  - chunk_index: 5
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book I. Production. > Chapter VII. Of The Law Of The Increase Of Labor. > § 2. The Law of Population.
    content_token_count: 129
    text: |-
      By this table it will be seen that if population can double itself in twenty-five years, and if food can only be
      increased by as much as x (the subsistence of eleven millions) by additional application of another equal quantity of
      labor on the same land in each period, then at the end of one hundred years there would be the disproportion of one
      hundred and seventy-six millions of people, with subsistence for only fifty-five millions. Of course, this is prevented
      either by checking population to the amount of the subsistence; by sending off the surplus population; or by bringing in
      food from new lands.
  - chunk_index: 6
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book I. Production. > Chapter VII. Of The Law Of The Increase Of Labor. > § 2. The Law of Population.
    content_token_count: 227
    text: |-
      In the United States to 1860 population has doubled itself about every twenty years, while in France there is
      practically no increase of population. It is stated that the white population of the United States between 1790 and 1840
      increased 400.4 per cent, deducting immigration. The extraordinary advance of population with us, where subsistence is
      easily attainable, is to be seen in the chart on the next page (No.
      [III](1129008759595750428_30107-h-3.html.xhtml#Chart_III)), which shows the striking rapidity of increase in the United
      States when compared with the older countries of Europe. The steady demand for land can be seen by the gradual westward
      movement of the center of population, as seen in chart No. IV (p. 116), and by the rapid settlement of the distant parts
      of our country, as shown by the two charts (frontispieces), which represent to the eye by heavier colors the areas of
      the more densely settled districts in 1830 and in 1880.
