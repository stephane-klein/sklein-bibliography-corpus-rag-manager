  - chunk_index: 11
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book I. Production. > Chapter VII. Of The Law Of The Increase Of Labor. > § 3. By what Checks the Increase of Population is Practically Limited.
    content_token_count: 39
    text: |-
      The obstacle to a just understanding of the subject arises from too confused a notion of the causes which, at most times
      and places, keep the actual increase of mankind so far behind the capacity.
  - chunk_index: 12
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book I. Production. > Chapter VII. Of The Law Of The Increase Of Labor. > § 3. By what Checks the Increase of Population is Practically Limited.
    content_token_count: 78
    text: |-
      The conduct of human creatures is more or less influenced by foresight of consequences, and by some impulses superior to
      mere animal instincts; and they do not, therefore, propagate like swine, but are capable, though in very unequal
      degrees, of being withheld by prudence, or by the social affections, from giving existence to beings born only to misery
      and premature death.
  - chunk_index: 13
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book I. Production. > Chapter VII. Of The Law Of The Increase Of Labor. > § 3. By what Checks the Increase of Population is Practically Limited.
    content_token_count: 69
    text: |-
      Malthus found an explanation of the anomaly that in the Swiss villages, with the longest average duration of life, there
      were the fewest births, by noting that no one married until a cow-herd's cottage became vacant, and precisely because
      the tenants lived so long were the new-comers long kept out of a place.
  - chunk_index: 14
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book I. Production. > Chapter VII. Of The Law Of The Increase Of Labor. > § 3. By what Checks the Increase of Population is Practically Limited.
    content_token_count: 175
    text: |-
      In proportion as mankind rise above the condition of the beast, population is restrained by the fear of want, rather
      than by want itself. Even where there is no question of starvation, many are similarly acted upon by the apprehension of
      losing what have come to be regarded as the decencies of their situation in life. Among the middle classes, in many
      individual instances, there is an additional restraint exercised from the desire of doing more than maintaining their
      circumstances—of improving them; but such a desire is rarely found, or rarely has that effect, in the laboring-classes.
      If they can bring up a family as they were themselves brought up, even the prudent among them are usually satisfied. Too
      often they do not think even of that, but rely on fortune, or on the resources to be found in legal or voluntary
      charity.
