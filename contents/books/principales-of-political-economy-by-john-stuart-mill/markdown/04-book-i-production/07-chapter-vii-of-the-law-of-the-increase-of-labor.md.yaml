  - chunk_index: 17
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book I. Production. > Chapter VII. Of The Law Of The Increase Of Labor. > § 3. By what Checks the Increase of Population is Practically Limited.
    content_token_count: 588
    text: |-
      This, in effect, is the well-known Malthusian doctrine. The thorough reader will also consult the original “Essay” of
      Malthus. Mr. Bowen[^119] and other writers oppose it, saying it has \[pg 116\] “no relation to the times in which we
      live, or to any which are near at hand.” He thinks the productive power of the whole world prevents the necessity of
      considering the pressure of population upon subsistence as an actuality now or in the future. This, however, does not
      deny the existence of Malthus's principles, but opposes them only on the methods of their action. Mr. Rickards[^120]
      holds that man's food—as, e.g., wheat—has the power to increase geometrically faster than man; but he omits to consider
      that for the growth of this food land is demanded; that land is not capable of such geometrical increase; and that
      without it the food can not be grown. Of course, any extension of the land area, as happened when England abolished the
      corn laws and drew her food from our prairies, removes the previous pressure of population on subsistence. No believer
      in the Malthusian doctrine is so absurd as to hold that the growth of population actually exceeds subsistence, but that
      there is a “constant _tendency_ in all animated life to increase beyond the nourishment prepared for it,” no one can
      possibly doubt. This is not inconsistent with the fact that subsistence has at any time increased faster than
      population. It is as if a block of wood on the floor were acted on by two opposing forces, one tending to move it
      forward, one backward: if it moves backward, that does not prove the absence of any force working to move it forward,
      but only that the other force is the stronger of the two, \[pg 117\] and that the final motion is the resultant of the
      two forces. It is only near-sighted generalization to say that since the block moves forward, there is therefore no
      opposing force to its advance.[^121] Mr. Doubleday maintains that, as people become better fed, they become unprolific.
      Mr. Mill's answer, referring to the large families of the English peerage, is unfortunate.[^122] In Sweden the increase
      of the peasantry is six times that of the middle classes, and fourteen times that of the nobility. The diminishing
      fertility of New England families gives a truer explanation, when it is seen that with the progress in material wealth
      later marriages are the rule. When New-Englanders emigrate to the Western States, where labor is in demand and where it
      is less burdensome to have large families, there is no question as to their fertility.[^123]
  - chunk_index: 18
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book I. Production. > Chapter VII. Of The Law Of The Increase Of Labor. > § 3. By what Checks the Increase of Population is Practically Limited.
    content_token_count: 217
    text: |-
      (1.) In a very backward state of society, like that of Europe in the middle ages, and many parts of Asia at present,
      population is kept down by actual starvation. The starvation does not take place in ordinary years, but in seasons of
      scarcity, which in those states of society are much more frequent and more extreme than Europe is now accustomed to.
      (2.) In a more improved state, few, even among the poorest of the people, are limited to actual necessaries, and to a
      bare sufficiency of those: and the increase is kept within bounds, not by excess of deaths, but by limitation of
      births.[^124] The limitation is brought about in various ways. In some countries, it is the result of prudent or
      conscientious self-restraint. There is a condition to which the laboring-people are habituated; they perceive that, by
      having too numerous families, they must sink below that condition, or fail to transmit it to their children; and this
      they do not choose to submit to.
  - chunk_index: 19
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book I. Production. > Chapter VII. Of The Law Of The Increase Of Labor. > § 3. By what Checks the Increase of Population is Practically Limited.
    content_token_count: 313
    text: |-
      There are other cases in which the prudence and forethought, which perhaps might not be exercised by the people \[pg
      118\] themselves, are exercised by the state for their benefit; marriage not being permitted until the contracting
      parties can show that they have the prospect of a comfortable support. There are places, again, in which the restraining
      cause seems to be not so much individual prudence, as some general and perhaps even accidental habit of the country. In
      the rural districts of England, during the last century, the growth of population was very effectually repressed by the
      difficulty of obtaining a cottage to live in. It was the custom for unmarried laborers to lodge and board with their
      employers; it was the custom for married laborers to have a cottage: and the rule of the English poor-laws, by which a
      parish was charged with the support of its unemployed poor, rendered land-owners averse to promote marriage. About the
      end of the century, the great demand for men in war and manufactures made it be thought a patriotic thing to encourage
      population: and about the same time the growing inclination of farmers to live like rich people, favored as it was by a
      long period of high prices, made them desirous of keeping inferiors at a greater distance, and, pecuniary motives
      arising from abuses of the poor-laws being superadded, they gradually drove their laborers into cottages, which the
      landowners now no longer refused permission to build.
  - chunk_index: 20
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book I. Production. > Chapter VII. Of The Law Of The Increase Of Labor. > § 3. By what Checks the Increase of Population is Practically Limited.
    content_token_count: 221
    text: |-
      It is but rarely that improvements in the condition of the laboring-classes do anything more than give a temporary
      margin, speedily filled up by an increase of their numbers. Unless, either by their general improvement in intellectual
      and moral culture, or at least by raising their habitual standard of comfortable living, they can be taught to make a
      better use of favorable circumstances, nothing permanent can be done for them; the most promising schemes end only in
      having a more numerous but not a happier people. There is no doubt that \[the standard\] is gradually, though slowly,
      rising in the more advanced countries of Western Europe.[^125] \[pg 119\] Subsistence and employment in England have
      never increased more rapidly than in the last forty years, but every census since 1821 showed a smaller proportional
      increase of population than that of the period preceding; and the produce of French agriculture and industry is
      increasing in a progressive ratio, while the population exhibits, in every quinquennial census, a smaller proportion of
      births to the population.
  - chunk_index: 21
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book I. Production. > Chapter VII. Of The Law Of The Increase Of Labor. > § 3. By what Checks the Increase of Population is Practically Limited.
    content_token_count: 387
    text: |-
      This brings forward the near connection between land-tenures and population. France is pre-eminently a country of small
      holdings, and it is undoubtedly true that the system has checked the thoughtless increase of numbers. On his few
      hectares, the French peasant sees in the size of his farm and the amount of its produce the limit of subsistence for
      himself and his family; as in no other way does he see beforehand the results of any lack of food from his lack of
      prudence.[^126] From 1790 to 1815 the average yearly increase of population was 120,000; from 1815 to 1846, the golden
      age of French agriculture, 200,000; from 1846 to 1856, when agriculture was not prosperous, 60,000; from 1856 to 1880
      the increase has been not more than 36,000 yearly. In France the question shapes itself to the peasant proprietor, How
      many can be subsisted by the amount of produce, not on an unlimited area of land in other parts of the world, but on
      this particular property of a small size? While in England there are ten births to six deaths, in France there are about
      ten births to every nine deaths.[^127] In no country has the doctrine of Malthus been more attacked than in France, and
      yet in no other country has there been a more marked obedience to its principles in actual practice. Since the French
      are practically not at all an emigrating people, population has strictly adapted itself to subsistence. For the relative
      increase of population in France and the United States, see also the movement of lines indicating the increase of
      population in chart No. III (p. [114](1129008759595750428_30107-h-3.html.xhtml#Pg114)).
