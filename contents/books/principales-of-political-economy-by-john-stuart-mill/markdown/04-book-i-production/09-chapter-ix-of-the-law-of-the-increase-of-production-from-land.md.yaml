  - chunk_index: 26
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book I. Production. > Chapter IX. Of The Law Of The Increase Of Production From Land. > § 3. —In Railways.
    content_token_count: 108
    text: |-
      The explanation of this reduced cost is given by Mr. Edward Atkinson[^135] as (1) the competition of water-ways, (2) the
      competition of one railway with another, and (3) the competition of other countries, which forces our railways to try to
      lay our staple products down in foreign markets at a price which will warrant continued shipment. Besides these reasons,
      much ought also (4) to be assigned to the progress of inventions and the reduced cost of steel and all appliances
      necessary to the railways.
  - chunk_index: 27
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book I. Production. > Chapter IX. Of The Law Of The Increase Of Production From Land. > § 3. —In Railways.
    content_token_count: 162
    text: |-
      The large importance of the railways shows itself in an influence on general business prosperity, and as a place for
      large investments of a rapidly growing capital. The building of railways, however, has been going on, at some times with
      greater speed than at others. Instead of 33,908 miles of railways at the close of our war, we have now (1884) over
      120,000 miles. How the additional mileage has been built year by year, with two distinct eras of increased building—one
      from 1869 to 1873, and another from 1879 to 1884—may be seen by the shorter lines of the subjoined chart, No.
      [VI](1129008759595750428_30107-h-3.html.xhtml#Chart_VI).
  - chunk_index: 28
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book I. Production. > Chapter IX. Of The Law Of The Increase Of Production From Land. > § 3. —In Railways.
    content_token_count: 155
    text: |-
      That speculation has been excited at different times by the opening up of our Western country, there can be no doubt.
      And if a comparison be made with Chart No. [XVII](1129008759595750428_30107-h-9.html.xhtml#Chart_XVII) ([Book IV, Chap.
      III](1129008759595750428_30107-h-5.html.xhtml#Book_III_Chapter_III)), which gives the total grain-crops of the United
      States, it will be seen that since 1879, although our population has increased from 12-½ per cent to 14 per cent, our
      grain-crops only 5 per cent, yet our railway mileage has increased 40 per cent.
  - chunk_index: 29
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book I. Production. > Chapter IX. Of The Law Of The Increase Of Production From Land. > § 3. —In Railways.
    content_token_count: 122
    text: |-
      The extent to which the United States has carried railway-building, as compared with European countries, although we
      have a very much greater area, is distinctly shown by Chart No.
      [VII](1129008759595750428_30107-h-3.html.xhtml#Chart_VII). This application of one form of improvement to oppose the law
      of diminishing returns in the United States has produced extraordinary results, especially when we consider that we are
      probably not yet using all our best lands, or, in other words, that we have not yet felt the law of diminishing returns
      in some large districts.
