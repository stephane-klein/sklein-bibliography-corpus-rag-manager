  - chunk_index: 9
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book I. Production. > Chapter IX. Of The Law Of The Increase Of Production From Land. > § 1. The Law of Production from the Soil, a Law of Diminishing Return in Proportion to the Increased Application of Labor and Capital.
    content_token_count: 199
    text: |-
      “It is long,” says a late traveler in the United States,[^130] “before an English eye becomes reconciled to the
      lightness of the crops and the careless farming (as we should call it) which is apparent. One forgets that, where land
      is so plentiful and labor so dear as it is here, a totally different principle must be pursued from that which prevails
      in populous countries, and that the consequence will of course be a want of tidiness, as it were, and finish, about
      everything which requires labor.” Of the two causes mentioned, the plentifulness of land seems to me the true
      explanation, rather than the dearness of labor; for, however dear labor may be, when food is wanted, labor will always
      be applied to producing it in preference to anything else. But this labor is more effective for its end by being applied
      to fresh soil than if it were employed in bringing the soil already occupied into higher cultivation.
  - chunk_index: 10
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book I. Production. > Chapter IX. Of The Law Of The Increase Of Production From Land. > § 1. The Law of Production from the Soil, a Law of Diminishing Return in Proportion to the Increased Application of Labor and Capital.
    content_token_count: 139
    text: |-
      The Western movement of what might be called the “wheat-center” is quite perceptible. Until recently Minnesota has been
      a great wheat-producing State, and vast tracts of land were there planted with that grain when the soil was first
      broken. The profits on the first few crops have been enormous, but it is now said to be more desirable for wheat-growers
      to move onward to newer lands, and to sell the land to cultivators of a different class (of fruit and varied products),
      who produce for a denser population. So that (in 1884) Dakota, instead of Minnesota, has become the district of the
      greatest wheat production.[^131]
  - chunk_index: 11
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book I. Production. > Chapter IX. Of The Law Of The Increase Of Production From Land. > § 1. The Law of Production from the Soil, a Law of Diminishing Return in Proportion to the Increased Application of Labor and Capital.
    content_token_count: 81
    text: |-
      Only when no soils remain to be broken up, but such as either from distance or inferior quality require a considerable
      rise of price to render their cultivation profitable, can it become advantageous to apply the high farming of Europe to
      any American lands; except, perhaps, in the immediate vicinity of towns, where saving in cost of carriage may compensate
      for great inferiority in the return from the soil itself.
  - chunk_index: 12
