  - chunk_index: 40
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book I. Production. > Chapter IX. Of The Law Of The Increase Of Production From Land. > § 4. —In Manufactures.
    content_token_count: 165
    text: |-
      The materials of manufactures being all drawn from the land, and many of them from agriculture, which supplies in
      particular the entire material of clothing, the general law of production from the land, the law of diminishing return,
      must in the last resort be applicable to manufacturing as well as to agricultural history. As population increases, and
      \[pg 142\] the power of the land to yield increased produce is strained harder and harder, any additional supply of
      material, as well as of food, must be obtained by a more than proportionally increasing expenditure of labor. But the
      cost of the material forming generally a very small portion of the entire cost of the manufacture, the agricultural
      labor concerned in the production of manufactured goods is but a small fraction of the whole labor worked up in the
      commodity.
  - chunk_index: 41
