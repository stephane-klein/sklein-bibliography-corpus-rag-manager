  - chunk_index: 0
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book I. Production. > Chapter IX. Of The Law Of The Increase Of Production From Land. > § 1. The Law of Production from the Soil, a Law of Diminishing Return in Proportion to the Increased Application of Labor and Capital.
    content_token_count: 87
    text: |-
      Land differs from the other elements of production, labor, and capital, in not being susceptible of indefinite increase.
      Its extent is limited, and the extent of the more productive kinds of it more limited still. It is also evident that the
      quantity of produce capable of being raised on any given piece of land is not indefinite. This limited quantity of land
      and limited productiveness of it are the real limits to the increase of production.
  - chunk_index: 1
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book I. Production. > Chapter IX. Of The Law Of The Increase Of Production From Land. > § 1. The Law of Production from the Soil, a Law of Diminishing Return in Proportion to the Increased Application of Labor and Capital.
    content_token_count: 105
    text: |-
      The limitation to production from the properties of the soil is not like the obstacle opposed by a wall, which stands
      immovable in one particular spot, and offers no hindrance to motion short of stopping it entirely. We may rather compare
      it to a highly elastic and extensible band, which is hardly ever so violently stretched that it could not possibly be
      stretched any more, yet the pressure of which is felt long before the final limit is reached, and felt more severely the
      nearer that limit is approached.
  - chunk_index: 2
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book I. Production. > Chapter IX. Of The Law Of The Increase Of Production From Land. > § 1. The Law of Production from the Soil, a Law of Diminishing Return in Proportion to the Increased Application of Labor and Capital.
    content_token_count: 175
    text: |-
      After a certain, and not very advanced, stage in the progress of agriculture—as soon, in fact, as mankind have applied
      themselves to cultivation with any energy, and have brought to it any tolerable tools—from that time it is the law of
      production from the land, that in any given state of agricultural skill and knowledge, by increasing the labor, the
      produce is not increased in an equal degree; doubling the labor does not double the produce; or, to express the same
      thing in other words, every increase of produce is obtained \[pg 131\] by a more than proportional increase in the
      application of labor to the land. This general law of agricultural industry is the most important proposition in
      political economy. Were the law different, nearly all the phenomena of the production and distribution of wealth would
      be other than they are.
  - chunk_index: 3
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book I. Production. > Chapter IX. Of The Law Of The Increase Of Production From Land. > § 1. The Law of Production from the Soil, a Law of Diminishing Return in Proportion to the Increased Application of Labor and Capital.
    content_token_count: 120
    text: |-
      It is not generally considered that in the United States, where in many sparsely settled parts of the country new land
      is constantly being brought into cultivation, an additional population under existing conditions of agricultural skill
      can be maintained with constantly increasing returns up to a certain point before the law of diminishing returns begins
      to operate. Where more laborers are necessary, and more capital wanted, to co-operate in a new country before all the
      land can give its maximum product, in such a stage of cultivation it can not be said that the law of diminishing returns
      has yet practically set in.
  - chunk_index: 4
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book I. Production. > Chapter IX. Of The Law Of The Increase Of Production From Land. > § 1. The Law of Production from the Soil, a Law of Diminishing Return in Proportion to the Increased Application of Labor and Capital.
    content_token_count: 191
    text: |-
      When, for the purpose of raising an increase of produce, recourse is had to inferior land, it is evident that, so far,
      the produce does not increase in the same proportion with the labor. The very meaning of inferior land is land which
      with equal labor returns a smaller amount of produce. Land may be inferior either in fertility or in situation. The one
      requires a greater proportional amount of labor for growing the produce, the other for carrying it to market. If the
      land A yields a thousand quarters of wheat to a given outlay in wages, manure, etc., and, in order to raise another
      thousand, recourse must be had to the land B, which is either less fertile or more distant from the market, the two
      thousand quarters will cost more than twice as much labor as the original thousand, and the produce of agriculture will
      be increased in a less ratio than the labor employed in procuring it.
  - chunk_index: 5
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book I. Production. > Chapter IX. Of The Law Of The Increase Of Production From Land. > § 1. The Law of Production from the Soil, a Law of Diminishing Return in Proportion to the Increased Application of Labor and Capital.
    content_token_count: 149
    text: |-
      Instead of cultivating the land B, it would be possible, by higher cultivation, to make the land A produce more. It
      might be plowed or harrowed twice instead of once, or three times instead of twice; it might be dug instead of being
      plowed; after plowing, it might be gone over with a hoe instead of a harrow, and the soil more completely pulverized; it
      might be oftener or more thoroughly weeded; \[pg 132\] the implements used might be of higher finish, or more elaborate
      construction; a greater quantity or more expensive kinds of manure might be applied, or, when applied, they might be
      more carefully mixed and incorporated with the soil.
  - chunk_index: 6
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book I. Production. > Chapter IX. Of The Law Of The Increase Of Production From Land. > § 1. The Law of Production from the Soil, a Law of Diminishing Return in Proportion to the Increased Application of Labor and Capital.
    content_token_count: 192
    text: |-
      The example of market-gardens in the vicinity of great cities and towns shows how the intensive culture permits an
      increase of labor and capital with larger returns. These lands, by their situation, are superior lands for this
      particular purpose, although they might be inferior lands as regards absolute productiveness when compared with the rich
      wheat-lands of Dakota. New England and New Jersey farms, generally speaking, no longer attempt the culture of grains,
      but (when driven out of that culture by the great railway lines which have opened up the West) they have arranged
      themselves in a scale of adaptability for stock, grass, fruit, dairy, or vegetable farming; and have thereby given
      greater profits to their owners than the same land did under the old régime. Even on lands where any grain can still be
      grown, corn, buckwheat, barley, oats, and rye, cover the cultivated areas instead of wheat.
  - chunk_index: 7
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book I. Production. > Chapter IX. Of The Law Of The Increase Of Production From Land. > § 1. The Law of Production from the Soil, a Law of Diminishing Return in Proportion to the Increased Application of Labor and Capital.
    content_token_count: 231
    text: |-
      Inferior lands, or lands at a greater distance from the market, of course yield an inferior return, and an increasing
      demand can not be supplied from them unless at an augmentation of cost, and therefore of price. If the additional demand
      could continue to be supplied from the superior lands, by applying additional labor and capital, at no greater
      proportional cost than that at which they yield the quantity first demanded of them, the owners or farmers of those
      lands could undersell all others, and engross the whole market. Lands of a lower degree of fertility or in a more remote
      situation might indeed be cultivated by their proprietors, for the sake of subsistence or independence; but it never
      could be the interest of any one to farm them for profit. That a profit can be made from them, sufficient to attract
      capital to such an investment, is a proof that cultivation on the more eligible lands has reached a point beyond which
      any greater application of labor and capital would yield, at the best, no greater return than can be obtained at the
      same expense from less fertile or less favorably situated lands.
  - chunk_index: 8
