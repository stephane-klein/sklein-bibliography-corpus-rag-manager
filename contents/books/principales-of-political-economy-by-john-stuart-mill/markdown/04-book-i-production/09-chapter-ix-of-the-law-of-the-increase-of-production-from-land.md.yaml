  - chunk_index: 13
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book I. Production. > Chapter IX. Of The Law Of The Increase Of Production From Land. > § 1. The Law of Production from the Soil, a Law of Diminishing Return in Proportion to the Increased Application of Labor and Capital.
    content_token_count: 139
    text: |-
      The principle which has now been stated must be received, no doubt, with certain explanations and limitations. Even
      after the land is so highly cultivated that the mere application of additional labor, or of an additional amount of
      ordinary dressing, would yield no return proportioned to the expense, it may still happen that the application of a much
      greater additional labor and capital to improving the soil itself, by draining or permanent manures, would be as
      liberally remunerated by the produce as any portion of the labor and capital already employed. It would sometimes be
      much more amply remunerated. This could not be, if capital always sought and found the most advantageous employment.
  - chunk_index: 14
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book I. Production. > Chapter IX. Of The Law Of The Increase Of Production From Land. > § 2. Antagonist Principle to the Law of Diminishing Return; the Progress of Improvements in Production.
    content_token_count: 112
    text: |-
      That the produce of land increases, cæteris paribus, in a diminishing ratio to the increase in the labor employed, is,
      as we have said (allowing for occasional and temporary exceptions), the universal law of agricultural industry. This
      principle, however, has been denied. So much so, indeed, that (it is affirmed) the worst land now in cultivation
      produces as much food per acre, and even as much to a given amount of labor, as our ancestors contrived to extract from
      the richest soils in England.
  - chunk_index: 15
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book I. Production. > Chapter IX. Of The Law Of The Increase Of Production From Land. > § 2. Antagonist Principle to the Law of Diminishing Return; the Progress of Improvements in Production.
    content_token_count: 324
    text: |-
      The law of diminishing returns is the physical fact upon which the economic doctrine of rent is based, and requires
      careful attention. Carey asserts, instead, that there is a law of increasing productiveness, since, as men grow in
      numbers and intelligence, there arises an ability to get more from the soil.[^132] Some objectors even deny that
      different grades of land are cultivated, and that there is no need of taking inferior soils into cultivation. If this
      were true, why would not one half an acre of land be as good as a whole State? Johnston[^133] says: “In a country and
      among poor settlers ... poor land is a relative term. Land is called poor which is not suitable to a poor man, which on
      mere clearing and burning will not yield good first crops. Thus that which is poor land for a poor man may prove rich
      land to a rich man.”[^134] Moreover, as is constantly the case in our country, it often happens that a railway may bring
      new lands into competition with old lands in a given \[pg 135\] market; of which the most conspicuous example is the
      competition of Western grain-fields with the Eastern farms. In these older districts, before the competition came, there
      was a given series of grades in the cultivated land; after the railway was built there was a disarrangement of the old
      series, some going out of cultivation, some remaining, and some of the new lands entering the list. The result is a new
      series of grades better suited to satisfy the wants of men.
  - chunk_index: 16
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book I. Production. > Chapter IX. Of The Law Of The Increase Of Production From Land. > § 2. Antagonist Principle to the Law of Diminishing Return; the Progress of Improvements in Production.
    content_token_count: 533
    text: |-
      This, however, does not prove that the law of which we have been speaking does not exist, but only that there is some
      antagonizing principle at work, capable for a time of making head against the law. Such an agency there is, in habitual
      antagonism to the law of diminishing return from land; and to the consideration of this we shall now proceed. It is no
      other than the progress of civilization. The most obvious \[part of it\] is the progress of agricultural knowledge,
      skill, and invention. Improved processes of agriculture are of two kinds: (1) some enable the land to yield a greater
      absolute produce, without an equivalent increase of labor; (2) others have not the power of increasing the produce, but
      have that of diminishing the labor and expense by which it is obtained. (1.) Among the first are to be reckoned the
      disuse of fallows, by means of the rotation of crops; and the introduction of new articles of cultivation capable of
      entering advantageously into the rotation. The change made in agriculture toward the close of the last century, by the
      introduction of turnip-husbandry, is spoken of as amounting to a revolution. Next in order comes the introduction of new
      articles of food, containing a greater amount of sustenance, like the potato, or more productive species or varieties of
      the same plant, such as the Swedish turnip. In the same class of improvements must be placed a better knowledge of the
      properties of manures, and of the most effectual modes of applying them; the introduction of new and more powerful
      fertilizing agents, such as guano, and the conversion to the same purpose of substances previously wasted; inventions
      like subsoil-plowing or tile-draining, by which the produce of some kinds of lands is so greatly multiplied;
      improvements in the breed or feeding of \[pg 136\] laboring cattle; augmented stock, of the animals which consume and
      convert into human food what would otherwise be wasted; and the like. (2.) The other sort of improvements, those which
      diminish labor, but without increasing the capacity of the land to produce, are such as the improved construction of
      tools; the introduction of new instruments which spare manual labor, as the winnowing and thrashing machines. These
      improvements do not add to the productiveness of the land, but they are equally calculated with the former to counteract
      the tendency in the cost of production of agricultural produce, to rise with the progress of population and demand.
  - chunk_index: 17
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book I. Production. > Chapter IX. Of The Law Of The Increase Of Production From Land. > § 3. —In Railways.
    content_token_count: 62
    text: |-
      Analogous in effect to this second class of agricultural improvements are improved means of communication. Good roads
      are equivalent to good tools. It is of no consequence whether the economy of labor takes place in extracting the produce
      from the soil, or in conveying it to the place where it is to be consumed.
  - chunk_index: 18
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book I. Production. > Chapter IX. Of The Law Of The Increase Of Production From Land. > § 3. —In Railways.
    content_token_count: 332
    text: |-
      The functions performed by railways in the system of production is highly important. They are among the most influential
      causes affecting the cost of producing commodities, particularly those which satisfy the primary wants of man, of which
      food is the chief. The amount of tonnage carried is enormous; and the cost of this service to the producers and
      consumers of the United States is a question of very great magnitude. The serious reduction in the cost of
      transportation on the railways will be a surprise to all who have not followed the matter very closely; the more so,
      that it has been brought about by natural causes, and independent of legislation. Corn, meat, and dairy products form,
      it is said, at least 50 per cent, and coal and timber about 30 per cent, of the tonnage moved on all the railways of the
      United States. If a lowered cost of transportation has come about, it has then cost less to move the main articles of
      immediate necessity. Had the charge in 1880 remained as high even as it was from 1866 to 1869, the number of tons
      carried in 1880 would have cost the United States from $500,000,000 to $800,000,000 more than the charge actually made,
      owing to the reductions by the railways. It seems, however, that this process of reduction culminated about 1879. In
      order to show the facts of this process, note the changes in the following chart, No. V. The railways of the State of
      New York are taken, but the same is also true of those of Ohio:
