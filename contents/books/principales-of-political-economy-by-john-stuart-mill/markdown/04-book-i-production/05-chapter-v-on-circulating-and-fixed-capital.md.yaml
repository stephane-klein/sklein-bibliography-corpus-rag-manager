    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book I. Production. > Chapter V. On Circulating And Fixed Capital. > § 3. —This seldom, if ever, occurs.
