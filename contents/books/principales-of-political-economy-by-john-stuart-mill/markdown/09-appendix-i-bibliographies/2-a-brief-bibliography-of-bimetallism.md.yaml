      Bourne, ibid., pp. 226, 227.
  - chunk_index: 14
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Appendix I. Bibliographies. > A Brief Bibliography Of Bimetallism.
    content_token_count: 162
    text: |-
      XI. Appreciation of Gold.—Giffen, “Statistical Journal,” vol. xlii, p. 36, started the theory for the period 1873-1879.
      Also see Bourne, “Statistical Journal,” vol. xlii, p. 406; S. Newcomb, “International Review,” 1879, p. 329; Wolowski,
      ibid., pp. 29, 30; Goschen, “Journal of the Institute of Bankers” (London), vol. iv, part vi, May, 1883; Patterson,
      “Statistical Journal,” vol. xliii, p. 1; for table of prices see London “Economist” (e.g., December 28, 1878).
  - chunk_index: 15
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Appendix I. Bibliographies. > A Brief Bibliography Of Bimetallism.
    content_token_count: 197
    text: |-
      XII. Bimetallism in the United States.—See supra, [book iii, chap.
      vii](1129008759595750428_30107-h-6.html.xhtml#Book_III_Chapter_VII); for a vast array of materials, see “Report of the
      International Monetary Conference,” 1878; Linderman's “Money and Legal Tender”; the Finance Reports of the United
      States; and Congressional Documents. For the coinage laws of 1792, 1834, 1853, 1873, 1878, see pamphlet, “Extracts from
      the Laws of the United States relating to Currency and Finance,” by C. F. Dunbar. For detailed account of passage of Act
      of 1873, see “Report of the Comptroller of the Currency,” 1876, p. 170. Present situation, “Atlantic Monthly,” May,
      1884, “The Silver Danger.”
