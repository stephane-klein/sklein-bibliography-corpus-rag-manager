    text: |-
      “The Report of the International Monetary Conference, 1878” (p. 754), contains an extended bibliography on money, by S.
      Dana Horton. Chevalier's third volume of his “Cours d'Économie politique,” entitled “Monnaie,” also gives a
      bibliography.
  - chunk_index: 1
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Appendix I. Bibliographies. > A Brief Bibliography Of Bimetallism.
    content_token_count: 144
    text: |-
      I. Standard of Value.—See Jevons, “Money and the Mechanism of Exchange,” chaps iii, xxv; S. Dana Horton, “Gold and
      Silver,” chap. iv, p. 36; F. A. Walker, “Political Economy,” pp. 363-368, “Money, Trade, and Industry,” pp. 56-77;
      Wolowski, “L'Or et l'Argent,” pp. 7, 22, 207; Mill, “Principles of Political Economy,” book iii, chap. xv; Walras,
      “Journal des Économistes,” October, 1882, pp. 5-13.
  - chunk_index: 2
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Appendix I. Bibliographies. > A Brief Bibliography Of Bimetallism.
    content_token_count: 170
    text: |-
      II. Bimetallic Theory.—Horton, “Gold and Silver,” p. 29; F. A. Walker, “Money, Trade, and Industry,” p. 157, “Political
      Economy,” p. 408; Giffen, “Fortnightly Review,” vol. xxxii (1879), p. 279; Wolowski, “L'Or et l'Argent,” p. 35; Jevons,
      ibid., chap, xii; A. J. Wilson, “Reciprocity, Bimetallism, and Land Reform,” p. 107; S. Bourne, “Trade, Population, and
      Food,” p. 227; Seyd, “The Decline of Prosperity,” and the various pamphlets of Cernuschi.
  - chunk_index: 3
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Appendix I. Bibliographies. > A Brief Bibliography Of Bimetallism.
    content_token_count: 181
    text: |-
      III. Operation of Gresham's Law.—Macaulay, chap. xxi for clipped coin of 1695; Jevons, ibid., pp. 80-85, also gives an
      example taken from the Japanese currency; for the case of France, see “Report of the Select Committee of the House of
      Commons on the Depreciation of Silver, 1876,” p. xlii, and Appendix, pp. 86, 148; for the United States, see supra,
      [book iii, chap. vii, § 3](1129008759595750428_30107-h-6.html.xhtml#Book_III_Chapter_VII_Section_3). See, also, Lord
      Liverpool's “Treatise on the Coins of the Realm,” chap. xii, for changes in the coin of England.
