      V. Effect of a League of States, or Law, on the Relative Value of Gold and Silver.—Giffen, “Fortnightly Review,” vol.
      xxxii (1879), pp. 285-290; Wolowski, “L'Or et l'Argent,” pp. 23, 24, 31; F. A. Walker, “Political Economy,” p. 410,
      “Report of the International Monetary Conference, 1878,” p. 74; Sumner, “Princeton Review,” vol. iv, p. 563; S. Dana
      Horton, “Report of the International Monetary Conference, 1878,” p. 741; Bourne, “Trade, Population, and Food,” pp. 228,
      230; Jevons, “Contemporary Review,” vol. xxxix (1881), p. 750; S. Newcomb, “International Review” (1879), p. 314.
  - chunk_index: 7
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Appendix I. Bibliographies. > A Brief Bibliography Of Bimetallism.
    content_token_count: 194
    text: |-
      VI. Production of Gold and Silver; Relative Value of the Two Metals.—Ad. Soetbeer, Petermann's “Mittheilungen,” No. 57;
      “House of Commons Report on Depreciation of Silver,” 1876, Appendix, pp. 11, 12, 24; Bourne, “Statistical Journal,” vol.
      xlii, p. 409, gives Sir H. Hay's figures corrected by him to 1878; Spofford's “American Almanac,” 1878, gives tables
      from the “Journal des Économistes”; the figures of Seyd, Hay, Jacob, and Tooke and Newmarch are in the “House of Commons
      Report,” above. Also see, supra, [book iii, chap. vi](1129008759595750428_30107-h-6.html.xhtml#Book_III_Chapter_VI), for
      references.
  - chunk_index: 8
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Appendix I. Bibliographies. > A Brief Bibliography Of Bimetallism.
    content_token_count: 85
    text: |-
      The relative values of gold and silver since 1834, as given in Pixley and Abell's (London) tables, are trustworthy.
      Previous to 1834 there is much uncertainty. Soetbeer, ibid., gives Hamburg quotations since 1687. Another table,
      probably incorrect in places, is that of White, see “Report of the International Monetary Conference,” 1878, p. 647.
  - chunk_index: 9
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Appendix I. Bibliographies. > A Brief Bibliography Of Bimetallism.
    content_token_count: 93
    text: |-
      VII. Demonetization of Silver by Germany.—For copy of laws of 1871 and 1873, see “Report of Directors of the United
      States Mint, 1873,” p. 82; “House of Commons Report on Depreciation of Silver,” 1876, p. 18; “Conférence Monétaire
      Internationale,” 1881, index, p. 215 for “Allemagne.”
  - chunk_index: 10
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Appendix I. Bibliographies. > A Brief Bibliography Of Bimetallism.
    content_token_count: 72
    text: |-
      VIII. Latin Union.—For treaty, see “Journal des Économistes,” May, 1866; “House of Commons Report,” ibid, xxxviii,
      Appendix, pp. 92, 98, 106-109, 116; “Report of Monetary Conference,” 1878, pp. 779-787.
  - chunk_index: 11
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Appendix I. Bibliographies. > A Brief Bibliography Of Bimetallism.
    content_token_count: 236
    text: |-
      IX. Flow of Silver to the East.—The figures of Sir Hector Hay after 1851, “House of Commons Report,” ibid., App., p. 24,
      are fullest, and should be combined with Pixley and Abell's figures for years before 1851, ibid., Appendix, p. 21. See
      also Bourne, “Statistical Journal,” 1879, p. 422; Waterfield, “House of Commons Report,” ibid., Appendix, pp. 171, 172,
      174; Quetteville, ibid., p. 184; “Conférence Monétaire Internationale,” 1881, p. 197; London “Economist,” February 24,
      1883, Supplement, p. 7; “Parliamentary Documents,” 1881, vol. \[pg 635\] xciii; “Report of the Director of the United
      States Mint,” 1880 (in the Finance Report, 1880, p. 194); J. B. Robertson, “Westminster Review,” vol. cxv, p. 200.
  - chunk_index: 12
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Appendix I. Bibliographies. > A Brief Bibliography Of Bimetallism.
    content_token_count: 144
    text: |-
      X. Depreciation of Silver, 1876.—Causes, Bourne, ibid., pp. 206, 212, 222, 233; Wilson, ibid., p. 128; “House of Commons
      Report,” ibid.; Sumner, “Princeton Review,” vol. iv., p. 570; S. Newcomb, “International Review,” vol. vi (1879), p.
      326; Cochut, “Revue des Deux Mondes,” i, December, 1883, p. 514; Cairnes, “Essays”; F. Bowen, “Minority Report of the
      United States Silver Commission,” 1878.
