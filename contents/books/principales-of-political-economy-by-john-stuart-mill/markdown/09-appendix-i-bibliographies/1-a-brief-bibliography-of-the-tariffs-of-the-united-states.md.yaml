      V. View of Early Manufactures.—Bishop, “History of American Manufactures”; Batchelder's “Introduction and Early Progress
      of the Cotton Manufacture in the United States”; N. Appleton, “Origin of Lowell”; G. S. White, “Memoir of Samuel
      Slater”; B. F. French, “History of the Rise and Progress of the Iron Trade of the United States for 1621-1857”; H.
      Scrivenor, “History of the Iron Trade”; “Bulletin of the National Association of Woolen Manufactures,” ii, pp. 479-488.
      Tench Coxe, “Statement of the Arts and Manufactures of the United States for 1810” (1814).
