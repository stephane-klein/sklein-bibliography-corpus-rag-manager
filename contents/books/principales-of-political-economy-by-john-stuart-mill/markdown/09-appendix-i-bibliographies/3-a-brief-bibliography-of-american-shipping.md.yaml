    text: |-
      I. English Navigation Acts.—Macpherson's “Annals,” ii, pp. 442, 484; Scobell, “Collection of Acts,” p. 176; Ruffhead,
      “Statutes at Large,” iii, p. 182; Roger Coke, “Treatise on Trade” (1671), p. 36; Sir Josiah Child, “New Discourse on
      Trade” (1671); Sir Matthew Decker, “Essay on the Causes of the Decline of Foreign Trade” (1744); Joshua Gee, “Trade and
      Navigation of Great Britain” (1730); Lindsay, “History of Merchant Shipping and Ancient Commerce”; McCulloch,
      “Dictionary of Commerce” (new edition), articles “Navigation” and “Colonial Trade”; ibid., edition of Adam Smith, note
      xii, p. 534; Huskisson, speeches, iii, 13, 351; Levi, “History of British Commerce,” p. 158.
  - chunk_index: 1
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Appendix I. Bibliographies. > A Brief Bibliography Of American Shipping.
