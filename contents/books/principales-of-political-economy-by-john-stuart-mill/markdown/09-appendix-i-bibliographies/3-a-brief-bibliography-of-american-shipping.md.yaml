    content_token_count: 129
    text: |-
      II. Navigation Laws of the United States.—“United States Statutes at Large,” i, 27, 287, 305; Act of 1817, Statutes,
      iii, 351; Revised Statutes (1878), “Commerce and Navigation,” p. 795; Lord Sheffield, “Observations on the Commerce of
      the United States”; Pitkin, “Statistical View of the Commerce of the United States,” chap, i; D. A. Wells, “Our Merchant
      Marine,” chap. v; Seybert's “Statistical Annals”; Macgregor, “Commercial Statistics of America.”
  - chunk_index: 3
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Appendix I. Bibliographies. > A Brief Bibliography Of American Shipping.
    content_token_count: 174
    text: |-
      III. Growth of American Shipping.—Rapid growth, 1840-1856. Levi, “History of British Commerce,” p. 582; Bigelow, “Tariff
      Question,” Appendix No. 57; “Harper's Magazine,” January, 1884, p. 217; Lindsay, “History of Merchant Shipping,” iii, p.
      187; for ship-building, see Report of the United States Bureau of Statistics, “Commerce and Navigation,” 1881, p. 927;
      for tonnage, ibid., pp. 928-930; also, see “United States Statistical Abstract”; Dingley's Report to House of
      Representatives, December 15, 1882, No. 1,827, Forty-seventh Congress, second session, pp. 5, 8, 254.
  - chunk_index: 4
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Appendix I. Bibliographies. > A Brief Bibliography Of American Shipping.
    content_token_count: 108
    text: |-
      IV. Steam and Iron Ships.—Preble, “History of Steam Navigation”; Colden, “Life of Fulton”; Porter, “Progress of the
      Nation,” section 3, chap. iv; Nimmo, “Report to the Secretary of the Treasury in Relation to the Foreign Commerce of the
      United States and the Decadence of American Shipping” (1870); Dingley's Report, pp. 4, 23; Kelley, “The Question of
      Ships,” Appendix ii, p. 208.
  - chunk_index: 5
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Appendix I. Bibliographies. > A Brief Bibliography Of American Shipping.
    content_token_count: 313
    text: |-
      V. Decline of American Shipping.—“Report on Commerce and Navigation” (1881), pp. 927, 928; Lindsay, ibid., iii, pp. 83,
      187, 593, 645; ibid., iv, pp. 163-180, 292, 316, 376; “North American Review,” October, 1864, p. 489; “Report on
      Commerce and Navigation,” 1881, lxv, pp. 915, 916, 922, 934; Lynch, Report to House of Representatives on “Causes of the
      Reduction of American Tonnage,” February 17, 1878, pp. ix, 80, 176, 195-213; remission of duties, Revised Statutes of
      the United States (edition of 1878), section 2,513; Report on “Commerce and Navigation,” xi, 83, 210; Dingley's Report;
      Nimmo, “Decadence of American Shipping” (which gives several charts), p. 17, “The Practical Workings of our Relations of
      Maritime Reciprocity” (1871); Kelley, ibid.; Reports of the New York Chamber of Commerce; Sumner, “Shall Americans own
      Ships?” in “North American Review,” June, 1880; Codman, “Free Ships”; for high-rate profit in the United States,
      Dingley's Report, p. 4.
  - chunk_index: 6
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Appendix I. Bibliographies. > A Brief Bibliography Of American Shipping.
    content_token_count: 98
    text: |-
      VI. Burdens on Ship-Owners.—Tonnage duties, Wells, p. 179; sailors' wages, Revised Statutes, sections 4,561, 4,578,
      4,580-4,584, 4,600; consular fees, Dingley's Report, p. 9; pilotage, taxation, Wells, p. 172, et seq.; see also Act of
      1884, abolishing many of these burdens.
