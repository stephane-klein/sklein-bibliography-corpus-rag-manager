    text: |-
      It is often said that wages are kept at a high rate in the United States by the existence of protected industries. On
      the other hand, the truth is that the protected industries must pay the current high rate of wages fixed by the general
      productiveness of all industries in the country. When the facts are investigated, it is surprising how small a portion
