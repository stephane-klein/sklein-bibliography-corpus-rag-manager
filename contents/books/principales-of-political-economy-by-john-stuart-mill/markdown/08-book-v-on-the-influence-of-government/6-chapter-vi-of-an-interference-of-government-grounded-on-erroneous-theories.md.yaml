    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter VI. Of An Interference Of Government Grounded On Erroneous Theories. > § 7. —on the ground that it lowers prices.
    content_token_count: 88
    text: '[^365]: Business men constantly use the term “cost of production” when in reality they mean that which to the economist is expressed by “cost of labor.” If cost of labor becomes higher, it takes from profits—the place where they feel the difficulties of competition—but they say that the cost of production has risen: the cost, to them, only has risen, that is, the “cost of labor,” not “cost of production.”'
