  - chunk_index: 34
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter VI. Of An Interference Of Government Grounded On Erroneous Theories. > § 6. —on the ground of creating a diversity of industries.
    content_token_count: 474
    text: |-
      England may have seven different grades of productiveness in her iron and coal supplies, of which her grades 1, 2, and 3
      are superior to the best grade of the United States, while grades 1, 2, 3, and 4 in the United States may compare only
      with grades 4, 5, 6, 7 of England. So long as England can supply herself and the United States also with coal and iron
      from the three superior grades, the United States can not work grade 1 at home. But if the supply for England and the
      world requires grade 5 to be worked, then the United States can begin the industry on her best grade, although that is
      far inferior to the best grade in England. Likewise, if the United States has three grades of wheat-land superior to
      England's best grade, the ability of England to grow wheat depends on whether the United States can, or can not, supply
      both herself and England from grades 1, 2, and 3. If we must resort to grade 4, then England can begin to grow wheat as
      well as we. In short, \[pg 624\] under a system of free exchange, as great a diversity as under protection is probably
      possible, but only in such a way that the best possible advantages in each particular industry are employed. Smaller
      amounts in some branches, and greater amounts in others, may be produced under a free than under a restrictive system,
      but with all the greater gain which arises from a proper and healthy adjustment of trade. The most poorly endowed
      enterprises in each occupation would be given up, but not the whole industry itself. No class of persons feel the
      competition of rivals more than English farmers since American wheat has come into English markets, and yet it does not
      follow that England can not grow a bushel of wheat. The fact is, merely, that some kinds of lands were thrown out of
      cultivation, and a readjustment made, to the benefit of those wanting cheaper food. So with us: we should not, by the
      free exchange, be forced to give up the iron and coal industries entirely; for the best mines would still keep that
      occupation in existence to “diversify” the others.
  - chunk_index: 35
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter VI. Of An Interference Of Government Grounded On Erroneous Theories. > § 6. —on the ground of creating a diversity of industries.
    content_token_count: 371
    text: |-
      So far the explanation covers the “extractive industries” only, or those industries affected by the law of diminishing
      returns when a larger quantity is demanded. The real question arises as to the manufactures of these materials. But we
      count upon larger industrial rewards, in the form of wages, and profits, here than in England; we must get more from an
      industry than England in order to satisfy us. Our grades of occupations, therefore, must be more productive to a certain
      extent, grade for grade, than English grades, in order to allow of their remaining free from competition. But we have
      this superiority, as regards our home market, owing to natural causes: (1) cheap raw materials (if we except wool and
      other commodities whose price is raised by the tariff); (2) advantage over England in cost of transportation of raw
      products; and (3) in the cost of transportation, again, of the finished goods in reaching our markets. Now, the
      processes of manufacture which do not put much labor upon the materials, especially where the articles are bulky, are
      conducted in this country without fear of foreign competition. And the range of this class of manufactures is
      surprisingly large. It includes the manufactures of iron, such as stoves, and the common utensils of every-day life; of
      hides, such as leather, harnesses, etc.; and of wood, such as all the furniture of common use. The list is too long to
      be fully stated here. These industries are not kept in existence by the tariff; and a diversity as wide as this would
      arise under a system of free exchange, as well as of restriction. Indeed, if duties were removed from so-called “raw
      materials,” it is altogether probable that a wider diversity would exist than ever before.
  - chunk_index: 36
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter VI. Of An Interference Of Government Grounded On Erroneous Theories. > § 6. —on the ground of creating a diversity of industries.
    content_token_count: 6
    text: \[pg 625\]
  - chunk_index: 37
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter VI. Of An Interference Of Government Grounded On Erroneous Theories. > § 6. —on the ground of creating a diversity of industries.
    content_token_count: 202
    text: |-
      And yet, it will be said, there are some things we can not produce in free competition with England. Of course there
      are; and it is to be hoped it will long continue so. If there are not some kinds of commodities which foreigners can
      produce to better advantage than we, then there will be no possibility of any foreign trade whatever; since, if they can
      send us nothing, they can take nothing from us. To deny this position, is to say that the export and import trade of the
      United States (amounting in 1883 to more than $1,500,000,000) is of no profit, and had best be entirely destroyed, in
      order that a few industries in which we have no natural advantages (and which employ less than one seventeenth of the
      laborers in the United States) should be continued at a loss to the general productiveness of our labor and capital, and
      so to a general diminution of wages and profits.
  - chunk_index: 38
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter VI. Of An Interference Of Government Grounded On Erroneous Theories. > § 7. —on the ground that it lowers prices.
    content_token_count: 132
    text: |-
      The argument—heard less frequently now than formerly—has been advanced, drawn inductively from statistics, that
      protection does not raise prices; because, after duties are put on, a larger quantity is produced, the advantages of
      large production are reaped, and then the price of the manufactured commodity falls lower here than it was before the
      duty was imposed. The position is then held that protection does not raise prices. It is, of course, understood to mean
      the prices of protected commodities—a necessary precaution, because we find our own agricultural (unprotected)
      commodities cited to show that prices are lower here than in England.
  - chunk_index: 39
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter VI. Of An Interference Of Government Grounded On Erroneous Theories. > § 7. —on the ground that it lowers prices.
    content_token_count: 193
    text: |-
      No one, however, will deny that there has been a fall in the prices of textile fabrics and manufactured goods. That is
      the result of a general law of value, and of the tendencies of a progressive state of industry.[^372] The causes of this
      acknowledged fall would be at work, no matter whether tariffs existed or not. It is the result of the general forward
      march of improvements, as evidenced in the application of new inventions and the display of skill and ingenuity in new
      processes. To say that it comes because of a tariff, is a complete non sequitur. How true this is may be seen by
      observing that a country like England, without tariffs, shares in the general fall of prices of manufactured goods
      equally with the country which has heavy customs-duties. The causes must be wider than tariffs, if they are seen working
      alike in tariff and non-tariff countries.
  - chunk_index: 40
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter VI. Of An Interference Of Government Grounded On Erroneous Theories. > § 7. —on the ground that it lowers prices.
    content_token_count: 232
    text: |-
      But the fact itself can not be gainsaid that protection does raise the prices of the protected goods in the home market.
      The comparison is not to be made between prices as they now are in this country and as they were twenty or forty years
      ago also in this country, for this would show only the general march of \[pg 626\] improvements in this country; but a
      comparison is to be made between prices in this country to-day and present prices in foreign countries. Does, for
      instance, the tariff increase the price of woolen goods and clothing to every consumer far beyond what the price would
      be if the duty on imported woolens were removed? The very existence of a protecting duty is the answer to this. If the
      duty does not raise the price, then why does the woolen industry wish a continuance of the duties? If goods can be sold
      as cheaply here as the foreign goods, why do protectionists want any duties? The duties are intended to keep foreign
      goods out of our markets; and they would be unnecessary if our goods could be sold as cheaply as the foreign wares.
  - chunk_index: 41
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter VI. Of An Interference Of Government Grounded On Erroneous Theories. > § 7. —on the ground that it lowers prices.
    content_token_count: 113
    text: |-
      The facts, however, are at hand to show that the statement of principle as made above is corroborated by the statistics.
      In 1883, although average weekly wages in Massachusetts were over 77 per cent higher than in England, the American
      laborer had to pay more for the articles entering into his real wages; and to that extent lost the advantage of his
      higher reward in this country. This is to be seen in the following figures,[^373] which show, in percentages, whether
      prices are higher or lower here than in England:
  - chunk_index: 42
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter VI. Of An Interference Of Government Grounded On Erroneous Theories. > § 7. —on the ground that it lowers prices.
    content_token_count: 84
    text: |-
      | Classes of Articles. | Higher Percent. | Lower Percent. |
      | --- | --- | --- |
      | Groceries | 16 |  |
      | Provisions, including meat, eggs, butter, and potatoes |  | 23 |
      | Dry goods (all grades) | 13 |  |
      | Boots, shoes, and slippers | 62 |  |
      | Clothing | 45 |  |
  - chunk_index: 43
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter VI. Of An Interference Of Government Grounded On Erroneous Theories. > § 7. —on the ground that it lowers prices.
    content_token_count: 133
    text: |-
      And yet, in spite of the high prices, 31 per cent of the Massachusetts workman's expenditure represents more comfort and
      better home surroundings than is enjoyed by the English workman. If the American could purchase at English prices, he
      would have no less than 37 per cent of a surplus for additional enjoyments (after making due allowance for the higher
      rents paid here than in England). In other words, higher prices cut off the American laborer from reaping all the
      superiority in comfort which might be expected from knowing that he had an advantage over the English laborer of 77 per
      cent in the money wages received.
  - chunk_index: 44
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter VI. Of An Interference Of Government Grounded On Erroneous Theories. > § 7. —on the ground that it lowers prices.
    content_token_count: 6
    text: \[pg 627\]
  - chunk_index: 45
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter VI. Of An Interference Of Government Grounded On Erroneous Theories. > § 7. —on the ground that it lowers prices.
    content_token_count: 23
    text: 'In order that the reader may easily find the arguments of the protectionists, he is referred to the following books:'
  - chunk_index: 46
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter VI. Of An Interference Of Government Grounded On Erroneous Theories. > § 7. —on the ground that it lowers prices.
    content_token_count: 91
    text: |-
      Carey's “Principles of Social Science” (3 vols.). The form of argument is, briefly, that all industries should be kept
      going within the bounds of a country so as to avoid foreign trade. The change of form into the finished commodity
      should, he holds, take place near the spot where the raw materials are produced, so that not so great a share should go
      to the mere middle-men, or transporters.
  - chunk_index: 47
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter VI. Of An Interference Of Government Grounded On Erroneous Theories. > § 7. —on the ground that it lowers prices.
    content_token_count: 39
    text: |-
      Bowen's “Political Economy,” Chap. XX, advocates protection on the ground that it is needed to secure diversity of
      industries, and that it lowers the prices of imported goods.
  - chunk_index: 48
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter VI. Of An Interference Of Government Grounded On Erroneous Theories. > § 7. —on the ground that it lowers prices.
    content_token_count: 41
    text: |-
      Sir J. B. Byles's “Sophisms of Free Trade” is an answer to Bastiat's “Sophisms of Protection,” the latter having been
      translated into English by Horace White.
  - chunk_index: 49
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter VI. Of An Interference Of Government Grounded On Erroneous Theories. > § 7. —on the ground that it lowers prices.
    content_token_count: 47
    text: |-
      Erastus B. Bigelow's “The Tariff Question.” This is one of the ablest discussions, from the protectionist point of view,
      based on statistical tables and comparisons of the policy of England and the United States.
  - chunk_index: 50
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter VI. Of An Interference Of Government Grounded On Erroneous Theories. > § 7. —on the ground that it lowers prices.
    content_token_count: 17
    text: Stebbins's “Protectionists' Manual” is a brief and handy statement.
  - chunk_index: 51
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter VI. Of An Interference Of Government Grounded On Erroneous Theories. > § 7. —on the ground that it lowers prices.
    content_token_count: 85
    text: |-
      Ellis H. Roberts's “Government Revenue” is the form into which he has thrown his lectures at Cornell University (1884)
      on protection, and is the latest statement emanating from that side of the discussion. He goes at length into the
      history of taxes in various countries; holds that wages are higher here than in England because of protection; that our
      manufactures are more flourishing than our agriculture, etc.
  - chunk_index: 52
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter VI. Of An Interference Of Government Grounded On Erroneous Theories. > § 7. —on the ground that it lowers prices.
    content_token_count: 23
    text: Frederick List's “National Economy” is the German statement of protection, much on Carey's own grounds.
  - chunk_index: 53
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter VI. Of An Interference Of Government Grounded On Erroneous Theories. > § 7. —on the ground that it lowers prices.
    content_token_count: 34
    text: |-
      “The Congressional Globe” contains numerous speeches of members of Congress on the tariff; and the Iron and Steel
      Association of Philadelphia send out pamphlets explaining the protectionist position.
  - chunk_index: 54
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter VI. Of An Interference Of Government Grounded On Erroneous Theories. > § 7. —on the ground that it lowers prices.
    content_token_count: 53
    text: |-
      The free-trade arguments may be found also in W. M. Grosvenor's “Does Protection Protect?” He studies the results of the
      various tariffs of the United States, and gives many very valuable tables and collections of statistics bearing upon
      this question.
  - chunk_index: 55
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter VI. Of An Interference Of Government Grounded On Erroneous Theories. > § 7. —on the ground that it lowers prices.
    content_token_count: 35
    text: |-
      W. G. Sumner's “History of Protection in the United States” is a very vigorous account of the evils of the various
      tariffs and the protective system.
  - chunk_index: 56
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter VI. Of An Interference Of Government Grounded On Erroneous Theories. > § 7. —on the ground that it lowers prices.
    content_token_count: 62
    text: |-
      D. A. Wells's “Reports” as Special Commissioner of the Revenue, and his numerous pamphlets (see Putnams' publisher's
      catalogue), are \[pg 628\] full of facts, and give the results of special study of the subject as affecting the United
      States.
  - chunk_index: 57
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter VI. Of An Interference Of Government Grounded On Erroneous Theories. > § 7. —on the ground that it lowers prices.
    content_token_count: 17
    text: A. L. Perry's “Political Economy” gives a radical free-trade view.
  - chunk_index: 58
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter VI. Of An Interference Of Government Grounded On Erroneous Theories. > § 7. —on the ground that it lowers prices.
    content_token_count: 27
    text: |-
      Henry Fawcett's “Free Trade and Protection” explains the causes which have retarded the more general adoption of free
      trade.
  - chunk_index: 59
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter VI. Of An Interference Of Government Grounded On Erroneous Theories. > § 7. —on the ground that it lowers prices.
    content_token_count: 76
    text: |-
      J. E. Cairnes's “Leading Principles of Political Economy” gives the ablest discussion of the economic principles
      involved in the question which has yet been offered to the reader. Moreover, almost all our systematic writers on
      political economy (excepting, perhaps, Bowen and R. E. Thompson) give the system of free exchange their support on
      economic grounds.
