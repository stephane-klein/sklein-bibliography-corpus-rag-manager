  - chunk_index: 26
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter VI. Of An Interference Of Government Grounded On Erroneous Theories. > § 5. —on the ground of high wages.
    content_token_count: 325
    text: |-
      Of the second class, less than 450,000 work-people are engaged in the chief protected industries—cotton, woolen, and
      iron and steel, combined. This class, it is to be noted, in the census returns, includes bakers, blacksmiths,
      brick-makers, builders, butchers, cabinet-makers, carpenters, carriage-makers, and so on through the whole list of
      similar occupations practically unaffected by the tariff (so far as protection to them is concerned). So that, at the
      most, there are less than a million laborers engaged in industries directly dependent on the tariff, and the number is
      undoubtedly very much less than a million. When some writers assert, therefore, that the existence of customs-duties
      allows industries (even including all those employed in producing cotton, wool, iron, and steel) to employ less than a
      million laborers in such a way that the remuneration is fixed for the remaining 16,000,000 laborers in the United
      States, keeping wages high for 16,000,000 by paying current wages for less than a million, the extravagance and
      ignorance of the statement are at once apparent; while, on the other hand, it is distinctly seen that the causes fixing
      the generally high rates of wages for the 16,000,000 are those governing the majority of occupations, and that the less
      than one million must be paid the wages which can be obtained elsewhere in the more productive industries. The facts
      thus strikingly bear out the principles as stated above.
  - chunk_index: 27
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter VI. Of An Interference Of Government Grounded On Erroneous Theories. > § 5. —on the ground of high wages.
    content_token_count: 257
    text: |-
      Confirmation—if confirmation now seems necessary—may be found in a study[^370] by our ablest statistician, Francis A.
      Walker, upon the causes which have operated on the growth of American manufactures. This growth has not been
      commensurate, he finds, with the remarkable inventive and industrial capacity of our people, and with the richness of
      our national resources: “I answer that the cause of that comparative failure is found, primarily and principally, in the
      extraordinary success of our agriculture, as already intimated in what has been said of the investment of capital. The
      enormous profits of cultivating a virgin soil without the need of artificial fertilization; the advantages which a
      sparse population derives from the privilege of selecting for tillage only the choicest spots,[^371] those most
      accessible, most fertile, most easily brought under the plow; and the consequent abundance of food and other necessaries
      enjoyed by the agricultural class, have tended continually to disparage mechanical industries, in the eyes alike of the
      capitalist, looking to the most remunerative investment \[pg 621\] of his savings, and of the laborer, seeking that
      avocation which should promise the most liberal and constant support.
  - chunk_index: 28
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter VI. Of An Interference Of Government Grounded On Erroneous Theories. > § 5. —on the ground of high wages.
    content_token_count: 142
    text: |-
      “It has been the competition of the farm with the shop which, throughout the entire century of our national
      independence, has most effectually hindered the growth of manufactures. A people who are privileged to cultivate a
      reasonably fertile soil, under the conditions indicated above, can secure for themselves subsistence up to the highest
      limit of physical well-being. If that people possess the added advantage of great skill in the use of tools, and great
      adroitness in meeting the large and the little exigencies of the occupation and cultivation of the soil, the fruits of
      their labor will include not only everything which is essential to health and comfort, but much that is of the nature of
      luxury.”
  - chunk_index: 29
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter VI. Of An Interference Of Government Grounded On Erroneous Theories. > § 5. —on the ground of high wages.
    content_token_count: 254
    text: |-
      It remains to be said in this connection that workmen are already discerning the practical and real causes at work
      affecting their wages—affecting them more directly than any tariff system possibly could—by showing no small alarm at
      the immigration of foreigners, such as the Hungarian miners and Italian laborers, who willingly underbid them. In other
      words, they are beginning to realize, in a practical way, the truth that increasing numbers are far more potent than
      anything else in reducing wages. So long as immigration is free to any race or nationality, there is no such thing as
      “protection to home laborers”; the only protection to them—not that I am urging the desirability of such measures—can
      come solely from forces which limit the number of workmen who enter into competition with them. Any other protection to
      laboring-men than the prohibition of immigration—which no one thinks of (except for the Chinese)—is an economic
      delusion. Instead of “protecting” them to the extent of affording higher wages, the tariff increases the cost of woolen
      clothing and other articles of their consumption, in addition to forcing capital into employments which yield a less
      return, and so insure lower wages.
  - chunk_index: 30
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter VI. Of An Interference Of Government Grounded On Erroneous Theories. > § 6. —on the ground of creating a diversity of industries.
    content_token_count: 383
    text: |-
      It must be kept in mind that Political Economy deals only with the phenomena of material wealth; it does not supply
      ethical or political grounds of action. It is quite conceivable that a legislator, in coming to a decision, may have to
      balance economic gains against moral or political losses, and may choose to give up the former to prevent the latter.
      But the economic truth remains unchanged. Political economy, for instance, to the question, Is there any gain in
      international trade? answers, unequivocally, yes. Would it be a loss of wealth to the community to have the goods
      formerly bought abroad now produced at home? The answer is, certainly it would. But here it has been ably urged by
      intelligent writers that a state \[pg 622\] has other ends to gain than the accumulation of mere riches; that it must
      aim to secure the greatest moral, social, and elevating influences possible for the working-classes; and that while free
      exchange of goods may add to wealth, it may injure the social and political well-being of a nation. So far as these are
      social and political questions they do not belong to Political Economy. But the commonest form of argument is that,
      under free exchange, the United States would become purely an “agricultural” country, its social horizon would become
      narrowed, and a lower standard of industrial activity would then ensue; instead of which, it is said, we should, by
      protection, keep in existence diversified industries by which the national mind may be better stimulated, and greater
      enterprise may be encouraged in all branches of industry. This argument for “diversity of industries,” however, is not
      merely a sociological question; it can only be fully discussed from an economic stand-point, and deserves even more than
      the brief attention we can give it here.
  - chunk_index: 31
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter VI. Of An Interference Of Government Grounded On Erroneous Theories. > § 6. —on the ground of creating a diversity of industries.
    content_token_count: 367
    text: |-
      In the first place, as soon as any purely agricultural country gains even a slight density of population—a density only
      such as to warrant the introduction of the principle of division of labor—there comes an inevitable differentiation of
      pursuits, wholly outside of legislation, and through the operation of natural causes. Not all of any population is
      required in agriculture to provide the whole with food. By a division of labor, one man in agriculture can produce the
      sustenance of himself and many others. “The United States have at the present time but five persons engaged in
      agriculture for each square mile of settled area.” By the side of the farm must early spring up a wide circle of
      industries—the shoemaker, the carpenter, the blacksmith, the wagon-maker, the painter, the builder, the mason, and all
      the ordinary employments which arise in any small community from the earliest division of labor. Moreover, “agriculture”
      is often used in a too limited sense as confined to producing food alone (although even in that limited sense employing
      nearly one half of the total number of our laborers). In a new country the natural field of employment is found in the
      “extractive industries,” which include the preparation for the market not only of food, but also of all ores, coal,
      minerals, oils, hides, leather, wool, lumber, and the industries intimately connected with them; all the employments
      which transport these from one part of the country to another (employing at present over one ninth of all our laborers);
      and professional and personal services of an extended variety. Even, therefore, if we were obliged to forego
      manufactures entirely, the “extractive industries” would necessarily involve a very extensive diversity of employments.
  - chunk_index: 32
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter VI. Of An Interference Of Government Grounded On Erroneous Theories. > § 6. —on the ground of creating a diversity of industries.
    content_token_count: 304
    text: |-
      The real question, however, for most persons, centers in the \[pg 623\] next stage of the industrial evolution—that of
      the manufactures of these above-mentioned products of the “extractive industries.” It will be remembered, here, that a
      country does not possess an equal ability in producing each of these or any commodities: the timber formerly near great
      rivers may vanish into the interior; the oil-sources may be more or less fertile; or the ore-deposits may be more or
      less rich, more or less accessible, than those of other countries. This being understood, then, as soon as the demand in
      the country calls for an increased quantity of a particular article, the cost may increase under the law of diminishing
      returns until a foreign country—having inferior agents of production as compared with our best—may be able to send
      supplies into our markets. It all depends on whether the United States wants more articles than can be produced on
      grades of natural agents superior to those possessed by foreigners, taking cost of carriage to this country into
      consideration. Even though foreign competition appears when we reach poorer grades of natural agents, it does not follow
      that some of the particular articles will not be produced. What ought to be clear is, that untrammeled exchange between
      countries will not prevent the existence of various industries, but only limit production to those grades of agents
      which are its best. This may be better seen by a simple diagram:
