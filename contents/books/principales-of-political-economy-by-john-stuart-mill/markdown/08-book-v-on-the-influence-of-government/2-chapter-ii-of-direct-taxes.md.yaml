  - chunk_index: 32
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter II. Of Direct Taxes. > § 6. A House-Tax.
    content_token_count: 63
    text: '[^342]: Another common objection is that large and expensive accommodation is often required, not as a residence, but for business. But it is an admitted principle that buildings, or portions of buildings, occupied exclusively for business, such as shops, warehouses, or manufactories, ought to be exempted from house-tax.'
  - chunk_index: 33
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter II. Of Direct Taxes. > § 6. A House-Tax.
    content_token_count: 167
    text: It has been also objected that house-rent in the rural districts is much lower than in towns, and lower in some towns and in some rural districts than in others; so that a tax proportioned to it would have a corresponding inequality of pressure. To this, however, it may be answered that, in places where house-rent is low, persons of the same amount of income usually live in larger and better houses, and thus expend in house-rent more nearly the same proportion of their incomes than might at first sight appear. Or, if not, the probability will be that many of them live in those places precisely because they are too poor to live elsewhere, and have, therefore, the strongest claim to be taxed lightly. In some cases it is precisely because the people are poor that house-rent remains low.—Mill.
