    content_token_count: 102
    text: |-
      As incomes below a certain amount ought to be exempt from income-tax, so ought houses below a certain value from
      house-tax, on the universal principle of sparing from all taxation the absolute necessaries of healthful existence. In
      order that the occupiers of lodgings, as well as of houses, might benefit, as in justice they ought, by this exemption,
      it might be optional with the owners to have every portion of a house which is occupied by a separate tenant valued and
      assessed separately.
