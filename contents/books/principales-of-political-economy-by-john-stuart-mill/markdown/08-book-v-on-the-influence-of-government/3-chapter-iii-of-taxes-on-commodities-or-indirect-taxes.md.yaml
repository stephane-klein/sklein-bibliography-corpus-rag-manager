  - chunk_index: 36
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 6. Effects produced on international Exchange by Duties on Exports and on Imports.
    content_token_count: 51
    text: |-
      The result of this investigation may, then, be generally formulated as follows: That country which has the strongest
      demand for the commodities of other countries as compared with the demand of other countries for its own commodities
      will pay the burden of the export duty.
  - chunk_index: 37
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 6. Effects produced on international Exchange by Duties on Exports and on Imports.
    content_token_count: 71
    text: |-
      Thus far of duties on exports. We now proceed to the more ordinary case of duties on imports: “We have had an example of
      a tax on exports, that is, on foreigners, falling in part on ourselves. We shall therefore not be surprised if we find a
      tax on imports, that is, on ourselves, partly falling upon foreigners.
  - chunk_index: 38
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 6. Effects produced on international Exchange by Duties on Exports and on Imports.
    content_token_count: 135
    text: |-
      “Instead of taxing the corn which we export, suppose that we tax the iron which we import. The duty which we are now
      supposing must not be what is termed a protecting duty, that is, a duty sufficiently high to induce us to produce the
      article at home. If it had this effect, it would destroy entirely the trade both in corn and in iron, and both countries
      would lose the whole of the advantage which they previously gained by exchanging those commodities with one another. We
      suppose a duty which might diminish the consumption of the article, but which would not prevent us from continuing to
      import, as before, whatever iron we did consume.
  - chunk_index: 39
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 6. Effects produced on international Exchange by Duties on Exports and on Imports.
    content_token_count: 241
    text: |-
      “The equilibrium of trade would be disturbed if the imposition of the tax diminished, in the slightest degree, the
      quantity of iron consumed. For, as the tax is levied at our own custom-house, the English exporter only receives the
      same price as formerly, though the American consumer pays a higher one. If, therefore, there be any diminution of the
      quantity bought, although a larger sum of money may be actually laid out in the article, a smaller one will be due from
      the United States to England: this sum will no longer be an equivalent for the sum due from England to the United States
      for corn, the balance therefore must be paid in money. Prices will fall in England and rise in the United States; iron
      will fall in the English market; corn will rise in the American. The English will pay a higher price for corn, \[pg
      579\] and will have smaller money incomes to buy it with; while the Americans will obtain iron cheaper, that is, its
      price will exceed what it previously was by less than the amount of the duty, while their means of purchasing it will be
      increased by the increase of their money incomes.
  - chunk_index: 40
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 6. Effects produced on international Exchange by Duties on Exports and on Imports.
    content_token_count: 49
    text: |-
      “If the imposition of the tax does not diminish the demand, it will leave the trade exactly as it was before. We shall
      import as much, and export as much; the whole of the tax will be paid out of our own pockets.
  - chunk_index: 41
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 6. Effects produced on international Exchange by Duties on Exports and on Imports.
    content_token_count: 146
    text: |-
      “But the imposition of a tax on a commodity almost always diminishes the demand more or less; and it can never, or
      scarcely ever, increase the demand. It may, therefore, be laid down as a principle that a tax on imported commodities,
      when it really operates as a tax, and not as a prohibition either total or partial, almost always falls in part upon the
      foreigners who consume our goods; and that this is a mode in which a nation may appropriate to itself, at the expense of
      foreigners, a larger share than would otherwise belong to it of the increase in the general productiveness of the labor
      and capital of the world, which results from the interchange of commodities among nations.”
  - chunk_index: 42
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 6. Effects produced on international Exchange by Duties on Exports and on Imports.
    content_token_count: 99
    text: |-
      Those are, therefore, in the right who maintain that taxes on imports are partly paid by foreigners; but they are
      mistaken when they say that it is by the foreign producer. It is not on the person from whom we buy, but on all those
      who buy from us, that a portion of our custom duties spontaneously falls. It is the foreign consumer of our exported
      commodities who is obliged to pay a higher price for them because we maintain revenue duties on foreign goods.
  - chunk_index: 43
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 6. Effects produced on international Exchange by Duties on Exports and on Imports.
    content_token_count: 295
    text: |-
      There are but two cases in which duties on commodities can in any degree, or in any manner, fall on the producer. One
      is, when the article is a strict monopoly, and at a scarcity price. The price in this case being only limited by the
      desires of the buyer—the sum obtained for the restricted supply being the utmost which the buyers would consent to give
      rather than go without it—if the treasury intercepts a part of this, the price can not be further raised to compensate
      for the tax, \[pg 580\] and it must be paid from the monopoly profits. A tax on rare and high-priced wines will fall
      wholly on the growers, or rather, on the owners of the vineyards. The second case, in which the producer sometimes bears
      a portion of the tax, is more important: the case of duties on the produce of land or of mines. These might be so high
      as to diminish materially the demand for the produce, and compel the abandonment of some of the inferior qualities of
      land or mines. Supposing this to be the effect, the consumers, both in the country itself and in those which dealt with
      it, would obtain the produce at smaller cost; and a part only, instead of the whole, of the duty would fall on the
      purchaser, who would be indemnified chiefly at the expense of the land-owners or mine-owners in the producing country.
  - chunk_index: 44
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 6. Effects produced on international Exchange by Duties on Exports and on Imports.
    content_token_count: 124
    text: |-
      Duties on importation may, then, be divided “into two classes: (1) those which have the effect of encouraging some
      particular branch of domestic industry \[protective duties\], (2) and those which have not \[revenue duties\]. The
      former are purely mischievous, both to the country imposing them and to those with whom it trades. They prevent a saving
      of labor and capital, which, if permitted to be made, would be divided in some proportion or other between the importing
      country and the countries which buy what that country does or might export.
  - chunk_index: 45
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 6. Effects produced on international Exchange by Duties on Exports and on Imports.
    content_token_count: 154
    text: |-
      “The other class of duties are those which do not encourage one mode of procuring an article at the expense of another,
      but allow interchange to take place just as if the duty did not exist, and to produce the saving of labor which
      constitutes the motive to international as to all other commerce. Of this kind are duties on the importation of any
      commodity which could not by any possibility be produced at home, and duties not sufficiently high to counterbalance the
      difference of expense between the production of the article at home and its importation. Of the money which is brought
      into the treasury of any country by taxes of this last description, a part only is paid by the people of that country;
      the remainder by the foreign consumers of their goods.
  - chunk_index: 46
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 6. Effects produced on international Exchange by Duties on Exports and on Imports.
