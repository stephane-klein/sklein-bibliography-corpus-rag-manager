    text: |-
      By “reciprocity” is meant that, when one country admits goods free of duty from a second country, this latter country
      will also admit the commodities of the former free of duty; or, as is often the case, if not free of duty, at a less
      than the usual rate. Until the last few years we have had a reciprocity treaty with Canada, but it is not now in force;
