  - chunk_index: 49
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 6. Effects produced on international Exchange by Duties on Exports and on Imports.
    content_token_count: 235
    text: |-
      “There would be no advantage, therefore, in imposing duties of this kind with a view to gain by them in the manner which
      has been pointed out. But, when any part of the revenue is derived from taxes on commodities, these may often be as
      little objectionable as the rest. It is evident, too, that considerations of reciprocity, which are quite unessential
      when the matter in debate is a protecting duty, are of material importance when the repeal of duties of this other
      description is discussed. A country can not be expected to renounce the power of taxing foreigners unless foreigners
      will in return practice toward itself the same forbearance. The only mode in which a country can save itself from being
      a loser by the revenue duties imposed by other countries on its commodities is, to impose corresponding revenue duties
      on theirs. Only it must take care that \[pg 582\] those duties be not so high as to exceed all that remains of the
      advantage of the trade, and put an end to importation altogether, causing the article to be either produced at home, or
      imported from another and a dearer market.”
  - chunk_index: 50
