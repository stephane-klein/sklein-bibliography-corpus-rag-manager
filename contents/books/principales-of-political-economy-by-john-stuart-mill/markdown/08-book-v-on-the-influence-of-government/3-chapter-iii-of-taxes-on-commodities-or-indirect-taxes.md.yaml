  - chunk_index: 48
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 6. Effects produced on international Exchange by Duties on Exports and on Imports.
