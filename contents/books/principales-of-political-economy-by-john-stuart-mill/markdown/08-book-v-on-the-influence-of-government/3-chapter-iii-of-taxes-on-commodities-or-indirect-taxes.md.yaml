  - chunk_index: 12
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 3. Peculiar effects of taxes on Necessaries.
    content_token_count: 197
    text: |-
      But it is only corn-rent that is lowered, and not rent estimated in money, or in any other commodity. For, in the same
      proportion as corn-rent is reduced in quantity, the corn composing it is raised in value. Under the tithe, 54 bushels
      will be worth in the market what 60 were before; and nine tenths will in all cases sell for as much as the whole ten
      tenths previously sold for. The landlords will therefore be compensated in value and price for what they lose in
      quantity, and will suffer only so far as they consume their rent in kind, or, after receiving it in money, expend it in
      agricultural produce; that is, they only suffer as consumers of agricultural produce, and in common with all the other
      consumers. Considered as landlords, they have the same income as before; the tithe, therefore, falls on the consumer,
      and not on the landlord.
  - chunk_index: 13
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 3. Peculiar effects of taxes on Necessaries.
    content_token_count: 128
    text: |-
      The same effect would be produced on rent if the tax, instead of being a fixed proportion of the produce, were a fixed
      sum per quarter or per bushel. A tax which takes a shilling for every bushel takes more shillings from one field than
      from another, just in proportion as it produces more bushels; and operates exactly like tithe, except that tithe is not
      only the same proportion on all lands, but is also the same proportion at all times, while a fixed sum of money per
      bushel will amount to a greater or less proportion, according as corn is cheap or dear.
  - chunk_index: 14
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 3. Peculiar effects of taxes on Necessaries.
    content_token_count: 265
    text: |-
      There are other modes of taxing agriculture, which would affect rent differently. A tax proportioned to the rent would
      \[pg 568\] fall wholly on the rent, and would not at all raise the price of corn, which is regulated by the portion of
      the produce that pays no rent. A fixed tax of so much per cultivated acre, without distinction of value, would have
      effects directly the reverse. Taking no more from the best qualities of land than from the worst, it would leave the
      differences the same as before, and consequently the same corn-rents, and the landlords would profit to the full extent
      of the rise of price. To put the thing in another manner: the price must rise sufficiently to enable the worst land to
      pay the tax, thus enabling all lands which produce more than the worst to pay not only the tax, but also an increased
      rent to the landlords. These, however, are not so much taxes on the produce of land as taxes on the land itself. Taxes
      on the produce, properly so called, whether fixed or ad valorem, do not affect rent, but fall on the consumer, profits,
      however, generally bearing either the whole or the greatest part of the portion which is levied on the consumption of
      the laboring-classes.
  - chunk_index: 15
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 4. —how modified by the tendency of profits to a minimum.
    content_token_count: 569
    text: |-
      The preceding is, I apprehend, a correct statement of the manner in which taxes on agricultural produce operate when
      first laid on. When, however, they are of old standing, their effect may be different. Now, the effect of accumulation,
      when attended by its usual accompaniment, an increase of population, is to increase the value and price of food, to
      raise rent, and to lower profits; that is, to do precisely what is done by a tax on agricultural produce, except that
      this does not raise rent. The tax, therefore, merely anticipates the rise of price and fall of profits which would have
      taken place ultimately through the mere progress of accumulation, while it at the same time prevents, or at least
      retards, that progress. If the rate of profit was such that the effect of the tithe reduces it to the practical minimum,
      after a lapse of time which would have admitted of a rise of one tenth from the natural progress of wealth, the consumer
      will be paying no more than he would have paid if the tithe had never existed; he will have ceased to pay any portion of
      it, and the person who will really pay it is the landlord, \[pg 569\] whom it deprives of the increase of rent which
      would by that time have accrued to him. At every successive point in this interval of time, less of the burden will rest
      on the consumer, and more of it on the landlord; and, in the ultimate result, the minimum of profits will be reached
      with a smaller capital and population and a lower rental than if the course of things had not been disturbed by the
      imposition of the tax. If, on the other hand, the tithe or other tax on agricultural produce does not reduce profits to
      the minimum, but to something above the minimum, accumulation will not be stopped, but only slackened; and, if
      population also increases, the twofold increase will continue to produce its effects—a rise of the price of corn and an
      increase of rent. These consequences, however, will not take place with the same rapidity as if the higher rate of
      profit had continued. At the end of twenty years the country will have a smaller population and capital than, but for
      the tax, it would by that time have had; the landlords will have a smaller rent, and the price of corn, having increased
      less rapidly than it would otherwise have done, will not be so much as a tenth higher than what, if there had been no
      tax, it would by that time have become. A part of the tax, therefore, will already have ceased to fall on the consumer
      and devolved upon the landlord, and the proportion will become greater and greater by lapse of time.
  - chunk_index: 16
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 4. —how modified by the tendency of profits to a minimum.
    content_token_count: 251
    text: |-
      But though tithes and other taxes on agricultural produce, when of long standing, either do not raise the price of food
      and lower profits at all, or, if at all, not in proportion to the tax, yet the abrogation of such taxes, when they
      exist, does not the less diminish price, and, in general, raise the rate of profit. The abolition of a tithe takes one
      tenth from the cost of production, and consequently from the price, of all agricultural produce; and, unless it
      permanently raises the laborer's requirements, it lowers the cost of labor and raises profits. Rent, estimated in money
      or in commodities, generally remains as before; estimated in agricultural produce, it is raised. The country adds as
      much, by the repeal of a tithe, to the margin which intervenes between it and the stationary \[pg 570\] state as was cut
      off from that margin by the tithe when first imposed. Accumulation is greatly accelerated, and, if population also
      increases, the price of corn immediately begins to recover itself and rent to rise, thus gradually transferring the
      benefit of the remission from the consumer to the landlord.
  - chunk_index: 17
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 5. Effects of discriminating Duties.
    content_token_count: 83
    text: |-
      We have hitherto inquired into the effects of taxes on commodities, on the assumption that they are levied impartially
      on every mode in which the commodity can be produced or brought to market. Another class of considerations is opened, if
      we suppose that this impartiality is not maintained, and that the tax is imposed, not on the commodity, but on some
      particular mode of obtaining it.
  - chunk_index: 18
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 5. Effects of discriminating Duties.
    content_token_count: 429
    text: |-
      Suppose that a commodity is capable of being made by two different processes—as a manufactured commodity may be produced
      either by hand or by steam-power—sugar may be made either from the sugar-cane or from beet-root, cattle fattened either
      on hay and green crops or on oil-cake and the refuse of breweries. It is the interest of the community that, of the two
      methods, producers should adopt that which produces the best article at the lowest price. This being also the interest
      of the producers, unless protected against competition, and shielded from the penalties of indolence, the process most
      advantageous to the community is that which, if not interfered with by Government, they ultimately find it to their
      advantage to adopt. Suppose, however, that a tax is laid on one of the processes, and no tax at all, or one of smaller
      amount, on the other. If the taxed process is the one which the producers would not have adopted, the measure is simply
      nugatory. But if the tax falls, as it is of course intended to do, upon the one which they would have adopted, it
      creates an artificial motive for preferring the untaxed process, though the inferior of the two. If, therefore, it has
      any effect at all, it causes the commodity to be produced of worse quality, or at a greater expense of labor; it causes
      so much of the labor of the community to be wasted, and the capital employed in supporting and remunerating \[pg 571\]
      that labor to be expended as uselessly as if it were spent in hiring men to dig holes and fill them up again. This waste
      of labor and capital constitutes an addition to the cost of production of the commodity, which raises its value and
      price in a corresponding ratio, and thus the owners of the capital are indemnified. The loss falls on the consumers;
      though the capital of the country is also eventually diminished, by the diminution of their means of saving, and, in
      some degree, of their inducements to save.
  - chunk_index: 19
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 5. Effects of discriminating Duties.
    content_token_count: 287
    text: |-
      The kind of tax, therefore, which comes under the general denomination of a discriminating duty, transgresses the rule
      that taxes should take as little as possible from the taxpayer beyond what they bring into the treasury of the state. A
      discriminating duty makes the consumer pay two distinct taxes, only one of which is paid to the Government, and that
      frequently the less onerous of the two. If a tax were laid on sugar produced from the cane, leaving the sugar from
      beet-root untaxed, then in so far as cane-sugar continued to be used, the tax on it would be paid to the treasury, and
      might be as unobjectionable as most other taxes; but if cane-sugar, having previously been cheaper than beet-root sugar,
      was now dearer, and beet-root sugar was to any considerable amount substituted for it, and fields laid out and
      manufactories established in consequence, the Government would gain no revenue from the beet-root sugar, while the
      consumers of it would pay a real tax. They would pay for beet-root sugar more than they had previously paid for
      cane-sugar, and the difference would go to indemnify producers for a portion of the labor of the country actually thrown
      away, in producing by the labor of (say) three hundred men what could be obtained by the other process with the labor of
      two hundred.
  - chunk_index: 20
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 5. Effects of discriminating Duties.
    content_token_count: 345
    text: |-
      An interesting illustration, in late years, of the operation of a discriminating duty is to be found in the case of
      different grades of sugar imported into the United States. Our tariff levied certain duties on different grades of sugar
      classified by color, on the theory that color was a test of saccharine strength. Cargoes were examined and compared with
      graded sugars hermetically sealed in glass bottles and distributed by the Dutch \[pg 572\] authorities, whence came the
      name of “Dutch standard.” Grades from No. 1 (melado) to No. 10 must go to the refiner before consumption; but the grades
      to No. 13, although some might have gone into immediate consumption, were usually sent to be manufactured into the
      highest grades of soft and hard sugars. So long as the sugar was secured by evaporation in open coppers, or by passing
      the molasses through a layer of clay, saccharine strength and color went fairly well together. But with the invention of
      the vacuum-pan and the centrifugal wheel, by which the sugar is reduced through a shorter and more effective process,
      sugar of a certain grade of color by the Dutch standard contained a much greater degree of sweetness than that produced
      by the old methods. Cuban planters, therefore, were permitted to send sugar into this country at a duty which was really
      levied on grades much inferior, and so paid a less duty than other sugars. The products of one country were
      discriminated against in favor of another. The difficulty was settled by using the polariscope, which gave an absolute
      chemical test of the sweetness, irrespective of color.
  - chunk_index: 21
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 5. Effects of discriminating Duties.
    content_token_count: 171
    text: |-
      One of the commonest cases of discriminating duties is that of a tax on the importation of a commodity capable of being
      produced at home, unaccompanied by an equivalent tax on the home production. A commodity is never permanently imported,
      unless it can be obtained from abroad at a smaller cost of labor and capital, on the whole, than is necessary for
      producing it. If, therefore, by a duty on the importation, it is rendered cheaper to produce the article than to import
      it, an extra quantity of labor and capital is expended, without any extra result. The labor is useless, and the capital
      is spent in paying people for laboriously doing nothing. All custom duties which operate as an encouragement to the home
      production of the taxed article are thus an eminently wasteful mode of raising a revenue.
  - chunk_index: 22
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 5. Effects of discriminating Duties.
    content_token_count: 426
    text: |-
      This character belongs in a peculiar degree to custom duties on the produce of land, unless countervailed by excise
      duties on the home production. Such taxes bring less into the public treasury, compared with what they take from the
      consumers, than any other imposts to which civilized nations are usually subject. If the wheat produced in a country is
      twenty millions of quarters, and the consumption twenty-one millions, a million being annually imported, and if on this
      \[pg 573\] million a duty is laid which raises the price ten shillings per quarter, the price which is raised is not
      that of the million only, but of the whole twenty-one millions. Taking the most favorable but extremely improbable
      supposition, that the importation is not at all checked, nor the home production enlarged, the state gains a revenue of
      only half a million, while the consumers are taxed ten millions and a half, the ten millions being a contribution to the
      home growers, who are forced by competition to resign it all to the landlords. The consumer thus pays to the owners of
      land an additional tax, equal to twenty times that which he pays to the state. Let us now suppose that the tax really
      checks importation. Suppose importation stopped altogether in ordinary years; it being found that the million of
      quarters can be obtained, by a more elaborate cultivation, or by breaking up inferior land, at a less advance than ten
      shillings upon the previous price—say, for instance, five shillings a quarter. The revenue now obtains nothing, except
      from the extraordinary imports which may happen to take place in a season of scarcity. But the consumers pay every year
      a tax of five shillings on the whole twenty-one millions of quarters, amounting to £5,250,000 sterling. Of this the odd
      £250,000 goes to compensate the growers of the last million of quarters for the labor and capital wasted under the
      compulsion of the law. The remaining £5,000,000 go to enrich the landlords as before.
  - chunk_index: 23
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 5. Effects of discriminating Duties.
    content_token_count: 170
    text: |-
      Such is the operation of what are technically termed corn laws, when first laid on; and such continues to be their
      operation so long as they have any effect at all in raising the price of corn. The difference between a country without
      corn laws and a country which has long had corn laws is not so much that the last has a higher price or a larger rental,
      but that it has the same price and the same rental with a smaller aggregate capital and a smaller population. The
      imposition of corn laws raises rents, but retards that progress of accumulation which would in no long period have
      raised them fully as much. The repeal of corn laws tends to lower rents, but it unchains a force which, in a progressive
      state of \[pg 574\] capital and population, restores and even increases the former amount.
  - chunk_index: 24
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 5. Effects of discriminating Duties.
    content_token_count: 158
    text: |-
      What we have said of duties on importation generally is equally applicable to discriminating duties which favor
      importation from one place, or in one particular manner, in contradistinction to others; such as the preference given to
      the produce of a colony, or of a country with which there is a commercial treaty; or the higher duties formerly imposed
      by our navigation laws on goods imported in other than British shipping. Whatever else may be alleged in favor of such
      distinctions, whenever they are not nugatory, they are economically wasteful. They induce a resort to a more costly mode
      of obtaining a commodity in lieu of one less costly, and thus cause a portion of the labor which the country employs in
      providing itself with foreign commodities to be sacrificed without return.
  - chunk_index: 25
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 6. Effects produced on international Exchange by Duties on Exports and on Imports.
    content_token_count: 97
    text: |-
      There is one more point, relating to the operation of taxes on commodities conveyed from one country to another, which
      requires notice: the influences which they exert on international exchanges. Every tax on a commodity tends to raise its
      price, and consequently to lessen the demand for it in the market in which it is sold. All taxes on international trade
      tend, therefore, to produce a disturbance, and a readjustment of what we have termed the equation of international
      demand.
  - chunk_index: 26
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 6. Effects produced on international Exchange by Duties on Exports and on Imports.
    content_token_count: 77
    text: |-
      Taxes on foreign trade are of two kinds—taxes on imports and on exports. On the first aspect of the matter it would seem
      that both these taxes are paid by the consumers of the commodity; that taxes on exports consequently fall entirely on
      foreigners, taxes on imports wholly on the home consumer. The true state of the case, however, is much more complicated.
  - chunk_index: 27
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 6. Effects produced on international Exchange by Duties on Exports and on Imports.
    content_token_count: 114
    text: |-
      “By taxing exports we may, in certain circumstances, produce a division of the advantage of the trade more favorable to
      ourselves. In some cases we may draw into our coffers, at the expense of foreigners, not only the whole tax, but more
      than the tax; in other cases we should gain exactly \[pg 575\] the tax; in others, less than the tax. In this last case
      a part of the tax is borne by ourselves; possibly the whole, possibly even, as we shall show, more than the whole.”
  - chunk_index: 28
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 6. Effects produced on international Exchange by Duties on Exports and on Imports.
    content_token_count: 402
    text: |-
      Reverting to the supposititious case employed of a trade between England and the United States in iron and corn, suppose
      that the United States taxes her export of corn, the tax not being supposed high enough to induce England to produce
      corn for herself. The price at which corn can be sold in England is augmented by the tax. This will probably diminish
      the quantity consumed. It may diminish it so much that, even at the increased price, there will not be required so great
      a money value as before. Or it may not diminish it at all, or so little that, in consequence of the higher price, a
      greater money value will be purchased than before. In this last case, the United States will gain, at the expense of
      England, not only the whole amount of the duty, but more; for, the money value of her exports to England being
      increased, while her imports remain the same, money will flow into the United States from England. The price of corn
      will rise in the United States, and consequently in England; but the price of iron will fall in England, and
      consequently in the United States. We shall export less corn and import more iron, till the equilibrium is restored. It
      thus appears (what is at first sight somewhat remarkable) that, by taxing her exports, the United States would, in some
      conceivable circumstances, not only gain from her foreign customers the whole amount of the tax, but would also get her
      imports cheaper. She would get them cheaper in two ways, for she would obtain them for less money, and would have more
      money to purchase them with. England, on the other hand, would suffer doubly: she would have to pay for her corn a price
      increased not only by the duty, but by the influx of money into the United States, while the same change in the
      distribution of the circulating medium would leave her less money to purchase it with.[^344]
  - chunk_index: 29
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 6. Effects produced on international Exchange by Duties on Exports and on Imports.
    content_token_count: 6
    text: \[pg 576\]
  - chunk_index: 30
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 6. Effects produced on international Exchange by Duties on Exports and on Imports.
    content_token_count: 320
    text: |-
      This, however, is only one of three possible cases. If, after the imposition of the duty, England requires so diminished
      a quantity of corn that its total value is exactly the same as before, the balance of trade would be undisturbed; the
      United States will gain the duty, England will lose it, and nothing more. If, again, the imposition of the duty
      occasions such a falling off in the demand that England requires a less pecuniary value than before, our exports will no
      longer pay for our imports; money must pass from the United States into England; and England's share of the advantage of
      the trade will be increased. By the change in the distribution of money, corn will fall in the United States, and
      therefore it will, of course, fall in England. Thus England will not pay the whole of the tax. From the same cause, iron
      will rise in England, and consequently in the United States. When this alteration of prices has so adjusted the demand
      that the corn and the iron again pay for one another, the result is that England has paid only a part of the tax, and
      the remainder of what has been received into our treasury has come indirectly out of the pockets of our own consumers of
      iron, who pay a higher price for that imported commodity in consequence of the tax on our exports, while at the same
      time they, in consequence of the efflux of money and the fall of prices, have smaller money incomes wherewith to pay for
      the iron at that advanced price.
  - chunk_index: 31
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 6. Effects produced on international Exchange by Duties on Exports and on Imports.
    content_token_count: 156
    text: |-
      It is not an impossible supposition that by taxing our exports we might not only gain nothing from the foreigner, the
      tax being paid out of our own pockets, but might even compel our own people to pay a second tax to the foreigner.
      Suppose, as before, that the demand of England for corn falls off so much on the imposition of the duty that she
      requires a smaller money value than before, but that the case is so different with iron in the United States that when
      the price rises the demand either does not fall off at all, or so little that the money value required is greater than
      before. The first effect of laying on the duty is, as before, that the corn exported will no longer pay for the iron
      imported.
  - chunk_index: 32
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 6. Effects produced on international Exchange by Duties on Exports and on Imports.
    content_token_count: 6
    text: \[pg 577\]
  - chunk_index: 33
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 6. Effects produced on international Exchange by Duties on Exports and on Imports.
    content_token_count: 325
    text: |-
      Money will therefore flow out of the United States into England. One effect is to raise the price of iron in England,
      and consequently in the United States. But this, by the supposition, instead of stopping the efflux of money, only makes
      it greater; because, the higher the price, the greater the money value of the iron consumed. The balance, therefore, can
      only be restored by the other effect, which is going on at the same time, namely, the fall of corn in the American and
      consequently in the English market. Even when corn has fallen so low that its price with the duty is only equal to what
      its price without the duty was at first, it is not a necessary consequence that the fall will stop; for the same amount
      of exportation as before will not now suffice to pay the increased money value of the imports; and although the English
      consumers have now not only corn at the old price, but likewise increased money incomes, it is not certain that they
      will be inclined to employ the increase of their incomes in increasing their purchases of corn. The price of corn,
      therefore, must perhaps fall, to restore the equilibrium, more than the whole amount of the duty; England may be enabled
      to import corn at a lower price when it is taxed than when it was untaxed; and this gain she will acquire at the expense
      of the American consumers of iron, who, in addition, will be the real payers of the whole of what is received at their
      own custom-house under the name of duties on the export of corn.
  - chunk_index: 34
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 6. Effects produced on international Exchange by Duties on Exports and on Imports.
    content_token_count: 65
    text: |-
      In general, however, there could be little doubt that a country which imposed such taxes would succeed in making foreign
      countries contribute something to its revenue; but, unless the taxed article be one for which their demand is extremely
      urgent, they will seldom pay the whole of the amount which the tax brings in.[^345]
  - chunk_index: 35
