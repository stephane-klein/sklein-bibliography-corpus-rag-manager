  - chunk_index: 55
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter III. Of Taxes On Commodities, Or Indirect Taxes. > § 6. Effects produced on international Exchange by Duties on Exports and on Imports.
    content_token_count: 79
    text: '[^345]: Probably the strongest known instance of a large revenue raised from foreigners by a tax on exports is the opium-trade with China. The high price of the article under the Government monopoly (which is equivalent to a high export duty) has so little effect in discouraging its consumption that it is said to have been occasionally sold in China for as much as its weight in silver.—Mill.'
