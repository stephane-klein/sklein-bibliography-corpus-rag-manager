  - chunk_index: 68
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter IV. Comparison Between Direct And Indirect Taxation. > § 5. A Résumé of the general principles of taxation.
    content_token_count: 212
    text: |-
      Indirect taxes on Short investments are subject to the laws of indirect taxation. 1. Tax vanities rather than positive
      enjoyments (e.g., liveries rather than servants). 2. The consumer and not the producer should pay the tax collector
      (Canon IV). That is, collect the tax as near the actual consumer as possible. 3. Taxes on real enjoyments to be kept as
      equal as possible for large and small means. 4. Tax as few articles as possible. England taxes only a very small number
      of imports. The United States taxes nearly everything imported. 5. Tax stimulants freely. The United States collect
      $91,000,000 from spirits and liquors, and $42,000,000 from tobacco (1883). 6. Tax imports of commodities not made at
      home, or whose home production is under an excise (internal revenue) duty equal to the customs tax. 7. Keep the rate of
      tax low, in order to get most revenue.
