      The experience of the United States is pregnant with lessons in this direction. During the war we imposed an
      internal-revenue tax on distilled spirits of so large an amount that it not only produced less revenue than a smaller
      tax would have done, but it created gigantic frauds, public corruption, and infinite devices to escape the payment. The
      following table will show how the production, as indicated by the tax, fell off when the tax was excessive. It forced
      evasions by distillers. It has been found by various experiences that with a less rate the revenue is largely increased.
