  - chunk_index: 53
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter IV. Comparison Between Direct And Indirect Taxation. > § 5. A Résumé of the general principles of taxation.
    content_token_count: 54
    text: |-
      General income taxes. The best of taxes, if people were all honest. As it is, it falls most heavily on the
      conscientious. Should be reserved for emergency. All _savings_ and a fixed amount in _all_ incomes should be exempt.
  - chunk_index: 54
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter IV. Comparison Between Direct And Indirect Taxation. > § 5. A Résumé of the general principles of taxation.
    content_token_count: 16
    text: |-
      Special taxes are on:  
      Rent.  
      Wages.  
      Profits.
  - chunk_index: 55
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter IV. Comparison Between Direct And Indirect Taxation. > § 5. A Résumé of the general principles of taxation.
    content_token_count: 50
    text: |-
      Taxes on Rent. Agricultural rent is meant. It falls entirely on the landlord, and, if not balanced by taxes on other
      classes, is unjust. May be blended with a tax on profits, if on rent due to landlord's improvements.
  - chunk_index: 56
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter IV. Comparison Between Direct And Indirect Taxation. > § 5. A Résumé of the general principles of taxation.
    content_token_count: 18
    text: |-
      Taxes on Wages are:  
      On Skilled.  
      On Unskilled.
  - chunk_index: 57
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter IV. Comparison Between Direct And Indirect Taxation. > § 5. A Résumé of the general principles of taxation.
    content_token_count: 33
    text: |-
      Skilled wages are at a monopoly price, and taxes on them are paid by the laborers, so long as wages are not reduced
      below their just proportion.
  - chunk_index: 58
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter IV. Comparison Between Direct And Indirect Taxation. > § 5. A Résumé of the general principles of taxation.
    content_token_count: 46
    text: |-
      Unskilled wages. (1) Population diminished by it. Paid by profits. (2) Population left stationary. Shared between
      profits and wages. (3) Population increasing in spite of it. Falls entirely on wages.
  - chunk_index: 59
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter IV. Comparison Between Direct And Indirect Taxation. > § 5. A Résumé of the general principles of taxation.
    content_token_count: 127
    text: |-
      Taxes on Profits. May possible stimulate production, and is then a good all round, contributing to the state, and
      leaving no one any poorer. If not, if profits are really diminished by the tax, capital may be diminished also. This (a)
      may, or (b) may not diminish population. If (a), then the margin of cultivation ceases to be extended, and part of the
      tax, pro tanto, falls on the landlords. If (b), then wages fall, and part of the tax falls on the laborer. Total result
      is a nearer approach to the stationary state.
  - chunk_index: 60
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter IV. Comparison Between Direct And Indirect Taxation. > § 5. A Résumé of the general principles of taxation.
    content_token_count: 31
    text: |-
      Taxes on Expenditure are open to the same objections as the general income-tax. They may be:  
      Assessed taxes.  
      House-tax.
