  - chunk_index: 71
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter IV. Comparison Between Direct And Indirect Taxation. > § 5. A Résumé of the general principles of taxation.
    content_token_count: 77
    text: '[^346]: A land-tax is, to its extent, an evidence that the state claims a certain right in the soil, and that it stands to the contributor, as it were, in the place of a landlord. This tax, however, is generally so small that it does not materially diminish the rent of land. So far as it goes, it is a tax on rent.'
  - chunk_index: 72
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter IV. Comparison Between Direct And Indirect Taxation. > § 5. A Résumé of the general principles of taxation.
    content_token_count: 129
    text: '[^347]: Some argue that the materials and instruments of all production should be exempt from taxation; but these, when they do not enter into the production of necessaries, seem as proper subjects of taxation as the finished article. It is chiefly with reference to foreign trade that such taxes have been considered injurious. Internationally speaking, they may be looked upon as export duties, and, unless in cases in which an export duty is advisable, they should be accompanied with an equivalent drawback on exportation. But there is no sufficient reason against taxing the materials and instruments used in the production of anything which is itself a fit object of taxation.—Mill.'
  - chunk_index: 73
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter IV. Comparison Between Direct And Indirect Taxation. > § 5. A Résumé of the general principles of taxation.
    content_token_count: 26
