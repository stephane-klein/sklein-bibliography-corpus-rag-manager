  - chunk_index: 0
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter IV. Comparison Between Direct And Indirect Taxation. > § 1. Arguments for and against direct Taxation.
    content_token_count: 351
    text: |-
      Are direct or indirect taxes the most eligible? A man dislikes not so much the payment as the act of paying. He dislikes
      seeing the face of the tax-collector, and being subjected to his peremptory demand. Perhaps, too, the money which he is
      required to pay directly out of his pocket is the only taxation which he is quite sure that he pays at all. That a tax
      of two shillings per pound on tea, or of three shillings per bottle on wine, raises the price of each pound of tea and
      bottle of wine which he consumes, by that and more than that amount, can not, indeed, be denied; it is the fact, and is
      intended to be so, and he himself, at times, is perfectly aware of it; but it makes hardly any impression on his
      practical feelings and associations, serving to illustrate the distinction between what is merely known to be true and
      what is felt to be so. The unpopularity of direct taxation, contrasted with the easy manner in which the public consent
      to let themselves be fleeced in the prices of commodities, has generated in many friends of improvement a directly
      opposite mode of thinking to the foregoing. They contend that the very reason which makes direct taxation disagreeable
      makes it preferable. Under it every one knows how much he really pays; and, if he votes for a war, or any other
      expensive national luxury, he does so with his eyes open to what it costs him. If all taxes were direct, taxation would
      be much more perceived than at present, and there would be a security, which now there is not, for economy in the public
      expenditure.
