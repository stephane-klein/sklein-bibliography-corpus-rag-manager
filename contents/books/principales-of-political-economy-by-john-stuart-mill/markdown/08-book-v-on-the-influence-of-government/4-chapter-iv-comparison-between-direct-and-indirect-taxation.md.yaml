  - chunk_index: 14
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter IV. Comparison Between Direct And Indirect Taxation. > § 3. Practical rules for indirect taxation.
    content_token_count: 175
    text: |-
      In what manner the finer articles of manufacture, consumed by the rich, might most advantageously be taxed, I must leave
      to be decided by those who have the requisite practical knowledge. The difficulty would be, to effect it without an
      inadmissible degree of interference with production. In countries which, like the United States, import the principal
      part of the finer manufactures which they consume, there is little difficulty in the matter; and, even where nothing is
      imported but the raw material, that may be taxed, especially the qualities of it which are exclusively employed for the
      fabrics used by the richer class of consumers. Thus, in England a high custom duty on raw silk would be consistent with
      principle; and it might perhaps be practicable to tax the finer qualities of cotton or linen yarn, whether spun in the
      country itself or imported.
