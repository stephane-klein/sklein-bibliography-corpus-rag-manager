  - chunk_index: 75
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter IV. Comparison Between Direct And Indirect Taxation. > § 5. A Résumé of the general principles of taxation.
    content_token_count: 336
    text: '[^350]: The old condition of things was well described by Sydney Smith: “We must pay taxes upon every article which enters into the mouth or covers the back, or is placed under the foot. Taxes upon everything which is pleasant to see, hear, feel, smell, and taste. Taxes upon warmth, light, and locomotion. Taxes upon everything upon earth and the waters under the earth. On everything that comes from abroad or is grown at home. Taxes on raw material. Taxes on every value that is added to it by the industry of man. Taxes on the sauce which pampers man''s appetite and the drug which restores him to health. On the ermine which decorates the judge and the rope which hangs the criminal. On the brass nails of the coffin and on the ribbons of the bride. At bed or at board, couchant or levant, we must pay. The beardless youth manages his taxed horse with a taxed bridle on a taxed road, and the dying Englishman, pouring his medicine (which has paid 7 per cent) into a spoon (which has paid 30 per cent), throws himself back upon his chintz bed (which has paid 22 per cent), makes his will, and expires in the arms of the apothecary (who has paid £100 for the privilege of putting him to death). His whole property is then taxed from 2 to 10 per cent; besides the probate, large fees are demanded for burying him in the chancel: his virtues are handed down to posterity on taxed marble, and he is then gathered to his fathers to be taxed no more.”'
