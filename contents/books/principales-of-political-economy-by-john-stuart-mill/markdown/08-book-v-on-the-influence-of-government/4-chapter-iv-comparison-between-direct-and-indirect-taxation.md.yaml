    text: |-
      This leaves a surplus of $132,839,444 above all expenditures, and our problem is now where to reduce taxation. The
      annual interest charge is lessening with the payment of the public debt, having fallen from its highest figure of
      $143,781,591 in 1867, to $59,160,131 in 1883.[^349] Our national taxation is practically all indirect, that of internal
      taxation being chiefly levied on tobacco and distilled spirits, and our customs falling on almost all articles which can
      be imported, materials as well as manufactures.
  - chunk_index: 24
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book V. On The Influence Of Government. > Chapter IV. Comparison Between Direct And Indirect Taxation. > § 4. Taxation systems of the United States and other Countries.
    content_token_count: 147
    text: |-
      In the United States direct taxation on real and personal property is very generally levied for State, county, and
      municipal purposes. In fact, nearly all the perceptible taxation is the property tax, and, inasmuch as the State and
      county tax is very light, the burden is almost always owing to municipal and town expenditures. People do not seem to be
      aware of the enormous national burden, because the taxes are indirect, and only increase the prices of commodities.
      Other countries, it will be seen, make a greater use of direct taxation than the United States. In fact, the comparison
      of the ways by which different countries collect their revenues may naturally show us where we may gain by their
      experience.
  - chunk_index: 25
