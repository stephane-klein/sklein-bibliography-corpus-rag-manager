      295\. Examine the following argument, emending, if you think it necessary, the free-trader's doctrine on the point
      raised: The free-trader's belief is that a customs duty is added to the price of the article upon which it is imposed.
      If the article is imported, according to his theory, the increase of the price goes into the public treasury; if the
      article is made in the country, the increase of the price goes into the pocket of the producer. But in the former case
      there is no protection; and competition will prevent the latter. Therefore protection does not increase the price of the
      protected article. If a customs duty is imposed upon a commodity, and its price is not raised in consequence, what
      inference can you draw?
