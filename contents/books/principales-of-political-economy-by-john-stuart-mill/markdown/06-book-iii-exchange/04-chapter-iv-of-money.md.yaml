    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book III. Exchange. > Chapter IV. Of Money. > § 1. The three functions of Money—a Common Denominator of Value, a Medium of Exchange, a “Standard of Value”.
    content_token_count: 70
    text: |-
      Having proceeded thus far in ascertaining the general laws of Value, without introducing the idea of Money (except
      occasionally for illustration), it is time that we should now superadd that idea, and consider in what manner the
      principles of the mutual interchange of commodities are affected by the use of what is termed a Medium of Exchange.
  - chunk_index: 1
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book III. Exchange. > Chapter IV. Of Money. > § 1. The three functions of Money—a Common Denominator of Value, a Medium of Exchange, a “Standard of Value”.
    content_token_count: 35
    text: |-
