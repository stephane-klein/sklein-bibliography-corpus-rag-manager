    content_token_count: 54
    text: |-
      F. A. Walker,[^221] however, says: “Money is the medium of exchange. Whatever performs this function, does this work, is
      money, no matter what it is made of.... That which does the money-work is the money-thing.”
  - chunk_index: 6
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book III. Exchange. > Chapter IV. Of Money. > § 1. The three functions of Money—a Common Denominator of Value, a Medium of Exchange, a “Standard of Value”.
    content_token_count: 177
    text: |-
      (1.) \[If we had no money\] the first and most obvious \[inconvenience\] would be the want of a _common measure for
      values_ of different sorts. If a tailor had only coats, and wanted to buy bread or a horse, it would be very troublesome
      to ascertain how much bread he ought to obtain for a coat, or how many coats he should give for a horse. The calculation
      must be recommenced on different data every time he bartered his coats for a different kind of article, and there could
      be no current price or regular quotations of value. As it is much easier to compare different lengths by expressing \[pg
      287\] them in a common language of feet and inches, so it is much easier to compare values by means of a common language
      of \[dollars and cents\].
  - chunk_index: 7
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book III. Exchange. > Chapter IV. Of Money. > § 1. The three functions of Money—a Common Denominator of Value, a Medium of Exchange, a “Standard of Value”.
    content_token_count: 129
    text: |-
      The need of a common denominator of values (an excellent term, introduced by Storch), to whose terms the values of all
      other commodities may be reduced, and so compared, is as great as that the inhabitants of the different States of the
      United States should have a common language as a means by which ideas could be communicated to the whole nation. A man
      may have a horse, whose value he wishes to compare in some common term with the value of his house, although he might
      not wish to sell either. A valuation by the State for taxation could not exist but for this common denominator, or
      register, of value.
  - chunk_index: 8
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book III. Exchange. > Chapter IV. Of Money. > § 1. The three functions of Money—a Common Denominator of Value, a Medium of Exchange, a “Standard of Value”.
    content_token_count: 80
    text: |-
      (2.) The second function is that of a medium of exchange. The distinction between this function and the common
      denominator of value is that the latter measures value, the former transfers value. The man owning the horse, after
      having measured its value by comparison with a given thing, may now wish to exchange it for other things. This discloses
      the need of another quality in money.
  - chunk_index: 9
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book III. Exchange. > Chapter IV. Of Money. > § 1. The three functions of Money—a Common Denominator of Value, a Medium of Exchange, a “Standard of Value”.
    content_token_count: 209
    text: |-
      The inconveniences of barter are so great that, without some more commodious means of effecting exchanges, the division
      of employments could hardly have been carried to any considerable extent. A tailor, who had nothing but coats, might
      starve before he could find any person having bread to sell who wanted a coat: besides, he would not want as much bread
      at a time as would be worth a coat, and the coat could not be divided. Every person, therefore, would at all times
      hasten to dispose of his commodity in exchange for anything which, though it might not be fitted to his own immediate
      wants, was in great and general demand, and easily divisible, so that he might be sure of being able to purchase with it
      whatever was offered for sale. The thing which people would select to keep by them for making purchases must be one
      which, besides being divisible and generally desired, does not deteriorate by keeping. This reduces the choice to a
      small number of articles.
  - chunk_index: 10
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book III. Exchange. > Chapter IV. Of Money. > § 1. The three functions of Money—a Common Denominator of Value, a Medium of Exchange, a “Standard of Value”.
    content_token_count: 192
    text: |-
      This need is well explained by the following facts furnished by Professor Jevons: “Some years since, Mademoiselle Zélie,
      \[pg 288\] a singer of the Théâtre Lyrique at Paris, made a professional tour round the world, and gave a concert in the
      Society Islands. In exchange for an air from ‘Norma’ and a few other songs, she was to receive a third part of the
      receipts. When counted, her share was found to consist of three pigs, twenty-three turkeys, forty-four chickens, five
      thousand cocoanuts, besides considerable quantities of bananas, lemons, and oranges. In the Society Islands, however,
      pieces of money were very scarce; and, as mademoiselle could not consume any considerable portion of the receipts
      herself, it became necessary in the mean time to feed the pigs and poultry with the fruit.”[^222]
  - chunk_index: 11
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book III. Exchange. > Chapter IV. Of Money. > § 1. The three functions of Money—a Common Denominator of Value, a Medium of Exchange, a “Standard of Value”.
    content_token_count: 148
    text: |-
      (3.) The third function desired of money is what is usually termed a “standard of value.” It is, perhaps, better
      expressed by F. A. Walker[^223] as a “standard of deferred payments.” Its existence is due to the desire to have a means
      of comparing the purchasing power of a commodity at one time with its purchasing power at another distant time; that is,
      that for long contracts, exchanges may be in unchanged ratios at the beginning and at the end of the contracts. There is
      no distinction between this function and the first, except one arising from the introduction of _time_. At the same time
      and place, the “standard of value” is given in the common denominator of value.
  - chunk_index: 12
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book III. Exchange. > Chapter IV. Of Money. > § 1. The three functions of Money—a Common Denominator of Value, a Medium of Exchange, a “Standard of Value”.
    content_token_count: 104
    text: |-
      A Measure of Value,[^224] in the ordinary sense of the word measure, would mean something by comparison with which we
      may ascertain what is the value of any other thing. When we consider, further, that value itself is relative, and that
      two things are necessary to constitute it, independently of the third thing which is to measure it, we may define a
      Measure of Value to be something, by comparing with which any two other things, we may infer their value in relation to
      one another.
  - chunk_index: 13
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book III. Exchange. > Chapter IV. Of Money. > § 1. The three functions of Money—a Common Denominator of Value, a Medium of Exchange, a “Standard of Value”.
    content_token_count: 99
    text: |-
      In this sense, any commodity will serve as a measure of value at a given time and place; since we can always infer the
      proportion in which things exchange for one another, when we know the proportion in which each exchanges for any third
      thing. To serve as a convenient measure of value is one of the functions of the commodity selected as a medium \[pg
      289\] of exchange. It is in that commodity that the values of all other things are habitually estimated.
  - chunk_index: 14
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book III. Exchange. > Chapter IV. Of Money. > § 1. The three functions of Money—a Common Denominator of Value, a Medium of Exchange, a “Standard of Value”.
    content_token_count: 178
    text: |-
      But the desideratum sought by political economists is not a measure of the value of things at the same time and place,
      but a measure of the value of the same thing at different times and places: something by comparison with which it may be
      known whether any given thing is of greater or less value now than a century ago, or in this country than in America or
      China. To enable the money price of a thing at two different periods to measure the quantity of things in general which
      it will exchange for, the same sum of money must correspond at both periods to the same quantity of things in
      general—that is, money must always have the same exchange value, the same general purchasing power. Now, not only is
      this not true of money, or of any other commodity, but we can not even suppose any state of circumstances in which it
      would be true.
  - chunk_index: 15
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book III. Exchange. > Chapter IV. Of Money. > § 1. The three functions of Money—a Common Denominator of Value, a Medium of Exchange, a “Standard of Value”.
    content_token_count: 56
    text: |-
      It being very clear that money, or the precious metals, do not themselves remain absolutely stable in value for long
      periods, the only way in which a “standard of value” can be properly established is by the proposed “multiple standard
      of value,” stated as follows:
  - chunk_index: 16
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book III. Exchange. > Chapter IV. Of Money. > § 1. The three functions of Money—a Common Denominator of Value, a Medium of Exchange, a “Standard of Value”.
    content_token_count: 506
    text: |-
      “A number of articles in general use—corn, beef, potatoes, wool, cotton, silk, tea, sugar, coffee, indigo, timber, iron,
      coal, and others—shall be taken, in a definite quantity of each, so many pounds, or bushels, or cords, or yards, to form
      a standard required. The value of these articles, in the quantities specified, and all of standard quality, shall be
      ascertained monthly or weekly by Government, and the total sum \[in money\] which would then purchase this bill of goods
      shall be, thereupon, officially promulgated. Persons may then, if they choose, make their contracts for future payments
      in terms of this multiple or tabular standard.”[^225] A, who had borrowed $1,000 of B in 1870 for ten years, would make
      note of the total money value of all these articles composing the multiple standard, which we will suppose is $125 in
      1870. Consequently, A would promise to pay B eight multiple units in ten years (that is, eight times $125, or $1,000).
      But, if other things change in value relatively \[pg 290\] to money during these ten years, the same sum of
      money—$1,000—in 1880 will not return to B the same just amount of purchasing power which he parted with in 1870. Now,
      if, in 1880, when his note falls due, the government list is examined, and it is found that commodities in general have
      fallen in value relatively to gold, the multiple unit will not amount to as much gold as it did in 1870; perhaps each
      unit may be rated only at $100. In that case, A is obliged to pay back but eight multiple units, which costs him only
      $800 in money, while B receives from A the same amount of purchasing power over other commodities which he loaned to
      him. B had no just claim to ten units, since the fall of all commodities relatively to gold was not due to his
      exertions. On the other hand, if, between 1870 and 1880, prices had risen, mutatis mutandis, the eight units would have
      cost A more than $1,000 in gold; but he would have been justly obliged to return the same amount of purchasing power to
      B which he received from him.
  - chunk_index: 17
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book III. Exchange. > Chapter IV. Of Money. > § 2. Gold and Silver, why fitted for those purposes.
    content_token_count: 207
    text: |-
      By a tacit concurrence, almost all nations, at a very early period, fixed upon certain metals, and especially gold and
      silver, to serve this purpose. No other substances unite the necessary qualities in so great a degree, with so many
      subordinate advantages. These were the things which it most pleased every one to possess, and which there was most
      certainty of finding others willing to receive in exchange for any kind of produce. They were among the most
      imperishable of all substances. They were also portable, and, containing great value in small bulk, were easily hid; a
      consideration of much importance in an age of insecurity. Jewels are inferior to gold and silver in the quality of
      divisibility; and are of very various qualities, not to be accurately discriminated without great trouble. Gold and
      silver are eminently divisible, and, when pure, always of the same quality; and their purity may be ascertained and
      certified by a public authority.
  - chunk_index: 18
