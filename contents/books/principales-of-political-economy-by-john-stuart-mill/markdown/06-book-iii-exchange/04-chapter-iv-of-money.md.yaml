  - chunk_index: 20
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book III. Exchange. > Chapter IV. Of Money. > § 2. Gold and Silver, why fitted for those purposes.
