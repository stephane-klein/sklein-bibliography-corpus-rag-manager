  - chunk_index: 21
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book III. Exchange. > Chapter IV. Of Money. > § 2. Gold and Silver, why fitted for those purposes.
    content_token_count: 172
    text: |-
      Accordingly, though furs have been employed as money in some countries, cattle in others, in Chinese Tartary cubes of
      tea closely pressed together, the shells called cowries on the coast of Western Africa, and in Abyssinia at this day
      blocks of rock-salt, gold and silver have been generally preferred by nations which were able to obtain them, either by
      industry, commerce, or conquest. To the qualities which originally recommended them, another came to be added, the
      importance of which only unfolded itself by degrees. Of all commodities, they are among the least influenced by any of
      the causes which produce fluctuations of value. No commodity is quite free from such fluctuations. Gold and silver have
      sustained, since the beginning of history, one great permanent alteration of value, from the discovery of the American
      mines.
  - chunk_index: 22
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book III. Exchange. > Chapter IV. Of Money. > § 2. Gold and Silver, why fitted for those purposes.
    content_token_count: 188
    text: |-
      In the present age the opening of new sources of supply, so abundant as the Ural Mountains, California, and Australia,
      may be the commencement of another period of decline, on the limits of which it would be useless at present to
      speculate. But, on the whole, no commodities are so little exposed to causes of variation. They fluctuate less than
      almost any other things in their cost of production. And, from their durability, the total quantity in existence is at
      all times so great in proportion to the annual supply, that the effect on value even of a change in the cost of
      production is not sudden: a very long time being required to diminish materially the quantity in existence, and even to
      increase it very greatly not being a rapid process. Gold and silver, therefore, are more fit than any other commodity to
      be the subject of engagements for receiving or paying a given quantity at some distant period.
  - chunk_index: 23
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book III. Exchange. > Chapter IV. Of Money. > § 2. Gold and Silver, why fitted for those purposes.
    content_token_count: 357
    text: |-
      Since Mr. Mill wrote, two great changes in the production of the precious metals have occurred. The discoveries of gold,
      briefly referred to by him, have led to an enormous increase of the existing fund of gold (see chart [No.
      IX](1129008759595750428_30107-h-6.html.xhtml#Chart_IX), [Chap.
      VI](1129008759595750428_30107-h-6.html.xhtml#Book_III_Chapter_VI)), and a fall in the value of gold within twenty years
      after the discoveries, according to Mr. Jevons's celebrated study,[^227] of from nine \[pg 292\] to fifteen per cent.
      Another change took place, a change in the value, of silver, in 1876, which has resulted in a permanent fall of its
      value since that time (see chart [No. X](1129008759595750428_30107-h-6.html.xhtml#Chart_X), [Chap.
      VII](1129008759595750428_30107-h-6.html.xhtml#Book_III_Chapter_VII)). Before that date, silver sold at about 60d. per
      ounce in the central market of the world, London; and now it remains about 52d. per ounce, although it once fell to
      47d., in July, 1876. In spite of Mr. Mill's expressions of confidence in their stability of value—although certainly
      more stable than other commodities—the events of the last thirty-five years have fully shown that neither gold nor
      silver—silver far less than gold—can successfully serve as a perfect “standard of value” for any considerable length of
      time.
  - chunk_index: 24
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book III. Exchange. > Chapter IV. Of Money. > § 2. Gold and Silver, why fitted for those purposes.
    content_token_count: 142
    text: |-
      When gold and silver had become virtually a medium of exchange, by becoming the things for which people generally sold,
      and with which they generally bought, whatever they had to sell or to buy, the contrivance of coining obviously
      suggested itself. By this process the metal was divided into convenient portions, of any degree of smallness, and
      bearing a recognized proportion to one another; and the trouble was saved of weighing and assaying at every change of
      possessors—an inconvenience which, on the occasion of small purchases, would soon have become insupportable. Governments
      found it their interest to take the operation into their own hands, and to interdict all coining by private persons.
  - chunk_index: 25
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book III. Exchange. > Chapter IV. Of Money. > § 3. Money a mere contrivance for facilitating exchanges, which does not affect the laws of value.
    content_token_count: 318
    text: |-
      It must be evident, however, that the mere introduction of a particular mode of exchanging things for one another, by
      first exchanging a thing for money, and then exchanging the money for something else, makes no difference in the
      essential character of transactions. It is not with money that things are really purchased. Nobody's income (except that
      of the gold or silver miner) is derived from the precious metals. The \[dollars or cents\] which a person receives
      weekly or yearly are not what constitutes his income; they are a sort of tickets or orders which he can present for
      payment at any shop he pleases, and which entitle him to receive a certain value of any commodity that he makes choice
      of. The farmer pays his laborers and his landlord in these tickets, as the most convenient plan for himself and them;
      \[pg 293\] but their real income is their share of his corn, cattle, and hay, and it makes no essential difference
      whether he distributes it to them directly, or sells it for them and gives them the price. There can not, in short, be
      intrinsically a more insignificant thing, in the economy of society, than money; except in the character of a
      contrivance for sparing time and labor. It is a machine for doing quickly and commodiously what would be done, though
      less quickly and commodiously, without it; and, like many other kinds of machinery, it only exerts a distinct and
      independent influence of its own when it gets out of order.
  - chunk_index: 26
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book III. Exchange. > Chapter IV. Of Money. > § 3. Money a mere contrivance for facilitating exchanges, which does not affect the laws of value.
    content_token_count: 210
    text: |-
      The introduction of money does not interfere with the operation of any of the Laws of Value laid down in the preceding
      chapters. The reasons which make the temporary or market value of things depend on the demand and supply, and their
      average and permanent values upon their cost of production, are as applicable to a money system as to a system of
      barter. Things which by barter would exchange for one another will, if sold for money, sell for an equal amount of it,
      and so will exchange for one another still, though the process of exchanging them will consist of two operations instead
      of only one. The relations of commodities to one another remain unaltered by money; the only new relation introduced is
      their relation to money itself; how much or how little money they will exchange for; in other words, how the Exchange
      Value of money itself is determined. Money is a commodity, and its value is determined like that of other commodities,
      temporarily by demand and supply, permanently and on the average by cost of production.
