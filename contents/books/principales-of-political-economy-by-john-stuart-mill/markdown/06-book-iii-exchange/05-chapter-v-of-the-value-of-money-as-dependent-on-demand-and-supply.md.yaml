    text: '[^228]: F. A. Walker defines the demand for money as “the occasion for the use of money in effecting exchanges; in other words, it is the amount of money-work to be done” (“Political Economy,” p. 133); and the supply of money as “the money-force available to do the money-work which the demand for money indicates as required to be done, in the given community, at the given time. The supply of money is measured by ... the amount of money and the rapidity of circulation” (ibid., p. 136).'
