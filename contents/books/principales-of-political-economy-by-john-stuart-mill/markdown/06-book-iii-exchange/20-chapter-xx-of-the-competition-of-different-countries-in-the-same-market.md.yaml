  - chunk_index: 29
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book III. Exchange. > Chapter XX. Of The Competition Of Different Countries In The Same Market. > § 5. Low profits as affecting the carrying Trade.
    content_token_count: 325
    text: |-
      In the United States, early in the century, a retaliatory policy against England gave us a body of navigation laws
      copied after the mediæval statutes of England and the Continent, which still remain on the statute-book. They do not
      permit an American to buy a vessel abroad and sail it under our flag without paying enormous duties; a provision which
      is intended to foster ship-building in the United States. Even with this legislation, ships, as a fact, are not built
      here for the foreign trade; and our ship-builders practically supply the coasting-trade only (which is not open to
      foreigners). The ability to buy ships anywhere, and enter them to registry under our flag free of duty, is what is meant
      by the demand for “free ships.” This, however, has to do with ship-building. But ship-owning or ship-sailing, is quite
      distinct from it. The ability to get as great a return from capital and labor invested in a ship as from other
      occupations open to Americans is another thing. Even if we had “free ships,” the higher returns in other industries in
      our country, particularly as regards profits, might cause capitalists naturally to neglect a less for a more productive
      business. In 1884 Congress has very properly taken away many vexatious restrictions upon ships, which diminished the
      returns from ship-sailing, and it remains to be seen whether we can thereby regain any of our foreign carrying-trade. At
      present we have a very small tonnage even in that part of the shipping engaged in carrying our own goods.
