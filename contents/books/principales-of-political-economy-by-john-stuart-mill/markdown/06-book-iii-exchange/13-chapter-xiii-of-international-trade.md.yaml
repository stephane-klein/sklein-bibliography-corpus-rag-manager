  - chunk_index: 9
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book III. Exchange. > Chapter XIII. Of International Trade. > § 2. Interchange of commodities between distance places determined by differences not in their absolute, but in the comparative, costs of production.
    content_token_count: 274
    text: |-
      Here England has the advantage over Sweden in both cotton and iron, since she can produce x yards of cotton in ten days'
      labor to fifteen days in Sweden, and y cwts. of iron in twelve days' labor to fifteen days in Sweden. The ship which
      takes x yards of cotton to Sweden, and there exchanges it, as may be done, for y cwts. of iron, brings back to England
      that which cost Sweden fifteen days' labor, while the cotton with \[pg 381\] which the iron was bought cost England only
      ten days' labor. So that England also got her iron at an advantage over Sweden of one half of ten days' labor; and yet
      England had an absolute advantage over Sweden in iron of a less amount (i.e., of one fourth of twelve days' labor). It
      is to be distinctly understood that by difference in _comparative cost_ we mean a difference in the comparative cost of
      producing two or more articles in the _same country_, and not the difference of cost of the same article in the
      different trading countries. In this example, for instance, it is the difference in the comparative costs in England of
      both cotton and iron (not the different costs of cotton in England and Sweden) which gives the reason for the existence
      of the foreign trade.
  - chunk_index: 10
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book III. Exchange. > Chapter XIII. Of International Trade. > § 2. Interchange of commodities between distance places determined by differences not in their absolute, but in the comparative, costs of production.
    content_token_count: 322
    text: |-
      To illustrate the cases in which interchange of commodities will not, and those in which it will, take place between two
      countries, the supposition may be made that the United States has an advantage over England in the production both of
      iron and of corn. It may first be supposed that the advantage is of equal amount in both commodities; the iron and the
      corn, each of which required 100 days' labor in the United States, requiring each 150 days' labor in England. It would
      follow that the iron of 150 days' labor in England, if sent to the United States, would be equal to the iron of 100
      days' labor in the United States; if exchanged for corn, therefore, it would exchange for the corn of only 100 days'
      labor. But the corn of 100 days' labor in the United States was supposed to be the same quantity with that of 150 days'
      labor in England. With 150 days' labor in iron, therefore, England would only get as much corn in the United States as
      she could raise with 150 days' labor at home; and she would, in importing it, have the cost of carriage besides. In
      these circumstances no exchange would take place. In this case the comparative costs of the two articles in England and
      in the United States were supposed to be the same, though the absolute costs were different; on which supposition we see
      that there would be no labor saved to either country by confining its industry to one of the two productions and
      importing the other.
  - chunk_index: 11
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book III. Exchange. > Chapter XIII. Of International Trade. > § 2. Interchange of commodities between distance places determined by differences not in their absolute, but in the comparative, costs of production.
    content_token_count: 457
    text: |-
      It is otherwise when the comparative and not merely \[pg 382\] the absolute costs of the two articles are different in
      the two countries. If, while the iron produced with 100 days' labor in the United States was produced with 150 days'
      labor in England, the corn which was produced in the United States with 100 days' labor could not be produced in England
      with less than 200 days' labor, an adequate motive to exchange would immediately arise. With a quantity of iron which
      England produced with 150 days' labor, she would be able to purchase as much corn in the United States as was there
      produced with 100 days' labor; but the quantity which was there produced with 100 days' labor would be as great as the
      quantity produced in England with 200 days' labor. By importing corn, therefore, from the United States, and paying for
      it with iron, England would obtain for 150 days' labor what would otherwise cost her 200, being a saving of 50 days'
      labor on each repetition of the transaction; and not merely a saving to England, but a saving absolutely; for it is not
      obtained at the expense of the United States, who, with corn that cost her 100 days' labor, has purchased iron which, if
      produced at home, would have cost her the same. The United States, therefore, on this supposition, loses nothing; but
      also she derives no advantage from the trade, the imported iron costing her as much as if it were made at home. To
      enable the United States to gain anything by the interchange, something must be abated from the gain of England: the
      corn produced in the United States by 100 days' labor must be able to purchase from England more iron than the United
      States could produce by that amount of labor; more, therefore, than England could produce by 150 days' labor, England
      thus obtaining the corn which would have cost her 200 days at a cost exceeding 150, though short of 200. England,
      therefore, no longer gains the whole of the labor which is saved to the two jointly by trading with one another.[^262]
