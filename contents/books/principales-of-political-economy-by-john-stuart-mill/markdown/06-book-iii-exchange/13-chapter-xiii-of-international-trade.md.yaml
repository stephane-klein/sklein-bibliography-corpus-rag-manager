    content_token_count: 96
    text: '[^261]: I at one time believed Mr. Ricardo to have been the sole author of the doctrine now universally received by political economists, on the nature and measure of the benefit which a country derives from foreign trade. But Colonel Torrens, by the republication of one of his early writings, “The Economists refuted,” has established at least a joint claim with Mr. Ricardo to the origination of the doctrine, and an exclusive one to its earliest publication.—Mill.'
