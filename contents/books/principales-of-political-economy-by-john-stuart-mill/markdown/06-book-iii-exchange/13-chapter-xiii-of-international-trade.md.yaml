  - chunk_index: 6
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book III. Exchange. > Chapter XIII. Of International Trade. > § 2. Interchange of commodities between distance places determined by differences not in their absolute, but in the comparative, costs of production.
    content_token_count: 235
    text: |-
      As I have said elsewhere[^260] after Ricardo (the thinker who has done most toward clearing up this subject),[^261] “it
      is not a difference in the _absolute_ cost of production which determines the interchange, but a difference in the
      _comparative_ cost. It may be to our advantage to procure iron from Sweden in exchange for cottons, even although the
      mines of England as well as her manufactories should be more productive than those of Sweden; for if we have an
      advantage of one half in cottons, and only an advantage of a quarter in iron, and could sell our cottons to Sweden at
      the price which Sweden must pay for them if she produced them herself, we should obtain our iron with an advantage
      \[over Sweden\] of one half, as well as our cottons. We may often, by trading with foreigners, obtain their commodities
      at a smaller expense of labor and capital than they cost to the foreigners themselves. The bargain is still advantageous
      to the foreigner, because the commodity which he receives in exchange, though it has cost us less, would have cost him
      more.”
