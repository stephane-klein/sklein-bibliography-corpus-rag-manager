  - chunk_index: 15
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book III. Exchange. > Chapter XIII. Of International Trade. > § 2. Interchange of commodities between distance places determined by differences not in their absolute, but in the comparative, costs of production.
    content_token_count: 239
    text: |-
      The ship which carries x bushels of corn from the United States to England can there exchange it for at least y tons of
      iron (costing England 150 days' labor, since x bushels in England would cost 200 days' labor), and bring it home,
      gaining for the United States the difference between the 100 days' labor in corn, paid for the y tons of iron, and the
      125 days which the iron would have cost here if produced at home. In this case the United States has an advantage over
      England in both corn and iron, but still an international trade will spring up, because the United States will derive a
      gain owing to the less cost of corn as compared with the cost of iron. Our _comparative_ advantage is in corn. England,
      also, by sending to the United States y tons of iron, gets in return for it x bushels of corn. To produce the corn
      herself would have cost her 200 days' labor, but she bought that corn by only 150 days' labor spent on iron. England's
      _comparative_ advantage is in iron. Then both countries will gain.
  - chunk_index: 16
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book III. Exchange. > Chapter XIII. Of International Trade. > § 2. Interchange of commodities between distance places determined by differences not in their absolute, but in the comparative, costs of production.
    content_token_count: 402
    text: |-
      Mr. Bowen[^263] gives an instance of international trade where one country has the advantage in both of the commodities
      entering into the exchange: “The inhabitants of Barbadoes, favored by their tropical climate and fertile soil, can raise
      provisions cheaper than we can in the United States. And yet Barbadoes buys nearly all her provisions from this country.
      Why is this so? Because, though Barbadoes has the advantage over us in the ability to raise provisions cheaply, she has
      a still greater advantage over us in her power to produce sugar and molasses. If she has an advantage of one fourth in
      raising provisions, she has an advantage of one half in regard to products exclusively tropical; and it is better for
      her to employ all her labor and capital in that branch of production in which her advantage is greatest. She can thus,
      by trading with us, obtain our breadstuffs and meat at a smaller expense of labor and capital than they cost ourselves.
      If, for instance, a barrel of flour costs ten days' labor in the United States and only eight days' labor in Barbadoes,
      the people of Barbadoes can still profitably buy the flour from this \[pg 384\] country, if they can pay for it with
      sugar which cost them only six days' labor; and the people of this country can profitably sell them the flour, or buy
      from them the sugar, provided the sugar, if raised in the United States, would cost eleven days' labor.... The United
      States receive sugar, which would have cost them eleven days' labor, by paying for it with flour which costs them but
      ten days. Barbadoes receives flour, which would have cost her eight days' labor, by paying for it with sugar which costs
      her but six days. If Barbadoes produced both commodities with greater facility, but greater in precisely the same
      degree, there would be no motive for interchange.”
  - chunk_index: 17
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book III. Exchange. > Chapter XIII. Of International Trade. > § 2. Interchange of commodities between distance places determined by differences not in their absolute, but in the comparative, costs of production.
    content_token_count: 245
    text: |-
      It may be said, however, that in practice no business-man considers the question of “comparative cost” in making
      shipments of goods abroad; that all he thinks of is whether the price here, for example, is less than it is in London.
      And yet the very fact that the prices are less here implies that gold is of high value relatively to the given
      commodity; while in London, if money is to be sent back in payment, and if prices are high there, that implies that gold
      is there of less comparative value than commodities, and consequently that gold is the cheapest article to send to the
      United States. The doctrine, then, is as true of gold, or the precious metals, as it is of other commodities.[^264] It
      may be stated in the following language of Mr. Cairnes: “The proximate condition determining international exchange is
      the state of comparative prices in the exchanging countries as regards the commodities which form the subject of the
      trade. But comparative prices within the limits of each country are determined by two distinct principles—within the
      range of effective industrial competition, by cost of production; outside that range, by reciprocal demand.”[^265]
  - chunk_index: 18
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book III. Exchange. > Chapter XIII. Of International Trade. > § 3. The direct benefits of commerce consist in increased Efficiency of the productive powers of the World.
    content_token_count: 354
    text: |-
      From this exposition we perceive in what consists the benefit of international exchange, or, in other words, foreign
      commerce. Setting aside its enabling countries to obtain commodities which they could not themselves produce at all, its
      advantage consists in a more efficient employment of the productive forces of the world. If two countries which traded
      together attempted, as far as was physically possible, to produce for themselves what they now import from one another,
      the labor and capital of the two countries \[pg 385\] would not be so productive, the two together would not obtain from
      their industry so great a quantity of commodities, as when each employs itself in producing, both for itself and for the
      other, the things in which its labor is relatively most efficient. The addition thus made to the produce of the two
      combined constitutes the advantage of the trade. It is possible that one of the two countries may be altogether inferior
      to the other in productive capacities, and that its labor and capital could be employed to greatest advantage by being
      removed bodily to the other. The labor and capital which have been sunk in rendering Holland habitable would have
      produced a much greater return if transported to America or Ireland. The produce of the whole world would be greater, or
      the labor less, than it is, if everything were produced where there is the greatest absolute facility for its
      production. But nations do not, at least in modern times, emigrate en masse; and, while the labor and capital of a
      country remain in the country, they are most beneficially employed in producing, for foreign markets as well as for its
      own, the things in which it lies under the least disadvantage, if there be none in which it possesses an advantage.
  - chunk_index: 19
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book III. Exchange. > Chapter XIII. Of International Trade. > § 3. The direct benefits of commerce consist in increased Efficiency of the productive powers of the World.
    content_token_count: 90
    text: |-
      The fundamental ground on which all trade, or all exchange of commodities, rests, is division of labor, or separation of
      employments. Beyond the ordinary gain from division of labor, arising from increased dexterity, there exist gains
      arising from the development of “the special capacities or resources possessed by particular individuals or localities.”
      International exchanges call out chiefly the special advantages offered by particular _localities_ for the prosecution
      of particular industries.
  - chunk_index: 20
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book III. Exchange. > Chapter XIII. Of International Trade. > § 3. The direct benefits of commerce consist in increased Efficiency of the productive powers of the World.
    content_token_count: 238
    text: |-
      “The only case, indeed, in which _personal aptitudes_ go for much in the commerce of nations is where the nations
      concerned occupy different grades in the scale of civilization.... The most striking example which the world has ever
      seen of a foreign trade determined by the peculiar personal qualities of those engaged in ministering to it is that
      which was furnished by the Southern States of the American Union previous to the abolition of slavery. The effect of
      that institution was to give a very distinct industrial character to the laboring population of those States which
      unfitted them for all but a very limited number of occupations, but gave them a certain special fitness for these.
      Almost the entire industry of the country was consequently \[pg 386\] turned to the production of two or three crude
      commodities, in raising which the industry of slaves was found to be effective; and these were used, through an exchange
      with foreign countries, as the means of supplying the inhabitants with all other requisites.... In the main, however, it
      would seem that this cause \[personal aptitudes\] does not go for very much in international commerce.”[^266]
  - chunk_index: 21
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book III. Exchange. > Chapter XIII. Of International Trade. > § 3. The direct benefits of commerce consist in increased Efficiency of the productive powers of the World.
    content_token_count: 44
    text: |-
      In brief, then, international trade is but an extension of the principle of division of labor; and the gains to
      increased productiveness, arising from the latter, are exactly the same as those from the former.
  - chunk_index: 22
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book III. Exchange. > Chapter XIII. Of International Trade. > § 4. —Not in a Vent for exports, nor in the gains of Merchants.
    content_token_count: 311
    text: |-
      According to the doctrine now stated, the only direct advantage of foreign commerce consists in the imports. A country
      obtains things which it either could not have produced at all, or which it must have produced at a greater expense of
      capital and labor than the cost of the things which it exports to pay for them. It thus obtains a more ample supply of
      the commodities it wants, for the same labor and capital; or the same supply, for less labor and capital, leaving the
      surplus disposable to produce other things. The vulgar theory disregards this benefit and deems the advantage of
      commerce to reside in the exports: as if not what a country obtains, but what it parts with, by its foreign trade, was
      supposed to constitute the gain to it. An extended market for its produce—an abundant consumption for its goods—a vent
      for its surplus—are the phrases by which it has been customary to designate the uses and recommendations of commerce
      with foreign countries. This notion is intelligible, when we consider that the authors and leaders of opinion on
      mercantile questions have always hitherto been the selling class. It is in truth a surviving relic of the Mercantile
      Theory, according to which, money being the only wealth, selling, or, in other words, exchanging goods for money, was
      (to countries without mines of their own) the only way of growing rich—and importation of goods, that is to say, parting
      with money, was so much subtracted from the benefit.
  - chunk_index: 23
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book III. Exchange. > Chapter XIII. Of International Trade. > § 4. —Not in a Vent for exports, nor in the gains of Merchants.
