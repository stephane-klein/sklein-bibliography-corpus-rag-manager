      The effects of the financial panic of 1857, in Massachusetts, \[pg 188\] show a similar movement in the number of
      marriages. The crisis came in October, 1857. In the three months following that date there were 400 less marriages.
  - chunk_index: 29
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book II. Distribution. > Chapter II. Of Wages. > § 3. Examination of some popular Opinions respecting Wages.
    content_token_count: 108
    text: |-
      To produce permanent advantage, the temporary cause operating upon them must be sufficient to make a great change in
      their condition—a change such as will be felt for many years, notwithstanding any stimulus which it may give during one
      generation to the increase of people. When, indeed, the improvement is of this signal character, and a generation grows
      up which has always been used to an improved scale of comfort, the habits of this new generation in respect to
      population become formed upon a higher minimum, and the improvement in their condition becomes permanent.
  - chunk_index: 30
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book II. Distribution. > Chapter II. Of Wages. > § 4. Certain rare Circumstances excepted, High Wages imply Restraints on Population.
    content_token_count: 199
    text: |-
      Wages depend, then, on the proportion between the number of the laboring population and the capital or other funds
      devoted to the purchase of labor; we will say, for shortness, the capital. If wages are higher at one time or place than
      at another, if the subsistence and comfort of the class of hired laborers are more ample, it is for no other reason than
      because capital bears a greater proportion to population. It is not the absolute amount of accumulation or of production
      that is of importance to the laboring-class; it is not the amount even of the funds destined for distribution among the
      laborers; it is the proportion between those funds and the numbers among whom they are shared. The condition of the
      class can be bettered in no other way than by altering that proportion to their advantage: and every scheme for their
      benefit which does not proceed on this as its foundation is, for all permanent purposes, a delusion.
  - chunk_index: 31
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book II. Distribution. > Chapter II. Of Wages. > § 4. Certain rare Circumstances excepted, High Wages imply Restraints on Population.
    content_token_count: 329
    text: |-
      In countries like North America and the Australian colonies, where the knowledge and arts of civilized life and a high
      effective desire of accumulation coexist with a boundless extent of unoccupied land, the growth of capital easily keeps
      pace with the utmost possible increase of population, and is chiefly retarded by the impracticability of obtaining
      laborers enough. All, therefore, who can possibly be born can find employment without overstocking the market: every
      \[pg 189\] laboring family enjoys in abundance the necessaries, many of the comforts, and some of the luxuries of life;
      and, unless in case of individual misconduct, or actual inability to work, poverty does not, and dependence need not,
      exist. \[In England\] so gigantic has been the progress of the cotton manufacture since the inventions of Watt and
      Arkwright, that the capital engaged in it has probably quadrupled in the time which population requires for doubling.
      While, therefore, it has attracted from other employments nearly all the hands which geographical circumstances and the
      habits or inclinations of the people rendered available; and while the demand it created for infant labor has enlisted
      the immediate pecuniary interest of the operatives in favor of promoting, instead of restraining, the increase of
      population; nevertheless wages in the great seats of the manufacture are still so high that the collective earnings of a
      family amount, on an average of years, to a very satisfactory sum; and there is as yet no sign of decrease, while the
      effect has also been felt in raising the general standard of agricultural wages in the counties adjoining.
  - chunk_index: 32
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book II. Distribution. > Chapter II. Of Wages. > § 4. Certain rare Circumstances excepted, High Wages imply Restraints on Population.
    content_token_count: 198
    text: |-
      But those circumstances of a country, or of an occupation, in which population can with impunity increase at its utmost
      rate, are rare and transitory. Very few are the countries presenting the needful union of conditions. Either the
      industrial arts are backward and stationary, and capital therefore increases slowly, or, the effective desire of
      accumulation being low, the increase soon reaches its limit; or, even though both these elements are at their highest
      known degree, the increase of capital is checked, because there is not fresh land to be resorted to of as good quality
      as that already occupied. Though capital should for a time double itself simultaneously with population, if all this
      capital and population are to find employment on the same land, they can not, without an unexampled succession of
      agricultural inventions, continue doubling the produce; therefore, if wages do not fall, profits must; and, when profits
      fall, increase of capital is slackened.
  - chunk_index: 33
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book II. Distribution. > Chapter II. Of Wages. > § 4. Certain rare Circumstances excepted, High Wages imply Restraints on Population.
    content_token_count: 235
    text: |-
      Except, therefore, in the very peculiar cases which I have \[pg 190\] just noticed, of which the only one of any
      practical importance is that of a new colony, or a country in circumstances equivalent to it, it is impossible that
      population should increase at its utmost rate without lowering wages. In no old country does population increase at
      anything like its utmost rate; in most, at a very moderate rate: in some countries, not at all. These facts are only to
      be accounted for in two ways. Either the whole number of births which nature admits of, and which happen in some
      circumstances, do not take place; or, if they do, a large proportion of those who are born, die. The retardation of
      increase results either from mortality or prudence; from Mr. Malthus's positive, or from his preventive check: and one
      or the other of these must and does exist, and very powerfully too, in all old societies. Wherever population is not
      kept down by the prudence either of individuals or of the state, it is kept down by starvation or disease.
  - chunk_index: 34
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book II. Distribution. > Chapter II. Of Wages. > § 5. Due Restriction of Population the only Safeguard of a Laboring-Class.
    content_token_count: 102
    text: |-
      Where a laboring-class who have no property but their daily wages, and no hope of acquiring it, refrain from over-rapid
      multiplication, the cause, I believe, has always hitherto been, either actual legal restraint, or a custom of some sort
      which, without intention on their part, insensibly molds their conduct, or affords immediate inducements not to marry.
      It is not generally known in how many countries of Europe direct legal obstacles are opposed to improvident marriages.
  - chunk_index: 35
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book II. Distribution. > Chapter II. Of Wages. > § 5. Due Restriction of Population the only Safeguard of a Laboring-Class.
    content_token_count: 96
    text: |-
      Where there is no general law restrictive of marriage, there are often customs equivalent to it. When the guilds or
      trade corporations of the middle ages were in vigor, their by-laws or regulations were conceived with a very vigilant
      eye to the advantage which the trade derived from limiting competition; and they made it very effectually the interest
      of artisans not to marry until after passing through the two stages of apprentice and journeyman, and attaining the rank
      of master.
  - chunk_index: 36
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book II. Distribution. > Chapter II. Of Wages. > § 5. Due Restriction of Population the only Safeguard of a Laboring-Class.
    content_token_count: 177
    text: |-
      Unhappily, sentimentality rather than common sense usually presides over the discussions of these subjects. Discussions
      \[pg 191\] on the condition of the laborers, lamentations over its wretchedness, denunciations of all who are supposed
      to be indifferent to it, projects of one kind or another for improving it, were in no country and in no time of the
      world so rife as in the present generation; but there is a tacit agreement to ignore totally the law of wages, or to
      dismiss it in a parenthesis, with such terms as “hard-hearted Malthusianism”; as if it were not a thousand times more
      hard-hearted to tell human beings that they may, than that they may not, call into existence swarms of creatures who are
      sure to be miserable, and most likely to be depraved!
  - chunk_index: 37
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book II. Distribution. > Chapter II. Of Wages. > § 5. Due Restriction of Population the only Safeguard of a Laboring-Class.
    content_token_count: 489
    text: |-
      I ask, then, is it true or not, that if their numbers were fewer they would obtain higher wages? This is the question,
      and no other: and it is idle to divert attention from it, by attacking any incidental position of Malthus or some other
      writer, and pretending that to refute that is to disprove the principle of population. Some, for instance, have achieved
      an easy victory over a passing remark of Mr. Malthus, hazarded chiefly by way of illustration, that the increase of food
      may perhaps be assumed to take place in an arithmetical ratio, while population increases in a geometrical: when every
      candid reader knows that Mr. Malthus laid no stress on this unlucky attempt to give numerical precision to things which
      do not admit of it, and every person capable of reasoning must see that it is wholly superfluous to his argument. Others
      have attached immense importance to a correction which more recent political economists have made in the mere language
      of the earlier followers of Mr. Malthus. Several writers had said that it is the tendency of population to _increase
      faster_ than the means of subsistence. The assertion was true in the sense in which they meant it, namely, that
      population would in most circumstances increase faster than the means of subsistence, if it were not checked either by
      mortality or by prudence. But inasmuch as these checks act with unequal force at different times and places, it was
      possible to interpret the language of these writers as if they had meant that population is usually \[pg 192\] gaining
      ground upon subsistence, and the poverty of the people becoming greater. Under this interpretation of their meaning, it
      was urged that the reverse is the truth: that as civilization advances, the prudential check tends to become stronger,
      and population to slacken its rate of increase, relatively to subsistence; and that it is an error to maintain that
      population, in any improving community, tends to increase faster than, or even so fast as, subsistence.[^171] The word
      tendency[^172] is here used in a totally different sense from that of the writers who affirmed the proposition; but
      waiving the verbal question, is it not allowed, on both sides, that in old countries population presses too closely upon
      the means of subsistence?
