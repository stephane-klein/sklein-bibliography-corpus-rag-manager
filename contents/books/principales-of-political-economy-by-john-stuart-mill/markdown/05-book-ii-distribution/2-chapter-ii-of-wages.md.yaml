    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book II. Distribution. > Chapter II. Of Wages. > § 1. Of Competition and Custom.
    content_token_count: 370
    text: |-
      Political economists generally, and English political economists above others, have been accustomed to lay almost
      exclusive stress upon the first of \[two\] agencies \[competition and custom\]; to exaggerate the effect of competition,
      and to take into little account the other and conflicting principle. They are apt to express themselves as if they
      thought that competition actually does, in all cases, whatever it can be shown to be the tendency of competition to do.
      This is partly intelligible, if we consider that only through the principle of competition has political economy any
      pretension to the character of a science. So far as rents, profits, wages, prices, are determined by competition, laws
      may be assigned for them. Assume competition to be their exclusive regulator, and principles of broad generality and
      scientific precision may be laid down, according to which they will be regulated. The political economist justly deems
      this his proper business: and, as an abstract or hypothetical science, political economy can not be required to do, and
      indeed can not do, anything more. But it would be a great misconception of the actual course of human affairs to suppose
      that competition exercises in fact this unlimited sway. I am not speaking of monopolies, either natural or artificial,
      or of any interferences of authority with the liberty of production or exchange. Such disturbing causes have always been
      allowed for by political economists. I speak of cases in which there is nothing to restrain competition; no hindrance
      \[pg 176\] to it either in the nature of the case or in artificial obstacles; yet in which the result is not determined
      by competition, but by custom or usage; competition either not taking place at all, or producing its effect in quite a
      different manner from that which is ordinarily assumed to be natural to it.
  - chunk_index: 1
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book II. Distribution. > Chapter II. Of Wages. > § 1. Of Competition and Custom.
    content_token_count: 129
    text: |-
      As stated by Mr. Cairnes,[^161] political economy is a science just as is any recognized physical science—astronomy,
      chemistry, physiology. The economic “facts we find existing are the results of causes, between which and them the
      connection is constant and invariable. It is, then, the constant relations exhibited in economic phenomena that we have
      in view when we speak of the laws of the phenomena of wealth; and in the exposition of these laws consists the science
      of political economy.” It is to be remembered that economic laws are _tendencies_, not actual descriptions of any given
      conditions in this or that place.
  - chunk_index: 2
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book II. Distribution. > Chapter II. Of Wages. > § 1. Of Competition and Custom.
    content_token_count: 142
    text: |-
      Competition, in fact, has only become in any considerable degree the governing principle of contracts, at a
      comparatively modern period. The further we look back into history, the more we see all transactions and engagements
      under the influence of fixed customs. The relations, more especially between the land-owner and the cultivator, and the
      payments made by the latter to the former, are, in all states of society but the most modern, determined by the usage of
      the country. The custom of the country is the universal rule; nobody thinks of raising or lowering rents, or of letting
      land, on other than the customary conditions. Competition, as a regulator of rent, has no existence.
  - chunk_index: 3
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book II. Distribution. > Chapter II. Of Wages. > § 1. Of Competition and Custom.
    content_token_count: 138
    text: |-
      Prices, whenever there was no monopoly, came earlier under the influence of competition, and are much more universally
      subject to it, than rents. The wholesale trade, in the great articles of commerce, is really under the dominion of
      competition. But retail price, the price paid by the actual consumer, seems to feel very slowly and imperfectly the
      effect of competition; and, when competition does exist, \[pg 177\] it often, instead of lowering prices, merely divides
      the gains of the high price among a greater number of dealers. The influence of competition is making itself felt more
      and more through the principal branches of retail trade in the large towns.
  - chunk_index: 4
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book II. Distribution. > Chapter II. Of Wages. > § 1. Of Competition and Custom.
    content_token_count: 66
    text: |-
      All professional remuneration is regulated by custom. The fees of physicians, surgeons, and barristers, the charges of
      attorneys, are nearly invariable. Not certainly for want of abundant competition in those professions, but because the
      competition operates by diminishing each competitor's chance of fees, not by lowering the fees themselves.
  - chunk_index: 5
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book II. Distribution. > Chapter II. Of Wages. > § 1. Of Competition and Custom.
    content_token_count: 171
    text: |-
      These observations must be received as a general correction to be applied whenever relevant, whether expressly mentioned
      or not, to the conclusions contained in the subsequent portions of this treatise. Our reasonings must, in general,
      proceed as if the known and natural effects of competition were actually produced by it, in all cases in which it is not
      restrained by some positive obstacle. Where competition, though free to exist, does not exist, or where it exists, but
      has its natural consequences overruled by any other agency, the conclusions will fail more or less of being applicable.
      To escape error, we ought, in applying the conclusions of political economy to the actual affairs of life, to consider
      not only what will happen supposing the maximum of competition, but how far the result will be affected if competition
      falls short of the maximum.
  - chunk_index: 6
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book II. Distribution. > Chapter II. Of Wages. > § 2. The Wages-fund, and the Objections to it Considered.
    content_token_count: 98
    text: |-
      Under the head of Wages are to be considered, first, the causes which determine or influence the wages of labor
      generally, and secondly, the differences that exist between the wages of different employments. It is convenient to keep
      these two classes of considerations separate; and in discussing the law of wages, to proceed in the first instance as if
      there were no other kind of labor than common unskilled labor, of the average degree of hardness and disagreeableness.
  - chunk_index: 7
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book II. Distribution. > Chapter II. Of Wages. > § 2. The Wages-fund, and the Objections to it Considered.
    content_token_count: 49
    text: |-
      Competition, however, must be regarded, in the present state of society, as the principal regulator of wages, and custom
      \[pg 178\] or individual character only as a modifying circumstance, and that in a comparatively slight degree.
  - chunk_index: 8
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book II. Distribution. > Chapter II. Of Wages. > § 2. The Wages-fund, and the Objections to it Considered.
    content_token_count: 233
    text: |-
      Wages, then, depend mainly upon the demand and supply of labor; or, as it is often expressed, on the proportion between
      population and capital. By population is here meant the number only of the laboring-class, or rather of those who work
      for hire; and by capital, only circulating capital, and not even the whole of that, but the part which is expended in
      the direct purchase of labor. To this, however, must be added all funds which, without forming a part of capital, are
      paid in exchange for labor, such as the wages of soldiers, domestic servants, and all other unproductive laborers. There
      is unfortunately no mode of expressing, by one familiar term, the aggregate of what may be called the wages-fund of a
      country: and, as the wages of productive labor form nearly the whole of that fund, it is usual to overlook the smaller
      and less important part, and to say that wages depend on population and capital. It will be convenient to employ this
      expression, remembering, however, to consider it as elliptical, and not as a literal statement of the entire truth.
  - chunk_index: 9
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book II. Distribution. > Chapter II. Of Wages. > § 2. The Wages-fund, and the Objections to it Considered.
    content_token_count: 115
    text: |-
      With these limitations of the terms, wages not only depend upon the relative amount of capital and population, but can
      not, under the rule of competition, be affected by anything else. Wages (meaning, of course, the general rate) can not
      rise, but by an increase of the aggregate funds employed in hiring laborers, or a diminution in the number of the
      competitors for hire; nor fall, except either by a diminution of the funds devoted to paying labor, or by an increase in
      the number of laborers to be paid.
  - chunk_index: 10
