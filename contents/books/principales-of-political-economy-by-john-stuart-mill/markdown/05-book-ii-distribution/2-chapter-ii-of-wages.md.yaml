  - chunk_index: 26
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book II. Distribution. > Chapter II. Of Wages. > § 3. Examination of some popular Opinions respecting Wages.
    content_token_count: 97
    text: |-
      In Vermont, while the average number of marriages was reached in 1860 and 1861, it fell off on the breaking out of the
      war; rose in 1863, under the fair progress of the Northern arms; again fell off in 1864, during the period of
      discouragement; and since 1865 has kept a steadily higher average. In manufacturing Massachusetts the number fell
      earlier than in agricultural Vermont, at the beginning of the difficulties.
