    text: '[^92]: Carey (1793-1879) was the son of an Irish exile, and began a business career at the age of twelve. At twenty-eight he was the leading partner in the publishing firm of Carey & Lea, Philadelphia, from which he retired in 1835, to devote himself wholly to political economy. His leading works have been translated into French, Italian, Portuguese, German, Swedish, Russian, Magyar, and Japanese. He has written thirteen octavo volumes, three thousand pages in pamphlet form, and twice that amount for the newspaper press. See “Proceedings of the American Academy of Science” (1881-1882, p. 417), and W. Elder''s “Memoir of Henry C. Carey” (January 5, 1880). The latter gives a list of his books.'
  - chunk_index: 138
