    content_token_count: 62
    text: '[^76]: His most important work is “Das Armenwesen und die Armengesetzebung in Europäischen Staaten” (1870). Selected essays from this have been translated into English by E. B. Eastwick, “Poor Relief in Different Parts of Europe” (1873).'
  - chunk_index: 120
