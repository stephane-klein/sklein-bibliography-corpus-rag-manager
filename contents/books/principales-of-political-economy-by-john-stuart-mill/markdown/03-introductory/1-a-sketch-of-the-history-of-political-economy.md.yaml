    text: '[^50]: See p. [33](1129008759595750428_30107-h-2.html.xhtml#Pg033).'
  - chunk_index: 94
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > A Sketch Of The History Of Political Economy.
    content_token_count: 131
    text: '[^51]: Born 1826, died 1877. He was early made familiar with banking in connection with the Stuckey Banking Company, in Somersetshire; was educated at University College, London. In 1858 he married the daughter of James Wilson, the editor of the London “Economist,” whom he succeeded. He was a political student of a rare kind, as is shown by his “English Constitution” (second edition, 1872), “Physics and Politics” (1872), “Literary Studies” (second edition, 1879). He also wrote “Depreciation of Silver” (1877).'
  - chunk_index: 95
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > A Sketch Of The History Of Political Economy.
    content_token_count: 21
    text: '[^52]: Established in 1848, and unquestionably the most useful economic publication for English questions.'
  - chunk_index: 96
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > A Sketch Of The History Of Political Economy.
    content_token_count: 182
    text: '[^53]: Born 1833. His eye-sight was lost by an accidental shot in 1858, but he was chosen Professor of Political Economy at Cambridge in 1863. His “Manual” and the “Economic Position of the British Laborer” (1865) gave him reputation, in 1865 he entered Parliament, and since 1880 he has been Postmaster-General in Mr. Gladstone''s administration. He has published “Pauperism, its Causes and Remedies” (1871), “Speeches” (1878), “Free Trade and Protection” (1878). His wife (born 1847), Millicent Garret Fawcett, reduced his “Manual” into “Political Economy for Beginners” (1869), and also wrote “Tales in Political Economy” (1874). Died November 13, 1884.'
  - chunk_index: 97
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > A Sketch Of The History Of Political Economy.
    content_token_count: 106
    text: '[^54]: He has also published “Social Economy” (1872); a small “Manual of Political Economy” (third edition, 1878); and a very considerable work, “Six Centuries of Work and Wages: the History of English Labor,” 1250-1883 (1884). He has edited Adam Smith''s “Wealth of Nations,” and written “Cobden and Modern Political Opinion” (1873), and “The Colonial Question,” in the Cobden Club Essays (1872).'
  - chunk_index: 98
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > A Sketch Of The History Of Political Economy.
    content_token_count: 190
    text: '[^55]: Of other books, mention should be made of G. J. Goschen''s most admirable “Theory of Foreign Exchanges” (eighth edition, 1875); “Reports and Speeches on Local Taxation” (1872); T. Brassey''s “Work and Wages” (third edition, 1883); E. Seyd, “Bullion and the Foreign Exchanges” (1868); H. D. McLeod, an eccentric writer, “Dictionary of Political Economy” (only one vol., A-C, 1863, published); and “Theory and Practice of Banking” (second edition, 1875-1876); H. Sidgwick, “Principles of Political Economy” (1883); J. Caird, “Landed Interest” (fourth edition, 1880); L. Levi, “History of British Commerce” (1872).'
  - chunk_index: 99
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > A Sketch Of The History Of Political Economy.
    content_token_count: 301
    text: '[^56]: Frédéric Bastiat (1801-1850) began life in a commercial house at Bayonne, but gained notice first by an article, “De l''influence des tarifs français et anglais sur l''avenir des deux peuples,” in the “Journal des Économistes” of 1844, and consequently had a very short period of literary activity. The corn-law agitation in England and the revolutionary movement of 1848 led him to write chiefly against protection and socialism. He translated Cobden''s speeches, “Cobden et la Ligue” (1845). His arguments against protection, “Sophismes économiques” (1846-1847), have been translated and published in this country; but the more extended exposition of his doctrine of value diminishing with the growth of civilization, and the harmony of all interests is in the “Harmonies économiques” (1850). In this his position is not much different from Carey''s. His other books were “Capital et rente” (1849), directed against gratuitous loans; “Protectionisme et communisme” (1849), showing protection to be communism for the rich; “Propriété et loi” (1848), directed against socialism; and “Essais sur l''économie politique” (1853); “Le Libre-échange” (1855). “Œuvres complètes,” 7 tom. (1855-1864).'
  - chunk_index: 100
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > A Sketch Of The History Of Political Economy.
    content_token_count: 88
    text: '[^57]: Carey, however, claimed, with probable truth, that Bastiat borrowed the idea from him, and Bastiat did not appear well in the controversy. Almost no one has followed the French writer in his theory except Professor A. L. Perry, of Williams College, Massachusetts, who has shaped his general argument according to this view of value. Also see Cairnes, “Essays in Political Economy,” p. 312.'
  - chunk_index: 101
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > A Sketch Of The History Of Political Economy.
    content_token_count: 234
    text: '[^58]: Chevalier (1806-1879) first drew attention in an experiment of Saint-Simonism in 1830-1833. After traveling in the United States, and writing excellent books on the country and its railways, he became professor in the Collége de France, where his lectures were collected in a “Cours d''économie politique” (1842-1850; second edition, 1855-1866). His third volume, “La Monnaie,” is a standard treatise on money, with an extensive bibliography. His treatise “Examen du système commerciale connu sous le nom de système protecteur” (1851) is now somewhat out of date. In his book “De la Baisse, probable de l''or” (1859), translated by Richard Cobden, he held that, unless prevented, gold would drive out the French currency, as against Faucher, who thought the fall temporary, and would progressively diminish. Other books are, “De l''industrie manufacturière en France,” and “La liberté du travail” (1848).'
  - chunk_index: 102
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > A Sketch Of The History Of Political Economy.
    content_token_count: 176
    text: '[^59]: Émile Levasseur (born 1828) was professor at Alençon, 1852-1854, and elected a member of the Academy of Sciences in 1868. He has published “Récherches historiques sur le système de Law” (1854); “La question de l''or” (1858); “Histoire des classes ouvrières en France depuis la conquête de Jules César jusqu''à la révolution” (1859); the same history continued, “Depuis 1789 jusqu''à nos jours” (1867); “La France industriale” (1865); “Cours d''économie rurale, la France et ses colonies” (1868); “Précis d''économie politique” (fourth edition, 1883).'
  - chunk_index: 103
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > A Sketch Of The History Of Political Economy.
    content_token_count: 214
    text: '[^60]: Born in Berlin in 1816, but since 1821 living in France. He was long connected with the Bureau de Statistique Générale, and the Ministry of Agriculture and Commerce, but in 1861 he left office and gave himself wholly to private work. In this year he received the Montyon prize for statistics, not given since 1857. His chief books are: “Des charges de l''agriculture dans les divers pays de l''Europe” (1850), a work crowned by the Institute; “Statistique de la France, comparée avec les divers états de l''Europe” (1860); “Le dictionnaire de l''administration française” (second edition, 1878); “Les finances de la France depuis 1815” (1863); “Les théoriciens du socialisme en Allemagne” (1872); and in connection with M. Guillaumin, “L''annuaire de l''économie politique,” since 1856.'
  - chunk_index: 104
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > A Sketch Of The History Of Political Economy.
    content_token_count: 188
    text: '[^61]: Jérôme-Adolphe Blanqui ainé (1798-1854) in 1833 succeeded to the chair of J. B. Say in the Conservatoire des Arts et Métiers, and was one of the founders of the “Journal des économistes.” Besides his “Histoire de l''économie politique en l''Europe” (1837-1852), he published a “Résumé de l''histoire du commerce et de l''industrie” (1826); “Précis élémentaire d''économie politique” (1826); “Rapports, histoire de l''exposition des produits de l''industrie française en 1827” (1827); “Cours d''economie politique” (2 vols., 1837-1838), and notices of Huskisson and J. B. Say.'
  - chunk_index: 105
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > A Sketch Of The History Of Political Economy.
    content_token_count: 305
    text: '[^62]: Louis Wolowski (1810-1876), of Polish origin, was Chevalier''s chief antagonist, and Professor of Legislation at the Conservatoire des Arts et Métiers (1839); founded the first Crédit Foncier of Paris, and was elected to the Institute in the place of Blanqui. In 1875 he was chosen senator. He was a fertile writer: “Mobilisation du Crédit Foncier” (1839); “De l''organisation du travail” (1846); “Études de l''économie politique et de statistique” (1848); “Henri IV, économiste, introduction de l''industrie de la soie en France” (1855); “Introduction de l''économie politique en Italie” (1859); “Les finances de la Russie” (1864); “La question des banques” (1864); his testimony in the “Enquête sur les principes et les faits généraux qui régissent la circulation monétaire et fiduciaire” (1866); “La banque d''Angleterre et les banques d''Écosse” (1867); “La liberté commerciale et les résultats du traité de commerce de 1860” (1868); “L''or et l''argent” (1870); “La change et la circulation”; and a translation of Roscher.'
  - chunk_index: 106
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > A Sketch Of The History Of Political Economy.
    content_token_count: 108
    text: '[^63]: Hippolyte-Philibert Passy (1793-1880) was educated for the army, and served at Waterloo. He was more prominent as a statesman than as an economist. In 1838 he entered the Academy in the place of Talleyrand, but politics left him unoccupied, and he wrote “Des systèmes de culture et de leur influence sur l''économie sociale” (1846), and “Des causes de l''inégalité des richesses” (1849).'
  - chunk_index: 107
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > A Sketch Of The History Of Political Economy.
    content_token_count: 197
    text: '[^64]: M. Léonce de Lavergne (1809-1880) came from Toulouse to Paris in 1840, elected deputy in 1846, a member of the Institute in 1855, and became professor in the Institut agronomique of Versailles. He was also the author of “L''économie rurale de l''Angleterre, de l''Écosse, et de l''Irlande” (1854), translated into English (1855); “L''agriculture et la population” (1857), a striking confirmation of Malthusianism; “Les économistes françaises du dixhuitième siècle” (1870). He also has contributed largely to the “Revue des Deux Mondes” and the “Journal des Économistes.” For a personal sketch by Cliffe Leslie, see “Fortnightly Review,” February, 1881.'
  - chunk_index: 108
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > A Sketch Of The History Of Political Economy.
    content_token_count: 138
    text: '[^65]: Born at Geneva, 1797, and died at Zurich, 1869. After studying law, he became an advocate, and in 1833 Professor of Law in the place of Rossi. In 1837 he was made Professor of Political Economy and Public Law at Geneva. He was also a member of the Swiss Grand Council. Besides his treatise, he wrote: “Richesse ou pauvreté” (1840); “Le socialisme, c''est la barbarie” (1848); “Études sur les causes de la misère” (1853); and aided in the “Dictionnaire de l''économie politique.”'
  - chunk_index: 109
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > A Sketch Of The History Of Political Economy.
    content_token_count: 241
    text: '[^66]: J. G. Courcelle-Seneuil (born 1813) left a commercial career to become a writer, first for the journals, and later for the “Dictionnaire politique” (edited by Pagnerre). In 1848 he was connected with the Ministry of Finance, and called to a professorship of Political Economy in Santiago, Chili, 1853-1863. His chief work is a “Traité théorique et pratique d''économie politique” (1858), but he has also published “La crédit de banque” (1840), reforms for the bank of France; “Traité des opérations de banque” (1852; sixth edition, 1876); “Traité des entreprises industrielles, commerciales, et agricoles” (1854); “Études sur la science sociale” (1862); “Leçons élémentaires d''économie politique” (1864); “La banque libre” (1867); “Liberté et socialisme” (1868); and articles in the “Dictionnaire de l''économie politique.”'
  - chunk_index: 110
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > A Sketch Of The History Of Political Economy.
    content_token_count: 22
    text: '[^67]: Died 1862; author of “De la liberté du travail” (1845).'
  - chunk_index: 111
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > A Sketch Of The History Of Political Economy.
    content_token_count: 188
    text: '[^68]: Professor of Political Economy at the Collége de France, author of an extended and able “Traité de la science des finances” (third edition, 1883). He has also published “De l''état moral et intellectual des populations ouvrières et de son influence sur le taux des salaires” (1868); “Récherches economiques, historiques, et statistiques sur les guerres contemporaines” (1869); “La question ouvrière au XIX siècle” (second edition, 1882); “L''administration locale en France et en Angleterre” (1872); “Le travail des femmes au XIX siècle” (1873); “Essai sur la répartition des richesses” (1880; second edition, 1883); and “De la colonisation chez les peuples modernes” (1882).'
  - chunk_index: 112
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > A Sketch Of The History Of Political Economy.
    content_token_count: 68
    text: '[^69]: He published two volumes on Socialism (see list of books p. [44](1129008759595750428_30107-h-2.html.xhtml#Pg044)). In several volumes on the “Régime des manufactures” he described the condition of the silk, woolen, cotton, and iron industries.'
  - chunk_index: 113
