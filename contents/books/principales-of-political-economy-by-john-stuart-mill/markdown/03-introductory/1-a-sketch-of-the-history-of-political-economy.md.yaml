    text: '[^8]: For information on this as well as a later period, consult Jacob “On the Precious Metals” (1832), a history of the production and influences of gold and silver from the earliest times. He is considered a very high authority. Humboldt''s “Essay on New Spain” gives estimates and facts on the production of the precious metals in America. A very excellent study has been made by Levasseur in his “Histoire des classes ouvrières en France jusqu''à la Révolution.” For pauperism and its history, Nicholl''s “History of the Poor Laws” is, of course, to be consulted.'
