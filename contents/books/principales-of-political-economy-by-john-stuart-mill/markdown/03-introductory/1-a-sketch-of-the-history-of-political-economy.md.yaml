    content_token_count: 87
    text: '[^95]: His system appears also in the books of disciples: E. Peshine Smith, “A Manual of Political Economy” (1853), William Elder''s “Questions of the Day” (1871), and of Robert E. Thompson''s “Social Science and National Economy” (1875). A condensation of Carey''s “Social Science” has been made by Kate McKean, in one volume, octavo.'
  - chunk_index: 141
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > A Sketch Of The History Of Political Economy.
    content_token_count: 160
    text: '[^96]: The son of Amasa Walker, and formerly Professor of Political Economy and History in the Sheffield Scientific School of Yale College, he has become well known for his statistical work in connection with the United States census. His “Statistical Atlas of the United States” (1874) is unequaled. He has also published “Money” (1878); “Money, Trade, and Industry” (1879); “Political Economy” (1883); and “Land and Rent” (1884). The last book replies to various attacks on Ricardo''s doctrine of rent, and particularly to Henry George''s “Progress and Poverty.” General Walker in 1883 became President of the Massachusetts Institute of Technology in Boston. He is also well known as an advocate of bimetallism.'
  - chunk_index: 142
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > A Sketch Of The History Of Political Economy.
    content_token_count: 92
    text: '[^97]: Professor of Political and Social Science in Yale College, and author of a “History of American Currency” (1874); “Lectures on the History of Protection in the United States” (1877); “What Social Classes owe to Each Other” (1883). He is a monometallist, and has devoted himself vigorously to the advocacy of free trade. His last book is a study in sociology, not in political economy.'
  - chunk_index: 143
