    text: '[^77]: Max Wirth is at Vienna, and has devoted himself to a “Geschichte der Handelskrisen” (1874), including the crisis of 1873. Baron von Hock has written a history of the finances of France, and of the United States—“Die Finanzen und die Finanzgeschichte der vereinigten Staaten von Amerika” (1867).'
