    text: '[^89]: Daniel Raymond, “The Elements of Political Economy” (1820). Thomas Cooper, “Lectures on the Elements of Political Economy” (1826); “A Manual of Political Economy” (1834). Willard Phillips, “A Manual of Political Economy” (1828); “Propositions concerning Protection and Free Trade” (1860). President Francis Wayland (1796-1865), “The Elements of Political Economy” (1837). Henry Vethake, “Principles of Political Economy” (1838). From 1840 to the civil war there appeared F. Bowen''s “Principles of Political Economy” (1856), since changed to “American Political Economy” (1873), which opposed the Malthusian doctrine and defended protection; John Bascom''s “Political Economy” (1859); and Stephen Colwell''s “Ways and Means of Payment” (1859). After the war, “Science of Wealth” (1866), by Amasa Walker, a lecturer in Amherst College, and father of F. A. Walker.'
