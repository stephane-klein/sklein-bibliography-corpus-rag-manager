    text: “Grundriss zu Vorlesungen über die Staatswirthschaft nach geschichtlicher Methode” (1843); “Kornhandel und Theuerungspolitik” (third edition, 1852); “Untersuchungen über das Colonialwesen”; “Verhältniss der Nationalökonomie zum klassischen Alterthume” (1849); “Geschichte der englischen Volkswirthschaftslehre im 16. und 17. Jahrhunderts”; “Ein nationalökonom. Princep der Forstwirthschaft”; “Ansichten der Volkswirthschaft aus dem geschichtlichen Standpunkte” (second edition, 1861); “Die deutsche Nationalökonomie an der Grenzscheide des 16. und 17. Jahrhunderts” (1862); “Gründungsgeschichte des Zollvereins” (1870); “Betrachtungen über die Währungsfrage der deutschen Müntzreform” (1872); “Geschichte der Nationalökonomie in Deutschland” (1874); “Nationalökonomie des Ackerbaues” (eighth edition, 1875). His histories of political economy in England and Germany are particularly valuable (see review by Cliffe Leslie, “Fortnightly Review,” July, 1875). But he does not rightly estimate the English writers when he takes McLeod as a type; and Carey is the only American to whom he refers.
