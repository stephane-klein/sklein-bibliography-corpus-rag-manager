  - chunk_index: 130
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > A Sketch Of The History Of Political Economy.
    content_token_count: 117
    text: '[^86]: By far the ablest is Adolph Wagner, of Berlin, editor of Rau''s “Lehrbuch der politischen Oekonomie” (1872). He also published “Die russische Papierwährung” (1868); “Staatspapiergeld, Reichs-Kassen Scheine, und Banknoten” (1874); “Unsere Müntzreform” (1877); “Finanzwissenschaft” (1877); and “Die Communalsteuerfrage” (1878).'
  - chunk_index: 131
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > A Sketch Of The History Of Political Economy.
    content_token_count: 232
    text: Dr. Eduard Engel was formerly the head of the Prussian Bureau of Statistics. Professor Gustav Schönberg, of Tübingen, with the assistance of twenty-one other economists, produced a large “Handbuch der politischen Oekonomie” (1882). The school have expressed their peculiar doctrines in the “Zeitschrift für die gesammte Staatswissenschaft” (quarterly, founded 1844, Tübingen), and the “Jahrbücher für Nationalökonomie” (established at Jena, 1863). Also, see A. Wagner's “Rede über die sociale Frage” (1872), H. v. Scheel's “Die Theorie der socialen Frage” (1871), and G. Schmoller's “Ueber einige Grundfrage des Rects und der Volkswirthschaft” (1875). A. E. F. Schäffle, once Minister of Commerce at Vienna, gained considerable reputation by “Das gesellschaftliche System der menschlichen Wirthschaft” (third edition, 1873).
  - chunk_index: 132
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > A Sketch Of The History Of Political Economy.
    content_token_count: 275
    text: '[^87]: Émile de Laveleye (born 1822) studied law at Ghent, but since 1848 has given himself up to political economy and public questions. Through the pages of the “Revue des Deux Mondes” he gained attention in 1863, and the next year was made Professor of Political Economy at the University of Liége. In 1869 he received an election as corresponding member of the Academy of Sciences. While a fertile writer on political subjects, he has produced “La question d''or” (1860); “Essai sur l''économie rurale de la Belgique” (1863); a study on “Suisse,” see “Revue des Deux Mondes,” April 15, 1863; “Études d''économie rurale, la Neerlande” (1864); “La marché monetaire depuis cinquante ans” (1865); “Land Systems of Belgium and Holland,” in the Cobden Club volume on “Land Tenures” (1870); “Bi-metallic Money,” translated by G. Walker (1877); “La socialisme contemporaine” (1881); “Éléments d''économie politique” (1882), which satisfies a certain modern demand for “ethical political economy.”'
  - chunk_index: 133
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > A Sketch Of The History Of Political Economy.
    content_token_count: 751
    text: '[^88]: Leslie found support in a well-known paper read before the Association for the Advancement of Science (see “London Statistical Journal,” December, 1878; also see “Penn Monthly,” 1879), by J. K. Ingram, who claimed that the old school isolated the study of economic from other social phenomena, and that Ricardo''s system was not only too abstract, but that its conclusions were of so absolute a character that they were little adapted for real use. Robert Lowe (Lord Sherbrooke) replied to Leslie and Ingram (“Nineteenth Century,” November, 1878). For most of this literature it will be necessary to consult the magazines. Cliffe Leslie, “Fortnightly Review” (November, 1870), placed Adam Smith among the inductive economists; D. Syme attacked the old methods, “Westminster Review,” vol. xcvi (1871); Cairnes represented the old school, and discussed the new theories, “Political Economy and Comte,” in the “Fortnightly Review,” vol. xiii, p. 579 (1870), “Political Economy and Laissez Faire,” vol. xvi, p. 80 (1871), and in 1872; see also his admirable “Logical Method”; F. Harrison discussed the limits of political economy, ibid. (1865), and answered Cairnes in an article on “Cairnes on Political Economy and M. Comte,” “Fortnightly Review,” vol. xiv, p. 39 (1870). W. Newmarch gave attention to Ingram''s paper, “Statistical Journal” (1871). Leslie, “Fortnightly Review” (1875), and G. Cohn, ibid. (1873), wrote on political economy in Germany. Leslie also contributed an article on “Political Economy and Sociology,” “Fortnightly Review,” vol. xxxi, p. 25 (1879), and the “Bicentenary of Political Economy,” in the “Bankers'' Magazine,” vol. xxxii, p. 29. Leslie examined the philosophical method, “Penn Monthly” (1877); Jevons saw the only hope for the future in the mathematical method, “Fortnightly Review” (1876); McLeod asks, “What is political economy?” in the “Contemporary Review” (1875); Maurice Block entered the discussion, “Penn Monthly” (1877), and “Bankers'' Magazine,” March and November, 1878. Henry Sidgwick answers Leslie in a paper on “Economic Method,” in the “Fortnightly Review,” vol. xxxi (1879), p. 301. See also essay by Wolowski prefixed to Roscher''s “Political Economy” (English translation); Roscher''s own statement in Chapters II and III of the Introduction to his “Political Economy,” and Laveleye''s “New Tendencies of Political Economy” (1879). See also “Penn Monthly,” vol. vii, p. 190, and “Bankers'' Magazine,” vol. xxxiii, pp. 601, 698, 761; vol. xxxvi, pp. 349, 422; S. Newcomb for an admirable essay “On the Method and Province of Political Economy,” “North American Review” (1875), vol. cxxi, p. 241, in which the “Orthodox” method is strongly supported; and an extreme position in favor of the historical method in a pamphlet, “The Past and Present of Political Economy,” by R. T. Ely (1884).'
  - chunk_index: 134
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > A Sketch Of The History Of Political Economy.
