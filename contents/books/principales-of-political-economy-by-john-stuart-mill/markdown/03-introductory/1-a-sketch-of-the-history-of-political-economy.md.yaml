    content_token_count: 38
    text: '[^98]: He has written “Political Economy” (eighteenth edition, 1883), and also “Introduction to Political Economy,” an elementary work on the same basis as the former.'
  - chunk_index: 144
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > A Sketch Of The History Of Political Economy.
    content_token_count: 208
    text: '[^99]: Henry George was born in Philadelphia, 1839, ran away to sea, and in 1857 entered a printing-office in San Francisco. In 1871 he was one of the founders of the “San Francisco Post,” which he gave up in 1875, and received a public office. He first began to agitate his views in a pamphlet entitled “Our Land and Land Policy” (1871), but not until the comparative leisure of his occupation (1875) gave him opportunity did he seriously begin the study which resulted in his “Progress and Poverty.” This volume was begun in the summer of 1877, and finished in the spring of 1879. The sale of the book, it is needless to say, has been phenomenal. He has also applied his doctrine of land to Ireland, in a pamphlet entitled “The Irish Land Question” (1882). His last book is a collection of essays entitled “Social Problems” (1884). His home is now in New York.'
