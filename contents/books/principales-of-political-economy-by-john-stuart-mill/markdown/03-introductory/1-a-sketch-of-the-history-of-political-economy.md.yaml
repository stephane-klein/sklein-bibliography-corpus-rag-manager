    content_token_count: 50
    text: '[^81]: In Ely''s “The Past and Present of Political Economy” (p. 9) it is clear the new school do not differ so much in reality as in seeming from the methods of the English writers, like Cairnes.'
  - chunk_index: 125
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > A Sketch Of The History Of Political Economy.
    content_token_count: 139
    text: '[^82]: The first division of Roscher''s (born 1817) treatise, also known under the title of “Grundlagen der Nationalökonomie,” has been translated here by J. J. Lalor, in two volumes, “Principles of Political Economy” (1878), with an essay by Wolowski on the historical method inserted. In 1840 he was made Privat-Docent at Göttingen, and professor extraordinary in 1843. In 1844 he was called to a chair at Erlangen, but since 1848 he has remained at Leipsic. A list of Roscher''s works is as follows:'
  - chunk_index: 126
