    content_token_count: 94
    text: '[^75]: Professor of Political Economy at Zürich in 1866, since 1875 director of statistics at Dresden, and editor of “Der Arbeiterfreund.” He made a valuable study of industrial partnerships, “Die Gewinnbetheiligung” (second edition 1878). He also wrote “Freiheit der Arbeit” (1858), and “Beiträge zur geschichte des Zunftwesens” (1861).'
  - chunk_index: 119
