  - chunk_index: 58
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > A Sketch Of The History Of Political Economy.
    content_token_count: 214
    text: '[^17]: When Quesnay was sixty-one years old he wrote the article, “Fermiers,” in the “Encyclopædia” (of Diderot and D''Alembert) in 1756; article “Grains,” in the same, 1757; “Tableau économique,” 1758; “Maximes générales du gouvernement économique d''un royaume”; “Problème économique”; “Dialogues sur le commerce et sur les travaux des artisans”; “Droit natural” (1768). “Collection des principaux économistes,” edited by E. Daire (1846), is a collection containing the works of Quesnay, Turgot, and Dupont de Nemours. See also Lavergne, “Les économistes françaises du 18e siècle” (1870); and H. Martin, “Histoire de France.” Quesnay''s “Tableau économique” was the Koran of the school.'
  - chunk_index: 59
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > A Sketch Of The History Of Political Economy.
