  - chunk_index: 52
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > A Sketch Of The History Of Political Economy.
    content_token_count: 221
    text: '[^11]: Thomas Mun, “England''s Treasure by Foreign Trade” (published in 1640 and 1664); “Advice of the Council of Trade” (1660), in Lord Overstone''s “Select Tracts on Money”; Sir William Petty, “Political Arithmetic,” etc. (about 1680); Sir Josiah Child, “New Discourse of Trade” (1690); Sir Dudley North, “Discourse on Trade” (1691); Davenant''s Works (1690-1711); Joshua Gee, “Trade and Navigation of Great Britain” (1730); Sir Matthew Decker (according to McCulloch, William Richardson), “Essay on the Causes of the Decline of Foreign Trade” (1744); Sir James Steuart, “An Inquiry into the Principles of Political Economy” (1767). For this period also consult Anderson''s “History of Commerce” (1764), Macpherson''s “Annals of Commerce” (1803), and Lord Sheffield''s “Observations on the Commerce of the American States” (1783).'
  - chunk_index: 53
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > A Sketch Of The History Of Political Economy.
    content_token_count: 174
    text: '[^12]: The English Navigation Act of 1651 is usually described as the cause of the decline of Dutch shipping. The taxation necessitated by her wars is rather the cause, as history shows it to us. Sir Josiah Child (1668 and 1690) speaks of a serious depression in English commerce, and says the low rate of interest among the Dutch hurts the English trade. This does not show that the acts greatly aided English shipping. Moreover, Gee, a determined partisan of the mercantile theory, says, in 1730, that the ship-trade was languishing. Sir Matthew Decker (1744) confirms Gee''s impressions. It looks very much as if the commercial supremacy of England was acquired by internal causes, and in spite of her navigation acts. The anonymous author of “Britannia Languens” confirms this view.'
  - chunk_index: 54
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > A Sketch Of The History Of Political Economy.
    content_token_count: 71
    text: '[^13]: This was, in substance, the whole teaching of one of the leading and most intelligent writers, Sir James Steuart (1767), “Principles of Political Economy.” See also Held''s “Carey''s Socialwissenschaft und das Merkantilsystem” (1866), which places Carey among the mercantilists.'
