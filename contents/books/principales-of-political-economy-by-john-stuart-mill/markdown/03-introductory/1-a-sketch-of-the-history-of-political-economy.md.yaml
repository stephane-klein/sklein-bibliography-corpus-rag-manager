    content_token_count: 56
    text: '[^93]: Bastiat''s “Harmonies économiques” appeared in 1850, and the question of his indebtedness to Carey was discussed, rather unfavorably to Bastiat, in a series of letters in the “Journal des économistes” for 1851.'
