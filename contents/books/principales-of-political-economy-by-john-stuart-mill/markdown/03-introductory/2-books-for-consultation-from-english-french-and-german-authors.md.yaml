    content_token_count: 53
    text: |-
      Professor Fawcett's “Manual of Political Economy” (London, sixth edition, 1883) is a brief statement of Mill's book,
      with additional matter on the precious metals, slavery, trades-unions, co-operation, local taxation, etc.
  - chunk_index: 2
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > Books For Consultation (From English, French, And German Authors).
    content_token_count: 74
    text: |-
      Antoine-Élise Cherbuliez's “Précis de la science économique” (Paris, 1862, 2 vols.) follows the same arrangement as
      Mill, and is considered the best treatise on economic science in the French language. He is methodical, profound, and
      clear, and separates pure from applied political economy.
  - chunk_index: 3
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > Books For Consultation (From English, French, And German Authors).
    content_token_count: 78
    text: |-
      Other excellent books in French are: Courcelle-Seneuil's “Traité théorique et pratique d'économie politique” (1858),
      (Paris, second edition, 1867, 2 vols.), and a compendium by Henri Baudrillart, “Manuel d'économie politique” (third
      edition, 1872).
  - chunk_index: 4
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > Books For Consultation (From English, French, And German Authors).
    content_token_count: 59
    text: |-
      Roscher's “Principles of Political Economy” is a good example of the German historical method; its notes are crowded
      with facts; but the English translation (New York, 1878) is badly done. There is an excellent translation of it into
      French by Wolowski.
  - chunk_index: 5
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Introductory. > Books For Consultation (From English, French, And German Authors).
    content_token_count: 28
    text: A desirable elementary work, “The Economics of Industry” (London, 1879), was prepared by Mr. and Mrs. Marshall.
