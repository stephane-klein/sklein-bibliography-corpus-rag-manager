    content_token_count: 236
    text: 'Charles Babbage, “Economy of Manufactures,” chap. xxvi; H. C. Briggs, “Social Science Association,” 1869; H. C. and A. Briggs, “Evidence before the Trades-Union Commission,” March 4, 1868, Questions 12,485 to 12,753 \[Parliamentary Documents\]; “The Industrial Partnerships Record”; Pare, “Co-operative Agriculture” (Longmans) 1870; Jean Billon, “Participation des Ouvriers aux Bénéfices des Patrons,” Genève, 1877; Fougerousse, “Patrons et Ouvriers de Paris” (Chaix), 1880; Sedley Taylor, “Society of Arts Journal,” February 18, 1881, vol. xxix, pp. 260-270; also in “Nineteenth Century,” May, 1881, pp. 802-811, “On Profit-Sharing”; J. C. Van Marken, “La Question Ouvrière: Essai de Solution Pratique” (Chaix) 1881.'
  - chunk_index: 65
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book IV. Influence Of The Progress Of Society On Production And Distribution. > Chapter V. On The Possible Futurity Of The Laboring-Classes. > § 7. People's Banks.
    content_token_count: 611
    text: '[^333]: In his last edition of his “Manual,” Professor Fawcett thus describes a co-operative experiment in agriculture: “The one that has attracted the most attention was made nearly forty years since by Mr. Gurdon, on his estate at Assington, near Sudbury, in Suffolk. Mr. Gurdon was so much impressed with the miserable condition of the agricultural laborers who were employed on his estate, that he was prompted to do something on their behalf. When, therefore, one of his farms became vacant, he offered to let it at the ordinary rent, £150 a year, to the laborers who worked upon it. As they, of course, had not sufficient capital to cultivate it, he in the first instance loaned them the requisite stock and implements. The laborers were, in fact, formed into a company in which there were eleven shares, and no laborer was permitted to hold more than one share. The plan was so eminently successful that in a few years sufficient had been saved out of the profits to repay all that had been advanced, and the stock and implements became the property of the laborers. Each share greatly increased in value. Mr. Gurdon was so much encouraged, not only by the pecuniary advantages secured to the laborers, but also by the general improvement effected in their condition, that some years afterward he let another and a larger farm on similar terms. Although no statement of accounts has ever been published, the remarkable pecuniary advantages secured to the laborers is proved by the fact that, after enjoying at least as high wages as were paid in the district, they were able in a few years to become the owners of a valuable property, consisting of the stock and implements on the farms. One of the most significant and hopeful circumstances connected with the experiment is, that it was not carried out by a picked body of men; and if so much could be done by laborers who were probably among the worst educated in the country, it maybe fairly concluded, that when the intelligence of our rural population has been better developed, co-operation may be applied in a more complete form to agriculture, and with even more striking results than were obtained at Assington.... In the description which has been frequently given of the system of peasant proprietorship, it is shown how powerfully the industry of the laborer is stimulated by the feeling of property. When he cultivates his own plot of ground, he exerts himself to the utmost, because he knows that he will enjoy all that is yielded by his labor. Each year, with the extended use of machinery in agriculture, it is becoming more advantageous to carry on farming on a large scale. When, therefore, co-operative agriculture becomes practicable, land may be cultivated by associations of laborers, and thus many of the advantages associated with the system of peasant proprietorship may be secured, while at the same time the disadvantages of small farming may be avoided. The progress toward co-operative agriculture will no doubt be slow and gradual.”'
