  - chunk_index: 13
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book IV. Influence Of The Progress Of Society On Production And Distribution. > Chapter II. Influence Of The Progress Of Industry And Population On Rents, Profits, And Wages. > § 3. The arts of production advancing, capital and population stationary.
    content_token_count: 294
    text: |-
      Now, let us go back to our first general group of causes, B—an advance in the arts of production (while capital and
      population remain stationary). We can now study by themselves the effect of improvements on wages, profits, and rent.
      The general effects arising from the extended introduction of machinery into agriculture and manufactures, the lowered
      cost of transportation by steam, have been to lessen the value of articles consumed chiefly by the laboring-classes. For
      the sake of clearness, imagine that the improvement comes suddenly. The first effect will be to lower the value and
      price of articles entering into the real wages of the laborers; and, if those consist mostly of food, there will be a
      rise in the margin of cultivation and a fall in rents (3). It has been previously shown[^299] that improvements retard,
      or put back, the law of diminishing returns from land (or in manufactures compensate for it), and so lower rents. The
      poorest soil cultivated is now of a better grade than before, and the produce is yielded at a less cost and value; so
      that the land with which the best grades are compared, to determine the rent, is not separated from the best grades by
      so wide a gap. It would at first blush seem, then, that the interests of the landlord were antagonistic to improvements,
      since they lower rents; but, in practice, it is not so, as we shall soon see.
  - chunk_index: 14
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book IV. Influence Of The Progress Of Society On Production And Distribution. > Chapter II. Influence Of The Progress Of Industry And Population On Rents, Profits, And Wages. > § 3. The arts of production advancing, capital and population stationary.
    content_token_count: 287
    text: |-
      We have seen that improvements cheapen the price of articles \[pg 492\] entering into the real wages of the laborer.
      Having had a given sum as money wages before the change, then, when the sudden change of improvements came, it lowered
      prices to the laborer, and the same money wages bought more (1) real wages. If nothing more happened, we could see that
      improvements raised real wages—without lowering (2) profits (because cost of labor remains the same, since the lowered
      cost of the articles consumed was exactly in proportion to the increase of real wages). And, if the laborers chose to
      retain this higher standard, this would be the situation. Sadly enough, however, in practice they are apt to be
      satisfied with the old standard; and the amount of real wages to give the old standard of living can be had now for less
      money wages. While only the same number, without any increase, can live at the new (higher) standard, a larger number
      can live at the old (lower) standard. In short, the obstacles to an increase of population will be removed by the
      possession of higher money wages. After a generation, it is very probable that a larger number of laborers will be in
      existence living at the same (or possibly a slightly higher) standard of real wages, and money wages will have fallen.
