    text: |-
      II. We will now take up the second supposition under A, that while Capital is advancing Population remains stationary.
      Then, of course (1), wages will rise; and, as there is no improvement to cheapen the cost of their real wages, there
      will be an increase in cost of labor to the capitalist, and (2) profits will fall. If, now, the laborers, being better
      off, demand more food, the new food would cost more, as the margin of cultivation was pushed down, and (3) rents would
      inevitably rise. But not only have the laborers received more real wages, but since that change the cost, as just
      described, of these real wages has increased. Therefore (2), profits would fall still more than by the rise of real
      wages. In this supposition, consequently, while the laborer gains, so does the landlord:
