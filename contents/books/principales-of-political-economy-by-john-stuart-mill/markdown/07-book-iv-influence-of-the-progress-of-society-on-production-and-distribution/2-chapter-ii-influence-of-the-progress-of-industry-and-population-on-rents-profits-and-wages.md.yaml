  - chunk_index: 19
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book IV. Influence Of The Progress Of Society On Production And Distribution. > Chapter II. Influence Of The Progress Of Industry And Population On Rents, Profits, And Wages. > § 4. Theoretical results, if all three Elements progressive.
    content_token_count: 183
    text: |-
      The effects are clearly contrasted. Under A, we see a tendency to a rise of rents (3), an increased cost of labor, and a
      fall of profits (2); under B, a fall of rents (3), a diminished cost of labor, and a rise of profits (2). We have,
      therefore, analyzed \[pg 493\] the forces belonging to the progress of industry, and found two distinct and antagonistic
      forces, working against each other. If, at any period, improvements (B) advance faster than population and capital (A),
      rent and money wages will tend downward and profits upward. If, on the other hand, population advances faster than
      improvements (B) either the laborers will submit to a reduction in the quantity or quality of their food, or, if not,
      rent and money wages will progressively rise, and profits will fall.
  - chunk_index: 20
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book IV. Influence Of The Progress Of Society On Production And Distribution. > Chapter II. Influence Of The Progress Of Industry And Population On Rents, Profits, And Wages. > § 5. Practical Results.
    content_token_count: 127
    text: |-
      This, however, is not the final and practical result. We have hitherto supposed that improvements, B, come suddenly. In
      point of fact, agricultural skill is slowly diffused, and inventions and discoveries are, in general, only occasional,
      not continuous in their action, as is the increase of capital and population. Inasmuch as it seldom happens that
      improvement has so much the start of population and capital as actually to lower rent, or raise the rate of profits,
      population almost everywhere “treads close on the heels of agricultural improvement,” and effaces its effects as fast as
      they are produced.
  - chunk_index: 21
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book IV. Influence Of The Progress Of Society On Production And Distribution. > Chapter II. Influence Of The Progress Of Industry And Population On Rents, Profits, And Wages. > § 5. Practical Results.
    content_token_count: 447
    text: |-
      The reason why agricultural improvement seldom lowers rent is, that it seldom cheapens food, but only prevents it from
      growing dearer; and seldom, if ever, throws land out of cultivation, but only enables worse and worse land to be taken
      in for the supply of an increasing demand. What is sometimes called the natural state of a country which is but half
      cultivated, namely, that the land is highly productive, and food obtained in great abundance by little labor, is only
      true of unoccupied countries colonized by a civilized people. In the United States the worst land in cultivation is of a
      high quality (except sometimes in the immediate vicinity of markets or means of conveyance, where a bad quality is
      compensated by a good situation); and even if no further improvements were made in agriculture or locomotion,
      cultivation would have many steps yet to descend, before the increase of population and capital would be brought to a
      stand; but in Europe five hundred years ago, though so thinly peopled in comparison to the present population, it is
      probable that the worst land under the plow was, from the rude state of agriculture, quite as unproductive as the worst
      land now cultivated, and that cultivation had approached as near to the ultimate limit of profitable tillage in those
      times as in the \[pg 494\] present. What the agricultural improvements since made have really done is, by increasing the
      capacity of production of land in general, to enable tillage to extend downward to a much worse natural quality of land
      than the worst which at that time would have admitted of cultivation by a capitalist for profit; thus rendering a much
      greater increase of capital and population possible, and removing always a little and a little further off the barrier
      which restrains them; population meanwhile always pressing so hard against the barrier that there is never any visible
      margin left for it to seize, every inch of ground made vacant for it by improvement being at once filled up by its
      advancing columns. Agricultural improvement may thus be considered to be not so much a counter-force conflicting with
      increase of population as a partial relaxation of the bonds which confine that increase.
  - chunk_index: 22
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book IV. Influence Of The Progress Of Society On Production And Distribution. > Chapter II. Influence Of The Progress Of Industry And Population On Rents, Profits, And Wages. > § 5. Practical Results.
