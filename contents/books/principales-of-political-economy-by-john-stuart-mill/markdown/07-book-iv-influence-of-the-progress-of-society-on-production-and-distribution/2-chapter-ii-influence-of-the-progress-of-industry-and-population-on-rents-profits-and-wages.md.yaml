    content_token_count: 113
    text: |-
      Continuing the inquiry into the nature of the economical changes taking place in a society which is in a state of
      industrial progress, we shall next consider what is the effect of that progress on the distribution of the produce among
      the various classes who share in it. We may confine our attention to the system of distribution which is the most
      complex, and which virtually includes all others—that in which the produce of manufactures is shared between two
      classes, laborers and capitalists, and the produce of agriculture among three, laborers, capitalists, and landlords.
  - chunk_index: 1
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book IV. Influence Of The Progress Of Society On Production And Distribution. > Chapter II. Influence Of The Progress Of Industry And Population On Rents, Profits, And Wages. > § 1. Characteristic features of industrial Progress.
    content_token_count: 101
    text: |-
      The characteristic features of what is commonly meant by industrial progress resolve themselves mainly into three,
      increase of capital, increase of population, and improvements in production; understanding the last expression, in its
      widest sense, to include the process of procuring commodities from a distance, as well as that of producing them. It
      will be convenient to set out by considering each of the three causes, as operating separately; after which we can
      suppose them combined in any manner we think fit.[^298]
