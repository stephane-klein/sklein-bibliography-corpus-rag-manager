    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book IV. Influence Of The Progress Of Society On Production And Distribution. > Chapter II. Influence Of The Progress Of Industry And Population On Rents, Profits, And Wages. > § 2. First two cases, Population and Capital increasing, the arts of production stationary.
    content_token_count: 321
    text: |-
      I. The first is that, while Population is advancing, Capital is stationary. By this means we can study separately the
      operation of one of the factors of societary progress, Population, and see its influence on rents, profits, and wages.
      There being only the same given quantity of wealth in the form of capital to be now distributed among more laborers (1),
      real wages must fall; whereupon, if the same capital purchases more labor, and obtains more produce (2), profits rise.
      Now, if the laborers were so well off before as to suffer the reduction of wages to take place not in their food, but in
      their other comforts, then, if each laborer uses as much food as before, and if, as by the supposition, there are more
      laborers, an increased quantity of food will be required from the soil. This supply can be produced only at a greater
      cost, and, as inferior soils are called into cultivation (3), rents will rise. This last action (3), however, will have
      an influence on the rise of profits (2). For it was only by a reduction of real wages that profits rose; but if the cost
      of food, that is, the real wages, have since risen, then one of the elements entering into cost of labor has risen, and
      in so far will offset the fall of real wages; so that profits will not gain so much as if rents had not risen. The
      result of this first supposition, then, is, that the landlord is the chief gainer:
