    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book IV. Influence Of The Progress Of Society On Production And Distribution. > Chapter II. Influence Of The Progress Of Industry And Population On Rents, Profits, And Wages. > § 2. First two cases, Population and Capital increasing, the arts of production stationary.
    content_token_count: 259
    text: |-
      A. It is easy for us now to take into our view the total effects under A, and see what the combined action of I and \[pg
      491\] II would be. That is, if both Capital and Population (improvements remaining stationary) increase, what will be
      the effect on Wages, Profits, and Rent? Of course, we must suppose that Capital and Population just keep pace with each
      other; and in that case (1) real wages remain the same, each laborer receiving the same quantity and same quality of
      commodities as before. Hence, if each laborer receives the same quantity as before, and there are many more laborers,
      there will be an increased demand put upon the soil for food, poorer soils will be cultivated, and the cost of the
      products will rise. So (3) rents rise. But if each laborer receives the same quantity of real wages as before, and the
      cost of them has risen, as just explained, an increased cost of labor will result which must come out of profits. (2)
      Profits will fall. So that the results of A upon distribution, taken separately from B, are that the owner of capital
      loses; but the owner of land again gains.
