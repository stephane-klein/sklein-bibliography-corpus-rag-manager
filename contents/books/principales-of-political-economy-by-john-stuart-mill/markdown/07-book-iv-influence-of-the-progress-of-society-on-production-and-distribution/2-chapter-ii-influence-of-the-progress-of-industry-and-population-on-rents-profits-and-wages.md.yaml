    text: |-
      Now, since improvements enable a much poorer quality of land to be ultimately cultivated, under the constant pressure of
      the increase of population and capital, improvements enable rent (3) in the end to rise gradually to a much higher limit
      than it could otherwise have attained.
  - chunk_index: 23
    heading_path: Principles of Political Economy / Abridged with Critical, Bibliographical, and Explanatory Notes, and a Sketch of the History of Political Economy > Book IV. Influence Of The Progress Of Society On Production And Distribution. > Chapter II. Influence Of The Progress Of Industry And Population On Rents, Profits, And Wages. > § 5. Practical Results.
    content_token_count: 91
    text: |-
      If a great agricultural improvement were suddenly introduced, it might throw back rent for a considerable space, leaving
      it to regain its lost ground by the progress of population and capital, and afterward to go on further. But taking
      place, as such improvement always does, very gradually, it causes no retrograde movement of either rent or cultivation;
      it merely enables the one to go on rising, and the other extending, long after they must otherwise have stopped.
