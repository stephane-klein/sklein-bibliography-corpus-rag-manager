    text: |-
      It is possible that a different combination from the above may sometimes occur in the causes which underlie the progress
      of society: (1.) There may be a period in which capital is increasing more rapidly than population, and when there seems
      to be an era of industrial improvements also. Then both wages and profits will be high, and it will be a period of
      general satisfaction. (2.) If capital goes on increasing, but improvements are few, wages will rise; but profits must
      suffer a fall. In this country, where population has not yet increased so as to press seriously against subsistence, and
      where capital increases with incredible swiftness, these cases are often exemplified. The extraordinary resources of the
      newer States have permitted an unlimited increase of population, and capital has found no difficulty in finding an
      investment. But yet those States which have been burdened with the disabilities of the old slave régime are far behind
      the others. The changes in the rank of the States, in respect of population, at each decade, as seen in Chart No. XVI,
      are suggestive.
