    text: |-
      Qu'est-ce que c'est qu'une banque de dépôt ? C'est une banque qui collecte des
      dépôts des ménages, tels que vous les utilisez, vous, avec lequel vous avez un
      compte bancaire. Le problème, c'est que les banquiers collectaient les dépôts
      des ménages et allaient spéculer sur le marché boursier comme n'importe quel
      acteur. En faisant ça, ils prennent des risques, sauf que les risques ne
      dépendent pas uniquement pour elles : elles les prennent aussi pour leurs
      déposants. Donc la première chose à faire, nous dit Roosevelt, et qu'il fait
      concrètement, c'est que les banques qui veulent spéculer en bourse ne doivent
      pas accueillir de dépôts. Ce qu'on appelle donc les banques d'investissement,
      les banques qui vont organiser des opérations financières, ne peuvent pas
      prendre des risques avec des gens qui sont là pour déposer l'argent. Donc les
      banques d'investissement collectent aussi l'épargne des ménages, mais elles la
      collectent dans un but bien précis, qui est de prendre des risques financiers,
      et les ménages, lorsqu'ils déposent leur argent sur un compte bancaire, n'ont
      pas spécialement envie de prendre des risques financiers. D'où cette idée de
      distinguer les deux activités bancaires : c'est le Glass-Steagall Act, qui va
      être totalement démantelé dans les années 90 et 2000, après la nouvelle crise.
      En 2001 et en 2008, on impose aussi des critères de solvabilité, c'est-à-dire
      qu'on va réguler un peu davantage les banques, vérifier qu'elles sont solvables,
      notamment lorsqu'elles ont des dépôts des ménages. C'est la première loi,
      effectivement, qui a duré très longtemps, qui a été très utile, et qui a
      beaucoup inspiré. On a aussi la loi bancaire en France en 1945, très inspirée de
      ces principes de régulation des marchés financiers, qui va être largement
      démantelée avec la période de déréglementation financière qu'on va connaître
      dans les années 80-90 en France comme partout ailleurs.
