    text: |-
      Bonjour à tous. Je viens de mettre le PowerPoint complet en ligne, puisque nous
      avons notre dernière séance aujourd'hui. J'ai vu que beaucoup d'étudiants ne
      suivent que des séances en direct ou en différé ; j'imagine que beaucoup
      chercheront à les regarder ou à réviser d'une manière ou d'une autre, d'autant
      que l'examen se tiendra début mai. C'est un peu embêtant de ne pas avoir
      l'interaction habituelle, et je vois bien que vous êtes tous très fatigués par
      les conditions d'études. Faites au mieux.
  - chunk_index: 1
    heading_path: HFE - Séance 10 du 9 avril
    content_token_count: 185
    text: |-
      Pour l'examen, je ne sais pas encore s'il sera distantiel ou présentiel ; je
      suis prêt à faire une épreuve en distanciel ou une épreuve en présentiel, cela
      dépendra des conditions. Quoi qu'il arrive, il y aura de la rédaction, pas
      seulement des QCM, pour que la qualité de l'évaluation ne soit pas perturbée. Ce
      n'est pas la mer à boire : les questions que je pose ne sont pas des questions
      pièges, elles servent à vérifier l'acquisition des connaissances. N'hésitez pas
      à me poser des questions dans le chat, et après la dernière séance, vous pouvez
      toujours me contacter si vous avez une question précise ou un besoin de
      compréhension du cours.
  - chunk_index: 2
    heading_path: HFE - Séance 10 du 9 avril > Introduction au chapitre sur la crise des années 30
    content_token_count: 193
    text: |-
      Nous allons faire la dernière séance sur le chapitre 6, consacré à la crise
      économique des années 30. C'est un chapitre important dans un cours d'histoire
      des faits économiques : la crise des années 30, le krach boursier de 1929 et ses
      conséquences sont parmi les choses qui reviennent le plus souvent. On en parle
      notamment quand on compare cette crise avec les crises ultérieures. C'est un
      cours qui part de la crise de 1929 et qui va suivre cette crise, puisqu'elle va
      se poursuivre pendant dix ans. Cette crise américaine va aussi être une crise
      mondiale, et elle permet de réfléchir plus globalement aux crises, car celles-ci
      reviennent régulièrement dans le capitalisme.
  - chunk_index: 3
    heading_path: HFE - Séance 10 du 9 avril > Introduction au chapitre sur la crise des années 30
    content_token_count: 177
    text: |-
      Les premières questions sont donc : qu'est-ce qu'une crise économique du
      capitalisme ? En quoi se distingue-t-elle des crises qui existaient auparavant,
      dans des systèmes de production précapitalistes ou dans d'autres systèmes ? Il
      est intéressant de comprendre la nature de ce genre de crise qui revient
      régulièrement. Quand je parle de crise, le modèle n'est pas celui que nous
      connaissons aujourd'hui avec le coronavirus, évidemment, puisque c'est une crise
      exogène. Ce qui est intéressant, c'est de voir comment le système capitaliste
      peut lui-même engendrer ses propres crises, pourquoi il les engendre, et quelle
      théorie on peut avoir pour l'expliquer.
  - chunk_index: 4
    heading_path: HFE - Séance 10 du 9 avril > Introduction au chapitre sur la crise des années 30
    content_token_count: 242
    text: |-
      Souvenez-vous qu'au premier semestre, dans le cours d'introduction à l'analyse
      économique, nous avons vu les crises économiques vues par Marx, qui sont
      toujours d'actualité : la question des débouchés et la question de
      l'accumulation du capital sont au cœur de l'explication des crises aujourd'hui.
      On peut élargir et réfléchir sur une crise modèle, la crise de 1929 et ses
      conséquences, en essayant de comprendre si l'on ne retrouve pas des éléments
      d'explication de cette crise qui correspondent à d'autres moments de l'histoire,
      notamment la crise de 2008, qui est la dernière grande crise du capitalisme, une
      crise mondiale également, qui a touché les États-Unis et ensuite le monde
      entier, qu'on appelle aussi la crise des subprimes, parce qu'elle a commencé
      dans le secteur immobilier américain avant de se propager à l'ensemble de
      l'économie.
  - chunk_index: 5
    heading_path: HFE - Séance 10 du 9 avril > Qu'est-ce qu'une crise économique du capitalisme ?
    content_token_count: 70
    text: |-
      La première chose à dire, c'est que les crises du capitalisme sont rarement des
      crises agricoles. Ce sont des crises liées au système économique tel qu'il
      fonctionne aujourd'hui, un système dans lequel l'agriculture est beaucoup moins
      présente et beaucoup moins prédominante.
  - chunk_index: 6
    heading_path: HFE - Séance 10 du 9 avril > Qu'est-ce qu'une crise économique du capitalisme ?
    content_token_count: 168
    text: |-
      Deuxième élément important : les crises des modèles traditionnels ne sont pas
      des crises de surproduction, ce sont en général des crises de sous-production.
      Qu'est-ce qui se passe ? On a une mauvaise récolte, une catastrophe climatique,
      ou un champignon qui a dévasté les récoltes. Alors il va y avoir une hausse du
      prix des biens alimentaires, qui va entraîner des contestations sociales,
      parfois ce qu'on appelait des disettes, c'est-à-dire des famines, concrètement
      localisées, ou des révoltes sociales qui peuvent être le produit simplement du
      fait que les gens n'ont pas à manger, donc ils se révoltent contre les
      autorités.
  - chunk_index: 7
    heading_path: HFE - Séance 10 du 9 avril > Qu'est-ce qu'une crise économique du capitalisme ?
    content_token_count: 507
    text: |-
      C'est quelque chose qu'on voit traditionnellement dans tous les pays avant le
      système capitaliste. On pourrait même dire que la dernière crise de l'ancien
      système, c'est la crise du milieu du XIXe siècle, 1845-1849, une crise globale
      de production agricole qui touche l'Europe et qui est conjuguée à l'apparition
      d'un nouveau champignon, le mildiou, qui va dévaster les pommes de terre, mais
      aussi les vignes et d'autres cultures, surtout les pommes de terre, parce que
      celles-ci étaient devenues un élément essentiel de l'alimentation, notamment des
      classes populaires. Le fait qu'il y ait à la fois moins de céréales, moins de
      blé, et des cultures de pommes de terre qui ne donnent plus, tout cela va avoir
      des conséquences en termes de capacité à s'alimenter. Il va y avoir notamment
      une grande famine en Irlande, une énorme famine qui va tuer près d'un million de
      personnes, et beaucoup d'Irlandais vont émigrer, principalement aux États-Unis.
      C'est quelque chose qui va toucher profondément l'histoire de cette île, qui
      était à l'époque extrêmement pauvre. Ces mauvaises récoltes vont aussi entraîner
      des révoltes populaires dans d'autres pays, notamment dans les milieux ouvriers,
      et on va voir en 1848 ce qu'on appelle le printemps des peuples. Ce n'est pas
      étonnant que ce soit au printemps : c'est là qu'on vit sur ses réserves, qu'on
      n'a pas encore les nouvelles cultures et qu'on a peu de choses à manger. Donc à
      l'hiver et au printemps 1848, il y a des manifestations contre le prix du pain,
      contre le prix de la vie, qui vont se propager partout en Europe, notamment à
      Vienne, à Paris, etc. En France, ces révolutions vont abattre la monarchie de
      Juillet et instaurer la Deuxième République, qui ne durera d'ailleurs pas très
      longtemps.
  - chunk_index: 8
    heading_path: HFE - Séance 10 du 9 avril > Qu'est-ce qu'une crise économique du capitalisme ?
    content_token_count: 79
    text: |-
      Ce printemps des peuples est donc une conséquence sociale d'une crise, mais ce
      n'est pas vraiment une crise du capitalisme au sens strict, puisque c'est une
      crise agricole produite par une situation de pénurie alimentaire. On est encore
      dans le modèle des crises de l'Ancien Régime.
  - chunk_index: 9
    heading_path: HFE - Séance 10 du 9 avril > Qu'est-ce qu'une crise économique du capitalisme ?
    content_token_count: 233
    text: |-
      Après 1850, en tout cas en Europe occidentale et en Amérique du Nord, on ne va
      plus se retrouver avec ce type de crise alimentaire. On va avoir une autre forme
      de crise, des crises d'accumulation du capital, et c'est typiquement ce genre de
      crise qu'on retrouve au XXe siècle. Après 1850, on doit avoir des crises qui
      sont des crises du capitalisme, et dans une logique radicalement à l'inverse de
      celle des systèmes traditionnels, puisque ce sont des crises qui sont le fruit
      de la surproduction. C'est là que ça paraît un peu bizarre : une crise de
      surproduction, alors qu'on n'a pas assez d'aliments pour nourrir les gens. Tout
      le monde comprend bien que ça crée une crise. Mais l'idée qu'on peut
      surproduire, qu'on peut avoir trop de capacités de production par rapport à nos
      besoins, et que cela peut engendrer une crise, est beaucoup moins intuitive.
  - chunk_index: 10
    heading_path: HFE - Séance 10 du 9 avril > Qu'est-ce qu'une crise économique du capitalisme ?
    content_token_count: 312
    text: |-
      Pour comprendre le mécanisme d'une surproduction, il suffit de regarder quelque
      chose qui est habituellement symptomatique d'une crise de surproduction : la
      question du chômage. Le chômage est bien un phénomène qui résulte du fait qu'on
      ne trouve pas d'emploi pour des gens qui sont prêts à travailler, c'est-à-dire
      qu'on a des capacités de production qui ne sont pas employées. Si on arrivait à
      employer ces capacités de production, à mettre ces chômeurs au travail, cela
      poserait question, puisque le système économique globalement n'a pas besoin de
      davantage de richesses. Donc typiquement, ce que reproduit le chômage, c'est un
      système de surproduction, et c'est typique du capitalisme. On n'a pas forcément
      de chômage dans les systèmes traditionnels. On n'avait pas de chômage dans un
      système communiste ; au contraire, on était toujours en manque de main-d'œuvre.
      Dans le capitalisme, on a au contraire un surplus de main-d'œuvre, des gens qui
      ont le temps de travailler, qui sont capables de travailler, et à qui on ne
      trouve pas d'emploi parce que simplement ils n'ont rien à faire ou qu'on n'a pas
      de production à leur donner.
  - chunk_index: 11
    heading_path: HFE - Séance 10 du 9 avril > Qu'est-ce qu'une crise économique du capitalisme ?
    content_token_count: 232
    text: |-
      Pour essayer de comprendre comment on peut en arriver à une crise de
      surproduction, à des productions qui ne trouvent pas de débouchés, il faut
      justement penser à des productions qui sont liées à la difficulté de trouver une
      demande solvable et en même temps à une forte croissance des capacités de
      production. Dans l'économie, ce n'est pas très compliqué : on résume en général
      la question de la capacité de production par l'accumulation du capital.
      Qu'est-ce qu'une crise du capitalisme ? C'est une crise qui résulte justement
      d'une trop forte accumulation de capital. Le capital est beaucoup accumulé, il
      produit trop, et cette surproduction va entraîner une crise des débouchés, qui
      va elle-même entraîner un ralentissement du processus d'accumulation et même une
      destruction de capital parfois, parce qu'une faillite d'entreprise, c'est une
      destruction de capital et une diminution des nouveaux investissements.
  - chunk_index: 12
    heading_path: HFE - Séance 10 du 9 avril > Qu'est-ce qu'une crise économique du capitalisme ?
    content_token_count: 143
    text: |-
      En général, ça se produit comme ça : on commence par ne plus pouvoir vendre,
      donc la première chose est la crise des débouchés. On va voir des stocks
      s'accumuler, qu'on ne pourra plus vendre. On va donc écouler ses stocks, donc
      moins produire. Si on produit moins, logiquement on va moins investir. Et
      puisqu'on a moins investi, on va moins recruter, et donc le chômage va
      apparaître comme le résultat logique de cette crise. C'est le schéma
      traditionnel quand on analyse les choses en termes réels.
  - chunk_index: 13
    heading_path: HFE - Séance 10 du 9 avril > Qu'est-ce qu'une crise économique du capitalisme ?
    content_token_count: 118
    text: |-
      Mais très vite, et c'est ça qui va être au cœur de la crise des années 30, on va
      se retrouver face à des crises qui ne se déclenchent pas dans le système réel,
      qui ne sont pas liées simplement à un problème de débouchés, mais qui sont liées
      à une crise financière. Dans ce cas, on a une autre logique de crise, qui va
      engendrer ensuite une crise du secteur réel, mais qui commence très souvent dans
      le secteur financier.
  - chunk_index: 14
    heading_path: HFE - Séance 10 du 9 avril > Qu'est-ce qu'une crise économique du capitalisme ?
    content_token_count: 206
    text: |-
      Pour comprendre comment une crise peut commencer dans le secteur financier, il
      faut savoir que la finance, ce sont ceux qui permettent de financer les
      investissements des entreprises à partir d'émissions de titres ou d'emprunts
      bancaires. Le financier va chercher à donner de l'argent à une entreprise en
      escomptant récupérer une partie des profits de l'entreprise. Le problème, c'est
      que si l'entreprise dont on espérait qu'elle fera du profit ne fait pas le
      profit attendu, pour plein de raisons — parce que son projet était mauvais,
      parce que la conjoncture est mauvaise, ou parce que l'entrepreneur était idiot,
      ce qui est tout à fait possible — alors, puisqu'il n'y a pas le profit attendu,
      l'entreprise pourrait faire faillite, et l'argent qu'on a mis dans l'entreprise
      aura disparu.
  - chunk_index: 15
    heading_path: HFE - Séance 10 du 9 avril > Qu'est-ce qu'une crise économique du capitalisme ?
    content_token_count: 162
    text: |-
      C'est ça qui entraîne la brutalité des crises financières : à un moment on pense
      que ce qu'on a prêté, on va le récupérer, et puis le lendemain on s'aperçoit
      qu'on ne récupérera pas. C'est un peu tout noir ou tout blanc. La finance, c'est
      un pari sur l'avenir ; ce pari peut être bon ou faux, et lorsqu'il est faux, on
      le sait souvent assez brutalement. Dans ce cas, tout l'argent qu'on a mis peut
      disparaître, c'est-à-dire qu'on sait qu'on aura beaucoup de mal à le récupérer.
      Les banques qui ont trop d'argent à plat peuvent faire faillite.
  - chunk_index: 16
    heading_path: HFE - Séance 10 du 9 avril > Qu'est-ce qu'une crise économique du capitalisme ?
    content_token_count: 458
    text: |-
      C'est ainsi qu'on peut analyser une crise du système financier ou du système
      bancaire. En général, cela commence par des créances douteuses. Une créance
      douteuse, c'est un avoir, une créance, mais dont on ne sait pas si on va pouvoir
      la récupérer. Ces créances douteuses s'accumulent, au final une grande partie ne
      va pas être remboursée, et donc une banque va devoir faire faillite. Quand on a
      des banques en faillite, le système financier peut être directement attaqué par
      le fait que les banques vont arrêter d'accorder des prêts pour éviter de prendre
      des risques. En général, il y a un phénomène mimétique : une banque fait
      faillite, d'autres banques se disent « peut-être que moi aussi j'ai des créances
      douteuses ». Les banques sont aussi très fortement liées entre elles,
      c'est-à-dire qu'elles se doivent beaucoup d'argent mutuellement. Donc si l'une
      fait faillite et ne rembourse pas aux autres, en ces périodes-là on va tout d'un
      coup freiner les prêts : c'est ce qu'on appelle un credit crunch, un
      effondrement du crédit. Les banques vont arrêter de prêter et renchérir le coût
      du prêt de manière très importante. Les entreprises ne peuvent donc plus se
      financer pour investir, et là typiquement on a une crise qui part du secteur
      financier et qui va se retrouver ensuite dans l'économie réelle. Si les
      entreprises ne peuvent plus trouver de financement pour leurs investissements,
      elles arrêtent d'investir, et on va se retrouver dans une crise de surproduction
      : on ne peut plus accumuler du capital, on cherche à licencier des gens parce
      qu'on n'a plus besoin de créer des emplois, puisqu'on n'arrive plus à créer du
      capital.
  - chunk_index: 17
    heading_path: HFE - Séance 10 du 9 avril > Quelques lectures recommandées
    content_token_count: 496
    text: |-
      Avant d'arriver à la crise de 1929, je voulais vous recommander des livres qui
      m'ont servi pour faire ce cours. Ce ne sont pas les seuls, bien sûr, mais
      d'abord ils sont très bien, et ils sont du même auteur, John Kenneth Galbraith.
      Le plus connu de ces deux livres, c'est celui de gauche, *La crise économique de
      1929*, un livre écrit en 1950 par un jeune économiste de l'époque, qui retrace
      l'histoire de la crise de 1929. C'est extrêmement intéressant, parce qu'il
      étudie les économistes de l'époque, ce qu'ils disaient, les banquiers de
      l'époque, ce qu'ils disaient et ce qu'ils faisaient ; il étudie un peu au jour
      le jour l'évolution de la crise. C'est presque plus un livre d'historien qu'un
      livre d'économiste. Puis, bien plus tard, dans les années 90, il a publié un
      autre livre très court, une centaine de pages, *Brève histoire de l'euphorie
      financière*, dans lequel il revient sur l'ensemble des crises financières qui
      ont eu lieu depuis la crise des tulipes aux Pays-Bas au XVIe siècle — il y a une
      spéculation sur l'oignon de tulipe à cette époque — jusqu'aux crises des années
      80-90. L'argument de Galbraith, c'est que toutes les crises obéissent un peu au
      même modèle, au même schéma : des gens qui se croient plus malins que les
      autres, qui cherchent une martingale pour gagner plus d'argent, et beaucoup de
      gens vont les suivre dans ce corps très intelligent, puis un jour tout ça va
      s'effondrer. Comme tout le monde aura beaucoup imité ces personnes, l'effet sera
      très fort. C'est pour ça qu'il parle d'euphorie financière, parce que tout
      commence toujours par un moment d'euphorie, un moment de perte de contrôle.
  - chunk_index: 18
    heading_path: HFE - Séance 10 du 9 avril > Quelques lectures recommandées
    content_token_count: 210
    text: |-
      Après cela, on a eu la crise de la bulle internet en 2000-2001, puis la crise
      des subprimes, et ce sont toujours un peu les mêmes mécanismes qui sont au cœur
      des crises financières. Si je voulais continuer, je pourrais dire que ce qui se
      passe aujourd'hui sur les cryptomonnaies ressemble tout à fait à ce dont parle
      Galbraith : une forme d'euphorie, avec des publicités sur les réseaux sociaux du
      type « regardez le bitcoin ne cesse d'augmenter, achetez maintenant, vous allez
      voir, ça va valoir plus dans un an ». Typiquement, on est dans les mécanismes
      d'euphorie financière, et systématiquement cela finit par arriver sur un krach,
      mais on ne sait jamais quand. C'est ça aussi le souci.
  - chunk_index: 19
    heading_path: HFE - Séance 10 du 9 avril > Les crises avant 1929
    content_token_count: 184
    text: |-
      Avant de parler des années 30, je voudrais revenir sur les crises de la fin du
      XIXe siècle et du début du XXe siècle, et sur la situation économique notamment
      aux États-Unis, mais globalement dans le monde développé. Il faut rappeler que
      les crises existaient avant 1929. Au moment où la crise de 1929 éclate, on
      savait qu'il y avait des cycles des affaires, des moments de croissance et des
      moments de crise, même si on n'avait pas de très bons outils statistiques. On
      n'avait pas le PIB, on ne mesurait même pas le chômage, donc c'était difficile
      d'évaluer les crises, sauf par la multiplication des faillites, notamment des
      banques.
  - chunk_index: 20
    heading_path: HFE - Séance 10 du 9 avril > Les crises avant 1929
    content_token_count: 199
    text: |-
      Il y avait aussi quelque chose qui s'est passé à la fin du XIXe siècle, au
      deuxième tiers du XIXe siècle, et qui a suscité des crises : l'apparition du
      chemin de fer. C'était une technologie nouvelle, un nouveau moyen de transport,
      mais qui était extrêmement coûteux et qui nécessitait énormément
      d'investissements. Dans ce cas, le secteur financier et bancaire a mis
      énormément d'argent dans les chemins de fer. Or c'était une activité extrêmement
      risquée, puisque une ligne de chemin de fer n'était rentable que s'il y avait
      suffisamment de demande et de péage à payer. Parfois, il n'y avait pas forcément
      les besoins, et la valeur d'une ligne de chemin de fer n'était pas au
      rendez-vous.
  - chunk_index: 21
    heading_path: HFE - Séance 10 du 9 avril > Les crises avant 1929
    content_token_count: 336
    text: |-
      Que se passe-t-il alors ? Toutes les banques qui financent ces lignes de chemin
      de fer, cette nouvelle technologie, se disent, sans doute avec une part de
      vérité : « le chemin de fer, c'est l'avenir ». Elles avaient raison, le chemin
      de fer, c'est l'avenir, et on peut encore le dire aujourd'hui. Mais le problème,
      c'est que ce n'est pas parce que c'est l'avenir que c'est rentable, et que c'est
      rentable au niveau où on l'attend. Par ailleurs, quand on construit un chemin de
      fer, on a toujours un coût au départ et un coût à l'arrivée, et souvent le coût
      à l'arrivée est bien supérieur au coût de départ. On anticipe un coût, on
      regarde combien ça va coûter, combien on attend de revenus de la ligne de chemin
      de fer, c'est-à-dire les péages, les trains qui vont payer un péage ; c'est
      comme ça qu'on gagne de l'argent. On est rentable à un instant t, mais si on
      s'aperçoit qu'en fait les coûts de construction sont bien plus élevés — ce qui
      arrive très souvent — et que les revenus sont un peu moins importants que ce
      qu'on avait prévu de manière optimiste, alors un projet rentable peut se
      transformer en gabegie financière totale.
  - chunk_index: 22
    heading_path: HFE - Séance 10 du 9 avril > Les crises avant 1929
    content_token_count: 246
    text: |-
      Un exemple plus récent et meilleur, c'est le tunnel sous la Manche, qui est
      aussi un tunnel ferroviaire. Il a coûté beaucoup, beaucoup plus cher que ce qui
      était anticipé, il a été financé par le système financier, par des gens qui ont
      acheté des actions du tunnel sous la Manche, et à la fin ils ont perdu
      énormément d'argent parce que le projet était beaucoup moins rentable que prévu.
      Tout ça pour vous expliquer que ces grands travaux de construction de voies de
      chemin de fer étaient l'occasion de très nombreuses crises financières. Quand on
      regarde ce qui s'est passé, notamment les crises comptabilisées à partir du
      nombre de faillites de banques, les banques font faillite en général parce
      qu'elles ont investi dans des voies de chemin de fer qui ont été moins rentables
      ou plus coûteuses que ce qui était anticipé, donc leurs créanciers ne
      remboursent pas, et les banques qui avaient mis beaucoup d'argent font faillite.
  - chunk_index: 23
    heading_path: HFE - Séance 10 du 9 avril > Les crises avant 1929
    content_token_count: 126
    text: |-
      On voit une série de crises : 1857, 1866, 1873, puis la crise de 1890, une
      énorme crise qui va toucher bien au-delà du système financier, qu'on appelait la
      première grande dépression, parce qu'en fait on en parlait déjà comme de la
      grande dépression à cette époque. Toutes ces crises commencent donc avec le
      ferroviaire, avec des faillites de banques engagées de manière trop importante
      dans l'activité ferroviaire.
  - chunk_index: 24
    heading_path: HFE - Séance 10 du 9 avril > Les crises avant 1929
    content_token_count: 353
    text: |-
      Ensuite, la finance va elle-même se développer. Il y a deux aspects : la manière
      de financer le crédit bancaire, et la souscription à l'épargne, auprès des
      épargnants, d'actions et d'obligations. Très souvent, ces actions vont
      progressivement se développer dans la deuxième moitié du XIXe siècle. On va
      aussi développer des bourses de change. Une bourse, qu'est-ce que c'est ? C'est
      un endroit où l'on va revendre les actions qu'on a achetées à un prix qui va
      être négocié dans le cadre du marché boursier. Là, il va se passer un phénomène
      qu'on connaît très bien en finance : la spéculation, c'est-à-dire que j'achète
      quelque chose maintenant, non pas parce que ça m'intéresse de garder ce titre,
      la rentabilité de cette action, de toucher le dividende qu'elle me promet, mais
      parce que j'anticipe une hausse du cours et que je vais pouvoir la vendre plus
      tard. L'idée d'acheter quelque chose non pas pour la valeur intrinsèque qu'il
      possède, c'est-à-dire le fait qu'il procure des dividendes, mais dans l'espoir
      que ce que vous avez acheté va voir son prix augmenter et que vous allez faire
      un profit à la revente : c'est typiquement ce qu'on appelle un mécanisme de
      spéculation.
  - chunk_index: 25
    heading_path: HFE - Séance 10 du 9 avril > Les crises avant 1929
    content_token_count: 337
    text: |-
      La spéculation, c'est une activité qui consiste à gagner de l'argent sur la
      variation des cours d'un actif. Je le répète : la spéculation, c'est quelque
      chose qui consiste à gagner de l'argent sur la variation des cours, des prix des
      actifs. C'est la même chose : vous cherchez à acheter et vendre, acheter pas
      cher, vendre plus cher. Quand vous êtes dans un mécanisme de spéculation, vous
      n'allez pas chercher l'intérêt de l'objet que vous achetez ; l'objet acheté ne
      vous intéresse que parce que vous prévoyez qu'il va monter. C'est typiquement le
      concept sur les cryptomonnaies aujourd'hui : les gens qui achètent des
      cryptomonnaies, du bitcoin, ne le font absolument pas parce qu'ils ont un usage
      du bitcoin — ou très peu —, la grande majorité le fait parce qu'ils croient que
      ça va monter et qu'ils vont faire des profits en revendant. D'ailleurs, les
      publicités que vous voyez sur les réseaux sont parfois uniquement axées sur cet
      argument : vous achetez maintenant, vous vendez plus tard. Mais on comprend bien
      qu'il y a un souci : la spéculation ne peut marcher que si d'autres perdent de
      l'argent, que si d'autres gens achètent au moment où vous les vendez,
      c'est-à-dire au prix le plus cher.
  - chunk_index: 26
    heading_path: HFE - Séance 10 du 9 avril > Les crises avant 1929
    content_token_count: 271
    text: |-
      Les phénomènes spéculatifs ne sont pas nouveaux, ils existent depuis tout le
      temps. Par ailleurs, vous n'avez pas besoin de titres financiers pour faire de
      la spéculation : vous pouvez spéculer sur n'importe quel actif, n'importe quel
      objet qui a de la valeur, et en particulier sur du mobilier. Vous achetez une
      maison, un appartement, et beaucoup de gens pensent que s'ils achètent une
      maison tant d'argent, ils ne feront de bonnes affaires que s'ils la revendent
      plus cher après. L'idée que le prix monte spontanément et que forcément on
      revendra plus cher ce qu'on a acheté est une croyance très ancrée chez les gens,
      mais elle n'est pas toujours vraie. Il y a des crises immobilières qui peuvent
      durer des dizaines d'années, dans lesquelles les prix de l'immobilier baissent.
      Vous pouvez donc acheter, mais vous ne pouvez jamais être certain que, quelle
      que soit la chose que vous achetez, vous la revendrez plus cher. Ça, c'est vrai,
      ça n'est pas vrai.
  - chunk_index: 27
    heading_path: HFE - Séance 10 du 9 avril > Les crises avant 1929
    content_token_count: 207
    text: |-
      Le phénomène de spéculation le plus célèbre, c'est la tulipe au XVIIe siècle aux
      Pays-Bas. J'en ai déjà parlé : ça a duré quatre ans, c'est une période où
      l'oignon de tulipe valait de plus en plus cher. La tulipe est une fleur qui
      vient de Turquie, qui était très populaire à l'époque, et on achetait des
      oignons de tulipe pour s'intéresser à la tulipe, pour planter les tulipes, et on
      achetait des oignons de tulipe pour les revendre plus cher. C'est typiquement un
      mécanisme de spéculation, et au bout d'un moment on disait que l'oignon de
      tulipe valait davantage d'argent qu'un petit carrosse, ce qui veut dire qu'on
      arrivait sur des prix totalement aberrants.
  - chunk_index: 28
