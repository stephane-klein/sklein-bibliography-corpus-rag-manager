  - chunk_index: 84
    heading_path: HFE - Séance 10 du 9 avril > Les explications de Galbraith et le parallèle avec 2008
    content_token_count: 651
    text: |-
      Le premier problème, nous dit Galbraith, c'est finalement une croissance
      déséquilibrée, c'est-à-dire une croissance qui a profité à certains et pas à
      d'autres, qui n'a pas été également répartie. Voilà ce qu'il dit : entre 1919 et
      1929, la productivité du travail s'est accrue de 43 %, mais les salaires n'ont
      quasiment pas augmenté. Donc la productivité du travail a beaucoup augmenté, les
      salaires ont augmenté moins. En fait, ça veut dire qu'on ne vendait pas
      davantage aux salariés du bas de l'échelle. Ce qui a tiré la demande pendant
      cette période, entre 1919 et 1929, ce sont deux choses : d'abord les biens
      durables, c'est-à-dire des biens chers qui se sont adressés à la classe moyenne
      et supérieure, et les biens d'investissement, qui sont destinés à l'équipement
      des entreprises. Galbraith montre ici que les biens d'équipement augmentent de
      6,3 % par an, ce qui est considérable, et les biens durables de 1,9 % par an, ce
      qui est considérable. Par contre, les biens destinés aux classes moyennes et
      populaires, inférieures aux classes moyennes, inférieures et populaires, leur
      consommation n'a augmenté que de 2,8 % par an. Autrement dit, la richesse des
      États-Unis dans ces années 1920-1929 est allée essentiellement vers les plus
      riches et les entreprises. Or, vous dit Galbraith, en soi ce n'est pas grave :
      on produit de la croissance, il y a de la croissance. Le problème, c'est que ça
      crée de l'instabilité. Pourquoi ? Parce que les biens supérieurs, les biens
      durables, sont des signaux riches, et les biens d'investissement sont très
      sensibles à la conjoncture économique. Ce qui s'est passé, c'est que le
      retournement de la conjoncture, avec l'effondrement de la demande, a touché les
      plus riches et les entreprises, et bien là ça fait s'effondrer les moteurs de la
      croissance structurelle. Si on avait eu une croissance mieux répartie, avec plus
      de revenus pour les plus pauvres, et bien les plus pauvres n'auraient pas baissé
      leur consommation avec la crise de 1929, et donc l'instabilité de la demande se
      serait moins accrue du fait de ce déséquilibre. C'est la thèse de Galbraith, je
      ne fais que citer Galbraith.
