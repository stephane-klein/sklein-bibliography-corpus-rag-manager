      Concrètement, comment ça fonctionne ? Il y a plein de façons, mais l'objectif
      est de partir déjà de l'argent. Donc vous possédez 1 000 dollars et avec 1 000
      dollars vous voulez acheter pour l'équivalent de 5 000 dollars de titres.
      Évidemment, avec 1 000 dollars, ce n'est pas 5 000, donc vous ne pouvez pas.
      Mais vous savez que si vous aviez 5 000 dollars de titres, vous gagneriez cinq
      fois plus d'argent avec la spéculation. Qu'est-ce qui permet de faire cela ? Ce
      qu'on appelle des opérations sur marge, et n'importe qui pouvait le faire.
      Qu'est-ce qu'il s'agit ? Vous décidez d'acheter 5 000 dollars de titres avec 1
      000 dollars d'argent : en fait vous ne payez que 20 % de l'achat, et quelqu'un
      va acheter pour vous 5 000 dollars de titres. Il va mettre 4 000 dollars et
      vous, vous allez donner 1 000 dollars en caution. Il va vous faire payer un taux
      d'intérêt. Donc en fait, ce que vous faites ici, c'est un emprunt : vous
      empruntez 5 000 dollars et vous mettez vos 1 000 dollars en caution auprès de la
      personne à qui vous avez emprunté. Tout ça fonctionne bien, sauf si les cours de
      l'action, les cours des titres que vous avez achetés, baissent. Dans ce cas, on
      va regarder le dépôt de garantie : vous avez mis 1 000 dollars, ok, mais si ça
      baisse de plus de 1 000 dollars, on va faire ce qu'on appelle un rappel de
      marge. C'est-à-dire qu'on va dire : « écoutez, vous avez mis 1 000 euros de
      garantie, là vous faites des pertes de 1 500 euros, je suis désolé, il va
      falloir me rallonger 500 euros ». C'est là qu'arrive le problème : quand les
      titres baissent, si vous n'avez pas d'argent, vous ne pouvez pas rajouter, et
      vous êtes obligé de vendre les titres que vous avez achetés, donc les 5 000
      dollars de titres, mais évidemment vous les vendez à un prix inférieur, parce
      que c'est justement l'appel de marge : la valeur des titres a baissé. Que se
      passe-t-il ? Tout le monde se met à vendre en raison des rappels de marge,
      c'est-à-dire parce que le courtier qui vous a acheté des actions vous demande de
      l'argent pour compenser les pertes, et vous êtes obligé de vendre dans
      l'urgence. Vous vendez à un mauvais prix, et en plus le souci qui se passe,
      c'est que ça accélère la chute des cours, parce que quand tout le monde fait ça
      en même temps, les cours s'effondrent. Tout le monde veut vendre en même temps.
      Il faut bien comprendre que si les gens vendent dans les moments de panique
      boursière, ce n'est pas toujours parce qu'ils se disent « ah bah c'est génial,
      vendons », ils ont bien compris qu'il vaut mieux ne pas vendre quand ça baisse,
      mais en fait ils n'ont pas le choix. C'est ça le problème : ils n'ont pas le
      choix, parce que non seulement ils doivent payer les intérêts aux courtiers, aux
      banquiers qui ont acheté pour eux et qui leur ont prêté de l'argent, mais en
      plus ils sont obligés, à cause du principe de rappel de marge, d'augmenter la
      caution qu'ils avaient mise au départ. Le rappel de marge, c'est un truc
      classique dans la finance. Je vous invite à regarder le film qui s'intitule en
      français *Margin Call* — en français, *Margin Call*, appel de marge. C'est un
      film très, très bon sur ce qui s'est passé pendant la crise des subprimes
      américaines, sorti en 2010. Le titre renvoie à ce principe.
