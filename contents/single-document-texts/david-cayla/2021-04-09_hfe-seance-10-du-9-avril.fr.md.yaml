      150 millions, cela fait 75 millions. Donc maintenant vous avez 75 millions de
      plus, donc vous avez une société qui vaut maintenant 225 millions. Cette société
      qui vaut 225 millions va bénéficier à ses 225 millions, et bien en fait
      uniquement les actions ordinaires : pourquoi ? Parce que les autres ne sont pas
      concernées, parce que les autres ont des rentabilités déjà contractualisées,
      donc elles ne peuvent pas être plus rentables, donc elles ne peuvent pas valoir
