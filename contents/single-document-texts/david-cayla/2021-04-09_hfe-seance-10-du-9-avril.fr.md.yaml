      chercher à organiser l'industrie américaine et notamment à mettre un terme à ce
      qui mine l'industrie américaine, c'est-à-dire la déflation, qui est une manière
      de faire baisser les prix d'un côté et baisser les salaires de l'autre. Il va
      chercher à lutter contre la déflation, et pour cela il va chercher à réorganiser
      l'économie américaine autour de grands accords de branche, constitués dans le
      cadre de cette loi qui s'appelle le National Industrial Recovery Act, le NIRA.
      Cela va créer une administration, la NRA, qui va susciter chez les entreprises
      un ensemble de pratiques qu'on appelle des bonnes pratiques, avec deux
      dimensions : une dimension sociale et une dimension concurrentielle. Ce qui est
      au cœur du problème, c'est la dimension concurrentielle : on va en fait
      encourager les entreprises à arrêter de baisser leurs prix et arrêter de se
      faire concurrence par la baisse des prix. Donc on demande aux entreprises de se
      mettre d'accord entre elles sur les prix. Quand on y réfléchit, on est
      complètement à l'envers de ce qu'on recommande aujourd'hui en économie,
      c'est-à-dire qu'on dit : il faut susciter la concurrence, il faut faire baisser
      les prix. Mais à l'époque, comme on est en situation de baisse généralisée des
      prix et que ça crée des problèmes pour l'industrie et pour l'emploi, on demande
      aux entreprises de s'entendre, de collaborer sur les prix, pour éviter de
      rentrer dans une guerre des prix. Cette logique de cartel n'était pas
      obligatoire : les entreprises qui acceptaient cette réforme de cartellisation
      sous l'autorité bienveillante de l'État avaient ce petit autocollant, l'aigle
      bleu, « We do our part ». Elles adhéraient au code de bonne conduite de la NRA
      et suspendaient la concurrence. Évidemment, ce label était vu par les
      consommateurs, qui achetaient ces biens. Mais pourquoi le consommateur
      accepterait-il que les entreprises arrêtent de baisser leurs prix, voire
      augmentent leurs prix ? Parce qu'il y a des contreparties sociales : des
      conventions collectives sur les salaires, on arrête de faire baisser les
      salaires, on se met d'accord avec les syndicats, on propose des hausses
      salariales ou en tout cas des fins de baisses de salaires. Et puis on organise
      aussi la baisse du temps de travail. Là aussi, les Américains ne sont pas les
      premiers : la France a voulu avec les RTT faire baisser le temps de travail pour
      répondre à la crise. Les États-Unis font baisser le temps de travail, et le
      gouvernement demande aux entreprises de faire baisser le temps de travail. C'est
