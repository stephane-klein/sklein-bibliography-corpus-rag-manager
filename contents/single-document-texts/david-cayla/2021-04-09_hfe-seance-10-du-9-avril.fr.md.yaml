    text: |-
      En France, on a connu le système de Law, un système de financement de la royauté
      de l'époque, je crois au moment de la Régence, après la mort de Louis XIV. Le
      gouvernement français cherchait à retrouver un peu d'argent et avait cherché à
      émettre des titres dont la rentabilité proposée était liée à l'exploitation des
      colonies, notamment de la Louisiane. Le problème, c'est que pour que ces titres
      aient de la valeur, il fallait qu'ils aient du profit, qu'ils soient réalisés en
      Louisiane. Or la Louisiane était un territoire français qui était quand même
      très peu développé. Il y a eu un phénomène spéculatif : on a commencé à racheter
      des titres uniquement parce qu'on pensait qu'ils allaient augmenter, sans
      vraiment s'intéresser au développement de la Louisiane au sens strict.
      Évidemment, quand les revenus ne sont pas arrivés, les titres se sont totalement
      effondrés. La particularité, c'est que Law a aussi introduit le papier-monnaie,
      puisque ses titres étaient en papier et pouvaient s'échanger en papier. Ça a à
      la fois fait son succès et causé sa perte, puisque ce trop grand succès, par
      confiance, peut poser problème.
  - chunk_index: 29
