      choses sont plus compliquées. Par exemple, l'abolition de l'esclavage de
      Lincoln, c'est un républicain, ce n'est pas un démocrate. Les démocrates à la
      fin du XIXe siècle sont plutôt soutenus par les États du Sud, les anciens
      esclavagistes, les ségrégationnistes, et les démocrates ne sont pas forcément
      des gens de gauche qu'on dirait aujourd'hui. Roosevelt, lui, va transformer les
      démocrates en parti de gauche, en fait. Mais quand il mène sa campagne,
      Roosevelt n'est pas du tout de gauche, là aussi tel qu'on pourrait le penser.
      Qu'est-ce qu'il dit ? Il dit qu'il faut équilibrer les comptes publics, que
      c'est un scandale qu'on soit en déficit. Il fait campagne en promettant, je cite
      : « un budget fédéral annuellement équilibré sur la base d'estimations exactes
      en matière de revenus », et il demande « une réduction immédiate et profonde des
      dépenses de l'État ». Il dit qu'il faut 25 % de moins de services publics,
      d'employés. Ce n'est pas du tout une politique de gauche. En revanche, il est
      contre les relances monétaires, c'est-à-dire la dévaluation, l'étalon-or, la fin
      de l'étalon-or. Donc d'un point de vue économique, Roosevelt n'apparaît pas de
      gauche pour les électorats de l'époque. La seule chose qu'on peut aujourd'hui
      considérer comme de gauche dans son programme, qu'il va mettre en avant très
      vite, c'est la régulation du système bancaire et financier. Là, pour le coup, la
      bourse pour lui doit être régulée, le système bancaire doit être entièrement
      transformé et réglementé. C'est d'ailleurs la première chose qu'il va faire avec
      le New Deal.
