      d'investissement, donc ça va faire perdre des revenus à d'autres entreprises, et
      puis ça se propage. Ensuite, vous avez quand même des stocks à vendre, donc
      qu'est-ce que vous faites ? Logiquement, vous baissez vos prix, vous essayez
      d'écouler vos stocks. Une baisse des prix qui dit baisse des prix dit forcément
      baisse des revenus pour les entreprises qui arrivent à se sauver, mais elles se
      sauvent en faisant des pertes. Du coup, elles vont chercher à baisser les coûts
      de production, donc elles vont licencier là aussi du personnel, ou elles vont
      essayer de négocier des salaires à la baisse. En fait, on va voir cette chose-là
      se répéter pendant des années et des années : c'est ce qu'on appelle la
      déflation. La déflation, qu'est-ce que c'est ? C'est un moment, celle inverse de
      l'inflation, c'est-à-dire une situation dans laquelle tout le monde baisse ses
      prix. En fait, la crise des années 30, c'est une crise qui est caractérisée par
      une baisse généralisée des prix et une baisse des prix de vente auprès des
      consommateurs, mais aussi par une baisse d'un prix extrêmement important, le
      salaire, puisque les entreprises ne peuvent plus payer de gros salaires, donc
      elles font baisser les salaires. Tout va baisser de prix, et cela est bien
      évidemment très embêtant, en particulier quand vous avez emprunté.
