    text: |-
      Quand vous empruntez, vous devez rembourser votre crédit et les intérêts à
      échéance régulière, par exemple mensuellement. Le problème, c'est que vos coûts
      financiers sont fixes et que vous avez calculé ces coûts financiers par rapport
      à des revenus attendus. Si les revenus se maintiennent, votre coût financier va
      se maintenir ; si les revenus s'accroissent, relativement à vos revenus, le coût
      financier va se réduire ; mais si vos revenus baissent, alors votre charge
      financière devient plus importante. Et ça veut dire que très vite vous passez
      d'une situation saine, où vous n'êtes pas trop endetté par rapport à vos
      revenus, à une situation beaucoup moins saine, où le coût de l'endettement ne va
      cesser d'augmenter, non pas parce que vous allez plus emprunter, mais parce que
      vos revenus vont baisser. Donc ça accélère le mécanisme dépressif. La baisse
      généralisée des prix est un système qui est extrêmement mauvais pour l'économie,
      puisque les prix baissent, les prix de vente des entreprises ou des producteurs
      baissent, mais les charges financières restent, et on a d'un côté des
      producteurs pris à la gorge par les coûts financiers, les coûts fixes, qui
      n'arrivent pas à s'en sortir, et de l'autre côté les banquiers qui ont de plus
      en plus peur de voir leurs emprunteurs ne pas rembourser et qui vont arrêter de
      faire des prêts. Donc toutes les entreprises qui vont bien ne pourront plus
      emprunter pour relancer l'activité économique.
