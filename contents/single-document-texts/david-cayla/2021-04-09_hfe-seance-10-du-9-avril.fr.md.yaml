    text: |-
      La grande crise de la fin du XIXe siècle, c'est la crise de 1893 aux États-Unis,
      et en Europe elle a aussi été très grave. Elle commence un peu avant d'ailleurs
      aux États-Unis. Quand elle arrive, c'est vraiment la première grande crise du
      Nouveau Continent, la première fois qu'il y a vraiment une grosse poussée de
      chômage. Comme souvent, elle fait suite à une phase d'expansion très rapide,
      puisque l'accumulation de capital — souvenez-vous des mécanismes — fait qu'on
      accumule trop de capital, donc trop d'agents de production, puis tout d'un coup
      le capital n'est pas rentable. Cette crise est liée, comme très souvent, à la
      faillite d'une grande compagnie ferroviaire. Toutes les banques qui avaient
      investi dans cette compagnie subissent des pertes. C'est à ce moment-là qu'on va
      voir apparaître la première grande panique bancaire.
  - chunk_index: 30
    heading_path: HFE - Séance 10 du 9 avril > Les crises avant 1929
    content_token_count: 350
    text: |-
      Une panique bancaire, qu'est-ce que c'est ? C'est un moment où tout le monde se
      rue au guichet pour récupérer son argent parce qu'on a peur que la banque fasse
      faillite. À l'époque, il n'y avait pas de banque centrale américaine, donc une
      panique bancaire pouvait faire s'effondrer les banques. Vous savez qu'une banque
      centrale sert justement à refinancer les banques. Ailleurs, si vous ne le savez
      pas, je vous le dis : on ne met plus en faillite une banque en se ruant au
      guichet pour essayer de récupérer en argent liquide le montant du dépôt.
      Pourquoi on ne fait plus faillite comme ça ? Parce que la banque est soutenue
      par la banque centrale, et la banque centrale imprimera le nombre de billets
      nécessaires sans aucun souci. Donc votre banque ne fera pas faillite si tout le
      monde se rue pour récupérer son argent liquide. Mais à l'époque, il n'y avait
      pas de banques centrales aux États-Unis, donc c'était possible. On pouvait se
      retrouver à avoir plus de possibilités de retirer son argent, et c'est la raison
      pour laquelle il y avait des paniques bancaires : la panique bancaire est
      elle-même le produit du fait qu'on savait qu'on pourrait ne pas récupérer son
      argent.
  - chunk_index: 31
    heading_path: HFE - Séance 10 du 9 avril > Les crises avant 1929
    content_token_count: 489
    text: |-
      Par ailleurs, le système bancaire américain de l'époque n'est pas du tout
      stable. Il n'y a pas de banque centrale, et le dollar, la monnaie américaine,
      était à la fois adossé sur l'or et sur l'argent : c'est ce qu'on appelle un
      système bimétallique. Du coup, c'était le désordre, parce qu'on était censé
      convertir son dollar en or ou en argent, mais en fonction du cours de l'or et de
      l'argent, on pouvait convertir dans l'un ou dans l'autre, ce qui créait une
      fragilité du dollar. Tout cela crée, comme d'habitude, un credit crunch,
      c'est-à-dire un effondrement des crédits, des prêts des banques, et donc une
      incapacité pour les entreprises de se financer auprès du secteur bancaire, donc
      de financer un investissement. Si on n'arrive plus à financer ces
      investissements, c'est trop coûteux, on arrête d'investir, donc on arrête de
      produire et on arrête d'embaucher, donc on a du chômage. On n'avait pas de
      statistiques du chômage, mais on a pu les reconstruire a posteriori et essayer
      de l'évaluer : on évalue que le chômage est passé de 4 % à plus de 10 %, et
      parfois plus de 14 %, notamment dans les grandes villes, les villes
      industrielles, parce qu'à la campagne il n'y a pas beaucoup de chômage. Donc
      toute la fin du XIXe siècle, on a cette crise qui est typique d'une crise du
      capitalisme contemporain, mais aussi liée à un système financier extrêmement
      archaïque : pas de banque centrale, et une monnaie dont on ne sait plus trop sur
      quoi elle est fondée, ainsi qu'un comportement des ménages qui va vers la
      panique bancaire et qui va accentuer les crises.
