      Tout cela nous renvoie à une réflexion plus large sur l'économie, que je ne vais
      pas faire ici parce qu'on ne va plus se voir maintenant ; en tout cas on se
      verra peut-être à l'examen, s'ils passent l'examen en présentiel. C'est
      l'importance et la responsabilité des économistes. Les économistes ne peuvent
      pas considérer comme une plaisanterie une science qui est une pensée tournée
      théoriquement vers l'action, vers le conseil de gouvernement. Lorsqu'ils croient
      un peu trop en leur propre discipline et à l'équilibre, on va dire, ils peuvent
      mal conseiller le gouvernement. Donc parfois il vaut mieux penser le réel plutôt
      que de chercher à respecter les dogmes et les mantras de la pensée théorique.
