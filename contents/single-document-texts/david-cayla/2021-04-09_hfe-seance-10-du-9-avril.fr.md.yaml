      Enfin, nous dit Galbraith — c'est la dernière diapo — la raison pour laquelle il
      y a une crise et que cette crise a été profonde, c'est qu'on ne comprenait rien
      à l'économie. Là, il reprend : les républicains et les démocrates sont en train
      de dire qu'il faut l'équilibre budgétaire, l'austérité, des comptes publics,
      arrêter avec la dette. Le problème, c'est que lorsque l'État arrête de dépenser,
      arrête de s'endetter, et bien en fait il crée moins de revenus : les dépenses de
      l'État, ce sont les revenus des agents. Donc si l'État arrête de dépenser,
      toutes les entreprises, tous les ménages vont arrêter d'avoir des revenus, et ça
      va approfondir la crise. Il dit donc : ils n'ont pas compris que la question du
      budget équilibré n'était pas du tout le problème à ce moment-là. Ils n'ont pas
      compris aussi — ils ont mis du temps à comprendre — qu'il fallait supprimer les
      taux d'intérêt, les taux récessifs, c'est-à-dire limiter la création monétaire
      renchérit les taux d'intérêt, et du coup ça nourrit la spirale déflationniste.
      Il fallait donc de l'inflation. Là aussi, c'est un truc qu'on voit aujourd'hui,
      où on a du mal à trouver de l'inflation, on a une inflation extrêmement faible.
      Par contre, on a compris qu'on pouvait dépenser, que l'État pouvait dépenser en
      période de crise. Regardez ce qui s'est passé en 2020, mais on a compris en même
      temps qu'en 2008 l'Europe a été très soft, elle n'a pas vraiment fait le
      nécessaire, ce qu'ont fait les États-Unis ; d'ailleurs les Européens sont
      beaucoup moins bien sortis de la crise. Et là aussi, si vous regardez les échos
      du jour, vous verrez que Bercy, le ministère des Finances, prévoit un retour à
      l'équilibre très rapidement, des dépenses publiques. Quand vous interrogez
      l'homme de la rue, les gens disent que c'est mal, qu'il faut rétablir les
      comptes publics. Mais en fait, ce n'est pas vrai, pas en temps de crise, pas
      pour lutter contre une crise, et on n'est pas encore à la fin de cette crise-là.
