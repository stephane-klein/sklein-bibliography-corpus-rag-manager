    text: |-
      Comment fonctionne un levier dans ce cadre ? Vous avez trois types de titres que
      vous émettez. On a des actions, dont des actions ordinaires — voilà, c'est le
      premier mécanisme — mais dans ce cas-là on n'a pas de levier. Pour qu'on ait un
      levier, il faut se financer par des actions ordinaires, mais également par ce
      qu'on appelle des actions préférentielles et par des obligations. Qu'est-ce que
      c'est qu'une action préférentielle ? C'est inventé, ça existe depuis tout le
      temps, ça existe d'ailleurs encore : ce sont des actions à dividende garanti.
      Dividende garanti veut dire que quel que soit l'état de la société, vous
      bénéficierez d'un dividende garanti par la société. L'obligation, c'est un peu
      le même principe, en réalité ce n'est pas des dividendes, c'est un intérêt, mais
      de la même façon que dans l'action préférentielle, il y a un intérêt garanti.
      Donc vous devez chaque année, ou à l'échéance, recevoir vos obligations, et
      elles seront remboursées : on vous rembourse le capital et l'ensemble des
      intérêts. Le fait d'avoir à la fois des actions préférentielles et des
      obligations comme source de financement fait que ces titres ne vont pas voir
      leur valeur augmenter, puisque leur valeur est déjà décidée, déjà déterminée par
      le dividende ou l'intérêt qu'on va verser, qui est déjà contractualisé. Ce qui
      signifie une chose : si quelque chose peut gagner en valeur dans l'entreprise,
      si l'entreprise globalement gagne 50 % de sa valeur, et bien ces 50 % ne
      reposeront que sur les actions ordinaires.
