      Pour Galbraith, qu'est-ce qui est au cœur de la crise des années 30 ? Parce
      qu'en fait, ce n'est pas que le problème du krach boursier. Bien sûr, il y a des
      problèmes plus fondamentaux, pour Galbraith, qui sont au cœur de la dynamique
