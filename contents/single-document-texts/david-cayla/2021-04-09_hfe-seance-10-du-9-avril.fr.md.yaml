      qu'il fait à ce moment-là, c'est une de ses promesses : une meilleure régulation
      de la bourse et du secteur bancaire, avec la création d'une autorité de
      régulation des marchés financiers qui existe toujours aujourd'hui, la SEC,
      Security and Exchange Commission, qui a pour but de réguler, d'encadrer les
      pratiques, d'interdire et d'initier les arnaques, les faillites frauduleuses,
      etc., puisque tout ça a été vraiment au cœur du krach boursier de 1929. Et puis
      il encadre davantage les banques, notamment en séparant les banques de dépôt des
      banques d'investissement. C'est extrêmement important.
  - chunk_index: 76
