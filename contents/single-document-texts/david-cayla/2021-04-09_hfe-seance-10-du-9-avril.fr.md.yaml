      Voici ce que dit Galbraith, et je terminerai le cours là-dessus : « le rejet à
      la fois d'une politique fiscale — impôts et dépenses — et d'une politique
      monétaire, c'est-à-dire tout mettre en œuvre, la politique fiscale et la
      politique monétaire, pour agir sur l'économie, qui valait au refus de toute
      politique économique constructive de la part des gouvernements, les conseillers
      économiques avait à la fois l'unanimité et l'autorité pour forcer les chefs de
      parti à désavouer toutes les mesures possibles pour arrêter la déflation et la
      crise. Dans son genre, ce fut une réussite remarquable : le triomphe du dogme
      sur la pensée. Les conséquences en furent profondes. »
