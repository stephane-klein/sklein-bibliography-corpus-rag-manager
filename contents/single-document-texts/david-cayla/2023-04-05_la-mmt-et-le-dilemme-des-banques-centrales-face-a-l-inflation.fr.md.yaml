      pour les banques direct. Je vous l'ai dit, les banques détiennent dans leur
      bilan des actifs financiers qui sont en général des prêts qu'elles ont accordés.
      Alors bien sûr des prêts aux entreprises, aux ménages, et elles ont aussi des
      obligations publiques, des prêts à l'État. Tous ces taux d'intérêt ont été
      fondés sur les taux sans risque de l'État. Au moment où les prix des obligations
      étaient très élevés, elles ont dû racheter des créances qui sont indexées sur
      les obligations. Pour le dire simplement, elles ont prêté à des taux d'intérêt
      qui à l'époque étaient faibles. Or, vous vous souvenez que quand les taux
      d'intérêt augmentent sur les obligations publiques, ça signifie que la valeur
      des obligations baisse, et inversement. Je vous rappelle, je vous ai dit de me
      faire confiance parce que je ne voulais pas le démontrer, mais on a une relation
      inverse entre les taux d'intérêt des obligations publiques et la valeur de ces
      obligations. Quand les taux d'intérêt baissent, la valeur des obligations
      augmente. Quand le taux d'intérêt augmente, la valeur des obligations baisse.
      Mais en fait, c'est vrai pour tous les crédits, le titre obligataire qu'on
      possède, y compris des entreprises, et globalement toutes les créances. Quand
      vous avez prêté à l'époque où les taux d'intérêt étaient faibles, vous avez donc
      des valeurs des obligations qui étaient élevées. Et puis tout d'un coup les
      banques centrales commencent à augmenter leurs taux. Alors mécaniquement, ça
      fait baisser la valeur de vos actifs financiers. C'est-à-dire que dans la
      comptabilité, vous subissez des pertes. Alors ces pertes, elles sont pour
      l'instant que potentielles parce qu'elles sont réalisées quand vous vendez
      l'obligation. Mais souvenez-vous du principe de comptabilité juste au marché, au
      prix de marché : quand vous vous retrouvez avec des obligations en stock dans
      vos comptes qui ont perdu 10 % de leur valeur et que vous en avez beaucoup
      d'obligations, ça fait que vos actifs perdent en valeur. Et c'est exactement ce
