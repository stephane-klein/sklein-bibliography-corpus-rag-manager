chunks:
  - chunk_index: 0
    heading_path: La MMT et le dilemme des banques centrales face à l'inflation
    content_token_count: 133
    text: |-
      Alors, bonsoir à tous et à toutes. Nous allons donc reprendre cette dernière
      séance du cycle sur la monnaie, la dette et les crises. Dans cette dernière
      séance, je vais reprendre directement là où on s'était arrêté la dernière fois,
      c'est-à-dire à la question des contestations monétaires, de l'ouverture du champ
      de réflexion sur la monnaie qu'a entraînée la crise de 2008 et toutes les
      conséquences qu'il y a eues sur les politiques monétaires.
  - chunk_index: 1
    heading_path: La MMT et le dilemme des banques centrales face à l'inflation
    content_token_count: 183
    text: |-
      Pour faire un petit rappel, jusqu'à 2008, les politiques monétaires étaient
      dites monétaristes. On a vu le monétarisme dans la deuxième session. C'est une
      doctrine qui repose sur l'idée qu'il faut dépolitiser la gestion de la monnaie.
      C'est-à-dire que la banque centrale doit être indépendante du pouvoir politique.
      Elle doit être concentrée sur la question de la stabilité des prix. C'est
      d'ailleurs ce qui détermine le mandat de la Banque centrale européenne, mais
      également en grande partie le mandat de la Réserve fédérale et de toutes les
      grandes banques centrales : elles ont un objectif de limiter la hausse des prix,
      de limiter l'inflation.
  - chunk_index: 2
    heading_path: La MMT et le dilemme des banques centrales face à l'inflation
    content_token_count: 177
    text: |-
      Cette doctrine monétariste s'est construite dans les années 70, au moment où de
      fait l'inflation avait dérapé : on était passé à des taux d'inflation supérieurs
      à 10 % dans la plupart des pays développés. Les monétaristes disaient que cette
      inflation était due à des causes monétaires, c'est-à-dire à une création
      monétaire trop importante qui avait entraîné un surcroît de monnaie par rapport
      à la richesse achetable et qui avait donc fait augmenter les prix. C'est ce
      qu'on appelle la théorie quantitative de la monnaie. Cette théorie monétariste a
      été mise en œuvre dans les années 80 et elle est devenue dominante jusqu'à 2008.
  - chunk_index: 3
    heading_path: La MMT et le dilemme des banques centrales face à l'inflation
    content_token_count: 234
    text: |-
      Là aussi, dans d'autres séances, on a vu que la crise de 2008 était une crise
      systémique, une crise qui menaçait de faire s'effondrer l'ensemble du système
      bancaire américain et mondial. Pour faire face à cette crise, les banques
      centrales ont dû sortir de leur dogme monétariste. D'une part, elles ont baissé
      fortement les taux d'intérêt pour aider les banques, diminuer le coût de
      l'argent pour les banques et accompagner leur reprise. D'autre part, dans le
      cadre de la Réserve fédérale américaine, elles ont dû racheter des titres
      risqués qui n'avaient plus de valeur pour leur redonner un prix. Ensuite, dans
      un deuxième temps, à partir du début 2009, elles ont racheté des obligations
      publiques pour faire baisser les taux d'intérêt longs.
  - chunk_index: 4
    heading_path: La MMT et le dilemme des banques centrales face à l'inflation
    content_token_count: 248
    text: |-
      Souvenez-vous : si on veut qu'il y ait une reprise économique, il faut des taux
      d'intérêt faibles pour que les agents économiques, comme les entreprises et les
      ménages, puissent facilement emprunter, puisqu'on sait que l'emprunt est le
      moteur de la consommation et de l'investissement des entreprises. En même temps,
      en rachetant des obligations publiques, on aide aussi l'État à se refinancer, à
      se financer. Ce qui était au cœur du débat aux États-Unis en 2009, c'était le
      plan Obama, qui visait quand même à injecter 787 milliards de dollars dans
      l'économie américaine et aussi à sauver General Motors, qui était à l'époque
      quasiment en faillite. Il y a donc eu ces dépenses publiques pour résoudre la
      crise, qu'a accompagnées la Réserve fédérale, et très vite les autres banques
      centrales se sont mises à mener ces mêmes politiques.
  - chunk_index: 5
    heading_path: La MMT et le dilemme des banques centrales face à l'inflation
    content_token_count: 236
    text: |-
      Ces politiques de rachat des obligations publiques, qui sont en quelque sorte
      des politiques de manipulation des marchés financiers pour faire baisser les
      taux d'intérêt, se sont étendues à la Banque d'Angleterre, puis dans un deuxième
      temps à la Banque centrale européenne, qui n'a pas trouvé d'autres moyens pour
      résoudre la crise de l'euro des années 2011-2015. En Europe, on a une crise
      spécifique : un certain nombre de pays n'ont plus pu se financer auprès des
      marchés financiers en raison de taux d'intérêt trop importants et du fait que
      leurs obligations publiques, plus personne n'en voulait. Qu'a fait la Banque
      centrale européenne ? Elle a racheté ces obligations publiques de la Grèce,
      etc., et puis, comme elle ne peut pas mener des politiques différentes selon les
      pays, elle a commencé à racheter les obligations publiques de tous les pays.
  - chunk_index: 6
    heading_path: La MMT et le dilemme des banques centrales face à l'inflation
    content_token_count: 176
    text: |-
      Ces nouvelles politiques monétaires ont fait réfléchir les économistes. Ils se
      sont dit : finalement, la banque centrale fait des choses qu'elle n'est pas
      censée faire, mais le monde ne s'écroule pas, il n'y a pas d'inflation, parce
      qu'à l'époque, jusqu'en 2021, il y avait une inflation très faible. Pendant 12
      ou 13 ans, entre 2008 et 2021, on a mené des politiques dites de quantitative
      easing, donc de rachat d'actifs par les banques centrales, qui n'ont pas eu
      d'effet sur le niveau d'inflation, contrairement à ce que postulait la théorie
      monétariste.
  - chunk_index: 7
    heading_path: La MMT et le dilemme des banques centrales face à l'inflation
    content_token_count: 277
    text: |-
      On sait pourquoi ça n'a pas eu d'effet : le quantitative easing ne constitue pas
      en soi de la création monétaire. Souvenez-vous, ça ne fait que faire circuler,
      que transformer des actifs financiers détenus par les banques en liquidité
      détenue par les banques. Ça ne rajoute pas de la monnaie aux agents économiques
      réels. Donc il n'y a pas davantage d'argent à dépenser. Par contre, ce que ça
      permet de faire, c'est d'inciter les agents à emprunter. Mais on n'a pas eu non
      plus d'explosion des emprunts à ce moment-là. On n'a même pas eu d'explosion du
      marché immobilier, comme j'ai essayé de vous le montrer la semaine dernière. En
      fin de compte, l'objectif était d'éviter la dépression, d'éviter l'effondrement
      du crédit bancaire et l'effondrement de l'activité économique, mais il n'y a pas
      eu d'effet de spéculation, d'augmentation des dettes, malgré le très faible
      niveau des taux d'intérêt.
  - chunk_index: 8
    heading_path: La MMT et le dilemme des banques centrales face à l'inflation
    content_token_count: 307
    text: |-
      Ça aussi c'est particulier, parce que ça ne correspond pas à la théorie
      économique. Normalement, quand les taux d'intérêt deviennent très faibles, voire
      négatifs — on rappelle que le taux d'intérêt négatif, c'est lorsque le taux
      d'intérêt nominal est inférieur au taux d'inflation : on va payer un intérêt
      contractuel de 2 % par exemple, mais si l'inflation est à 3 %, c'est comme si le
      taux d'intérêt réel était négatif — malgré des taux d'intérêt réels négatifs
      jusqu'à récemment, et qui le sont encore, il n'y a pas eu d'explosion de
      l'emprunt. On peut se demander pourquoi, quand l'argent est gratuit, les gens
      n'empruntent pas tous. Parce qu'il y a des raisons pour lesquelles on ne veut
      pas ou on ne peut pas emprunter : même si on emprunte à un taux négatif, il faut
      quand même rembourser son emprunt. Il faut avoir des projets d'investissement ou
      des projets d'achat. Or, en situation d'incertitude économique, les gens n'ont
      pas forcément envie d'emprunter.
  - chunk_index: 9
    heading_path: La MMT et le dilemme des banques centrales face à l'inflation
    content_token_count: 259
    text: |-
      Souvenez-vous aussi, c'est un truc que j'ai dit : contrairement à ce que
      beaucoup de gens disent, ce n'est pas la banque qui crée la monnaie, c'est le
      crédit bancaire. Dire cela, ce n'est quand même pas tout à fait la même chose.
      Bien sûr, s'il n'y a pas de banque qui prête, il n'y a pas de crédit bancaire,
      donc il n'y a pas de création monétaire. Mais s'il n'y a pas d'agent économique
      qui emprunte, il n'y a pas plus de crédit bancaire. La création monétaire se
      fait toujours dans cette relation entre la banque et ses clients qui empruntent.
      Ce qui s'est passé après 2008-2009, c'est que malgré la très forte baisse des
      taux d'intérêt, il n'y a pas eu une très forte hausse des envies d'emprunter de
      la part des agents économiques, et donc la baisse n'a pas eu d'effet réel sur
      l'explosion de la création monétaire et du crédit.
  - chunk_index: 10
    heading_path: La MMT et le dilemme des banques centrales face à l'inflation
    content_token_count: 265
    text: |-
      Quand on regarde les chiffres de la dette globale aux États-Unis par rapport au
      PIB — on essaie de comparer le niveau de dette et le PIB, qui correspond à
      l'ensemble des revenus ; pour avoir une idée de la soutenabilité d'une dette, on
      compare le stock de dette avec les revenus moyens de l'économie, et les revenus
      moyens de l'économie, c'est le PIB — on voit que l'endettement par rapport au
      PIB aux États-Unis a atteint un pic en 2006-2007 au moment de la crise, puis
      qu'après il a un peu baissé. À l'époque, c'était 3,6 fois le PIB. Ensuite il a
      un peu baissé, puis il est resté constant. C'est-à-dire qu'il n'y a pas eu
      d'augmentation globale de l'endettement. Même si les États eux-mêmes se sont
      plus endettés, il y a eu des agents qui ont baissé leur endettement, ce qui fait
      que tout ça s'est compensé.
  - chunk_index: 11
    heading_path: La MMT et le dilemme des banques centrales face à l'inflation
    content_token_count: 241
    text: |-
      Je ne dis pas que l'État n'a pas plus de dettes aujourd'hui qu'en 2008. Bien sûr
      que les États, tous les États, ont augmenté leur dette ; quand il y a eu la
      crise du Covid, la dette publique a encore augmenté partout. Mais c'est normal :
      l'État s'est substitué aux agents économiques pour éviter que l'économie
      s'effondre. Cette hausse de la dette publique depuis 2008, manifeste dans tous
      les pays développés, a compensé une baisse de l'endettement d'autres agents
      économiques, notamment le secteur financier, qui a dû réduire son niveau
      d'endettement parce que la crise financière a conduit à changer un peu quelques
      pratiques. En fin de compte, le niveau d'endettement global n'a pas vraiment
      baissé, il n'a pas vraiment augmenté, malgré les taux d'intérêt très faibles.
      C'est un peu un rappel de ce qu'on a vu auparavant.
  - chunk_index: 12
    heading_path: La MMT et le dilemme des banques centrales face à l'inflation
    content_token_count: 97
    text: |-
      Cette réflexion sur les nouvelles politiques monétaires et le fait que la Banque
      centrale européenne est tout d'un coup devenue un agent très puissant, qui a
      commencé à faire plein de choses que normalement les banques centrales n'étaient
      pas censées faire, a conduit certains économistes à proposer de nouvelles
      théories monétaires. On les a un peu vues l'année dernière.
  - chunk_index: 13
    heading_path: La MMT et le dilemme des banques centrales face à l'inflation
    content_token_count: 327
    text: |-
      D'abord, il y a tous ceux qui voulaient que les banques centrales reviennent à
      leur théorie d'avance, c'est-à-dire tous les monétaristes un peu frustrés qui
      disent : « Regardez, si vous continuez à faire du quantitative easing, ça va
      faire exploser la spéculation, c'est de la manipulation de la monnaie, c'est
      mauvais, ça a créé de l'inflation. » On a eu évidemment beaucoup de Cassandres
      qui ont expliqué, beaucoup sur les réseaux sociaux et ailleurs, que ces
      politiques de quantitative easing, ces politiques dites non conventionnelles,
      allaient forcément engendrer une catastrophe. Mais ils ont dit ça en 2009-2010,
      et la catastrophe n'est pas venue. Ils ont continué de le dire en 2012, etc.
      Puis, au bout d'un moment, la catastrophe n'est jamais venue. L'inflation n'est
      jamais venue. Après, il y a eu l'inflation en 2021. « Regardez, je vous l'avais
      dit », mais on comprend que l'inflation de 2021-2022 peut difficilement être la
      cause directe d'une politique commencée en 2008-2009 et qui s'est prolongée
      pendant tout ce temps. Nous verrons d'ailleurs qu'il y a encore des questions
      sur les causes de cette inflation.
  - chunk_index: 14
    heading_path: La MMT et le dilemme des banques centrales face à l'inflation
    content_token_count: 341
    text: |-
      Deuxième théorie qui a commencé à émerger du fait de cette ouverture, c'est que
      l'abandon de la doctrine monétaire a entraîné de nouvelles doctrines à
      apparaître, puisqu'il faut bien trouver d'autres choses. La deuxième approche,
      ce sont ceux qui ont dit : « Annulons les dettes. Annulons les dettes détenues
      par les banques centrales. Réinjectons de la monnaie dans le système pour
      financer la transition écologique. » Je vous ai dit ce que j'en pensais. Je
      pense que c'est une théorie qui pose question, parce que l'annulation des
      dettes, ce n'est pas si simple, et puis la création de nouvelles dettes, de
      nouvelle monnaie par la banque centrale, c'est aussi une opération qui, à mon
      avis, n'est pas très pertinente, parce que, comme je l'ai dit, la banque
      centrale ne crée pas de monnaie en fait, et donc il faut toujours qu'il y ait
      des gens qui ont des investissements. Par ailleurs, la question qui se posait,
      c'est : est-ce que la banque centrale peut être un agent budgétaire ?
      C'est-à-dire quelqu'un qui, alors qu'il n'est pas responsable devant les
      représentants du peuple, peut décider comme ça de financer certains
      investissements et pas d'autres. Ça pose des problèmes démocratiques.
  - chunk_index: 15
    heading_path: La MMT et le dilemme des banques centrales face à l'inflation
    content_token_count: 240
    text: |-
      Troisième approche : la critique de ce qu'on appelle l'hélicoptère monnaie, la
      monnaie hélicoptère. L'idée que la banque centrale pourrait maintenant
      directement — c'est un peu lié à la première, mais cette fois-ci directement —
      proposer, donner de l'argent aux ménages, aux entreprises et à l'État. Là aussi,
      je vous ai dit que ça posait le même problème que la précédente : faire de la
      banque centrale un agent qui va faire plus que simplement garantir la valeur de
      la monnaie et organiser le système bancaire, mais qui va aller jusqu'à donner de
      l'argent à des gens. Du coup, se pose la question : à qui on donne, combien on
      donne, qui décide de donner ? Si c'est la banque centrale qui le fait
      souverainement, ça pose quand même des questions démocratiques. Et puis
      finalement, est-ce bien nécessaire ? C'est la même question pour la deuxième
      théorie.
  - chunk_index: 16
    heading_path: La MMT et le dilemme des banques centrales face à l'inflation
    content_token_count: 161
    text: |-
      Maintenant, je voudrais terminer ce panorama des grandes théories hétérodoxes
      par la théorie monétaire moderne, qu'on appelle en français également MMT. Mais
      MMT, c'est l'acronyme de l'anglais Modern Monetary Theory. Donc on devrait dire
      TMM en français, mais les gens disent MMT. C'est une théorie très intéressante,
      qui n'est en fait pas très nouvelle, qui existe depuis le début du XXe siècle,
      depuis Keynes et depuis Abba Lerner, qui sont des économistes du XXe siècle qui
      ont essayé de comprendre la théorie de la monnaie, la théorie monétaire sous un
      angle différent.
  - chunk_index: 17
    heading_path: La MMT et le dilemme des banques centrales face à l'inflation
    content_token_count: 256
    text: |-
      L'angle choisi, c'est celui qui consiste à dire qu'en fait la monnaie n'est
      qu'une convention sociale. Si elle n'est pas rattachée à un objet extérieur et
      si elle est endogène, c'est-à-dire qu'elle est produite par la société
      elle-même, alors on ne peut pas tomber en manque de monnaie. J'ai envie de dire
      que c'est un peu l'évidence. S'il y a des gens qui n'ont pas assez de monnaie,
      ce n'est pas qu'ils n'ont pas assez de monnaie parce qu'on peut tout à fait en
      quelque sorte imprimer de la monnaie nouvelle et puis donner de la monnaie à
      tout le monde. Qu'est-ce qui empêche finalement un État d'émettre autant de
      monnaie qu'il le souhaite jusqu'à ce qu'il comble ses besoins ? Cette question,
      au départ, est une question philosophique, et puis ça devient assez vite une
      question pratique. Si la monnaie n'est pas rattachée, alors on est totalement
      libre d'en faire ce qu'on veut.
  - chunk_index: 18
    heading_path: La MMT et le dilemme des banques centrales face à l'inflation
    content_token_count: 212
    text: |-
      Évidemment, pourquoi je dis ça ? Parce que si elle est rattachée à l'or, on ne
      peut pas faire tout ce qu'on veut. Une monnaie rattachée à l'or, c'est une
      monnaie convertible en or, en argent ou en n'importe quel métal précieux. Si
      elle est convertible, ça veut dire que quand on émet de la monnaie, à tout
      moment, la personne qui détient le billet de banque doit pouvoir — ou qui a un
      compte en monnaie dans une banque a le droit — le transférer, le convertir en
      or, cette monnaie qu'il détient. Donc si on permet aux gens de convertir leur
      monnaie en or, il faut qu'on ait des stocks d'or, et donc on est limité dans sa
      capacité de créer de la monnaie par les stocks d'or qu'on possède.
  - chunk_index: 19
    heading_path: La MMT et le dilemme des banques centrales face à l'inflation
    content_token_count: 269
    text: |-
      Il faut savoir quand même que la monnaie a très longtemps été convertible en or.
      Le principe de l'étalon-or s'est imposé au XIXe siècle dans tous les pays
      développés. Même après la Seconde Guerre mondiale, on avait un système d'étalon
      à deux niveaux où le dollar était convertible en or, et c'était vrai jusqu'en
      1971, et les monnaies européennes par exemple étaient convertibles en dollars,
      donc indirectement elles étaient convertibles en or également. Donc jusqu'en
      1971, jusqu'à ce que Nixon suspende et arrête définitivement la convertibilité
      du dollar en or, les pays occidentaux capitalistes n'étaient pas libres de faire
      ce qu'ils voulaient avec leur monnaie, puisqu'il y avait toujours ce
      rattachement à l'or qui les empêchait de créer autant de monnaie qu'ils
      voulaient. Ils devaient avoir un système bancaire qui reposait sur des réserves
      soit en or directement, soit en devises, c'est-à-dire en monnaie convertible en
      or. Ça a été local jusqu'en 1971.
  - chunk_index: 20
    heading_path: La MMT et le dilemme des banques centrales face à l'inflation
    content_token_count: 119
    text: |-
      Mais à partir du moment où il n'y a plus cette obligation d'assurer la
      conversion de la monnaie en or, on est libre d'émettre autant de monnaie qu'on
      veut. C'est cette question-là qui est la base de la théorie moderne de la
      monnaie. En poussant cette logique jusqu'au bout, on doit admettre que l'État ne
      peut pas avoir de problèmes de financement puisqu'il peut toujours se financer
      par la création monétaire.
  - chunk_index: 21
    heading_path: La MMT et le dilemme des banques centrales face à l'inflation
    content_token_count: 456
    text: |-
      Cette thèse a été exprimée par de nombreux économistes depuis très longtemps. Ce
      n'est pas une théorie nouvelle au sens strict puisque, en fait, c'est juste une
      définition de la monnaie qui est à peu près reconnue. C'est plutôt une doctrine
      différente, c'est-à-dire : qu'est-ce qu'on peut faire maintenant qu'on contrôle
      la puissance de création monétaire ? Est-ce qu'on ne peut pas faire un peu plus
      ce qu'on veut ? Cette théorie qui n'est pas une théorie, qui est une doctrine,
      qui est plutôt un regard spécifique porté sur la monnaie par les économistes, a
      été exprimée très clairement il n'y a pas très longtemps dans un livre. C'est ce
      livre-là qui est pour moi la référence, même s'il y a beaucoup d'autres ouvrages
      — je n'ai pas tout lu, j'ai lu celui-là, il est récent et il parle très
      clairement de cette théorie. C'est l'ouvrage de Stéphanie Kelton, publié en
      français en 2021, sous le titre Le mythe du déficit, aux liens qui libèrent.
      C'est un livre accessible au grand public, pas un livre très compliqué, qui est
      aussi fait pour les économistes, parce que les économistes l'ont lu. Il explique
      exactement ça : si la monnaie n'est pas convertible en or et si l'État est
      souverain monétairement, alors il ne peut y avoir aucun problème de financement
      de l'État. C'est la raison pour laquelle le livre s'intitule Le mythe du
      déficit. Le mythe du déficit, ça veut dire : il n'y a jamais de déficit. En
      fait, cette histoire de déficit est une construction théorique idéologique. Tout
      État souverain monétairement peut se financer autant qu'il le souhaite.
  - chunk_index: 22
    heading_path: La MMT et le dilemme des banques centrales face à l'inflation
    content_token_count: 255
    text: |-
      Évidemment, quand on dit les choses comme ça, ça surprend, parce que ce que dit
      Stéphanie Kelton, mais que disent aussi les économistes, c'est que quand on
      réfléchit à partir de l'État, quand on réfléchit à l'État, aux finances
      publiques, à partir d'une représentation qui est l'entreprise ou le ménage, on
      se trompe complètement. L'État n'est pas un ménage, n'est pas une entreprise.
      Pourquoi ? Parce qu'il crée la monnaie. Et donc comme il crée la monnaie — au
      sens là aussi ce n'est pas tout à fait vrai parce qu'on a dit que la monnaie est
      créée dans le cadre du crédit bancaire, etc. — mais il a un pouvoir de décider
      de sa propre monnaie et donc il ne peut pas tomber à court de financement
      puisqu'il contrôle la banque centrale qui émet la monnaie et qui elle-même
      contrôle indirectement, bien sûr, la création monétaire.
  - chunk_index: 23
    heading_path: La MMT et le dilemme des banques centrales face à l'inflation
