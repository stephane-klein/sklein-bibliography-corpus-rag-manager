      fait des pertes. En même temps, quand les taux d'intérêt augmentent, les flux
      augmentent en valeur parce qu'elles vont pouvoir prêter à des prix plus élevés.
      Mais vous voyez le souci : si on augmente trop vite les taux d'intérêt, la perte
      des stocks va être plus rapide que les gains liés aux flux, les nouveaux crédits
      qu'on va accorder à des taux plus chers. Et là se pose un problème de
      solvabilité des banques.
