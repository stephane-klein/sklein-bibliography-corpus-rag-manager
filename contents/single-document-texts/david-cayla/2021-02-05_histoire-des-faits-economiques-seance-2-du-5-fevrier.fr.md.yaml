      ensemble — à une relation abstraite — on ne se connaît pas, mais on va tous se
      retrouver à l’université pour organiser des cours —, c’est ce qu’il appelle la
      révolution cognitive. Cela nécessite, nous dit Harari, un changement profond
      dans l’architecture de notre pensée, donc dans l’architecture du cerveau.
