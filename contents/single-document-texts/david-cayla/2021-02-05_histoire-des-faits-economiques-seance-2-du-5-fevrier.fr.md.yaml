      relire, voir notamment les annotations, parce que je corrige toujours en faisant
      des annotations. En ayant la correction, vous comprendrez, j’espère, vos
      erreurs. Ça vous sert, même si vous avez une mauvaise note, et même si vous avez
      une bonne note : tout le monde fait des erreurs, puisqu’il n’y a pas de note
      au-dessus de 18,5, je crois, c’est la meilleure note. Donc même les meilleurs
      auraient pu s’améliorer. Je pense que c’est bien pour ceux qui passeront la
      seconde session. C’est utile aussi de voir un peu comment vous pouvez
      progresser. Souvent, vous pouvez progresser dans l’expression écrite, dans la
      clarté de votre expression écrite, parce que parfois vous avez une idée en tête
      et vous en écrivez une autre. J’étais assez souple, par exemple, sur les
      définitions : je ne vous demandais pas d’avoir une définition parfaite. Quand
      vous donniez l’essentiel de l’idée, je mettais les points qu’il fallait. Là où
      ça devient plus compliqué, c’est lorsqu’il faut faire des raisonnements. Et bien
      sûr, il y a des étudiants qui ne connaissaient pas le cours, donc forcément ça a
