      Deuxième loi fondamentale de l’agriculture : plus vous faites des progrès de
      productivité du travail, moins vous avez besoin de main-d’œuvre pour produire
      votre nourriture. Donc plus le taux d’urbanisation de la société va se
      développer. Je répète : plus vous augmentez la productivité du travail, moins
      vous avez besoin de main-d’œuvre pour produire de la nourriture. Et donc si vous
      avez moins de main-d’œuvre pour produire la nourriture, cette main-d’œuvre, elle
      va aller où ? Elle ne sert à rien dans la campagne ; elle va aller là où il y a
      une activité non agricole, dans les villes. Donc vous allez avoir votre taux
      d’urbanisation de la société qui va augmenter. S’il y a plus de gens dans les
      villes, il y a plus de produits non agricoles, et donc on va avoir plus de plein
      d’autres choses que des produits alimentaires. C’est ça qui va être la base de
      nos sociétés actuelles, c’est ça qui va permettre l’industrialisation. On verra
      que l’industrialisation est possible que si vous avez une main-d’œuvre embauchée
      dans l’industrie, c’est-à-dire des gens qui ne produisent pas la nourriture.
      Donc il va falloir des progrès dans l’agriculture au niveau de la productivité
      du travail. Par contre, si vous augmentez, si vous multipliez les rendements
      agricoles, vous augmentez la masse globale de la population, mais vous
      n’augmentez pas forcément la taille des villes. Elle va augmenter en proportion
      de la taille de la population. Le taux d’urbanisation, lui, va augmenter par
      lui-même. Donc ces deux progrès extrêmement importants dans la culture — la
      hausse des rendements et la hausse de la productivité — il ne faut pas les
      confondre. Ils n’ont pas du tout les mêmes effets socialement. C’est la raison
      pour laquelle il faut absolument les distinguer. On le fera : on s’amusera à
      regarder, pour chaque innovation, est-ce qu’elle augmente les rendements ou
      est-ce qu’elle augmente la productivité du travail ? Est-ce qu’elle va augmenter
      la taille de la population ou est-ce qu’elle va augmenter la structure de cette
      population entre urbains et ruraux ? Aujourd’hui, la majorité des gens vivent en
      ville, y compris dans une petite ville — on dit que 1 000 habitants c’est une
      ville. Vous voyez bien que la majorité des gens ne travaillent plus la terre. Il
      y en a encore, mais la plupart vivent en ville. Même les agriculteurs peuvent,
