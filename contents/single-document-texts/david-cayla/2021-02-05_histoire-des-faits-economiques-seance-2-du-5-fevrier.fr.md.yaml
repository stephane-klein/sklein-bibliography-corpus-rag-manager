      personne dans les sociétés préagricoles, alors qu’il faut 1 000 à 1 300 heures
      pour nourrir une population agricole. Aujourd’hui, on travaille encore plus
      d’ailleurs, en passant. Enfin, en moyenne, on ne travaille pas plus, parce que
      collectivement on travaille beaucoup moins : on ne travaille pas quand on est
      vieux, on a beaucoup de gens au chômage, mais si vous prenez un actif salarié,
      il travaille quand même plus que 1 300 heures par an, plutôt genre 1 600. On
      n’est pas très loin. Bref, tout ça pour dire que Cohen se pose la question de
      savoir pourquoi on est passés à l’agriculture dans ce cas-là. Pourquoi les
      sociétés humaines ont-elles choisi un système qui en fait les oppresse
      davantage, qui les fait plus travailler et qui les nourrit moins bien ? Certes,
      les sociétés agricoles vont avoir un avantage que n’ont pas les sociétés du
      paléolithique : c’est là qu’on a pu progresser. Il y avait des progrès dans la
      chasse, j’ai parlé de l’arc tout à l’heure, mais on va dire que la culture
      permet de développer et de multiplier les occasions de progrès, et du coup
      d’arriver à une société où aujourd’hui on se trouve peut-être mieux que si on
      était des chasseurs-cueilleurs du paléolithique — encore que tout cela se
      discute. C’est difficile de dire ce qui est mieux pour l’être humain. Mais
      concrètement, il y a clairement une régression à tous les points lorsque l’on
      passe du paléolithique au néolithique.
