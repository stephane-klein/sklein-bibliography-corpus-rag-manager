      D’abord un mot sur cet examen. Globalement, je suis quand même très content de
      vous. La moyenne est à 7 sur 20. Ça peut vous faire un peu peur, mais c’est
      meilleur que l’année dernière et bien meilleur qu’il y a deux ans, puisqu’on
      était à 5,5 sur 20. L’année dernière, on était à 6 ou 6,3, quelque chose comme
      ça. Donc c’est un peu mieux. Je parle ici des L1 économie-gestion et double
      licence. C’est nettement meilleur. Évidemment, ça fait partie du décor :
      l’examen le plus difficile. Il y a aussi énormément d’étudiants qui ont de très
      mauvaises notes en D2 ou D1, donc ça va beaucoup baisser la moyenne. La plupart
      de ceux qui ont travaillé ont, à mon avis, pour beaucoup des notes au-dessus de
      10. Si vous avez plus de 8, si vous n’êtes pas très loin, vous pouvez rattraper
      avec le cours d’été. Donc globalement, c’est bien, c’est un peu mieux que les
      années précédentes. Je ne dirai pas que le confinement vous fait du bien, mais
      tout de même, vous n’êtes pas pris de retard. Les deux raisonnements sont bien
      maîtrisés, bien connus, peut-être pas par la majorité, mais par un bon tiers
      d’entre vous, ce qui est quand même très rassurant.
