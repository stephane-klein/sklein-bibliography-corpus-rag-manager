    text: |-
      Pourquoi je veux parler de cette analyse ? Aussi parce que j’ai trouvé cela
      intéressant quand j’ai eu ce cours en première année, puisque c’était mon
      enseignant. Je vous montre le bouquin : Jean-Pierre Dozon, *Histoire des faits
      économiques et sociaux*. C’est un bouquin que j’avais acheté parce que j’avais
      adoré le cours. J’avais adoré ce prof. J’ai acheté le livre d’occasion, et en
      fait j’avais préféré son cours à son livre. Son livre est assez petit, mais il
      donne les bases de l’analyse marxiste de l’histoire. Ce n’est pas ça qui nous
