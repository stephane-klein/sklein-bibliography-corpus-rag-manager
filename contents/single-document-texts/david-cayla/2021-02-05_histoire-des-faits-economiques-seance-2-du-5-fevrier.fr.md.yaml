      Cette agriculture va laisser sa place ensuite à un autre type de culture, qui
      est la culture de la Grèce de l’âge du fer. La spécialité de la Grèce, la
      transition entre la civilisation mycénienne et la civilisation grecque, c’est
      une rupture de civilisation : elle maîtrise le fer. L’âge du fer est considéré
      dans l’histoire comme un tournant socio-économique important, parce que le fer
      est compliqué à acquérir et à manier, et qu’en plus il produit des armes
      extrêmement puissantes. Par ailleurs, il est beaucoup plus abondant que le
      bronze, qui est un alliage de cuivre et d’étain et qui est plus difficile à
      trouver. Le fer est beaucoup plus fréquent. Donc des civilisations qui trouvent
      le fer sont plus puissantes militairement, plus efficaces économiquement, et ont
      un niveau technologique plus élevé. Le problème du fer, c’est d’être capable de
      transformer le minerai brut en minerai de fer, puis en fer, et ensuite de faire
      des armes ou des choses comme ça. La température de fusion du fer est tellement
      élevée — on parle de 1500 degrés — que c’est très difficile à produire. Je vais
      vous montrer une petite vidéo après, puis on va terminer le cours sur cette
      structure. Le problème de la production métallurgique, c’est que dans la nature
      le fer pur n’existe pas, sauf dans les météorites. Ça arrive parfois, mais en
      général vous trouvez toujours du fer mélangé à plein de choses. C’est en fait
      une roche métallurgique, un minerai : une roche avec des éléments de fer. Si
      vous voulez dissocier le fer de la roche, comment faites-vous ? Vous faites
      chauffer jusqu’à atteindre la température de fusion du fer. La partie qui a
      passé le fer va s’écouler. Parfois une partie de la roche aussi va fondre. Si
      vous arrivez à une terre, quelque chose de très fin, toutes les choses qui vont
      brûler, tout le minerai est composé de plein de choses différentes, mais le fer
      va être plus dense, donc il va tomber au fond. Donc tout le problème de la
      sidérurgie, la métallurgie du fer, c’est d’être capable d’atteindre la
      température de fusion du fer, qui est de plus de 1500 degrés. C’est très
      difficile à faire. Comment fait-on ? On va construire un four spécial, qui est
      isolé — souvent fait en briques, en terre —, pour garder la chaleur. On va le
      faire quasiment totalement et l’alimenter par le bas jusqu’à ce que les flammes
      montent, en mettant beaucoup de bois. On n’a pas d’autre choix à ce moment-là.
      Jusqu’à atteindre une température de plus de 1500 degrés, qui permet de faire
      fondre le fer et donc de dissocier la roche du fer. Parce qu’en fait le fer va
      être en bas : il va s’écouler parce qu’il est plus dense. On aura la paix après
      avoir nettoyé. Ce four qu’on va faire, on ne va pas pouvoir l’utiliser plusieurs
      fois : on va le faire, mais complètement. Le fer sera dedans. Ensuite, on le
      casse, et on récolte le minerai, maintenant le fer purifié. Jamais totalement
      purifié, mais suffisamment purifié pour pouvoir faire des armes.
