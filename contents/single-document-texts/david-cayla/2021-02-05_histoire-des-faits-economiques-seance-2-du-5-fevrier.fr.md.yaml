      Deuxième chose sur les corrections de copies. Je vais essayer d’organiser dans
      des amphis, sans doute en fin de journée, des séances de remise des copies, de
      consultation des copies, de correction. Je ferai d’abord une correction,
      peut-être simplement sous forme d’une vidéo, et ensuite je vous permettrai de
      regarder vos copies. Sauf que je ne vais pas pouvoir inviter tout le monde : il
      faudra sans doute vous inscrire, parce qu’on est limité à 50 étudiants. On
