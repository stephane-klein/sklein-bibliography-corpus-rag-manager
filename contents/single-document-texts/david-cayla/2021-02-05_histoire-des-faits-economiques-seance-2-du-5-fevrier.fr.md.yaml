  - chunk_index: 4
    heading_path: Histoire des faits économiques - séance 2 du 5 février > Informations sur l’examen
    content_token_count: 800
    text: |-
      Une dernière remarque sur cet examen, sur la question de la monnaie, de la
      création monétaire et de la manière dont la banque centrale contrôle la création
      monétaire. J’ai été parfois surpris de retrouver dans vos copies des concepts
      que je n’ai pas vus, que je n’ai pas dits. Je ne les ai pas dits pour une raison
      simple : ce sont des concepts très idéologiques, qui pour moi sont faux
      aujourd’hui dans la pensée économique. Parmi ces concepts, il y a l’idée et
      l’image fausse de la planche à billets. Je n’en ai pas parlé. Je n’ai pas dit
      que la banque centrale crée de la monnaie fiduciaire ; j’ai dit qu’elle émettait
      la monnaie fiduciaire, et ce n’est pas tout à fait la même chose. J’ai aussi vu
      des expressions très idéologiques, notamment l’idée de système de
      dépôts-crédits. Je n’ai jamais employé cette expression, et pour cause : ce
      n’est pas comme ça. Les crédits ne sont pas créés à partir de dépôts. J’ai aussi
      vu « système de réserves fractionnaires », expression que je n’ai jamais
      employée. En fait, j’ai souvent vu « planches à billets », « réserves
      fractionnaires », « système dépôts-crédits » dans les mêmes réponses. J’en
      déduis que beaucoup d’entre vous, notamment en double licence droit-économie,
      avez vu soit une vidéo, soit un document qui expliquait la création monétaire,
      et que vous vous êtes appuyés là-dessus plutôt que sur mon cours pour décrire la
      création monétaire. Je ne vous ai pas mis zéro, bien sûr : il y a des choses
      justes dans ce que vous avez vu. Mais il faut bien comprendre que ces questions
      sont des questions sur lesquelles les économistes ne sont pas tous d’accord.
      Vous avez tout à fait le droit, et c’est même très bien, d’aller voir d’autres
      analyses sur la monnaie et de compléter le cours par des documents extérieurs.
      Mais faites attention à ce que ce qui est dit dans le cours et ce qui est dit
      dans le document ou la vidéo soit la même chose. Parce que le problème, c’est
      que vous allez me dire des choses qui, de mon point de vue, ne sont pas exactes,
      et vous ne dites pas des choses que moi j’ai dites. Notamment, ce que j’ai
      utilisé pour expliquer la création monétaire, c’est que ce sont plutôt les
      crédits qui font les dépôts, plutôt que les dépôts qui font les crédits. C’est
      une analyse. Quand vous dites l’un, vous ne dites pas l’autre, donc il y a des
      choses contradictoires. Je reviendrai sur ces choses-là. Clairement, sur la
      monnaie, il y a un document qui a circulé en droit, en éco et aussi en licence
      classique, et beaucoup d’étudiants se sont focalisés sur ce document en oubliant
      un peu le cours. C’est dommage, d’autant plus que les cours sont enregistrés.
      J’arrête là sur l’examen. Je vois que vous êtes 56, et pas mal : ça fait quand
      même pas beaucoup. J’imagine que les autres regarderont en différé.
  - chunk_index: 5
    heading_path: Histoire des faits économiques - séance 2 du 5 février > Retour sur l’analyse marxiste de l’histoire
    content_token_count: 850
    text: |-
      Je reprends le cours. Nous avions terminé, dans l’introduction, l’analyse
      marxiste de l’histoire. Pourquoi je vous parle de l’analyse marxiste de
      l’histoire ? Parce que c’est une analyse assez intéressante, qui décrit les
      ruptures et les évolutions des systèmes économiques, et qui montre bien — c’est
      son intérêt à mon avis — quelque chose qu’il faut toujours garder en tête : il y
      a toujours un lien entre le système économique d’un côté et le système politique
      institutionnel de l’autre. Ce lien est double : c’est l’infrastructure
      économique qui, en quelque sorte, engendre des classes sociales, et ces classes
      sociales engendrent un système institutionnel qui va les organiser
      politiquement, gérer non plus le rapport entre les hommes et la nature, mais le
      rapport des hommes entre eux. On voit aussi chez Marx cette espèce de
      dialectique, c’est-à-dire ce mouvement contradictoire entre le système
      politique, qui finit par devenir un peu autonome, qui finit par s’organiser
      selon ses propres valeurs, et le système d’infrastructures économiques, qui lui
      aussi évolue par l’intermédiaire des technologies. Le problème, c’est que ces
      deux systèmes — l’infrastructure en dessous, la superstructure au-dessus —
      évoluent de manière à la fois autonome et dépendante. Il y a une dépendance des
      deux. Donc quelque part, on va parfois se retrouver face à une contradiction
      entre l’infrastructure et la superstructure, contradiction qui va entraîner des
      révolutions. C’est ça qui est intéressant dans l’analyse de Marx : il a une
      vision dynamique des transformations des systèmes économiques, et pas une vision
      statique où on dirait « l’économie, c’est ça, point barre », puis « les lois de
      l’économie sont ainsi, elles se perpétuent et existent indépendamment des
      institutions sociales, politiques et juridiques ». Clairement, ce n’est pas le
      cas. Le marché, on va le voir, est un des éléments très importants du deuxième
      chapitre : le marché n’est pas un système naturel, c’est un système organisé,
      coordonné par les institutions politiques, par les lois, par les règles, etc.
      Créer une économie de marché, par exemple, ça ne vient pas spontanément ; ça
      vient par des institutions. Une chose qui a permis de le voir, c’est lorsque les
      systèmes communistes se sont effondrés et qu’il a fallu passer au capitalisme :
      toute une phase de transition a été très brutale pour les gens, parce que toutes
      les anciennes règles ne valaient plus et qu’il fallait en trouver d’autres. Cela
      a entraîné aussi un effondrement économique avant une reprise. Il y a eu dix à
      quinze ans d’effondrement entre 1990 et 2000, un effondrement qui a duré plus de
      trois ans, puis une lente reprise. Mais le nouveau système capitaliste a mis du
      temps à se mettre en place. Tout cela démontre que l’économie de marché n’est
      pas un système naturel, c’est un système institutionnalisé. Il faut comprendre
      cette idée : il y a une forme de corrélation entre le système économique et le
      système politique. Il n’y a pas une économie autonome d’un côté et un système
      politique autonome de l’autre. C’est ça qu’il faut bien comprendre.
  - chunk_index: 6
