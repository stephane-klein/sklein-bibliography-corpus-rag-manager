      suis rentrée en première année, donc ça fait un bout de temps. J’avais beaucoup
      aimé les cours de ce prof, qui s’appelait — je ne sais plus exactement — et
      c’était un cours d’histoire des faits économiques et sociaux.
  - chunk_index: 7
    heading_path: 'Histoire des faits économiques - séance 2 du 5 février > L’approche libérale de l’histoire : Francis Fukuyama'
    content_token_count: 414
    text: |-
      On a vu l’analyse marxiste, mais je vous propose de voir maintenant l’approche
      libérale de l’histoire. Cette approche est très bien représentée par un
      chercheur, politologue — ce n’est pas un économiste —, analyste et aussi
      historien : Francis Fukuyama. Il est né en 1952 et, à la fin des années 80, il
      publie un certain nombre d’articles puis un livre qui s’intitule *La fin de
      l’histoire*. Sa thèse est assez simple. Il constate à la fin des années 80 un
      basculement dans un certain nombre de pays, notamment des pays d’Amérique latine
      qui étaient souvent des dictatures militaires pour beaucoup d’entre eux — le
      Brésil, l’Argentine, le Chili, etc. — et qui progressivement changent leur
      modèle et arrivent vers la démocratie. Puis, en 1989-1990, il y a la chute du
      mur de Berlin et la transition des pays communistes. Il en déduit une loi :
      finalement, l’histoire aura été pendant très longtemps la recherche du meilleur
      système politique et économique. On est passés par des empires, de petites
      communautés autonomes de chasseurs-cueilleurs, des royaumes, des États-nations,
      des systèmes communistes, fascistes, corporatistes, etc. Et Fukuyama nous dit
      qu’on a fini par arriver à un système qui est le plus stable : le système de la
      démocratie libérale. En gros, l’idée de Fukuyama, c’est que les systèmes
      politiques ont été plein dans l’histoire, mais qu’ils ont tendance à converger
      vers un système unique, celui de la démocratie libérale.
  - chunk_index: 8
    heading_path: 'Histoire des faits économiques - séance 2 du 5 février > L’approche libérale de l’histoire : Francis Fukuyama'
    content_token_count: 460
    text: |-
      C’est évidemment une thèse très forte, très contestée et très contestable, parce
      que ça voudrait dire que tous les peuples du monde finiront un jour ou l’autre
      par arriver à la démocratie libérale. Pour appuyer sa thèse, Fukuyama dit la
      chose suivante : la raison pour laquelle tout converge vers la démocratie
      libérale, c’est que c’est le système le plus stable. C’est-à-dire qu’une fois
      qu’un pays se trouve dans une situation de démocratie libérale, il reste dans ce
      système. Une fois que la démocratie est complètement instituée, il n’y a jamais
      de retour en arrière. Alors que le système communiste s’effondre, les dictatures
      militaires, fascistes, s’effondrent, les royaumes périclitent, les empires
      s’effondrent, mais la démocratie libérale, non. Il en conclut une idée assez
      simple : tous ces changements, ces révolutions, ces changements de système
      politique sont instables, et quand on arrive à des démocraties libérales, elles
      deviennent stables. Donc, une fois qu’elles deviennent stables, elles restent
      telles qu’elles sont, et on ne revient plus en arrière vers de nouveaux royaumes
      ou d’autres choses. Cette « fin de l’histoire » que professe Fukuyama ne veut
      pas dire la fin des événements historiques : plus de pandémies, plus de guerres
      — puisqu’il y a des guerres entre démocraties libérales. Ça veut simplement dire
      qu’il y aura une convergence, que ça prend du temps, mais qu’au final il y aura
      convergence vers des formes de démocratie, qui pourront être différentes d’un
      pays à l’autre, mais qui auront toutes l’aspect de la démocratie libérale
      capitaliste.
  - chunk_index: 9
    heading_path: 'Histoire des faits économiques - séance 2 du 5 février > L’approche libérale de l’histoire : Francis Fukuyama'
    content_token_count: 301
    text: |-
      Évidemment, il s’appuie sur l’idée qu’il n’y a aucune démocratie libérale
      instituée qui a finalement renoncé à son système de démocratie libérale. C’est
      ça, la thèse qu’il défend : une fois qu’on arrive à un système de démocratie
      libérale, c’est un régime tellement stable qu’il se perpétue, qu’il ne change
      pas. Mais cette thèse n’est pas toujours vraie. C’est vrai que, surtout écrit en
      1990, on avait du mal à l’époque à voir l’exemple d’une démocratie libérale qui,
      sous des coups, aurait sombré dans le nazisme ou le fascisme. Bien sûr, on a des
      exemples : la république de Weimar en Allemagne, qui va sombrer dans le nazisme,
      ou la monarchie constitutionnelle italienne, qui va sombrer dans le fascisme.
      Mais Fukuyama dirait qu’on n’avait pas encore une démocratie vraiment établie,
      que ce n’étaient pas des régimes et des institutions suffisamment solides, et
      que c’est la raison pour laquelle elles ont été perverties en fascisme. Donc,
      pour Fukuyama, il faut des institutions établies.
  - chunk_index: 10
    heading_path: 'Histoire des faits économiques - séance 2 du 5 février > L’approche libérale de l’histoire : Francis Fukuyama'
    content_token_count: 922
    text: |-
      Il y a cependant un contre-exemple très connu. Je vous interroge : avez-vous une
      idée d’un pays qui a été pendant des décennies une démocratie libérale stable et
      qui a sombré dans une dictature, ou dont le système s’est effondré ? En général,
      les étudiants cherchent et ne trouvent pas. C’est vrai qu’on n’a pas un recul
      énorme sur les démocraties libérales. Les toutes premières démocraties
      libérales, ce sont vraiment les États-Unis d’Amérique, avec la Constitution — je
      ne sais plus quand elle est faite, à ne pas confondre avec la Déclaration
      d’indépendance de 1776. C’est la plus ancienne et la plus stable démocratie
      libérale au monde. On sait aussi qu’il y a le Royaume-Uni, mais il n’était pas
      dans une véritable démocratie à la fin du XVIIIe siècle : il a fallu supprimer
      le suffrage censitaire, etc. Et puis il y en a une qui a existé pendant des
      décennies et qui s’est effondrée. C’est la France. La France, de 1870, à la
      suite du second Empire, de la défaite contre les Prussiens, etc., établit la
      Troisième République. Cette Troisième République va durer près de soixante-dix
      ans. C’est un régime politique extrêmement stable, évidemment contesté par des
      ligues fascistes dans les années 30, mais qui va s’effondrer après la défaite
      contre l’Allemagne en 1940, avec les pleins pouvoirs à Pétain et un régime qui
      ne devient plus du tout libéral, et plus du tout démocratique : un régime
      fasciste en réalité, même s’il y a différentes formes de fascisme. Le régime de
      Pétain, de Vichy, c’est bien de cela qu’il s’agit. Donc là, on a quand même un
      exemple de démocratie instaurée depuis longtemps, depuis plus d’une génération,
      où beaucoup de gens sont dans un système républicain, et qui s’autodétruit en
      quelque sorte. On pourra dire : oui, mais ce n’est pas elle qui s’est détruite
      toute seule, c’est à cause de l’invasion allemande. Mais déjà en 1990, quand
      Fukuyama sort son bouquin, on pouvait voir qu’il y avait eu des contre-exemples,
      et qu’en réalité des régimes de démocratie libérale stables et durables dans le
      temps, il n’y en a pas eu tant que ça. Si on a déjà un contre-exemple alors
      qu’on n’a qu’une poignée de pays qui ont vraiment eu des démocraties libérales,
      c’est peut-être que la thèse n’est pas complètement vraie. Aujourd’hui, on voit
      bien que les choses sont plus compliquées. Par exemple, si vous prenez la
      Turquie : ça a été quand même une république pendant longtemps. Était-ce une
      démocratie libérale stable ? On peut discuter du caractère très libéral et très
      démocratique de la Turquie, mais on voit bien un durcissement du régime. On peut
      le voir aussi peut-être dans d’autres pays, une forme de durcissement. Il y a un
      classement des démocraties dans le monde par *The Economist* ; la France a
      rétrogradé : elle était une démocratie parfaite, elle devient une démocratie
      imparfaite. Donc l’idée qu’une démocratie libérale est forcément stable et ne
      change jamais, qu’elle est en quelque sorte l’aboutissement de l’histoire des
      systèmes sociaux et politiques, est une idée assez contestable et contestée.
  - chunk_index: 11
    heading_path: 'Histoire des faits économiques - séance 2 du 5 février > L’approche libérale de l’histoire : Francis Fukuyama'
    content_token_count: 850
    text: |-
      J’ai vu qu’il y avait une remarque, je vais voir ce que c’est. Oui, bien sûr, on
      a eu après la Révolution française un passage à une démocratie, puis un retour à
      la monarchie. Oui, mais attention : encore une fois, on parle de démocratie
      stable. Lorsqu’on est en pleine période révolutionnaire, on a eu la Première
      République, la Deuxième République, etc. On n’est pas dans une démocratie
      instituée. C’est ça qu’il faut bien comprendre. C’est pour ça qu’on a du mal à
      trouver des exemples : en fait, les démocraties libérales instituées, on peut
      dire que l’Europe, en tout cas l’Europe occidentale, est une démocratie durable
      et instituée. Pensez par exemple que pour l’Europe de l’Est, ce n’est pas le
      cas, parce qu’ils sont démocratiques depuis 30 ans. Donc on n’a pas un énorme
      recul. Mais l’Allemagne, on peut dire qu’aujourd’hui c’est une démocratie
      instituée. Si l’Allemagne devait retomber dans une autre forme de système
      politique, clairement ça serait un contre-exemple. Mais même la Hongrie
      aujourd’hui, qui ne respecte pas totalement l’État de droit, on pourrait dire :
      oui, mais finalement cette démocratie n’est pas si ancienne que ça et pas si
      instaurée. C’est vrai qu’ils n’ont que trente ans de démocratie. Il faut penser
      à l’échelle en termes de générations : quand vous avez des gens qui ont vécu
      dans une démocratie, qui sont construits politiquement dans une démocratie, en
      général, nous dit Fukuyama, ils ne reviennent pas en arrière, ils ne soutiennent
      pas des monarchies, des empires, des fascismes, etc. Mais ce n’est pas si bref.
      C’est ça que je veux dire : cette thèse n’est pas vérifiée, elle est débattue,
      et elle est aujourd’hui très critiquée. Pensez par exemple à ce qui s’est passé
      avec l’invasion du Capitole il y a quelques semaines. Ce n’est pas une
      démocratie qui fait rêver : le peuple qui se révolte, qui va envahir le
      parlement américain. Bien sûr, les États-Unis ne sont pas sombrés dans le
      fascisme après cet épisode, mais on voit bien que la démocratie n’est pas si
      solide, qu’elle peut avoir des fragilités. Donc l’idée qu’un jour on puisse
      revenir en arrière sur un autre type de régime n’est pas totalement aberrante.
