      Pourquoi ? Harari dit la chose suivante : il y a eu une révolution cognitive
      dans un groupe d’*Homo sapiens*. Cette révolution conduit, dit Harari, à
      l’acquisition de l’abstraction. Voici sa thèse. Je vous la livre, puis vous
      verrez, vous lirez son livre si ça vous intéresse, c’est très intéressant. C’est
      une thèse qui n’est pas démontrable, parce qu’on ne saura jamais comment les
      choses se sont passées réellement : on n’a pas de supports écrits, pas de
      preuves tangibles. Pourquoi dit-il cela ? En fait, il y a quelque chose qui
      s’est passé : les capacités du cerveau n’ont pas changé, mais on est passé de
      l’état animal à l’état humain. Qu’est-ce que la différence entre l’état animal
      et l’état humain ? C’est la capacité d’abstraction. L’abstraction, on la voit
      par l’apparition de peintures, d’objets qui sont plus figuratifs ou qui vont
      au-delà du figuratif, qui sont des représentations de choses et d’idées. Harari
      dit que les sociétés humaines primitives, qui avaient exactement les mêmes gènes
      que nous — pas plus bêtes, pas plus intelligentes —, communiquaient avec des
      semblables qui se connaissaient et s’organisaient autour de quelques dizaines
      d’individus qui pouvaient entretenir des relations suivies les uns avec les
      autres. Au-delà de quelques centaines, on ne se connaît plus, on ne peut plus
      faire confiance, donc on ne peut plus collaborer. Donc les tribus humaines,
      c’est quelques dizaines, quelques douzaines, mettons cent personnes maximum, qui
      collaborent parce qu’ils se connaissent directement. Mais quand on a cette
      révolution cognitive — Harari dit que c’est 10 000 ans avant Jésus-Christ ? Non,
      il parle de quelque chose qui se passe avant — on va retrouver effectivement des
      éléments d’abstraction. On va collaborer avec nos semblables non pas sur le
      rapport humain personnel qu’on a avec eux, mais par rapport à un mythe qu’on
      construit et qui nous rassemble. Qu’est-ce que c’est que ce mythe ? C’est une
      idée : on existe, on partage quelque chose qui n’est pas les relations vécues,
      quelque chose de tangible, mais quelque chose d’abstrait. Par exemple : on est
      la tribu des Français, en France. Donc même si on arrive à collaborer tous dans
      ce pays qu’est la France, parce que tous on s’identifie, on se représente des
