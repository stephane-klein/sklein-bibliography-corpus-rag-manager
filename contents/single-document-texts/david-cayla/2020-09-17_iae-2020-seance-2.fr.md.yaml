chunks:
  - chunk_index: 0
    heading_path: IAE 2020   Séance 2
    content_token_count: 153
    text: |-
      Nous avons ici des facteurs de production territoriaux qui expliquent sans doute
      les raisons pour lesquelles certains territoires sont plus performants dans la
      manufacture, dans l'industrie, que d'autres. Qu'est-ce qui explique, par
      exemple, la performance de l'Allemagne par rapport à celle de la Grèce ? Le cœur
      du problème nous est en partie expliqué par un économiste très ancien, ce qui
      est intéressant : cette théorie ne vient pas vraiment de moi. Elle est appliquée
      ici à la question européenne, mais c'est en fait une vieille théorie qui date de
      la fin du XIXᵉ siècle.
  - chunk_index: 1
    heading_path: IAE 2020   Séance 2 > La théorie d'Alfred Marshall et la localisation industrielle
    content_token_count: 171
    text: |-
      Alfred Marshall, cet économiste britannique, dans son grand manuel, *Principes
      d'économie politique* (publié pour la première fois en 1890), va essayer de
      comprendre la manière dont l'industrie fonctionne. Il faut bien comprendre que
      l'industrie n'est pas une activité économique anodine. C'est une activité de
      transformation de matières premières en produits finis. Cela signifie qu'on a
      besoin de matières premières ou de produits déjà finis, de ce qu'on appelle les
      *inputs* et la consommation intermédiaire. Il faut donc du matériel, mais
      surtout, on a besoin de la main-d'œuvre.
  - chunk_index: 2
    heading_path: IAE 2020   Séance 2 > La théorie d'Alfred Marshall et la localisation industrielle
    content_token_count: 172
    text: |-
      Une autre caractéristique de l'industrie est que sa localisation n'est pas
      déterminée par les consommateurs. Si vous prenez les services, par exemple, un
      supermarché est bien obligé de s'installer près de là où les gens vivent, car on
      ne va pas faire mille kilomètres pour aller faire ses courses. À l'inverse, une
      usine peut être installée un peu où l'on veut, puisque de toute façon on va
      pouvoir vendre les produits qu'on a fabriqués n'importe où dans le monde, après
      un peu de transport. La localisation de l'entreprise n'est pas déterminée de la
      même façon dans l'industrie que dans les autres activités.
  - chunk_index: 3
    heading_path: IAE 2020   Séance 2 > La théorie d'Alfred Marshall et la localisation industrielle
    content_token_count: 144
    text: |-
      Prenons un autre exemple : le secteur primaire. On ne va pas concentrer toute
      l'agriculture de l'Europe dans un seul territoire, parce que la culture
      nécessite beaucoup d'espace. Elle est donc répartie dans tous les espaces
      cultivables de l'Union européenne. Mais l'industrie, ce n'est pas le cas. Pensez
      au smartphone, par exemple. Quasiment tous les smartphones, aussi bien les
      Samsung que les Apple, sont assemblés en ligne dans quelques usines chinoises,
      et ce sont les mêmes smartphones que ceux vendus dans le monde entier.
  - chunk_index: 4
    heading_path: IAE 2020   Séance 2 > La théorie d'Alfred Marshall et la localisation industrielle
    content_token_count: 78
    text: |-
      Cela signifie que du point de vue de l'activité, la performance économique est
      plus intéressante si l'on concentre l'activité dans un seul lieu. L'industrie
      est ensuite exportée partout dans le monde, plutôt que d'installer des usines un
      peu partout à l'endroit où l'on vend.
  - chunk_index: 5
    heading_path: IAE 2020   Séance 2 > La théorie d'Alfred Marshall et la localisation industrielle
    content_token_count: 116
    text: |-
      La production automobile, en revanche, va plutôt se faire à l'échelle
      continentale. On assemble les voitures vendues en Europe en Europe, celles
      vendues au Japon au Japon, et celles vendues aux États-Unis aux États-Unis.
      C'est pourquoi on a des usines Renault pas sur un seul endroit dans le monde,
      mais sur chaque continent. Le coût de transport d'une voiture est bien plus
      élevé par rapport à sa valeur que le transport d'un smartphone.
  - chunk_index: 6
    heading_path: IAE 2020   Séance 2 > La théorie d'Alfred Marshall et la localisation industrielle
    content_token_count: 190
    text: |-
      Je vous propose de faire un petit calcul simple. Un smartphone vaut 500 euros et
      pèse 200 grammes. Un kilo de smartphones a donc une valeur de 2 500 euros (5
      unités x 500 euros). Une voiture pèse quasiment une tonne (1000 kg) et vaut
      environ 15 000 euros, soit 15 euros le kilo. Si vous considérez que le coût de
      transport est de 2 euros le kilo, le prix de la voiture passe de 15 000 à 17 000
      euros. En revanche, pour le smartphone, le coût de transport de 2 euros le kilo
      n'augmente le prix que de 2 500 à 2 502 euros le kilo : le poids du transport
      dans le prix est quasiment négligeable.
  - chunk_index: 7
    heading_path: IAE 2020   Séance 2 > La théorie d'Alfred Marshall et la localisation industrielle
    content_token_count: 104
    text: |-
      C'est la raison pour laquelle les industriels préfèrent produire tous leurs
      smartphones dans l'usine la plus efficace, quitte à les exporter partout dans le
      monde. Pour l'automobile, ils vont organiser la production près des
      consommateurs, globalement dans chaque continent. Cela dépend aussi du volume de
      ventes : plus l'usine est importante, plus elle est efficace et moins elle coûte
      cher.
  - chunk_index: 8
    heading_path: IAE 2020   Séance 2 > L'effet d'agglomération industrielle
    content_token_count: 155
    text: |-
      Cette réflexion nous amène à Marshall, qui se demande : qu'est-ce qui rend une
      usine efficace ? La question du transport est importante, mais ce qui l'est
      encore plus, c'est le fait d'avoir à côté de soi d'autres industriels. Quand
      vous êtes une entreprise automobile, vous produisez une voiture, pour laquelle
      vous avez besoin d'acier. Si l'entreprise métallurgique à laquelle vous achetez
      l'acier est très loin, il faudra le transporter, ce qui peut être cher. Si les
      producteurs de phares, de sièges, etc., sont tous très loin, plus on est loin,
      plus ça coûte cher.
  - chunk_index: 9
    heading_path: IAE 2020   Séance 2 > L'effet d'agglomération industrielle
    content_token_count: 201
    text: |-
      Marshall a remarqué que lorsqu'il y avait beaucoup d'entreprises industrielles
      implantées sur un territoire, cela avait tendance à attirer d'autres entreprises
      industrielles. Pourquoi ? Parce qu'elles trouveront plus facilement des
      partenaires commerciaux, des fournisseurs et des clients. De plus, la présence
      de beaucoup d'activités industrielles sur un espace concentré rend rentables les
      infrastructures de transport (ports, routes, etc.). Les entreprises qui
      produisent des biens manufacturés attirent celles qui leur fournissent des
      matières premières, des pièces. Des institutions d'enseignement vont se
      développer pour former techniciens, ouvriers et ingénieurs. Il est plus
      intéressant de s'implanter dans une région industrielle que dans une région sans
      industrie.
  - chunk_index: 10
    heading_path: IAE 2020   Séance 2 > L'effet d'agglomération industrielle
    content_token_count: 170
    text: |-
      Au final, plus un territoire est dense en entreprises industrielles, plus ce
      territoire va savoir rendre ces entreprises performantes et va en attirer de
      nouvelles. C'est ce qu'on appelle **l'effet d'agglomération industrielle**.
      C'est un processus dans lequel la densité industrielle tend à attirer d'autres
      industries en raison d'infrastructures et de structures (réseau d'entreprises,
      main-d'œuvre qualifiée) qui sont profitables et performantes, créant ainsi une
      dynamique de croissance de l'industrie sur un territoire. C'est un effet
      cumulatif : plus il y a d'industries, plus il y en aura.
  - chunk_index: 11
    heading_path: IAE 2020   Séance 2 > Le marché unique européen et la polarisation industrielle
    content_token_count: 115
    text: |-
      Or, que se passe-t-il en 1986 avec l'Acte unique ? Il entraîne la constitution
      d'un marché unique, fondé sur la libre circulation du capital et du travail.
      Avant l'Acte unique, les pays pouvaient limiter la circulation du capital. En
      limitant cette circulation, ils atténuaient les effets d'agglomération, car il
      faut que le capital soit mobile pour que quiconque puisse investir n'importe où
      pour créer une nouvelle usine.
  - chunk_index: 12
    heading_path: IAE 2020   Séance 2 > Le marché unique européen et la polarisation industrielle
    content_token_count: 95
    text: |-
      Imaginons un Grec qui décide d'implanter une nouvelle usine. Il a de l'argent à
      investir et se demande où se placer. Lorsque les mouvements de capitaux sont
      limités, il la place naturellement en Grèce, surtout s'il ne s'intéresse pas
      trop aux dragons extérieurs. À l'époque, chaque pays avait sa monnaie nationale.
  - chunk_index: 13
    heading_path: IAE 2020   Séance 2 > Le marché unique européen et la polarisation industrielle
    content_token_count: 179
    text: |-
      Maintenant, avec l'euro, une monnaie unique, et une libre circulation totale des
      capitaux, l'industriel grec raisonne autrement. Il se demande s'il faut
      rentabiliser son investissement dans une région peu industrialisée comme la
      Grèce, où il n'y a pas d'infrastructure correcte, pas de main-d'œuvre bien
      formée, pas de ports, pas de fournisseurs ni de clients. S'il va en Bavière, par
      exemple, il y aura beaucoup de partenaires pour produire, des ouvriers bien
      formés car c'est une région fortement industrialisée, et son investissement sera
      plus efficace. De plus, un bateau pourra atteindre le port de Rotterdam, un des
      plus grands ports européens.
  - chunk_index: 14
    heading_path: IAE 2020   Séance 2 > Le marché unique européen et la polarisation industrielle
    content_token_count: 104
    text: |-
      Avant la libre circulation des capitaux, l'industriel grec restait investir dans
      son pays. Mais avec l'ouverture du capital, tous les industriels européens (et
      étrangers) lorsqu'ils choisissent d'investir en Europe ne vont pas investir en
      Grèce, mais en Allemagne, parce que c'est là qu'il y a des effets
      d'agglomération, que les industriels sont plus efficaces.
  - chunk_index: 15
    heading_path: IAE 2020   Séance 2 > Le marché unique européen et la polarisation industrielle
    content_token_count: 176
    text: |-
      On obtient ainsi un phénomène : la libre circulation du capital tend à renforcer
      les régions qui ont un potentiel industriel plus important et, de fait, va
      assécher les zones périphériques. Les règles du marché unique interdisent aux
      États d'intervenir pour avantager leurs entreprises et leur imposent de
      respecter les principes de la libre concurrence (pas de monopoles, égalité des
      chances pour toutes les entreprises). Mais cette égalité des chances est
      illusoire, car tous les territoires ne sont pas égaux. Certains sont richement
      dotés en facteurs de production territoriaux, d'autres non. Lorsqu'on est
      richement doté, on a un avantage concurrentiel extrêmement important.
  - chunk_index: 16
    heading_path: IAE 2020   Séance 2 > Le marché unique européen et la polarisation industrielle
    content_token_count: 123
    text: |-
      L'Union européenne n'a pas pensé à cela. Elle s'est construite sur l'idée que si
      tous les pays fonctionnent avec les mêmes règles, au bout d'un moment, tous les
      pays vont se retrouver à égalité et converger. La réalité est exactement
      l'inverse : les mêmes règles appliquées à des pays qui sont différents, car ils
      n'ont pas les mêmes dotations en facteurs de production territoriaux, entraînent
      une **divergence**.
  - chunk_index: 17
    heading_path: IAE 2020   Séance 2 > Le marché unique européen et la polarisation industrielle
    content_token_count: 131
    text: |-
      Cette divergence s'appelle la **polarisation industrielle**. C'est l'idée que
      les pays avec une forte industrie vont voir leur industrie croître, alors que
      les pays avec une industrie plus faible vont voir leur industrie disparaître.
      Les infrastructures qui servaient l'industrie deviennent moins rentables, et
      ainsi de suite, aboutissant à un processus de disparition progressive de
      l'industrie dans les pays où elle est la plus faible, et de progression de
      l'industrie dans les pays où elle est la plus forte.
  - chunk_index: 18
    heading_path: IAE 2020   Séance 2 > Illustration cartographique et évolution de l'emploi industriel
    content_token_count: 190
    text: |-
      Observons une carte montrant les principales zones industrielles de l'Union
      européenne en 2001, au moment où le marché unique est achevé et deux ans après
      la création de la monnaie unique. On voit que l'industrie n'est pas répartie de
      manière uniforme. Le cœur de l'activité industrielle se trouve en Allemagne et
      dans le nord de l'Europe. En Grèce, côté, il y a peu d'industries. En Espagne,
      c'est faible. En France, l'industrie se concentre sur les fleuves (Seine, Saône,
      Rhône), à Nantes-Saint-Nazaire, Bordeaux, et dans une moindre mesure à Toulouse
      (industrie aéronautique créée par l'État).
  - chunk_index: 19
    heading_path: IAE 2020   Séance 2 > Illustration cartographique et évolution de l'emploi industriel
    content_token_count: 50
    text: |-
      Si, dans ce système, on permet la libre circulation totale des capitaux, les
      régions performantes vont attirer l'industrie, et les régions les moins
      performantes vont en voir disparaître.
  - chunk_index: 20
    heading_path: IAE 2020   Séance 2 > Illustration cartographique et évolution de l'emploi industriel
    content_token_count: 255
    text: |-
      J'ai essayé de mesurer l'évolution de l'industrie en Europe en observant le
      développement de l'emploi industriel manufacturier entre 1991 et 2007. On voit
      que les pays du cœur (Pologne, Allemagne, pays scandinaves) ont très peu perdu,
      voire gagné (Pologne) des emplois industriels. Les pays périphériques (Portugal,
      Royaume-Uni, Finlande, Italie, Espagne, France, Grèce) ont perdu beaucoup
      d'emplois. On a clairement un essor de la polarisation : "le plus attire le
      plus, le moins attire le moins". Cependant, cette carte est un peu décalée par
      rapport au schéma théorique, car certains pays périphériques (comme la Pologne)
      ont aussi perdu beaucoup, tandis que d'autres (comme la Pologne, justement) en
      ont gagné. Cela s'explique aussi par la question du coût du travail, plus faible
      dans les pays d'Europe centrale.
  - chunk_index: 21
    heading_path: IAE 2020   Séance 2 > Lien entre désindustrialisation et déséquilibres financiers
    content_token_count: 74
    text: |-
      Ce qui se passe lorsqu'une région se désindustrialise ? La désindustrialisation
      d'une région va entraîner un déficit de sa balance courante. Je rappelle que le
      solde courant représente les besoins de financement ou les capacités de
      financement (l'épargne) d'une économie.
  - chunk_index: 22
    heading_path: IAE 2020   Séance 2 > Lien entre désindustrialisation et déséquilibres financiers
    content_token_count: 71
    text: |-
      Quand on regarde les exportations d'un pays, on s'aperçoit que ce sont rarement
      des services (qui sont consommés sur place), mais principalement des biens
      manufacturés. Une économie désindustrialisée aura beaucoup de mal à exporter et
      se retrouvera en déficit commercial.
  - chunk_index: 23
    heading_path: IAE 2020   Séance 2 > Lien entre désindustrialisation et déséquilibres financiers
    content_token_count: 237
    text: |-
      Lorsqu'un pays connaît un déséquilibre commercial (exportations inférieures aux
      importations), il va aussi connaître un déséquilibre financier. Il se retrouvera
      en situation de besoin de financement, ce qui peut entraîner un déficit de sa
      balance courante. Tous les pays en excédent commercial comme l'Allemagne vont
      dégager de l'épargne, et tous les pays comme la Grèce, qui ont des besoins de
      financement, vont devoir emprunter. La crise de l'euro a été une perte soudaine
      de confiance des créanciers (les épargnants du Nord) dans les capacités de
      remboursement des pays du Sud, qui ont donc arrêté de leur prêter, les faisant
      quasiment entrer en faillite. Ils ne pouvaient plus emprunter, parce qu'ils
      avaient du mal à équilibrer leur balance commerciale, précisément parce qu'ils
      étaient désindustrialisés.
  - chunk_index: 24
    heading_path: IAE 2020   Séance 2 > Conséquences sociales et démographiques de la polarisation
    content_token_count: 135
    text: |-
      Il y a un piège à l'échelle européenne : des règles communes appliquées à des
      économies profondément différentes (dotations, histoires, institutions,
      infrastructures) aggravent les déséquilibres et enrichissent les riches en
      appauvrissant les pauvres. C'est la raison pour laquelle la crise européenne est
      insoluble. Cette dynamique n'a pas de solutions réelles. Les plans de relance
      financés par l'Union européenne se font dans un processus de désintégration
      économique des pays périphériques.
  - chunk_index: 25
    heading_path: IAE 2020   Séance 2 > Conséquences sociales et démographiques de la polarisation
    content_token_count: 153
    text: |-
      La désindustrialisation n'est pas qu'une question d'industrie. Lorsqu'on n'a
      plus d'industrie, on n'a plus d'emplois industriels, on perd les techniciens,
      les ingénieurs, qui s'expatrient. C'est ce qui se passe en Grèce, en Espagne, en
      Italie. On observe des flux migratires très importants des pays périphériques
      vers les pays centraux. Entre 2012 et 2018, l'Allemagne a connu un solde
      migratoire de plus de 4 millions de personnes, dont la moitié provenait de
      l'Union européenne.
  - chunk_index: 26
    heading_path: IAE 2020   Séance 2 > Conséquences sociales et démographiques de la polarisation
    content_token_count: 250
    text: |-
      Ces mouvements de population suivent la dynamique économique et industrielle. Il
      y a un risque d'avoir des régions qui se dépeuplent. En perdant l'industrie, on
      perd la main-d'œuvre, on perd les gens qui font des enfants. On observe des
      effondrements démographiques en Espagne, en Italie, en Grèce, en Europe
      orientale, avec des taux de fécondité retombés à 1,2 enfant par femme, car les
      femmes (et hommes) en âge de procréer sont partis travailler ailleurs. C'est une
      réorganisation de l'économie et de la société européenne qui concentre les
      activités les plus rentables dans un territoire central et provoque une
      disparition progressive d'activités dans les régions périphériques. Le seul
      outil efficace pour compenser serait de revenir à des monnaies nationales, mais
      cela signifierait la fin de l'Europe. Sinon, on attise les tensions entre les
      pays.
  - chunk_index: 27
    heading_path: IAE 2020   Séance 2 > Conséquences sociales et démographiques de la polarisation
    content_token_count: 165
    text: |-
      La crise de l'euro est en réalité la crise du marché unique, c'est-à-dire du
      nouveau modèle économique (d'inspiration libérale) engagé en 1986. L'économiste
      est utile à la société : il permet de comprendre des choses invisibles pour le
      commun des mortels. Par exemple, l'effondrement de l'économie grecque ne
      s'explique pas par la fainéantise des Grecs, mais par un problème d'institutions
      dysfonctionnelles, à savoir le marché unique créé en 1986. Cela permet de
      réfléchir au monde dans lequel nous vivons et d'anticiper.
  - chunk_index: 28
    heading_path: IAE 2020   Séance 2 > L'économie comme science et l'économiste comme conseiller
    content_token_count: 122
    text: |-
      L'économie s'intéresse davantage à l'environnement et aux institutions qu'à
      l'entreprise au sens strict. La gestion étudie le fonctionnement intérieur de
      l'entreprise, tandis que l'économie s'intéresse au système, à l'environnement de
      l'entreprise (débouchés, marchés, dynamiques de crise et de croissance, emploi,
      chômage). Dans la pensée économique, on s'intéresse à la société dans son
      ensemble plutôt qu'à l'agent individuel.
  - chunk_index: 29
    heading_path: IAE 2020   Séance 2 > L'économie comme science et l'économiste comme conseiller
    content_token_count: 108
    text: |-
      L'économiste cherche à produire un savoir scientifique sur un objet extérieur à
      lui : le monde économique. Il va chercher à comprendre comment fonctionnent les
      relations entre les différents agents qui participent à l'activité économique.
      L'économiste est aussi, au-delà du scientifique, un conseiller. Il cherche à
      soigner les maux de l'économie en proposant des solutions à des décideurs
      (politiques, banques, entreprises).
  - chunk_index: 30
    heading_path: IAE 2020   Séance 2 > L'économie comme science et l'économiste comme conseiller
    content_token_count: 133
    text: |-
      Il existe de nombreuses commissions d'experts (sur le Smic, composées de prix
      Nobel comme Jean Tirole, ou des commissions sur la richesse avec Joseph
      Stiglitz). Des économistes sont aussi consultants dans les entreprises (Patrick
      Artus à Natixis, par exemple) pour aider dans les décisions stratégiques et
      comprendre la conjoncture. Les enseignants-chercheurs à l'université ne sont pas
      seulement des scientifiques, ils peuvent aussi être des consultants qui
      produisent des travaux nourrissant la réflexion économique.
  - chunk_index: 31
    heading_path: IAE 2020   Séance 2 > Le système économique et la doctrine économique
    content_token_count: 320
    text: |-
      Il faut distinguer deux sens du mot "économie" :
      1.  **Le système économique** : C'est l'environnement économique, produit du comportement collectif. Il n'existe pas dans la nature indépendamment des êtres humains. L'activité économique (création, répartition de biens et services) est organisée collectivement par des institutions et des infrastructures. Ces institutions peuvent être **formelles** (juridique, fiscal, créé par décision consciente) ou **informelles** (culture, langue, infrastructures héritées, règles de vie non écrites). Les comportements individuels sont déterminés en partie par ces institutions. Le système économique est l'ensemble de ce processus de création et distribution de richesses, déterminé par les comportements individuels eux-mêmes conditionnés par les institutions.
      2.  **La doctrine économique** : C'est la manière de concevoir, analyser et représenter l'économie. C'est un prisme à travers lequel on regarde le système économique. Elle comporte un aspect **positif** (description, analyse de la réalité, compréhension) et un aspect **normatif** (recommandation, action, ce qu'il faut faire). L'économiste est à la fois analyste (comme un physicien) et ingénieur (comme un médecin qui soigne), ce qui le rend unique.
  - chunk_index: 32
    heading_path: IAE 2020   Séance 2 > Le système économique et la doctrine économique
    content_token_count: 151
    text: |-
      Le système économique est unique, mais les doctrines pour le concevoir et
      l'analyser sont multiples. Cela entraîne des contradictions et des oppositions,
      car les économistes ne sont pas tous d'accord. La science avance par le débat,
      la confrontation et le dialogue, car un seul point de vue ne suffit pas à
      comprendre un phénomène complexe. C'est illustré par la parabole des aveugles et
      de l'éléphant : chaque scientifique ne touche qu'une partie de l'éléphant (la
      réalité) et a raison sur son bout, mais l'ensemble ne peut être compris qu'en
      croisant les perspectives.
  - chunk_index: 33
    heading_path: IAE 2020   Séance 2 > Caractéristiques du système économique et implications
    content_token_count: 142
    text: |-
      Le système économique est façonné par des choix individuels, mais aussi et
      surtout par des institutions et infrastructures héritées de l'histoire (la
      langue, l'aménagement du territoire, comme cette université). Changer l'économie
      est donc très long et complexe, car on ne peut pas faire table rase. Les
      institutions formelles (lois) et les institutions informelles (culture,
      habitudes) sont liées. Changer les lois sans que les comportements ne s'adaptent
      ne fonctionne pas. Le temps d'adaptation est nécessaire et pas totalement
      maîtrisable.
  - chunk_index: 34
    heading_path: IAE 2020   Séance 2 > Caractéristiques du système économique et implications
    content_token_count: 110
    text: |-
      De plus, le système économique est marqué par des **processus irréversibles**
      (comme la deuxième loi de la thermodynamique) et des **sentiers de dépendance**
      (chaque choix détermine les choix futurs). Par exemple, adopter l'euro crée une
      dépendance : il est très coûteux, voire impossible, d'y revenir. Les
      institutions formelles peuvent changer, mais les institutions informelles
      s'adaptent lentement.
  - chunk_index: 35
    heading_path: IAE 2020   Séance 2 > Caractéristiques du système économique et implications
    content_token_count: 185
    text: |-
      Le changement économique persiste et modifie durablement le système. On ne peut
      pas revenir en arrière comme avant une crise ou une réforme. Nous sommes à la
      fois les produits du système économique et ses bâtisseurs, mais notre capacité à
      changer la société est limitée par l'inertie des comportements collectifs et des
      habitudes. Une doctrine économique ne peut pas seulement décrire la réalité
      (aspect positif) ; elle doit aussi proposer des solutions (aspect normatif). Or,
      toute mesure économique crée des gagnants et des perdants, réorganise la
      richesse et entraîne des conflits d'intérêts. L'économiste doit donc appuyer ses
      recommandations sur des principes et des normes pour justifier les arbitrages
      nécessaires.
