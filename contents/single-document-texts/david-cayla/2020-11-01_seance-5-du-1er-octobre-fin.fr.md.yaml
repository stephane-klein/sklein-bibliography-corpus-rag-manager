      plus connus après François Quesnay, c’est Turgot. Turgot, qui était contrôleur
      général des finances sous Louis XV, je crois — je ne suis plus sûr si c’est à la
      fin de sa vie ou au milieu, je crois que c’est Louis XV —, a cherché justement à
      mettre en application les théories physiocratiques, et notamment à permettre de
      faire circuler au maximum le produit net, à supprimer les droits de douane. Mais
      il se heurtait à des oppositions farouches, et finalement il a dû démissionner.
      Je crois à la fin, en tout cas il n’a pas vraiment réussi à développer
      l’économie comme il l’entendait, parce qu’il y avait évidemment beaucoup de
      contestation. Ceux qui contestaient, c’était souvent la cour, les nobles, ceux
      qui avaient des intérêts et qui, en fait, empêchaient en quelque sorte la
      modernisation de l’État. D’où d’ailleurs, au bout d’un moment, le blocage
      complet, puis la Révolution française, la convocation des États généraux et la
