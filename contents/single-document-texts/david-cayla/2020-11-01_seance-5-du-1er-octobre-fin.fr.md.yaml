      un économiste. Il enseigne : son activité principale, c’est d’enseigner,
      d’enseigner à des étudiants à l’université. Et il écrit des livres qui
      reprennent en fait ses cours. Donc il fait ses cours, puis il essaie de les
      remettre après par écrit, de manière accessible. C’est un homme assez discret.
      Il ne va pas aller à la cour de Londres pour essayer de faire valoir ses idées,
      il ne va pas faire de politique du tout. Il ne s’est jamais marié. Il a une vie
      plutôt de quelqu’un de discret. Moi je le vois un peu comme un rat de
      bibliothèque : il passe son temps à lire des livres et à essayer d’écrire. Parce
      que son œuvre est énorme, je dois dire. C’est un livre extrêmement vaste, *La
      Richesse des nations*. Vous avez parfois des versions résumées, où on coupe des
      passages ; vous pouvez tout à fait lire ce genre de version si vous voulez, mais
      le livre en entier est beaucoup plus long.
