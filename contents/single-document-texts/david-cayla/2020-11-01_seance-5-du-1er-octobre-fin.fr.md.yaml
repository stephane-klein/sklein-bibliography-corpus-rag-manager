      Adam Smith, c’est un enseignant, un universitaire. On pourrait dire aujourd’hui
      que c’est un enseignant-chercheur. Il possède une chaire à l’Université de
      Glasgow, en Écosse. Il est philosophe, il n’est pas économiste. Il n’y a pas
      vraiment de chaire d’économie en Angleterre à l’époque, et le mot même —
      souvenez-vous, je l’ai dit — a été inventé en France pour parler des
      physiocrates. Bon, il n’y a pas vraiment d’économistes à titre de pensée
      véritablement économique à titre conçu comme cela en Angleterre à l’époque.
      Alors ça ne veut pas dire qu’il n’y a pas des penseurs qui pensent l’économie,
      mais on va dire que la discipline économie n’existe pas. Et donc c’est en tant
      que philosophe qu’il va écrire un livre d’économie. Clairement, quand on lit *La
      Richesse des nations*, c’est un livre d’économie, ce n’est pas un livre de
      philosophie, même s’il y a de nombreuses réflexions sur le comportement humain.
      C’est vraiment un livre qui cherche à décrire et à comprendre le système
      économique, et qui va poser, un peu comme chez François Quesnay, une réflexion
      sur le fonctionnement du monde économique et sur les outils qui permettraient
      d’améliorer ce fonctionnement.
