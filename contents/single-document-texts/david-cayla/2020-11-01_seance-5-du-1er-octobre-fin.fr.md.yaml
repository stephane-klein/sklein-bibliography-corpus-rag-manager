chunks:
  - chunk_index: 0
    heading_path: 'Séance 5 du 1er octobre (fin) > Reprise : le lien entre la France et le mercantilisme'
    content_token_count: 87
    text: |-
      Bien, nous allons reprendre le cours. Un étudiant est venu me voir à la pause
      pour poser une question très intelligente : il disait que ce que j’avais raconté
      sur la France était intéressant, mais qu’on ne comprenait pas le lien avec le
      mercantilisme. Il avait raison, je ne l’avais pas suffisamment souligné.
  - chunk_index: 1
    heading_path: 'Séance 5 du 1er octobre (fin) > Reprise : le lien entre la France et le mercantilisme'
    content_token_count: 341
    text: |-
      Le mercantilisme, je le répète, a pour objectif de trouver les moyens de
      financer l’État pour qu’il ait une armée puissante. Pour cela, il faut de l’or.
      On va donc avoir des stratégies qui tournent toutes autour de la question :
      comment récupère-t-on de l’or ? Pour l’Espagne, on garde l’or parce qu’on a les
      mines ; on essaie donc de le conserver, avec une politique bullioniste. Pour
      l’Angleterre et les Provinces-Unies, on a accès à des ressources qu’on peut
      échanger contre de l’or ; on va donc chercher à avoir une politique
      protectionniste favorable aux échanges, pour dégager un excédent commercial.
      Pour la France, c’est cela que je n’avais pas dit : on va chercher à se
      développer en utilisant sa main-d’œuvre pas très chère et nombreuse. On va
      développer des manufactures pour à la fois se substituer aux importations —
      c’est-à-dire éviter d’importer de l’étranger — et exporter les productions de
      ces manufactures, de manière à dégager également un excédent commercial, et donc
      trouver des financements pour l’armée et pour l’État. C’est bien une stratégie
      mercantiliste, seulement on utilise là les ressources de la France, qui sont sa
      population nombreuse et pas très bien payée.
  - chunk_index: 2
    heading_path: 'Séance 5 du 1er octobre (fin) > Reprise : le lien entre la France et le mercantilisme'
    content_token_count: 71
    text: |-
      Oui, c’est du protectionnisme, c’est marqué ici : protectionnisme et
      interventionnisme. C’est là la différence avec l’Angleterre. On va vraiment
      chercher à trouver des commandes, à donner des commandes aux manufactures
      françaises pour qu’elles se développent.
  - chunk_index: 3
    heading_path: Séance 5 du 1er octobre (fin) > La doctrine des physiocrates
    content_token_count: 219
    text: |-
      Revenons maintenant à la doctrine des physiocrates. C’est une approche qui est
      en réalité plus scientifique que l’approche mercantiliste, parce qu’elle ne
      cherche pas juste à répondre à un besoin particulier, mais plutôt à essayer de
      comprendre le fonctionnement de l’économie. Pour comprendre le fonctionnement de
      l’économie, on va adopter une démarche qui est celle de la science de l’époque :
      on va commencer par catégoriser ce qu’on veut étudier. Par exemple, en biologie,
      à l’époque, qu’est-ce qu’on fait ? On catégorise l’ensemble des animaux,
      l’ensemble des plantes, pour essayer de comprendre le fonctionnement des
      espèces. Le grand travail des biologistes de l’époque était de catégoriser
      l’ensemble des espèces, de les regrouper par famille. C’est comme cela que
      fonctionne la science.
  - chunk_index: 4
    heading_path: Séance 5 du 1er octobre (fin) > La doctrine des physiocrates
    content_token_count: 179
    text: |-
      Donc qu’est-ce qu’on fait en économie ? On va aussi chercher à comprendre le
      système économique à partir d’une forme de catégorisation. Cette catégorisation
      repose sur des classes sociales. Aujourd’hui, quand on parle de classe sociale,
      on a tendance à parler des riches et des pauvres, mais ce n’est pas ainsi que le
      concept de classe sociale a été inventé. Il ne s’agit pas juste de diviser la
      société en riches et en pauvres ; il s’agit surtout de trouver les fonctions
      sociales des gens. Une classe sociale, c’est un regroupement de personnes, une
      catégorisation du peuple en fonction de leur fonction sociale, c’est-à-dire de
      ce à quoi ils servent dans la société.
  - chunk_index: 5
    heading_path: Séance 5 du 1er octobre (fin) > La doctrine des physiocrates
    content_token_count: 265
    text: |-
      En France, à l’époque, on avait déjà des classes sociales institutionnelles : la
      noblesse, le clergé et le tiers état. Trois groupes fonctionnels ; c’était
      finalement comme cela que les gens se représentaient la société. Il n’est donc
      pas étonnant que, lorsqu’on cherche à comprendre la société et l’économie, on
      regroupe aussi en trois grandes classes. Mais on ne peut pas utiliser les
      classes que je viens de citer — noblesse, clergé, tiers état — parce que, par
      exemple, si on veut faire une analyse économique, il va être difficile de
      trouver des distinctions importantes entre ces trois classes. Notamment, que
      fait le clergé d’un point de vue économique ? Est-ce que c’est profondément
      différent de ce que fait la noblesse ? Tout cela n’est pas très clair, et ce
      n’est pas vraiment la question que se posent les physiocrates. Ils vont donc
      établir aussi trois classes sociales, mais avec des catégories plus
      intéressantes, plus pertinentes que les catégories politiques de l’époque.
  - chunk_index: 6
    heading_path: Séance 5 du 1er octobre (fin) > La doctrine des physiocrates > Les trois classes physiocratiques
    content_token_count: 70
    text: |-
      Ces trois classes, ils vont les appeler : la classe productive, la classe des
      propriétaires et la classe stérile. Chacune de ces classes a une fonction
      particulière, et cette fonction est relative à l’usage qu’ils ont de la terre.
      On est dans une société agricole.
  - chunk_index: 7
    heading_path: Séance 5 du 1er octobre (fin) > La doctrine des physiocrates > Les trois classes physiocratiques
    content_token_count: 298
    text: |-
      Pour François Quesnay, le fondateur de cette pensée physiocratique — né en 1694,
      mort en 1774 —, c’est d’abord un médecin, le médecin du roi Louis XV. Il est
      donc à la cour, c’est quelqu’un d’important dans la cour de Louis XV. À la fin
      de sa vie, il s’amuse à essayer de dépasser la médecine et donc à comprendre non
      plus le corps humain, mais le corps social : comment la société fonctionne.
      François Quesnay a aussi conscience que, à l’époque, la richesse c’est
      essentiellement la nourriture. Si on devait calculer le PIB de l’époque — bien
      sûr on ne sait pas le faire, parce qu’on n’a pas les instruments statistiques
      suffisants —, sans doute qu’on verrait que 70 % ou 80 % du PIB relève de
      l’agriculture, et que les services et l’industrie ne sont qu’une part marginale
      de l’activité économique. Finalement, comme la richesse essentielle est la
      richesse de l’agriculture, on va regarder comment la société fonctionne par
      rapport à son rapport à la terre.
  - chunk_index: 8
    heading_path: Séance 5 du 1er octobre (fin) > La doctrine des physiocrates > Les trois classes physiocratiques
    content_token_count: 109
    text: |-
      C’est là qu’on introduit les trois classes. La classe productive, pour Quesnay,
      ce sont les agriculteurs, c’est-à-dire ceux qui produisent la nourriture, qui va
      ensuite être dispatchée dans la société. C’est une classe productive parce que
      c’est elle qui est réellement productive. Je viendrai tout à l’heure expliquer
      pourquoi il considère qu’elle est productive. Son travail, c’est d’exploiter la
      terre.
  - chunk_index: 9
    heading_path: Séance 5 du 1er octobre (fin) > La doctrine des physiocrates > Les trois classes physiocratiques
    content_token_count: 187
    text: |-
      Toujours quand on regarde le rapport à la terre, la classe des propriétaires,
      c’est la classe des gens qui possèdent la terre. Bien sûr, la classe des
      propriétaires peut aussi — on peut avoir des gens qui sont à la fois
      propriétaires et qui exploitent —, on peut avoir des agriculteurs qui possèdent
      leur propre terre. Compris, à l’époque toute la terre n’est pas détenue par la
      noblesse. Dans ce cas-là, on peut avoir quelqu’un qui appartient aux deux
      catégories. Ce n’est pas un problème du point de vue de la pensée économique :
      on catégorise en fonction de la fonction sociale, mais une personne peut tout à
      fait être à la fois propriétaire et avoir une activité productive, au sens
      travailler la terre.
  - chunk_index: 10
    heading_path: Séance 5 du 1er octobre (fin) > La doctrine des physiocrates > Les trois classes physiocratiques
    content_token_count: 155
    text: |-
      La troisième classe sociale — et une personne peut tout à fait être sur
      plusieurs classes à la fois — c’est la classe stérile. On va voir tout à l’heure
      pourquoi elle est dite stérile : parce qu’elle ne produit pas de produit net. En
      fait, son rapport à la terre, c’est justement qu’elle n’a aucun rapport à la
      terre. Ce sont les urbains, les gens qui vivent dans les villes, qui ne sont ni
      propriétaires de terre ni ne l’exploitent. Ce sont les artisans, les
      commerçants, les industriels, toutes les personnes qui ne sont pas liées
      directement au travail agricole.
  - chunk_index: 11
    heading_path: Séance 5 du 1er octobre (fin) > La doctrine des physiocrates > Les trois classes physiocratiques
    content_token_count: 67
    text: |-
      Cette représentation de la société vise à comprendre les fonctions économiques
      de chaque classe. Elle survalorise l’agriculture — mais c’est aussi le principe
      de la société de l’époque —, néanmoins elle est fondée sur un certain nombre de
      réflexions.
  - chunk_index: 12
    heading_path: Séance 5 du 1er octobre (fin) > La doctrine des physiocrates > Le produit net
    content_token_count: 241
    text: |-
      Première chose : pourquoi la classe productive est-elle productive ? Parce que —
      vous allez avoir l’occasion de le voir dans le TD1, qui analysera un peu plus
      profondément les physiocrates — elle crée un produit net, c’est-à-dire qu’elle
      crée un surplus. On pourrait dire en gros qu’un agriculteur sème une quantité de
      blé X et qu’à la fin des moissons il va se retrouver avec une quantité de blé X
      x 5 ou X x 10. Il va en quelque sorte produire davantage de blé qu’il n’a
      utilisé de blé pour semer. Il y a un effet multiplicateur. Et en gros, nous dit
      Quesnay, c’est cela le principe de la nature : c’est la croissance des blés, la
      croissance naturelle des plantes, qui n’est pas le fruit du travail mais le
      fruit de la nature, et qui explique que c’est dans l’agriculture qu’on va
      produire davantage que ce qu’on a dépensé.
  - chunk_index: 13
    heading_path: Séance 5 du 1er octobre (fin) > La doctrine des physiocrates > Le produit net
    content_token_count: 177
    text: |-
      Il y a donc l’idée d’un surplus produit par les bienfaits de la nature. C’est ce
      qu’on appelle le produit net. Et ce produit net est le résultat du fait que la
      production est supérieure aux avances qui ont été nécessaires pour la produire.
      Les avances, c’est le blé qu’on a semé, c’est aussi le blé qu’on a mangé pour
      pouvoir semer, donc c’est tout l’ensemble des coûts de production.
      L’agriculture, nous dit Quesnay, c’est un domaine très particulier : c’est le
      seul domaine productif, parce que c’est le seul domaine où finalement ce qui est
      rapporté par l’activité est supérieur à ce que ça a coûté.
  - chunk_index: 14
    heading_path: Séance 5 du 1er octobre (fin) > La doctrine des physiocrates > Le produit net
    content_token_count: 291
    text: |-
      Cela permet aussi de comprendre que la classe stérile est stérile en ce sens
      qu’elle ne produit pas, elle ne travaille pas dans la culture, elle ne bénéficie
      donc pas de ce que Quesnay appelle le don gratuit de la nature. C’est-à-dire que
      tout ce qu’elle produit est égal globalement à ce que ça lui coûte ; du fait,
      elle ne génère pas de surplus, pas de produit net, et donc elle est considérée
      comme stérile du point de vue de la production de richesse. Elle transforme de
      la richesse, elle ne produit pas de la richesse. C’est un peu comme ça qu’il
      l’analyse : en gros, le commerçant transporte des marchandises d’un endroit à
      l’autre, l’artisan transforme les matières premières en produits finis, mais en
      fait ça leur coûte aussi cher que la valeur de ce qu’ils produisent. Si on
      produit un service par un transport, on va faire payer le transport à peu près
      le coût de production du transport ; donc il n’y a pas derrière cela de surplus,
      à la différence de l’agriculture, qui est une activité qui permet de dégager un
      véritable surplus social.
  - chunk_index: 15
    heading_path: Séance 5 du 1er octobre (fin) > La doctrine des physiocrates > Le produit net
    content_token_count: 195
    text: |-
      À qui va ce surplus social, ce produit net ? Comme c’est un produit qui est
      engendré par la nature, donc par la terre, il ne va pas à la classe productive,
      à celui qui exploite la terre ; il va au propriétaire de la terre. C’est donc la
      classe des propriétaires, les propriétaires fonciers, ceux qui possèdent les
      terres et qui prélèvent le produit net de la terre à partir des loyers qu’ils
      font payer aux agriculteurs. C’est eux qui bénéficient du produit net payé par
      les agriculteurs sous forme de rente, sous forme de loyer de la terre, et qui
      vont ensuite faire circuler ce produit net par leurs dépenses de consommation.
      Et c’est ces dépenses de consommation qui vont permettre de nourrir la classe
      stérile en quelque sorte.
  - chunk_index: 16
    heading_path: Séance 5 du 1er octobre (fin) > La doctrine des physiocrates > Le produit net
    content_token_count: 144
    text: |-
      On a donc aussi cette présentation : classe productive, classe des
      propriétaires, classe stérile. Parce que c’est aussi un aspect logique : on
      génère le produit net dans la production agricole, ce produit net va ensuite aux
      propriétaires, qui vont le dépenser et réaliser les revenus de la classe
      stérile. La classe stérile va également être utile à la classe productive,
      puisque, par exemple, elle va réparer les outils des paysans et donc faire en
      sorte que le travail agricole pourra se poursuivre. Il a une vision très
      circulaire de l’économie.
  - chunk_index: 17
    heading_path: Séance 5 du 1er octobre (fin) > La doctrine des physiocrates > Le produit net
    content_token_count: 326
    text: |-
      Mais ce qui est intéressant, c’est finalement le postulat des physiocrates : la
      richesse n’est pas créée par le travail, elle est créée par la terre, et la
      terre c’est la nature. On a donc une vision où toute richesse vient de la
      nature. Ce n’est pas forcément une vision absurde. Aujourd’hui, on est quelque
      part les héritiers d’Adam Smith, pour lequel la richesse venait du travail, de
      l’activité humaine. Mais quand on pense à certaines conceptions écologiques, et
      quand on pense aussi, peut-être de manière plus large, que toute activité
      économique repose sur des ressources naturelles, et que ces ressources
      naturelles, ce n’est pas nous qui les avons créées, ce n’est pas notre travail
      qui les a créées, elles sont là, on pourrait tout à fait raisonner comme un
      physiocrate en disant que la richesse de notre société, c’est notre capacité à
      exploiter les richesses naturelles, à bénéficier de l’énergie qui vient de la
      nature, des biens miniers qui viennent de la nature également. Donc cette pensée
      de Quesnay, cette pensée physiocratique, n’est pas forcément absurde a priori.
      Bien sûr, elle aura des conséquences idéologiques dont on parlera tout à
      l’heure.
  - chunk_index: 18
    heading_path: Séance 5 du 1er octobre (fin) > La doctrine des physiocrates > Les avances
    content_token_count: 89
    text: |-
      Dernière chose que je voulais voir sur la diapo : cette notion d’avance. Le
      produit net, tout à l’heure je vous l’ai dit, c’est la différence entre la
      valeur de la production et les avances nécessaires à réaliser cette production.
      Ces avances, quelles sont-elles ? Chez les physiocrates, il y en a trois formes.
  - chunk_index: 19
    heading_path: Séance 5 du 1er octobre (fin) > La doctrine des physiocrates > Les avances
    content_token_count: 106
    text: |-
      D’abord, il y a les avances foncières. Les avances foncières, c’est la mise en
      culture sur des terres : comment on a transformé des terres non cultivables en
      terres cultivables. Cela a demandé un certain travail, mais ce travail, une fois
      qu’il est fait, n’a plus à être fait. C’est la mise en culture des terres qui
      date de très très longtemps et qui est amortie depuis longtemps.
  - chunk_index: 20
    heading_path: Séance 5 du 1er octobre (fin) > La doctrine des physiocrates > Les avances
    content_token_count: 107
    text: |-
      Ensuite, il y a une autre avance qu’il faut mettre en avant, justement :
      l’avance primitive. C’est ce qui permet les bâtiments, les outils qui permettent
      l’agriculture. On peut aussi mettre dans l’avance primitive, par exemple, les
      troupeaux, quand on est un éleveur, puisqu’il a bien fallu constituer un cheptel
      pour pouvoir avoir un troupeau de vaches ou de moutons.
  - chunk_index: 21
    heading_path: Séance 5 du 1er octobre (fin) > La doctrine des physiocrates > Les avances
    content_token_count: 346
    text: |-
      Et puis ensuite, on a les avances annuelles, qui sont les avances qui se
      renouvellent chaque année, qui disparaissent chaque année. C’est la subsistance
      de l’agriculteur et les semences, si on est aussi dans l’agriculture au sens
      semer du blé. En fait, quand on compare l’avance primitive et l’avance annuelle,
      l’avance foncière ne se dégrade pas, elle reste constante, donc il n’y a plus de
      question à se poser. Mais l’avance primitive se détériore chaque année à un
      rythme faible, et l’avance annuelle disparaît chaque année, donc à un rythme
      très élevé. Quand on veut comprendre avec les mots d’aujourd’hui, on dira —
      notez-le, on aura l’occasion de le revoir — que les avances primitives
      correspondent à du capital fixe, alors que les avances annuelles correspondent à
      du capital circulant. Puisque finalement les avances primitives, c’est
      l’investissement qu’il faut renouveler, qui se détériore, qu’il faut renouveler
      au fur et à mesure du temps, mais qui va perdurer. Alors que les avances
      annuelles, c’est les dépenses qu’on a besoin de faire pour produire, les
      semences, mais qui vont disparaître quand on va semer. On a aussi bien sûr la
      subsistance de l’agriculteur dans les avances annuelles.
  - chunk_index: 22
    heading_path: Séance 5 du 1er octobre (fin) > La doctrine des physiocrates > Les avances
    content_token_count: 334
    text: |-
      Voilà donc finalement le grand schéma de représentation de l’économie. Vous
      voyez, là on est dans la description, on n’est pas dans le normatif.
      Souvenez-vous du chapitre 1 : on est en train de concevoir une théorie pour
      décrire la réalité. Cette théorie est tout à fait contestable. Pourquoi trois
      classes ? On pourra avoir des différences, par exemple, dans la classe stérile,
      entre ceux qui produisent et ceux qui vendent, les marchands, les industriels ;
      ce ne sont pas tout à fait les mêmes activités. En fait, tout ça est arbitraire.
      L’intérêt d’une théorie, ce n’est pas forcément de décrire la réalité au plus
      précis, parce que si on décrit la réalité au plus précis, chaque personne
      individuellement a des fonctions différentes. Si on commence à entrer là-dedans,
      on n’a plus de modèle, on a 40 millions d’actifs en France. Comment voulez-vous
      raisonner à partir de 40 millions de personnes qui font des choses différentes ?
      On est obligé de catégoriser. Alors est-ce qu’on prend deux catégories, trois
      catégories, cinq catégories ? Plus on va prendre de catégories, plus notre
      modèle sera complexe et moins ça sera facile de produire une théorie. Donc là,
      voilà, on a un choix qui est trois classes sociales.
  - chunk_index: 23
    heading_path: Séance 5 du 1er octobre (fin) > La doctrine des physiocrates > Les avances
    content_token_count: 81
    text: |-
      Par contre, ce qu’il faut, c’est que ça soit cohérent. Cohérent comment ? C’est
      que chaque fois c’est le rapport à la terre qui détermine la place dans la
      classe sociale : est-ce qu’on exploite la terre, est-ce qu’on la possède, ou
      est-ce qu’on n’a aucune relation avec la terre ?
  - chunk_index: 24
    heading_path: Séance 5 du 1er octobre (fin) > La doctrine des physiocrates > Les avances
    content_token_count: 219
    text: |-
      Donc voilà cette idée ici, qui est que nous avons une doctrine qui vise quand
      même à essayer de comprendre la société et son fonctionnement, et en plus qui
      cherche à avoir une réflexion réaliste sur le fonctionnement de la société.
      C’est que François Quesnay va chercher à produire des statistiques. Là aussi
      c’est la première fois qu’on essaie de faire ça. Ces statistiques sont très
      approximatives, il n’a pas l’outil statistique qui permet de voir, mais il
      essaie de comprendre l’économie française, du royaume de France à l’époque, en
      regardant combien de tonnes de blé sont produites chaque année, où ce blé va,
      comment il circule. Il cherche à trouver des chiffres réalistes, en unité
      monétaire d’ailleurs, pour voir comment globalement l’argent circule, comment
      les richesses elles-mêmes circulent.
  - chunk_index: 25
    heading_path: Séance 5 du 1er octobre (fin) > La doctrine des physiocrates > Théorie de la valeur, circuit et circulation
    content_token_count: 304
    text: |-
      Du point de vue de la pensée économique, je l’ai dit tout à l’heure et je le
      redis : les avances, c’est un concept extrêmement important. C’est finalement le
      capital, c’est-à-dire la richesse qui sert à produire de la richesse.
      Souvenez-vous, c’est bien ça. On a donc là vraiment une innovation d’un point de
      vue de la pensée économique. Le mot capital existe depuis bien longtemps, mais
      qu’est-ce qu’il représente ? Il parle du capital d’un prêt en général.
      Souvenez-vous des *Fables de La Fontaine*, « capital et intérêt », la fourmi et
      Cie. Donc le mot capital existe, mais il n’est pas conçu ici de la même façon.
      Ici, Quesnay va reprendre ce mot — pas ce mot d’ailleurs, il va prendre le mot «
      avance » — il va utiliser le mot avance pour évoquer ce que nous appelons
      capital, c’est-à-dire cette richesse qui est productive. On va donc avoir le
      capital fixe, qui est alors les avances primitives, les avances foncières aussi,
      même si c’est un capital fixe au sens où il ne va pas se détériorer, et le
      capital circulant, qui lui est avance annuelle.
  - chunk_index: 26
    heading_path: Séance 5 du 1er octobre (fin) > La doctrine des physiocrates > Théorie de la valeur, circuit et circulation
    content_token_count: 114
    text: |-
      Vous verrez dans le TD numéro 2, je crois, le moment où Smith définit le capital
      fixe et le capital circulant. Vous verrez que la définition de Smith du capital
      fixe et du capital circulant est très proche de celle qu’on a aujourd’hui. En
      fait, on n’a pas inventé grand-chose depuis Smith par rapport à cela. Donc là il
      ne parle pas de capital, il parle d’avance, mais c’est bien exactement la même
      notion.
  - chunk_index: 27
