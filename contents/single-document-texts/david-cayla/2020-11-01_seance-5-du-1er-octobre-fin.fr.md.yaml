      monnaie. D’où le fait que dans son tableau on va voir des tableaux qui montrent
      la circulation de la monnaie et des tableaux qui montrent la circulation de la
      richesse en général. D’ailleurs les deux flux vont en sens inverse. Quand vous
      achetez à un vendeur un produit, la monnaie va de chez vous vers le vendeur,
      mais la marchandise va du vendeur à chez vous. Donc vous avez deux flux. C’est
      très important de comprendre ces mécanismes-là pour poser les bases d’une
