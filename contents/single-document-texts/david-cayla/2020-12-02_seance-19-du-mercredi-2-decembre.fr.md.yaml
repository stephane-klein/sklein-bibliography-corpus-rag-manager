      Keynes nous dit la chose suivante : il existe dans certains journaux des
      concours qui sont proposés aux lecteurs. Ces concours, c’est simplement : on
      vous donne une série de photos de visages, des photos de visages en noir et
      blanc à l’époque, et vous devez choisir les visages qui sont les plus beaux. Le
      gagnant du concours, le lecteur qui sera gagnant, ce n’est pas les personnes qui
      sont sur photo qui gagnent le concours de beauté. Ceux qui gagnent le concours,
      ce sont les lecteurs qui auront choisi, parmi les visages qui leur sont
      proposés, ceux qui auront reçu le plus de suffrages des autres lecteurs.
      Autrement dit, les gagnants sont ceux qui se sont approchés le plus des critères
      de beauté des autres. Si vous raisonnez comme ça, la question se pose très vite
      à vous, en tant que lecteur qui participez au concours : quel visage allez-vous
      choisir ? Est-ce que vous allez choisir le visage qui vous plaît à vous
      personnellement le plus, ou est-ce que vous allez choisir le visage qui
      trouvera, selon vous, le plus de votes ? Évidemment, pour gagner ce concours de
      beauté, il ne faut pas choisir selon ses propres préférences, il faut choisir
      selon les préférences des autres. Mais quelles sont les préférences des autres ?
      Est-ce que par exemple vous allez choisir la blonde à forte poitrine ou la brune
      un peu plus normale ? Vous pouvez préférer la brune, mais vous dites : comment
      les autres raisonnent avec leur cerveau reptilien ? Comment toutes ces masses
      vont choisir ? Est-ce qu’ils ne vont pas choisir la blonde à forte poitrine
      plutôt que la brune ? D’ailleurs, beauté, c’est plutôt homme, plutôt femme ? En
      réalité c’est les deux, on est d’accord. Et puis la préférence des uns et des
      autres… Mais vous, vous n’êtes pas en train de réfléchir sur la vraie beauté,
      vous êtes en train de choisir sur les canons de beauté. Donc vous allez sans
      doute choisir le truc qui semble beau pour les autres, mais qui ne vous semble
      pas forcément beau pour vous. Le paradoxe, c’est que tout le monde peut faire le
      même calcul. C’est-à-dire qu’en fin de compte, dans le concours de beauté, ce
      qui va être choisi comme visage, ce sera la blonde aux yeux bleus, à forte
      poitrine, pas forcément la personne que les gens trouveront la plus belle.
      Pourquoi ils vont choisir ça ? Parce qu’ils vont considérer que les autres vont
      penser comme ça, parce qu’ils sont un peu bêtes. En fait c’est ça, le paradoxe :
      on pense que tout le monde est bête, c’est toujours l’autre. Et donc on va
      choisir le critère de beauté qui peut-être ne plaira pas aux individus comme
      critère de beauté. Et c’est ça qu’on parle quand on parle de convention :
