    text: |-
      Qu’est-ce que c’est que la valeur fondamentale d’une action ? C’est les
      capacités de l’entreprise à faire des profits, non pas des profits l’année
      prochaine, mais des profits à long terme, puisque une action vous donne des
      dividendes sur une période infinie de temps. Évidemment, les dividendes que vous
      allez éventuellement recevoir dans 150 ans, vous vous en fichez complètement,
      ils ne valent rien pour vous. Ce qui vous intéresse, c’est les dividendes de
      l’année prochaine, puis les dividendes de l’année suivante, etc. Mais plus vous
      vous reculez dans le temps, moins ça vous intéresse. Donc en fait c’est ce qu’on
      appelle la valeur actualisée des dividendes. En théorie, c’est la valeur d’une
      action. En fait, s’il y a une action qui vaut 10 € par exemple, et dont vous
      pensez qu’elle va vous rapporter 1 € par an en termes de dividende, donc elle a
      un rendement de 10 %, vous pouvez dire : c’est 10 %, on va dire c’est la norme.
      Cela veut dire que je vais toucher 1 € l’année prochaine, puis encore 1 €
      l’année suivante, etc. Mais au fur et à mesure, comme ces euros auront de moins
      en moins de valeur parce qu’ils sont de plus en plus repoussés dans le temps,
      vous pouvez considérer que l’ensemble de tous ces revenus futurs de l’action
      vaut 10 €.
