    text: |-
      La première, c’est la SICAV. Je ne sais pas si vous avez déjà entendu parler des
      SICAV : ce sont des sociétés d’investissement à capital variable. La
      caractéristique d’une SICAV, c’est qu’il s’agit d’une société, c’est-à-dire
      d’une véritable entreprise autonome. Ce n’est pas forcément la banque qui la
      produit, cela peut l’être mais pas forcément. Vous pouvez avoir des particuliers
      par exemple qui créent une société d’investissement. Donc c’est une société
      d’investissement qui a la forme d’une société anonyme, c’est-à-dire qu’elle émet
      des actions. Concrètement, vous achetez les actions de cette SICAV, donc vous
      êtes actionnaire, vous êtes copropriétaire du fonds de placement, et vous êtes
      rémunéré par rapport aux profits qui sont réalisés dans ce fonds. Concrètement,
      vous achetez l’action de la SICAV. En achetant l’action — la SICAV a émis une
      action —, vous mettez par exemple 100 € l’action. Vous achetez je ne sais pas 50
      actions de 100 €, donc vous placez 5 000 € dans la SICAV. Après, ce qu’elle
      fait, c’est que la société utilise 5 000 € pour acheter des actions, des
      obligations. Et à tout moment — c’est pour cela que c’est à capital variable —
      vous pouvez vous faire rembourser, vous pouvez récupérer vos parts auprès de
      l’entreprise en demandant à l’entreprise de vous rembourser. Donc vous pouvez
      retirer votre argent et vous êtes remboursé de la valeur du moment, c’est-à-dire
      on divise par le nombre d’actions et vous touchez la valeur du patrimoine de
      l’entreprise à ce moment-là.
  - chunk_index: 33
    heading_path: 'Séance 19 du mercredi 2 décembre > Les deux formes d’OPCVM : SICAV et FCP'
    content_token_count: 420
    text: |-
      L’intérêt de la SICAV, c’est que comme vous êtes un actionnaire, vous êtes
      copropriétaire de l’entreprise, vous participez à l’assemblée générale des
      actionnaires, vous touchez un dividende qui correspond au profit de la société
      financière. Ce qu’il faut bien comprendre, c’est que cette société financière
      possède des actions d’autres sociétés. Donc en fait elle ne produit pas de
      richesse au sens strict, elle ne produit pas de richesse réelle, elle achète les
      actions ou les titres d’entreprises, ou d’autres entreprises qui, elles,
      produisent de la richesse réelle. Donc il faut bien comprendre que c’est une
      société de sociétés en quelque sorte. On peut même avoir des systèmes — on verra
      dans le cours d’histoire des faits économiques si vous suivez ce cours-là au
      prochain semestre — dans la crise de 29, ce qui était intéressant, c’est qu’on
      avait des SICAV qui avaient des actions de SICAV. Vous voyez, on est déjà sur le
      troisième degré, et on pourrait même multiplier ainsi des SICAV qui ont acheté
      des actions de SICAV qui elles-mêmes ont acheté des actions de SICAV. Évidemment
      tout cela finit finalement par créer de l’argent parce que derrière il y a une
      entreprise réelle qui crée de la richesse. Mais parfois on a tendance à
      l’oublier un peu, on est un peu dans une phase de forme de bulle financière.
      D’ailleurs c’est l’une des raisons pour lesquelles il y a eu le krach financier
      de 1929, parce que tous ces systèmes-là étaient déjà connus dans les années 20.
