      de le faire en dehors de, sans avoir l’autorisation de l’AMF. L’AMF vérifie
      aussi que vous êtes bien informé. Cela est très intéressant : l’information.
      Quand vous placez de l’argent, vous avez différents types de fonds. Vous pouvez
      avoir des fonds qui vont plutôt acheter des actions à l’étranger, qui seront des
      fonds plus risqués mais plus rentables bien sûr. Vous avez aussi des fonds qui
      vont plutôt acheter ce qu’on appelle des valeurs monétaires, c’est-à-dire des
      prêts à court terme avec des taux d’intérêt très faibles, d’ailleurs souvent
      négatifs. L’idée c’est de vous garantir de ne pas perdre, donc de vous garantir
      la sécurité sans vous donner de rendement. Donc vous, en tant qu’investisseur,
      vous avez le choix : soit vous allez vers les hauts rendements, mais il y aura
      un risque ; soit vous allez vers des bas rendements, mais sans risque. C’est un
      arbitrage, un choix qui vous est laissé, qui n’est pas simple à faire. L’AMF
      vérifie que vous êtes bien informé sur les risques que vous prenez, et cela
      évidemment est extrêmement important.
