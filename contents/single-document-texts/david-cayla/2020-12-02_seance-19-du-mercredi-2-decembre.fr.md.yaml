    text: |-
      Ce qui est plus courant, ce ne sont pas les SICAV. Les SICAV, vous pouvez
      acheter des actions de SICAV. Si cela vous intéresse, vous pouvez aller regarder
      dans le journal *Les Échos* : à la fin, vous avez tous les taux d’intérêt, les
      prix d’achat des actions. Bien sûr, vous avez toujours un résumé de l’évolution
      des cours de bourse tous les jours de chaque entreprise du CAC 40, mais vous
      avez aussi les SICAV. Et puis vous avez les fonds communs de placement. Les
      fonds communs de placement, c’est forcément émis par une banque, donc une
      société commerciale, une société de gestion, une banque. En fait, il s’agit
      beaucoup plus d’un… typiquement, ce n’est pas vous qui gérez, vous n’êtes pas
      copropriétaire. Vous confiez votre argent à un fonds qui est géré par une
      banque, très souvent donc la société de gestion, et qui va placer pour vous
      l’argent. Le FCP est donc une copropriété de valeurs mobilières qui émet des
      parts, mais ces parts ne vous donnent pas le droit de participer aux décisions.
      Vous n’avez pas vraiment de droit politique. La seule chose que vous avez le
      droit, c’est d’exiger de la part du gestionnaire du fonds qu’il prenne des
      décisions en fonction de votre intérêt. Cela est très important : il gère votre
      épargne dans votre intérêt exclusif. Je ne sais pas si c’est marqué ici. Oui,
      c’est ça : la société commerciale, dite société de gestion, agit au nom des
      porteurs de parts. Cela veut dire que vous êtes copropriétaire de l’actif et
      dans leur intérêt exclusif, donc dans votre intérêt à vous. Mais vous ne pouvez
      pas virer par exemple le gestionnaire, puisque c’est la société commerciale qui
      est censée gérer tout cela pour vous.
