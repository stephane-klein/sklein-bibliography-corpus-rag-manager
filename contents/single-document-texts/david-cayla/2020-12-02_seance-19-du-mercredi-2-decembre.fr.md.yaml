      Tesla par exemple, qui fait beaucoup parler parce que Tesla a vu son cours de
      bourse exploser ces derniers mois. La question qui se pose, c’est : est-ce que
      cette action que j’achète, je l’achète cher ou pas ? Est-ce que je me fais
      arnaquer ? Est-ce qu’elle est trop cher par rapport à ce qu’elle vaut ? Ou
      est-ce qu’au contraire c’est une bonne affaire, elle est moins chère par rapport
      à ce qu’elle vaut ? Évidemment, quand on réfléchit comme ça, se pose la question
      de savoir : mais combien elle vaut en vrai, au fond ? Et là c’est là que se pose
      le problème. Si vous voulez savoir si vous faites une bonne affaire en achetant
      une action, ou au contraire une mauvaise affaire, il faudrait savoir quelle est
      ce qu’on appelle sa valeur fondamentale.
