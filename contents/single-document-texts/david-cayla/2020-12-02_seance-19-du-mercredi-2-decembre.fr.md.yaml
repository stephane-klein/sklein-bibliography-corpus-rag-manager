      Donc la différence entre une SICAV et un FCP, c’est que dans une SICAV vous avez
      les véritables droits d’un actionnaire, parce que vous ne les avez pas dans le
      FCP. Très souvent le banquier, c’est cela qu’il va vous proposer : il va vous
      proposer un FCP, parce que c’est sa banque qui le propose. Pareil, dans une
      banque, n’importe quelle banque, il y a plein de FCP différents, parce qu’il y a
      des FCP qui ont une gestion risquée et fortement rémunératrice, et puis d’autres
      qui ont une gestion moins risquée et donc moins rémunératrice. On peut aussi
      voir des FCP de ce qu’on appelle la finance éthique, qui sont spécialisés dans
      le financement d’entreprises, de projets qui sont écolos ou sociaux. Là aussi,
      parfois cela gagne beaucoup d’argent. Donc on a des FCP qui peuvent être
      vraiment très variés, qui vont dépendre de ce que vous attendez, où vous voulez
