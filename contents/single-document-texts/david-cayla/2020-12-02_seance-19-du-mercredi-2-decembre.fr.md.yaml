  - chunk_index: 7
    heading_path: Séance 19 du mercredi 2 décembre > Annonces administratives
    content_token_count: 18
    text: Je pense que maintenant il est l’heure de commencer le cours magistral.
  - chunk_index: 8
    heading_path: Séance 19 du mercredi 2 décembre > La circulation financière
    content_token_count: 324
    text: |-
      Nous sommes sur la circulation financière. Nous avons vu la dernière fois que la
      circulation financière est d’abord une composante importante de l’économie,
      puisqu’elle permet d’organiser, de coordonner les besoins des uns et des autres,
      en particulier de deux types d’agents : les agents qui ont des capacités de
      financement, donc de l’épargne, et qui n’ont pas d’usage de cette épargne ; ils
      ont de l’argent en trop, ils ne savent pas quoi en faire, ils ne le consomment
      pas, donc ils l’épargnent. Très souvent, ces agents sont des ménages. De l’autre
      côté, on a les producteurs. Qui dit producteur dit nécessité d’investir dans du
      capital fixe, donc de trouver des sources de financement. Ces acteurs, ces
      agents, ont besoin d’utiliser l’argent qu’ont épargné les ménages. Ce qu’on
      constate, c’est que le système financier permet en quelque sorte de coordonner
      les besoins des uns et des autres : il va collecter l’épargne des agents à
      capacité de financement, essentiellement des ménages, et il va utiliser,
      financer grâce à cette épargne les besoins de financement des producteurs qui,
      comme sont producteurs, ont une activité d’investissement à long terme.
  - chunk_index: 9
    heading_path: Séance 19 du mercredi 2 décembre > La circulation financière
    content_token_count: 24
    text: |-
      Nous avions terminé le cours là-dessus, sur les trois modalités d’organisation
      de la finance.
  - chunk_index: 10
    heading_path: Séance 19 du mercredi 2 décembre > La circulation financière > La finance intermédiée
    content_token_count: 341
    text: |-
      Tout premièrement, ce qu’on appelle la finance intermédiée. Cela n’est pas dans
      le diaporama, mais vous pouvez l’écrire. La finance intermédiée, cela veut dire
      qu’il existe un intermédiaire bancaire. Cela veut dire que nous avons ici un
      mécanisme qui permet de créer la monnaie. Souvenez-vous, on l’a vu au chapitre
      précédent. Ce sont les ménages qui déposent de l’argent dans la banque, et en
      déposant cet argent, la banque va utiliser cet argent, on l’a vu, pour accorder
      des crédits aux entreprises et à l’État, aux administrations publiques. Dans ce
      cadre-là, il va y avoir création monétaire. Sachant que cela permet aussi
      d’expliquer que ce ne sont pas forcément les dépôts des ménages au sens strict
      qui sont utilisés : il y a comme une part de création monétaire, on l’a vu aussi
      dans le chapitre précédent. Ce sont les crédits qui font les dépôts, mais ce
      sont aussi les crédits qui font les dépôts ; il y a une forme de relation
      circulaire dans cette relation. C’est-à-dire que la banque n’est jamais en
      manque de dépôt, en fait, parce que tous les crédits qu’elle accorde finissent
      d’une manière ou d’une autre par se retrouver dans des dépôts.
  - chunk_index: 11
    heading_path: Séance 19 du mercredi 2 décembre > La circulation financière > La finance intermédiée
    content_token_count: 128
    text: |-
      Mais ce qu’il faut comprendre, c’est que grâce à ce système-là, il y a ce qu’on
      appelle une opération de transformation. Je ne vais pas y revenir, mais c’est en
      gros : les ménages ont des liquidités qu’ils peuvent réutiliser à tout moment,
      et les entreprises ont un crédit qu’elles ne peuvent rembourser qu’à l’échéance.
      Donc il y a une forme de sécurisation du crédit des entreprises et une
      sécurisation, de l’autre côté, des dépôts des ménages.
  - chunk_index: 12
    heading_path: Séance 19 du mercredi 2 décembre > La circulation financière > La finance semi-directe
    content_token_count: 390
    text: |-
      Ensuite, nous avons vu qu’il y avait une forme semi-directe. Elle passe par ce
      qu’on appelle des investisseurs institutionnels. On les appelle aussi parfois,
      dans le jargon, des « zinzins ». Ces investisseurs institutionnels sont
      essentiellement les assureurs, les fonds de pension. Eux récoltent des
      cotisations des ménages : les ménages achètent un service d’assurance. Avec cet
      argent, le fonds va placer cet argent sur les marchés financiers et ainsi
      financer les besoins des entreprises et des administrations publiques en
      achetant des titres. Donc des titres de placement : il peut acheter des actions
      d’entreprise, donc devenir copropriétaire des entreprises. On a d’ailleurs
      beaucoup d’entreprises, notamment des PME industrielles, qui peuvent être
      possédées par des fonds d’investissement, qui sont soit co-possédées, soit
      possédées directement. Les fonds de pension gèrent les retraites des gens. Comme
      ils ont une échéance très longue, parce qu’entre le moment où vous cotisez et le
      moment où vous recevez la retraite il peut se passer beaucoup de temps, ils font
      fructifier l’argent en achetant sur les marchés financiers donc des actions
      d’entreprise, qu’ils peuvent parfois co-gérer, et puis évidemment des
      obligations d’État ou des obligations d’entreprise, qui sont les titres de
      dette. Contrairement à la banque, il n’y a pas ici de création monétaire. Il n’y
      a pas de crédit derrière cela directement.
  - chunk_index: 13
    heading_path: Séance 19 du mercredi 2 décembre > La circulation financière > La finance directe et les OPCVM
    content_token_count: 106
    text: |-
      Enfin, et je m’en étais arrêté là, les ménages peuvent acheter directement sur
      les marchés financiers. Soit tout seuls : ils vont se connecter sur un site
      spécialisé, ils vont acheter des actions, des obligations ou n’importe quoi.
      Mais ils peuvent aussi, non pas eux-mêmes directement acheter, passer par des
      OPCVM, c’est-à-dire des organismes de placement collectif en valeurs mobilières.
  - chunk_index: 14
    heading_path: Séance 19 du mercredi 2 décembre > La circulation financière > La finance directe et les OPCVM
    content_token_count: 327
    text: |-
      Je vais vous expliquer un peu ce que cela signifie. Nous avons bien ici un
      organisme, donc quelque chose qui est une institution. « Placement collectif »
      veut dire qu’on va placer de l’argent, donc c’est bien un mécanisme d’épargne,
      on rend service à l’épargnant. « Collectif » veut dire ensemble : on va avoir un
      pool de personnes, en gros on va collecter l’épargne de beaucoup de personnes
      pour créer une masse financière suffisante pour, on va le voir, diversifier,
      etc. Je vais vous en parler. Et les valeurs mobilières : ce qu’on appelle
      valeurs mobilières, c’est quelque chose qui n’est pas immobilier. Donc qui est
      en fait très souvent ce qu’on appelle des titres, des titres financiers. Il va
      placer essentiellement sous forme de titres financiers. C’est-à-dire qu’il ne va
      pas placer ni dans l’immobilier, dans le logement, les bâtiments, etc., ni dans
      les entreprises, le capital fixe directement. Donc il ne va pas investir dans la
      production, dans l’investissement, la formation de capital fixe, mais il va
      investir dans la finance, c’est-à-dire dans racheter des choses qui peuvent
      s’échanger facilement : ce sont les titres de dette ou de propriété que sont les
      obligations et les actions.
  - chunk_index: 15
    heading_path: Séance 19 du mercredi 2 décembre > La circulation financière > La finance directe et les OPCVM
    content_token_count: 45
    text: |-
      Donc c’est cela qu’on appelle un OPCVM : c’est un fonds de placement en titres
      financiers, qui sont les actions et les obligations qu’on a vues par ailleurs.
  - chunk_index: 16
    heading_path: Séance 19 du mercredi 2 décembre > La circulation financière > La finance directe et les OPCVM
    content_token_count: 403
    text: |-
      Je voudrais qu’on revienne sur les OPCVM, du coup, que je vous explique, parce
      que sans doute qu’à votre âge vous n’avez pas encore beaucoup de stratégies,
      beaucoup d’épargne qui vous permettent de placer de l’argent, vos économies,
      dans les OPCVM. Mais un jour ça viendra. Souvent à 50 ans, on commence à avoir
      beaucoup d’épargne, on prépare sa retraite, on ne sait pas quoi en faire, et on
      ne peut pas évidemment la laisser uniquement dans un livret A, d’abord parce que
      c’est plafonné, ensuite parce que la rémunération n’est pas très importante.
      Donc parfois on va voir son banquier, on dit : voilà, j’ai beaucoup d’épargne,
      qu’est-ce que vous me proposez ? En général, le banquier vous propose des OPCVM.
      En fait, en tant que banquier, c’est un peu son rôle aussi : il va collecter
      votre épargne. Vous allez dire : je vais mettre 1 000 €, 10 000 €, 50 000 €,
      cela peut être des sommes très importantes, parce que cela n’a pas de sens de
      mettre 100 € dans ce genre de choses. Et il va donc placer pour vous cet argent
      en mutualisant les parts d’autres personnes. Ce n’est pas vous qui gérez les
      placements, c’est un trader qui va le faire, donc un employé de la banque, qui
      va choisir, à partir de l’ensemble de l’argent qu’il possède, où placer cet
      argent pour le faire fructifier au mieux, et vous rendre les bénéfices de ce
      placement, avec bien sûr une commission derrière.
  - chunk_index: 17
    heading_path: Séance 19 du mercredi 2 décembre > La circulation financière > La finance directe et les OPCVM
    content_token_count: 174
    text: |-
      Pourquoi placer son argent dans un OPCVM, pourquoi ne pas placer son argent
      directement ? Parce qu’en fait, malgré le fait qu’il existe des coûts de gestion
      — c’est marqué ici comme un inconvénient : coûts de gestion —, parfois il peut y
      avoir des coûts d’entrée, vous devez cotiser à quelque chose pour ensuite
      pouvoir placer l’argent. Coût de gestion, cela veut dire que le trader va être
      rémunéré, il va être rémunéré par le profit qu’il va faire, donc vous n’aurez
      pas tout le profit de ces placements. Mais malgré tout, cela peut être
      intéressant de le faire parce que cela va permettre de faciliter la
      diversification.
  - chunk_index: 18
    heading_path: Séance 19 du mercredi 2 décembre > La circulation financière > La finance directe et les OPCVM
    content_token_count: 57
    text: |-
      Ici je vous demande de noter, parce que c’est un mot en rouge déjà, et c’est un
      concept extrêmement important en finance, que vous aurez l’occasion de revoir
      plus tard, mais pourquoi pas commencer maintenant dès la première année.
  - chunk_index: 19
    heading_path: Séance 19 du mercredi 2 décembre > La diversification
    content_token_count: 458
    text: |-
      Concrètement, quand on achète, quand on place de l’argent sur les marchés
      financiers, l’objectif évidemment c’est de perdre le moins possible,
      c’est-à-dire d’éviter que les actions, les actifs qu’on achète perdent en
      valeur. Cela est possible : vous pouvez acheter les actions d’une entreprise,
      l’entreprise fait faillite — ça arrive régulièrement —, votre action ne vaudra
      plus rien, donc vous serez propriétaire de plus rien. Vous allez acheter 20 €
      l’action et elle va à zéro : vous pouvez perdre 20 €. Au contraire, le cours de
      l’action peut augmenter, on va voir cela tout à l’heure, comment cela se passe
      dans les marchés financiers, et dans ce cas-là vous gagnez de l’argent. Mais en
      fait vous ne gagnez pas uniquement de l’argent en pari sur l’évolution du cours
      du titre que vous achetez ; vous gagnez aussi simplement de l’argent parce que,
      souvenez-vous, les actions vous permettent d’obtenir un dividende : tous les
      ans, l’entreprise rémunère ses actionnaires. De la même façon, si vous achetez
      des titres de dette, des obligations, vous touchez un intérêt. C’est surtout
      cela qui est intéressant aussi dans le placement. Mais comme je l’ai dit tout à
      l’heure, il y a des risques : la faillite d’entreprise, le fait que l’entreprise
      vous a promis un dividende élevé et finalement il n’y aura pas de dividende
      cette année parce qu’elle n’a pas fait assez de profit, voire a fait des pertes.
      Le cours de l’action peut donc varier ; le cours de l’obligation peut varier
      aussi. Vous avez une obligation d’entreprise qui fait faillite : pareil, vous
      perdez la valeur de l’obligation.
  - chunk_index: 20
    heading_path: Séance 19 du mercredi 2 décembre > La diversification
    content_token_count: 209
    text: |-
      Donc quand vous placez de l’argent sur les marchés financiers, il y a ce qu’on
      appelle un arbitrage, un choix à faire entre le risque que vous prenez et les
      gains que vous obtenez. Il faut gérer les deux, parce que si on vous promet
      beaucoup, beaucoup de gains mais avec de forts risques de faillite, évidemment
      c’est moins intéressant que si on vous promet peu de gain mais certains. C’est
      tout le talent et le travail d’un trader et d’un analyste financier : essayer
      d’évaluer les risques et donc de vous aider à placer cet argent. Bien sûr, quand
      vous êtes tout seul à devoir choisir comment placer votre argent, vous avez du
      mal à le faire parce que vous n’avez pas forcément les connaissances. Mais il y
      a aussi une autre chose qu’il faut voir : justement cet aspect de
      diversification.
  - chunk_index: 21
    heading_path: Séance 19 du mercredi 2 décembre > La diversification
    content_token_count: 521
    text: |-
      Comme tout placement est risqué, vous êtes rémunéré en fonction du risque. On
      peut dire par exemple que plus un placement est risqué, plus il va vous
      permettre d’avoir des gains élevés, parce qu’il faut compenser le risque pour
      attirer des investisseurs. On peut considérer premièrement qu’il y a une
      première loi de la finance, si je peux dire une première règle de base : plus le
      risque est élevé, plus la rémunération sera importante. C’est ce qu’on appelle
      la prime de risque. C’est-à-dire que lorsque vous prêtez à l’Allemagne, par
      exemple, vous avez quasiment aucun risque, donc la rémunération sera très très
      faible. Aucun risque de non-remboursement : le seul risque qui peut y avoir,
      c’est le non-remboursement, donc le taux d’intérêt sera très faible. Il peut
      même être à zéro, voire négatif. En ce moment, on a des taux d’intérêt négatifs.
      Pourquoi ? Parce que les chances, entre guillemets, ou le risque que l’Allemagne
      fasse faillite et ne rembourse pas sa dette est très très faible. D’ailleurs, en
      passant, c’est le même cas de la France : la France est considérée comme un
      emprunt sans risque. Prêter à la France, ce n’est pas prendre de risque. Par
      contre, vous achetez des actions d’une start-up qui vient de rentrer en bourse,
      qui a un modèle économique intéressant, mais on ne sait pas trop ce qui va se
      passer : là vous prenez un risque. Vous investissez dans le secteur automobile
      et tout d’un coup les gens arrêtent d’acheter des voitures : là vous avez un
      risque. Vous achetez les actions d’une entreprise pharmaceutique qui développe
      un médicament prometteur et finalement on s’aperçoit que ce vaccin n’est pas
      efficace ou n’a pas été accepté : là aussi vous prenez un risque. Donc vous
      prenez des risques plus ou moins importants dès le départ.
  - chunk_index: 22
    heading_path: Séance 19 du mercredi 2 décembre > La diversification
    content_token_count: 400
    text: |-
      Mais il y a une manière de contourner ce risque : c’est d’investir dans des
      secteurs qui ne sont pas soumis au même risque. Par exemple, on l’a vu dans les
      chapitres précédents : en cas de récession, l’industrie automobile va être
      directement affectée, parce que l’automobile c’est un bien durable, et quand les
      agents économiques perdent confiance, ou les consommateurs perdent confiance
      dans le revenu futur, dans l’état de l’économie, ils ont tendance à renoncer ou
      à reporter des achats durables. Donc dès qu’il y a une crise économique, le
      secteur automobile s’effondre. Mais quand il y a une crise économique, et
      notamment quand il y a une crise sanitaire comme celle que l’on connaît, qui va
      profiter de la crise ? Les entreprises qui vendent des médicaments, ou par
      exemple les biens non durables, par exemple les grandes surfaces : elles vont
      davantage résister, notamment sur la vente de produits alimentaires, que les
