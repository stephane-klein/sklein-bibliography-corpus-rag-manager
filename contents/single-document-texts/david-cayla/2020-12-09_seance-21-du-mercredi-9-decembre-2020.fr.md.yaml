    text: |-
      Que va-t-il se passer pour l’entreprise ? Elle va embaucher. C’est pour ça que
      je vous ai dit ici une petite nuance ; je vais bien la donner parce que parfois
      dans les médias on ne lit pas ce genre de choses, alors ça me semble absolument
      indispensable. Quand une entreprise décide d’investir, il s’agit d’un engagement
      à long terme. Si vous investissez sur 10 ans, par exemple vous faites construire
      une nouvelle unité de production qui va servir sur 10 ans, au bout de 6 mois
      vous ne pouvez pas la bazarder et la revendre, vous allez perdre énormément.
      Vous investissez en construisant un bâtiment : là vous avez une durée
      d’amortissement sur 20 ou 30 ans. Il est clair que si le bâtiment n’est pas
      conforme à ce que vous voulez, ou si vous voulez le bazarder, vous ne pourrez
      pas. Donc l’investissement, c’est un engagement à très long terme et qui est
      extrêmement peu flexible. Bien sûr, on peut toujours revendre, mais pas toujours
      ; parfois on a du capital totalement spécifique, spécifique pour vous, qui
      n’intéresse absolument personne. Par exemple, vous faites construire une voie de
      chemin de fer. Cette voie de chemin de fer n’est pas rentable, elle ne sera pas
      rentable pour vous, mais elle ne sera pas rentable pour n’importe qui non plus,
      donc personne ne voudra l’acheter. Finalement, qu’est-ce que vous faites si vous
      voulez récupérer un peu d’argent sur votre chemin de fer ? Vous êtes obligé de
      quasiment décrocher les voies et de revendre l’acier à la casse. Et ça,
      évidemment, ça ne rapporte rien par rapport au coût de construction de la voie
      de chemin de fer. Donc quand une entreprise investit, elle s’engage à long
      terme, et si le profit n’est pas suffisant, elle perd et elle fait faillite.
  - chunk_index: 12
