    text: |-
      À l’inverse, quand une entreprise recrute, son engagement est beaucoup plus
      flexible, beaucoup moins strict qu’un engagement d’investissement. Il est
      toujours possible de rompre un contrat de travail, il est toujours possible de
      licencier quelqu’un qu’on a employé en CDI, et même aujourd’hui avec les
      nouveaux systèmes de CDI on peut avoir des périodes d’essai extrêmement longues
      dans lesquelles on licencie sans aucune cause. Donc ça veut dire que parfois,
      pour des missions de 4 ou 5 mois, parfois on préfère prendre des CDI qu’on va
      rompre au bout de 4 ou 5 mois plutôt que des CDD. Mais on a aussi bien sûr des
      CDD, on a aussi de l’intérim. Quand on est sur ces niveaux de contrat, la
      flexibilité est extrêmement forte et l’entreprise peut à tout moment se séparer
      des salariés si elle voit que finalement elle n’arrive pas à leur donner du
      travail, ou que la production de ces salariés n’est pas suffisante par rapport à
      leur coût. Si je vous dis ça, c’est parce qu’on nous explique très souvent, à
      longueur de temps, qu’il faut absolument flexibiliser les contrats de travail,
      que c’est une charge trop importante pour l’entreprise. Moi j’ai envie de
      répondre : si l’entreprise n’est pas capable de prendre des risques, ou si le
      cœur de l’entreprise n’est pas justement la gestion du risque et de
      l’investissement, comment peut-on ensuite nous dire que le contrat de travail en
      lui-même est un truc catastrophique pour les entreprises ? Ça n’a pas de sens.
      Je veux dire, une entreprise qui est capable d’investir et de prévoir un taux de
      profit ou un profit sur 20 ou 30 ans, elle est capable de ne pas avoir peur de
      recruter en CDI. Donc cette histoire que les emplois doivent être absolument
      flexibles pour éviter le chômage et permettre l’embauche, c’est ne pas vraiment
      comprendre ce que c’est qu’une entreprise, qui par définition risque et prend
      des risques, notamment lorsqu’elle décide d’investir. Et une entreprise qui
      n’investit pas, qui n’est pas capable de prendre des risques, à mon avis elle
      n’est pas non plus capable d’embaucher des gens. C’était la petite parenthèse,
      pour aussi expliquer pourquoi je ne crois absolument pas que les politiques de
      flexibilisation du marché du travail ont la moindre efficacité réelle sur le
      taux de chômage. Concrètement, je pense que si ça a un effet, ça a un effet
      extrêmement marginal, contrairement à ce que croient beaucoup d’économistes ; on
      y reviendra tout à l’heure.
