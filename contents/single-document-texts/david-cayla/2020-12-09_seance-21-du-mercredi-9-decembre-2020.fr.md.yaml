    text: |-
      Pourquoi a-t-on cette décroissance de la production marginale du travail ? Pour
      deux raisons théoriques. La première, c’est celle de Ricardo sur les terres.
      Souvenez-vous : les terres sont de fertilités différentes, donc on va cultiver
      d’abord les terres les plus fertiles, donc logiquement plus on augmente la
      production, plus on va se retrouver avec des terres moins fertiles. On pourrait
      dire de la même façon que les travailleurs qu’on va embaucher sont au départ de
      performances différentes, et qu’on va d’abord recruter les meilleurs, puis
      qu’après il nous restera forcément les moins bons. Évidemment, cette théorie
      n’est pas hyper convaincante, parce que déjà un processus de recrutement qui
      arrive à identifier les meilleurs, c’est quasiment impossible ; le recrutement
      c’est très compliqué, très difficile. Le salarié met du temps à s’habituer à son
      entreprise, et la performance est aussi très difficile à mesurer à l’échelle
      individuelle, puisque le travail est toujours collectif, ce n’est pas aussi
      clair. Et puis, tous les 6 mois vous avez un renouvellement important des
      personnes que vous pouvez recruter : ceux qui sortent des études, ceux qui ont
      changé d’emploi, etc. Enfin, si vous mettez la même annonce à 6 mois
      d’intervalle, vous n’avez forcément pas du tout les mêmes personnes. Donc l’idée
      qu’il existe un stock fini de travailleurs qui sont toujours les mêmes et qui
      attendent, et puis vous prenez le meilleur, ensuite le deuxième meilleur,
      ensuite le troisième meilleur, tout ça me paraît très abstrait et pas forcément
      pertinent. Néanmoins, je vous donne la théorie telle qu’elle existe : il faut
      bien justifier cette courbe de décroissance, et la première justification c’est
      celle-ci.
