    text: |-
      Je vous propose de commencer directement ce dernier cours. Pour commencer, je
      reviens sur ce qu’on a vu la dernière fois. On s’était arrêtés sur la
      productivité… non, pardon, sur l’informatique, sur le fait qu’on va acheter un
      parc informatique. On a vu qu’il fallait comparer le taux de profit marginal
      avec le taux d’intérêt pour savoir combien d’ordinateurs ou d’unités
      informatiques il faudrait acheter. Il y avait un petit souci dans le graphique
      précédent, donc je vous le refais ici ; je m’en suis aperçu en le refaisant.
  - chunk_index: 1
    heading_path: 'Séance 21 du mercredi 9 décembre 2020 > Reprise du cours précédent : investissement et coût d’opportunité'
    content_token_count: 140
    text: |-
      Nous avons ici une courbe de profit marginal, qui représente le profit de chaque
      unité qu’on achète. En abscisse… je ne sais plus… en ordonnée, le profit
      marginal, et horizontalement le capital. En fait, à chaque fois que vous ajoutez
      une unité de capital, vous grandissez, puis vous regardez le profit. Au début,
      les premières unités de capital rapportent beaucoup, puis progressivement, plus
      vous ajoutez des unités informatiques, moins ces unités informatiques seront
      utiles, et donc plus le profit marginal de chaque unité va baisser.
  - chunk_index: 2
    heading_path: 'Séance 21 du mercredi 9 décembre 2020 > Reprise du cours précédent : investissement et coût d’opportunité'
    content_token_count: 326
    text: |-
      La question est : jusqu’où aller ? La première idée spontanée, si on ne fait pas
      une étude d’économiste, serait de dire : tant qu’on gagne du profit, on achète
      l’unité informatique, c’est-à-dire qu’on va s’arrêter jusqu’à ce point
      d’intersection où on arrive à une rentabilité négative. Mais en réalité, ce
      n’est pas comme ça qu’il faut raisonner quand on est économiste, puisqu’il faut
      comparer la profitabilité de chaque unité de capital avec le coût du capital. Or
      le coût du capital, que ce soit un coût direct ou un coût indirect, que ce soit
      un coût parce qu’on emprunte et donc qu’on paie des intérêts, ou que ce soit…
      merci, l’ordonnée à la verticale et l’abscisse à l’horizontale, merci, j’oublie
      toujours… que ce soit un coût direct ou indirect, c’est-à-dire qu’on paie
      directement un intérêt parce qu’on a emprunté, ou alors on n’emprunte pas, donc
      on ne va pas payer d’intérêt, mais on aurait pu utiliser cet argent autrement en
      le plaçant, en le prêtant à quelqu’un, donc là on aurait gagné un intérêt sans
      risque.
  - chunk_index: 3
    heading_path: 'Séance 21 du mercredi 9 décembre 2020 > Reprise du cours précédent : investissement et coût d’opportunité'
    content_token_count: 257
    text: |-
      C’est ça qu’il faut comparer : il faut comparer le profit de l’unité de capital
      avec l’usage alternatif qu’on aurait pu avoir de cet argent. C’est ce qu’on
      appelle le coût d’opportunité. C’est la raison pour laquelle, dans les deux cas
      — j’insiste — que vous empruntiez ou non, vous regardez toujours le niveau des
      taux d’intérêt. Si le niveau des taux d’intérêt est par exemple là, alors le
      niveau optimal d’investissement va être k étoile ici, c’est-à-dire que tout ce
      qui est en dessous, tout ce qui rapporte moins que ce que vous rapporte un
      intérêt, ne vaut pas la peine d’investir. J’espère être très clair. Pourquoi je
      refais ça ? Parce que j’ai regardé, j’ai vérifié que sur le diaporama j’avais
      mis ça à un autre endroit, parce que j’avais refait le graphique, et je voulais
      être sûr que vous avez bien compris le sens de ce graphique.
  - chunk_index: 4
    heading_path: 'Séance 21 du mercredi 9 décembre 2020 > Reprise du cours précédent : investissement et coût d’opportunité'
    content_token_count: 312
    text: |-
      Ensuite, on regarde un exemple concret : on calcule le taux de profit marginal.
      Il faut calculer le taux de profit marginal ; je vous ai donné la méthode, je ne
      reviens pas dessus. Si on calcule ce taux de profit marginal, on arrive ici à ce
      que, si on achète quatre unités — on considère ici que les unités informatiques
      ne sont pas divisibles, qu’on peut faire 4 ou 5, mais pas 4 et demi —, la
      dernière unité qu’il va racheter, c’est la 4e, puisqu’elle rapporte un taux de
      profit supérieur au taux d’intérêt, ici un taux d’intérêt élevé à 10 %, mais peu
      importe, c’est pour le calcul que je vous présente. Donc ici ça vaut le coup,
      mais ici ça ne vaut pas le coup, parce que si on a de l’argent pour acheter une
      5e unité, elle serait beaucoup mieux placée à rapporter 10 % d’intérêt
      qu’investie dans cette unité informatique qui, même si elle est profitable au
      sens strict, n’est pas profitable au sens où le taux de profit qu’elle apportera
      sera inférieur à son coût d’opportunité ou à son coût direct si on emprunte.
      C’est clair ?
  - chunk_index: 5
    heading_path: 'Séance 21 du mercredi 9 décembre 2020 > Reprise du cours précédent : investissement et coût d’opportunité'
    content_token_count: 310
    text: |-
      Là, on a regardé… on est dans le chapitre sur la production. On a regardé ce qui
      détermine l’investissement d’une entreprise, c’est-à-dire pourquoi une
      entreprise investit. Souvenez-vous : on investit pour plein de raisons : pour
      remplacer le capital usagé, ou pour améliorer, augmenter la quantité de
      production, c’est ce qu’on appelle l’investissement de capacité ; ou alors elle
      peut simplement investir parce qu’elle veut améliorer la productivité du travail
      ; et parfois elle fait un peu les deux, un investissement de productivité et un
      investissement de capacité. Quoi qu’il en soit, dans ces deux cas — quand il ne
      s’agit pas d’investissement de renouvellement, où là ce n’est pas vraiment un
      investissement, on remplace du capital usagé —, il y a une logique économique.
      Cette logique économique, c’est toujours qu’on va investir si l’investissement
      est profitable, c’est-à-dire si le profit attendu de cet investissement est
      supérieur au coût qu’on va avoir. En fait, on va s’arrêter au moment où on
      n’aura plus de capacité, ou plutôt où ça sera plus intéressant d’un point de vue
      financier d’investir.
  - chunk_index: 6
    heading_path: 'Séance 21 du mercredi 9 décembre 2020 > Reprise du cours précédent : investissement et coût d’opportunité'
    content_token_count: 260
    text: |-
      Maintenant, je continue la réflexion. Puisqu’on a deux facteurs de production,
      capital et travail, il faut aussi s’intéresser à ce qui détermine l’emploi,
      c’est-à-dire pourquoi on décide de recruter un salarié. Vous allez voir que la
      logique de recrutement est très similaire à la logique d’investissement. On va
      comparer deux choses de la même façon : la production de chaque salarié, qu’on
      peut appeler sa productivité individuelle — on fait le rapport entre la
      production et l’individu —, et son coût. Le coût du salarié, c’est, si on
      simplifie, le salaire, le coût total employeur, qui correspond au salaire plus
      les cotisations. Donc tant qu’on a des individus qui sont efficaces, ou qui
      rapportent plus que ce coût, on va les recruter ; quand on a des individus qui
      rapportent moins que ce qu’ils coûtent, on ne va pas les recruter. Vous voyez,
      le raisonnement est extrêmement simple.
  - chunk_index: 7
    heading_path: 'Séance 21 du mercredi 9 décembre 2020 > Reprise du cours précédent : investissement et coût d’opportunité'
    content_token_count: 441
    text: |-
      Il y a aussi un élément que je ne vais pas prendre en compte ici, parce qu’on en
      a déjà parlé : l’élément de substitution capital-travail. L’une des choses qu’il
      faut prendre en compte, c’est : est-ce qu’il vaut mieux recruter quelqu’un ou
      est-ce qu’il vaut mieux embaucher une machine pour faire ce travail ? Le souci,
      c’est que bien sûr on ne peut pas toujours substituer du capital au travail.
      Dans les manuels, bien sûr, on vous dit oui, oui, bien sûr, mais en fait il y a
      beaucoup de travail qui ne peut pas se faire par une machine. Ce qu’on constate,
      c’est que très vite les écarts de prix sont tellement évidents qu’il n’y a pas
      10 000 façons de faire les choses, il n’y a pas un choix énorme sur ces
      questions. Mais ce qu’on a vu quand même, c’est que dans ce cadre on a bien un
      lien — on l’a vu la dernière fois — entre niveau du salaire et niveau d’emploi.
      Souvenez-vous : si on peut permuter une machine par un salarié, faire le travail
      par une machine ou par un salarié, on a vu que la combinaison productive ne va
      pas forcément toujours être la même. On peut utiliser cinq machines et cinq
      salariés, ou quatre machines et six salariés, ou l’inverse. Donc tout dépend du
      coût du travail. Même si on ne peut pas substituer tous les travailleurs à des
      machines, on a parfois une petite marge de manœuvre sur le niveau d’emploi qu’on
      veut. On peut avoir des entreprises qui seront avec beaucoup de travail et peu
      de capital, et d’autres qui seront plutôt avec plus de capital et peu de
      travail. Donc ça dépend des prix relatifs des facteurs de production et de la
      combinaison productive, de l’efficacité.
  - chunk_index: 8
    heading_path: 'Séance 21 du mercredi 9 décembre 2020 > Reprise du cours précédent : investissement et coût d’opportunité'
    content_token_count: 796
    text: |-
      Je reviens sur le fait que parfois il n’y a pas de possibilité : dans un salon
      de coiffure — je vous avais donné cet exemple —, on ne peut pas acheter plus de
      fauteuils et de ciseaux et licencier des coiffeurs en disant : grâce au capital
      supplémentaire, on va pouvoir produire davantage. Non, là il y a une stricte
      complémentarité, c’est-à-dire que le capital et le travail sont totalement
      complémentaires, ils ne sont pas du tout substituables. Donc là il n’y a pas de
      possibilité de s’amuser avec une combinaison productive autre. Par contre, oui,
      peut-être que les caisses automatiques dans les supermarchés, par exemple, où
      c’est le client lui-même qui scanne son produit, ça peut entraîner une hausse de
      productivité des agents de caisse, parce qu’ils surveilleront plus de caisses.
      Il y aura bien ici une forme de substitution du capital au travail. Mais
      voyez-vous, ce n’est pas tout à fait la même chose. C’est pour cette raison que
      toutes les caisses ne sont pas automatiques dans les supermarchés : ce n’est pas
      tout à fait le même rapport au client, les clients ne sont pas tous d’accord
      pour faire passer leurs produits, ça prend plus de temps aussi pour les clients,
      ça prend plus de place aussi. Donc ce n’est pas automatique, et les caisses ne
      vont pas disparaître du jour au lendemain. Il y a des tentatives de supermarchés
      totalement automatisés qui existent aussi ; par exemple Amazon est en train de
      créer ça aujourd’hui en Californie. Mais là aussi, ça ne veut pas dire qu’il n’y
      aura plus du tout de travail humain, parce qu’il faudra bien étiqueter les
      produits, il faudra bien leur mettre sur chaque produit une puce pour savoir
      quand est-ce qu’elle sort et pour les identifier. Donc le principe de ces
      magasins Amazon, c’est que les gens arrivent, prennent les produits qu’ils
      souhaitent et repartent avec les produits ; ils ne passent même plus par une
      caisse, en fait c’est immédiatement débité sur leur compte. Mais bien sûr, il
      faut un compte, bien sûr avec Amazon par exemple, en ayant donné sa carte bleue,
      il faut que ce compte soit crédité. Il faut éviter le pillage, donc il faut
      quand même que l’accès au magasin soit sécurisé, donc sans doute qu’il va
      falloir du personnel. Et puis il faut, je vous dis, mettre une puce sur chaque
      produit. Par exemple, est-ce que vous allez pouvoir acheter un kilo de pommes en
      vrac ? Ça ne sera plus du tout possible dans ce genre de magasin, parce qu’on ne
      peut pas mettre des puces sur chaque pomme ; évidemment ça les dénaturerait.
      Donc tout sera préemballé. Par ailleurs, le prix de ce que vous allez acheter va
      intégrer aussi le prix de la puce et le prix du travail de ceux qui vont mettre
      les puces sur chaque produit. Donc voyez, méfiez-vous aussi de ces prophètes qui
      vous expliquent que bientôt il n’y aura plus jamais de caisse. Je pense que les
      choses sont un peu plus compliquées que ça.
  - chunk_index: 9
