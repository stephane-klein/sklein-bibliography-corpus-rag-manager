      C’est là qu’on voit ici, avec ce petit exemple tout bête, très théorique, l’une
      des grandes questions politiques actuellement, qui est menée très souvent : on
      voit des partis politiques, des responsables politiques, ou même des citoyens,
      dire : « Mais c’est scandaleux, regardez, cette entreprise fait des profits et
      pourtant elle licencie ! » Et bien en fait, c’est ça, ça s’explique comme cela :
      pourquoi elle licencie alors qu’elle fait des profits ? Parce qu’en fait le cœur
      de l’emploi n’est pas la production, la maximisation de la production ; le cœur
      de l’emploi dans une entreprise qui est soumise à la volonté de ses
      actionnaires, ces actionnaires qui sont rémunérés par rapport au profit, ce
      n’est donc pas de maximiser la production de richesse, ce n’est pas de maximiser
      l’emploi, c’est de maximiser les profits. Donc ici, même si elle va baisser son
      chiffre d’affaires, ça vaut le coup de passer de 6 à 4 salariés. Donc le
      licenciement, il faut le voir comme une volonté de maximiser le profit et non
      pas une volonté de sauver l’entreprise, parce que l’entreprise à 6 salariés est
      tout à fait rentable. Et ça, c’est certaines choses que parfois les gens ont du
      mal à comprendre, y compris dans les copies d’étudiants. Dans vos copies, je lis
      parfois : « Il faut que l’entreprise fasse du profit pour qu’elle embauche. »
      Absolument pas. Il n’y a pas besoin de faire du profit pour embaucher. Le profit
      ne sert pas à embaucher. La question qui se pose sur l’embauche, c’est la
      maximisation du profit. À partir du moment où on considère que l’entreprise a
      pour vocation unique de maximiser ses profits, on fait du profit quand on a 150
      000… 150 000, 6 salariés, on fait du profit. On pourrait tout à fait, avec ce
      profit de 30 000 €, recruter un 7e salarié, même si ce 7e salarié ne rapporte
      rien ; mettons que sa production marginale soit de zéro. On pourrait tout à fait
      avec ces 30 000 € payer 20 000 € d’un salarié en plus et puis se retrouver à
      maximiser comme ça son niveau d’emploi. On ferait encore 10 000 € de profit.
      Oui, mais justement 10 000 € de profit, c’est moins que 52 000 €. Si d’ailleurs
      on est passé de 2 à 4, c’est aussi pour la même raison. Regardez : si on avait
      un taux d’emploi avec deux salariés, une petite entreprise de deux salariés, son
      coût total c’est 2 × 20 000 = 40 000 €. Ce qu’elle produit, c’est 85 000 €. 85
      000 € moins 40 000 €, on a 45 000 €, on a un profit inférieur. Le niveau
      d’emploi de 4 est bien au niveau où le profit est maximal. C’est ça qui importe.
