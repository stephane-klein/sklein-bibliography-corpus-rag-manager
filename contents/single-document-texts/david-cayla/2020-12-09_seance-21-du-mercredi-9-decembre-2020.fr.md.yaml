      Prenons un exemple d’application stricte de cette loi que je viens de vous dire.
      Vous avez donc un choix d’emploi : 0, 1, 2, 3, 4, 5, 6. Ici une production. Si
      vous avez aucun employé, forcément votre production est zéro. Le salaire est
      déterminé par le marché du travail, qui vous dit… alors c’est un salaire annuel,
      rassurez-vous les enfants. Donc on est sur un petit salaire en réalité, parce
      que c’est le coût total du travail : on est quasiment au SMIC, pas tout à fait,
      un peu plus, mais pas beaucoup plus. Vous êtes en train de regarder combien il
      faut recruter de gens. Pour ça, vous regardez ce que ça vous rapporte à chaque
      fois de recruter une personne, deux personnes, etc. C’est ça la production :
      elle augmente — 50 000, 85 000, 110 000, 132 000, 145 000, 150 000. Vous voyez.
      Et puis ensuite, qu’est-ce qu’on fait ? On regarde la production marginale, ce
      qu’apporte le dernier salarié, et c’est ainsi qu’on va voir s’il est utile de le
      recruter ou non. Donc le premier salarié nous a fait passer de 0 à 50 000 —
      pardon — donc il a une production marginale de 50 000. Le deuxième nous a fait
      passer d’une production de 50 000 à 85 000, donc il a une production marginale
      de 35 000, l’écart entre 85 000 et 50 000. Et ainsi de suite : 25 000, 22 000,
      13 000. Ce n’est vraiment pas très compliqué. Quand est-ce que la production
      marginale est supérieure au salaire ? Partout, jusqu’au 4e. Et après, ça n’est
      plus supérieur, ça devient inférieur, donc il n’est plus utile d’embaucher. Donc
      nous avons ici un niveau d’emploi optimal qui est 4 : 4 salariés. Le 4e me
      rapportera 22 000 et me coûtera 20 000. On voit d’ailleurs ici — si on laisse
      tomber tous les autres coûts, parce qu’il n’y a pas que ça comme coût, bien sûr,
      je veux dire l’entreprise n’a pas que des salaires comme coût, mais imaginons
      que ce soit le coût — alors on voit qu’ici elle fait le profit maximal, puisque
      finalement à quatre salariés, ça coûte combien ? Ça coûte 4 × 20 000, donc 80
      000. Combien ça lui rapporte au total ? 132 000. Donc elle fait 52 000 € de
      profit. Là aussi, encore une fois, je considère qu’il n’y a pas d’autre coût que
      le salaire, ce qui évidemment est une hypothèse forte.
