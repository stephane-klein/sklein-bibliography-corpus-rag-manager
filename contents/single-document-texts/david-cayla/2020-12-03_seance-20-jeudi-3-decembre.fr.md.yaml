chunks:
  - chunk_index: 0
    heading_path: Séance 20 jeudi 3 décembre
    content_token_count: 36
    text: |-
      Bonjour à tous. Je vous propose de reprendre le cours là où on s'était arrêtés,
      c'est-à-dire au cours du chapitre 8.
  - chunk_index: 1
    heading_path: Séance 20 jeudi 3 décembre > Reprise du cours et introduction
    content_token_count: 36
    text: |-
      Ce chapitre 8 parle de la production. Nous en sommes à la question de savoir
      comment concrètement la production se réalise dans l'économie.
  - chunk_index: 2
    heading_path: Séance 20 jeudi 3 décembre > Reprise du cours et introduction
    content_token_count: 160
    text: |-
      Nous avons vu au départ les différents agents, leurs différentes fonctions. On a
      commencé par faire un peu d'histoire et d'introduction, puis on a vu, dans le
      cas de cours, comment on pouvait analyser la circulation réelle, c'est-à-dire
      comment concrètement les acteurs organisés répartissent la production. Nous
      avons ensuite regardé le rôle des différents acteurs, en commençant par la
      question de la consommation, puis nous avons continué sur la question du marché
      et de la valeur, comment le marché fonctionne — c'était le chapitre 5. Ensuite,
      au chapitre 6, nous avons vu la monnaie et puis la finance.
  - chunk_index: 3
    heading_path: Séance 20 jeudi 3 décembre > Reprise du cours et introduction
    content_token_count: 252
    text: |-
      Maintenant, si on continue un peu la réflexion, on est sur l'entreprise :
      comment l'entreprise fonctionne et comment les entreprises produisent. N'oubliez
      pas qu'il n'y a pas que l'entreprise qui produit de la richesse. Il y a aussi
      l'État qui produit de la richesse, en produisant de la valeur ajoutée, en
      embauchant des fonctionnaires, en produisant des services publics. Souvenez-vous
      que l'État, c'est surtout sa fonction principale, c'est de produire des biens
      non marchands. C'est absolument indispensable pour la société : les biens non
      marchands d'abord, qui sont collectifs, bien sûr la sécurité, la justice, les
      routes, etc., et puis des biens non marchands qui sont distribués aux individus
      et aux ménages sous la forme de services publics. Certains sont un peu payants
      mais pas très chers, comme l'université, d'autres sont totalement gratuits. Donc
      on a ici une production de richesse là aussi chez l'État.
  - chunk_index: 4
    heading_path: Séance 20 jeudi 3 décembre > Reprise du cours et introduction
    content_token_count: 133
    text: |-
      Mais on ne va pas forcément analyser l'État, d'abord parce que ce cours est
      limité en temps — 42 heures, c'est déjà beaucoup — mais aussi parce que
      finalement, l'État, ce qu'il fait, ça dépend du pouvoir politique, ça relève de
      la décision politique. Ça n'est pas forcément au cœur de l'analyse d'un
      économiste. Nous, ce qui nous intéresse ici, c'est de comprendre comment les
      agents qui ne sont pas l'État fonctionnent et donc comment ils produisent.
  - chunk_index: 5
    heading_path: Séance 20 jeudi 3 décembre > Les facteurs de production et leur rémunération
    content_token_count: 38
    text: |-
      Donc on a repris cette histoire de production en disant la chose suivante :
      toute production associe deux facteurs de production que sont le capital et le
      travail.
  - chunk_index: 6
    heading_path: Séance 20 jeudi 3 décembre > Les facteurs de production et leur rémunération
    content_token_count: 137
    text: |-
      Le capital, qu'est-ce que c'est ? Le capital, c'est l'ensemble des machines et
      des matières premières qui sont utilisés dans le cadre productif. Ce capital, on
      l'a vu, il est apporté par les actionnaires. Dans le TD 8, on voit aussi qu'il
      est apporté par les banques, qu'il est le produit du financement. Mais nous
      allons voir tout à l'heure comment concrètement le financement se fait, comment
      l'investissement se fait dans l'entreprise, parce que c'est cet investissement
      qui produit du capital fixe.
  - chunk_index: 7
    heading_path: Séance 20 jeudi 3 décembre > Les facteurs de production et leur rémunération
    content_token_count: 129
    text: |-
      Et puis nous avons également le travail, le travail qui est rémunéré cette
      fois-ci par le salaire, alors que le capital tire du profit. Le travail dépend
      donc des individus qui travaillent. Alors on a la question qui se pose : quelle
      est la qualité du travail ? On mesure la qualité productive du travail en
      mesurant la productivité du travail. Quel rapport y a-t-il ? C'est-à-dire la
      quantité de richesses produites divisée par la quantité de facteurs de
      production, ici le travail, qui a été nécessaire.
  - chunk_index: 8
    heading_path: Séance 20 jeudi 3 décembre > Les facteurs de production et leur rémunération
    content_token_count: 89
    text: |-
      Je ne vais pas faire de pause. Je vais aller directement jusqu'à -10 parce que
      je préfère ça, mais vous, vous pouvez faire une pause et reprendre après.
      Évidemment, si vous reprenez après, vous arrivez en retard, donc ne posez pas de
      questions parce que du coup vos questions seront en décalage par rapport à moi.
      Bref, je reviens.
  - chunk_index: 9
    heading_path: Séance 20 jeudi 3 décembre > Les facteurs de production et leur rémunération
    content_token_count: 197
    text: |-
      Donc la productivité du travail va dépendre de quoi ? On a vu le capital humain,
      c'est-à-dire la compétence des individus. Elle dépend de la dotation en capital
      de l'entreprise, c'est-à-dire de ses équipements : si on possède un certain
      nombre d'équipements, on est plus efficace. Et puis elle dépend aussi de
      l'organisation interne, de la manière dont l'entreprise fonctionne pour produire
      des richesses, de la capacité qu'on a de mettre en œuvre les travailleurs entre
      eux de manière à ce qu'ils soient efficaces. Si on a une entreprise dans
      laquelle les gens sont mal gérés, dans laquelle les gens ne s'entendent pas ou
      ne parviennent pas à collaborer, bien sûr l'entreprise ne sera pas tellement
      efficace.
  - chunk_index: 10
    heading_path: Séance 20 jeudi 3 décembre > La valeur ajoutée et sa répartition
    content_token_count: 73
    text: |-
      Maintenant qu'on a expliqué le capital et le travail, je pense qu'il est
      important de comprendre que ces rémunérations que sont le capital et le travail
      sont tirées de la richesse produite par l'entreprise. Cette richesse, comment
      l'appelle-t-on ? On l'appelle la valeur ajoutée.
  - chunk_index: 11
    heading_path: Séance 20 jeudi 3 décembre > La valeur ajoutée et sa répartition
    content_token_count: 79
    text: |-
      Cette partie est très complémentaire avec le TD 8, donc vous l'avez peut-être
      fait, normalement vous l'avez fait. Je vous invite à le relire après avoir fait
      le cours parce qu'il y a une cohérence très forte entre ce TD et le cours,
      puisque le TD parle aussi de la répartition de la valeur ajoutée.
  - chunk_index: 12
    heading_path: Séance 20 jeudi 3 décembre > La valeur ajoutée et sa répartition
    content_token_count: 142
    text: |-
      Concrètement, cette valeur ajoutée, je le dis, c'est la richesse produite par
      l'entreprise. Bien entendu, les gens qui produisent de la richesse dans le cadre
      d'une entreprise ne la produisent pas gratuitement. Ils en produisent parce
      qu'ils en tirent un bénéfice. Le travail, ça demande du temps, ça demande de
      l'énergie, ça fatigue. Donc si on le fait, c'est parce que derrière on attend
      une rétribution, quel salaire. De la même façon que le capitaliste, lui qui a
      investi son argent, attend une rémunération derrière.
  - chunk_index: 13
    heading_path: Séance 20 jeudi 3 décembre > La valeur ajoutée et sa répartition
    content_token_count: 157
    text: |-
      Alors ici arrive une forme de paradoxe que j'ai envie de soulever avec vous :
      c'est que par définition, toute rémunération est individuelle. C'est-à-dire
      qu'on va toujours donner aux individus qui travaillent dans l'entreprise une
      forme de rémunération. D'ailleurs tous les individus n'ont pas les mêmes
      rémunérations dans une entreprise : il y a les salaires élevés, des salaires
      faibles, etc. Il y a différents types de salaire, différentes façons de
      rémunérer. On peut rémunérer par des primes, ou alors un fixe, tout ça ce n'est
      pas toujours pareil.
  - chunk_index: 14
    heading_path: Séance 20 jeudi 3 décembre > La valeur ajoutée et sa répartition
    content_token_count: 150
    text: |-
      Et tout le problème est de savoir ce que chacun mérite. Parce que finalement, on
      a l'impression que le salaire correspond à la contrepartie de ce qu'on a donné.
      Donc on se dit : si j'ai donné beaucoup, je dois recevoir beaucoup. Si j'ai
      donné moins, je dois recevoir moins, enfin je peux accepter de recevoir moins.
      Et le souci, c'est que quand on a des individus qui travaillent collectivement,
      en réalité il faut dire une chose : c'est que la richesse n'est jamais le
      produit d'une seule personne. On a toujours besoin des autres pour produire
      quelque chose.
  - chunk_index: 15
    heading_path: Séance 20 jeudi 3 décembre > La valeur ajoutée et sa répartition
    content_token_count: 205
    text: |-
      Par exemple, référence à dire : regardez-moi, on pensait que je travaille tout
      seul, que je fais mon cours tout seul dans mon coin. Effectivement, ça donne
      cette impression. Mais en réalité, si le cours a pu se faire, c'est parce que
      l'équipe — on a de la scolarité, on a des gens qui ont fait les emplois du
      temps, alors parfois je dis il y a des gens qui nettoient aussi les amphis, mais
      là pour le coup ce n'est pas dans les amphis — mais on a tout un ensemble de
      coûts qui sont en fait dans le cours, qui ne sont pas juste liés au salaire du
      prof, qui sont aussi liés aux salaires des autres personnes qui accompagnent
      l'enseignant. Donc personne en fait ne travaille individuellement, et pourtant
      tout le monde est rémunéré individuellement.
  - chunk_index: 16
    heading_path: Séance 20 jeudi 3 décembre > La valeur ajoutée et sa répartition
    content_token_count: 120
    text: |-
      Donc quelque part, le souci c'est : pourquoi est-ce que par exemple la scolarité
      qui fait les emplois du temps devrait être moins rémunérée que moi qui fais
      cours ? Bien sûr, on pourrait dire que le cœur du travail c'est le cours, mais
      d'un autre côté, un cours sans personne qui fasse d'emploi du temps, finalement
      ça n'est pas possible. Vous voyez ce qui se passerait si on n'avait pas
      quelqu'un pour organiser l'ensemble de votre formation.
  - chunk_index: 17
    heading_path: Séance 20 jeudi 3 décembre > La valeur ajoutée et sa répartition
    content_token_count: 152
    text: |-
      Et c'est pareil par exemple pour produire une voiture : vous avez un ouvrier qui
      a produit la voiture, vous avez un ingénieur qui l'a conçue, vous avez un
      commercial qui fait que cette voiture est vendue 15 000 euros. La question se
      pose, et à mon avis elle est légitime : combien rémunère chacun ? Est-ce qu'on
      donne 5 000 euros à chacun ? Est-ce qu'on donne 2 000 euros à l'un, 5 000 à
      l'autre, et puis le reste, on fait pas 8 000 euros à la troisième personne ?
      Comment concrètement répartir le travail ?
  - chunk_index: 18
    heading_path: Séance 20 jeudi 3 décembre > La valeur ajoutée et sa répartition
    content_token_count: 152
    text: |-
      Quelqu'un vient de poser une question intéressante : et si on est une profession
      libérale, est-ce qu'on ne travaille pas tout seul ? Et bien là aussi, une
      profession libérale a besoin des autres en quelque sorte. Elle a toujours besoin
      d'abord d'avoir autour d'elle une société qui fonctionne. Par exemple, si vous
      êtes un avocat, difficile de produire quoi que ce soit s'il n'y a pas un système
      judiciaire qui est lui-même le produit des administrations publiques. Un avocat
      tout seul ne produit pas de richesses, en fait il a besoin forcément d'un
      système judiciaire autour de lui.
  - chunk_index: 19
    heading_path: Séance 20 jeudi 3 décembre > La valeur ajoutée et sa répartition
    content_token_count: 197
    text: |-
      Vous prenez un chanteur par exemple. Le chanteur, oui, il est riche parce qu'il
      est tout seul et qu'il est tout seul à travailler. Mais en réalité, non, parce
      que d'abord il a besoin de gens pour communiquer, il a besoin d'une plateforme
      pour que l'on puisse télécharger sa musique, il a aussi besoin qu'une société
      fonctionne pour lui acheter des disques, il a aussi besoin qu'il existe de la
      monnaie — ce n'est pas produit par lui-même. Un chanteur extrêmement talentueux
      qui naît dans un pays très très très pauvre, en voie de développement très
      pauvre, il aura beaucoup moins de chance d'être connu dans le monde qu'une
      personne du même talent qui est née dans un pays riche où il existe une
      véritable industrie musicale.
  - chunk_index: 20
    heading_path: Séance 20 jeudi 3 décembre > La valeur ajoutée et sa répartition
    content_token_count: 188
    text: |-
      Donc tout ça pour vous dire une chose qui est quand même pour moi à la base de
      l'économie et la base de la grande question économique, et la raison pour
      laquelle l'économie est forcément une science politique : c'est que l'économie,
      le cœur de son travail, ce qu'elle essaie de comprendre, c'est la richesse —
      comment elle est produite et comment elle est répartie. Or le problème de la
      répartition de la richesse, c'est que l'on répartit individuellement des choses
      qui ont toujours été produites collectivement. Et donc ça veut dire qu'il y a
      forcément une part d'arbitraire dans la manière dont on décide qui doit avoir
      quoi. C'est-à-dire que ça va en dehors en quelque sorte du champ de l'économie.
  - chunk_index: 21
    heading_path: Séance 20 jeudi 3 décembre > La valeur ajoutée et sa répartition
    content_token_count: 187
    text: |-
      Alors bien sûr, vous allez avoir des économistes qui vont vous dire que la
      rémunération du salarié est toujours égale à sa productivité marginale. On va en
      parler un peu tout à l'heure. C'est un peu facile de mon point de vue,
      c'est-à-dire qu'on se trouve devant le même problème : qu'est-ce que c'est que
      la productivité marginale d'un salarié s'il travaille tout seul ? Il n'y a
      aucune productivité. Et si tout le monde est tout seul, en fait personne n'a
      quasiment la moindre productivité marginale. Donc en fait la productivité
      marginale d'un salarié dépend aussi du contexte et des autres personnes qui
      l'ont aidé. Elle n'existe pas par elle-même.
  - chunk_index: 22
    heading_path: Séance 20 jeudi 3 décembre > La valeur ajoutée et sa répartition
    content_token_count: 54
    text: |-
      Bref, nous avons donc ici une véritable question au cœur de la politique et
      aussi au cœur de l'économie : comment on organise la redistribution, enfin la
      distribution, c'est-à-dire qui possède quoi.
  - chunk_index: 23
    heading_path: Séance 20 jeudi 3 décembre > La répartition primaire et secondaire
    content_token_count: 268
    text: |-
      Cette réflexion est en partie résolue par le marché, puisque souvenez-vous,
      chapitre 5, le marché a sa fonction première : c'est justement de donner du prix
      aux choses, de dire quelle est la valeur. Donc le marché va dire la valeur de —
      je ne sais pas — quand vous vendez votre force de travail sur le marché, eh bien
      vous valez, je ne sais pas, 2 000 euros par mois. Donc voilà, vous savez que
      c'est ça que vous valez. Mais là aussi il y a une dimension arbitraire, parce
      qu'en quoi le marché est-il légitime pour déterminer la valeur des choses ? On
      l'a vu dans les chapitres précédents, ça pose des vraies questions. La
      valorisation par le marché du prix d'une action est très contestable et elle ne
      repose pas sur grand-chose. Donc on a un marché qui tourne, qui mouline, qui
      crée des prix, qui crée des valeurs, mais ces valeurs, ces prix, en fait, s'ils
      correspondent vraiment à ce que les individus jugent socialement utiles, ce
      n'est pas si sûr.
  - chunk_index: 24
    heading_path: Séance 20 jeudi 3 décembre > La répartition primaire et secondaire
    content_token_count: 134
    text: |-
      Quand je réfléchis à la question de la répartition des richesses, en fait c'est
      une question extrêmement complexe qui est très difficile à trancher comme ça.
      Donc on a parfois tendance à la simplifier. La manière dont on va la simplifier,
      c'est la même manière un peu que Marx : c'est-à-dire souvenez-vous, chez Marx il
      y a deux classes sociales, deux facteurs de production, le capital et le
      travail. Et donc on va considérer que finalement la répartition c'est une
      question de répartition entre capital et travail.
  - chunk_index: 25
    heading_path: Séance 20 jeudi 3 décembre > La répartition primaire et secondaire
    content_token_count: 222
    text: |-
      Alors bien sûr, cette question de répartition entre capital et travail est un
      peu limitée. C'est celle qu'on voit dans le TD 8, c'est celle qu'on va voir
      aussi à présent, parce que c'est intéressant quand même de la faire. Mais ce
      qu'elle ne voit pas, bien sûr, c'est tous les écarts qui peuvent y avoir entre
      différents salaires. C'est-à-dire qu'il ne suffit pas de dire il y a les
      salariés d'un côté et les capitalistes de l'autre. Bien sûr c'est vrai, bien sûr
      qu'en général ceux qui apportent le capital sont mieux rémunérés que ceux qui
      apportent le travail, c'est vrai aussi. Mais au sein même des travailleurs, il y
      a des inégalités extrêmement fortes. Et là aussi il y a une répartition des
      richesses qui pose question et qui, pour le coup, n'est pas toujours facile à
      analyser.
  - chunk_index: 26
    heading_path: Séance 20 jeudi 3 décembre > La répartition primaire et secondaire
    content_token_count: 61
    text: |-
      Si on réfléchit sur la répartition, il y a un produit assez général sur l'écran,
      le concept de la répartition. En économie, on a tendance à distinguer ce qu'on
      appelle la répartition primaire de la répartition secondaire.
  - chunk_index: 27
    heading_path: Séance 20 jeudi 3 décembre > La répartition primaire et secondaire
    content_token_count: 370
    text: |-
      La répartition primaire concerne la répartition de la richesse produite avant
      l'intervention des administrations publiques, c'est-à-dire dans le cadre du
      processus productif, avant toute redistribution, donc tout impôt et allocation —
      à la fois allocations en espèces et allocations en nature. La répartition
      primaire, on nous dit, c'est celle qui se fait au sein des entreprises entre
      capital et travail. Si on a une approche marxiste un peu duale capital-travail,
      mais ça c'est la base. Et la répartition primaire, ça veut dire que ce n'est pas
      ce que les gens touchent réellement comme argent. Là aussi je vous renvoie aux
      différentes aides et notamment au TD 17 je crois qu'ils en parlent, et puis même
      au TD 5. On regarde les comptes, puisque ce qu'on constate c'est qu'en fait les
      ménages touchent comme argent également de l'argent qui n'est pas issu du
      processus productif, qui est par exemple issu des retraites, donc qui est issu
      des allocations qu'ils peuvent recevoir. Par ailleurs ils payent des impôts.
      Donc là on a une autre répartition qui est organisée par le pouvoir public, par
      la puissance publique, qui est une répartition en argent, en espèces comme on
      dit, et une répartition en nature. Et donc ça, ça s'appelle la répartition
      secondaire, ou on l'appelle aussi la redistribution. C'est-à-dire la manière
      dont, une fois que l'État intervient, il redistribue la richesse produite.
  - chunk_index: 28
    heading_path: Séance 20 jeudi 3 décembre > La répartition primaire et secondaire
    content_token_count: 96
    text: |-
      Alors attention, l'État produit aussi des richesses, mais il redistribue aussi
      ses richesses qu'il a produites lui-même, parce que les richesses des biens non
      marchands qu'il produit, elles sont distribuées gratuitement et payées par
      l'impôt. Voilà donc c'est le TD 5 sur les comptes qui distingue la répartition
      primaire et la répartition secondaire.
  - chunk_index: 29
    heading_path: Séance 20 jeudi 3 décembre > La répartition primaire et secondaire
    content_token_count: 327
    text: |-
      Alors oui, on devrait pas dire redistribution, on devrait dire distribution,
      d'ailleurs c'est un peu une erreur ici. Alors je ne sais plus de quoi il
      correspond déjà, bien l'oublier, on peut apporter — vous regarderez sur le TD 5.
      Donc on a bien une distribution primaire et une redistribution secondaire.
      L'idée de redistribution c'est évidemment — enfin, souvenez-vous d'ailleurs que
      cette réallocation des richesses, c'est aussi ce que fait le marché. Donc on
      peut dire qu'il y a deux formes d'allocation des richesses : la première c'est
      le marché qui réalise les richesses à travers un processus marchand, et puis
      ensuite il y a l'État aussi qui réalise les richesses en fonction d'un processus
      du coup politique. Puisque finalement c'est l'État, c'est quand même le principe
      du collectif qui se met d'accord pour dire : ben tiens, cette personne-là il
      faut qu'elle soit un peu mieux payée ou un peu mieux rémunérée, on va lui donner
      une allocation. Celle-ci, ça serait bien qu'elle soit un peu plus prélevée, elle
      gagne trop, et on va lui imposer une taxe. Alors pas une personne en
      particulier, c'est à une situation plutôt qu'on va taxer ou qu'on va attribuer
      des allocations.
  - chunk_index: 30
    heading_path: Séance 20 jeudi 3 décembre > L'évolution de la part salariale
    content_token_count: 157
    text: |-
      Si on regarde la répartition primaire, on peut analyser les choses en regardant
      la part des salaires dans le PIB. On va avoir cette analyse un peu marxiste,
      opposition capital-travail, c'est celle aussi qui est prise dans le TD 8. C'est
      une vision qui dépasse largement le marxisme, en fait, qui est aujourd'hui —
      c'est comme ça qu'on évalue la répartition primaire en général dans tous les
      pays du monde. C'est-à-dire qu'on regarde au sein du processus productif quelle
      part de la valeur ajoutée va rémunérer toutes ses formes du capital, et quelle
      autre part va rémunérer le travail.
  - chunk_index: 31
    heading_path: Séance 20 jeudi 3 décembre > L'évolution de la part salariale
    content_token_count: 268
    text: |-
      Ce qui est intéressant, c'est de voir son évolution historique. Ça aussi c'est
      ce qu'on voit dans le TD 8, c'est-à-dire ce qu'on appelle la part salariale, la
      part des salaires dans le PIB. Ici c'est exactement ça, donc c'est un tableau
      qui est issu de la banque — d'Espagne ? — 2012, un peu ancien, mais on est sur
      du très long terme, ce n'est pas très grave. Et dans lequel on va voir que les
      différents grands pays ici — les États-Unis, France, Allemagne, Royaume-Uni — on
      voit une évolution de la part de certains pays mais qui globalement est toujours
      négative. C'est-à-dire qu'entre 1980 et 2010, on voit s'effriter la part des
      salaires dans la valeur ajoutée. Ce qui veut dire que dans le cadre de la
      répartition primaire, dans les entreprises — c'est bien au sein des entreprises
