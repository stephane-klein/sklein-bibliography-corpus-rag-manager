      le capitaliste paye la force de travail à son coût de reproduction. Il n’y a pas
      de problème par rapport à cela. La force de travail n’est pas vendue par les
      travailleurs à un niveau inférieur à sa valeur ; elle est vendue au niveau de sa
      valeur, parce que sa valeur, c’est bien celle-là, c’est le coût de reproduction
      de la force de travail. Puisque la force de travail se reproduit, cela veut dire
      que le salaire est bien payé au coût de reproduction, donc à la valeur de la
      force de travail. En réalité, l’origine du profit, pour Marx, est la différence
      entre la valeur de la force de travail et la valeur générée par la force de
      travail.
