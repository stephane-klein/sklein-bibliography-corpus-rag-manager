      Pour essayer de comprendre la logique ici à l’œuvre, il faut réfléchir sur le
      fait que, comme chez Ricardo, le taux de profit va déterminer le rythme
      d’accumulation du capital. Chez Marx comme chez Ricardo, plus le profit est
      important, plus cela va être rentable d’investir, et plus les entrepreneurs, les
      capitalistes, vont investir et vont accumuler du capital. Lorsque le taux de
      profit faiblit, le régime d’accumulation faiblit, et lorsque le taux de profit
      est égal à zéro, il n’y a plus d’accumulation. C’est ce qu’on avait vu chez
      Ricardo avec l’état stationnaire. Marx va construire une théorie d’ état
      stationnaire, mais surtout sur un autre modèle. C’est intéressant, d’ailleurs,
      c’est une question qui revient dans les questions du TD 2 : comment on peut
      comparer l’analyse de Ricardo avec celle de Marx ? Dans les deux cas on a une
      baisse du taux de profit, mais elle n’est pas liée à la même logique. Chez
      Ricardo, la baisse des profits est liée à la hausse de la rente, elle-même liée
      à la hausse des prix agricoles. Chez Marx, c’est une autre logique.
