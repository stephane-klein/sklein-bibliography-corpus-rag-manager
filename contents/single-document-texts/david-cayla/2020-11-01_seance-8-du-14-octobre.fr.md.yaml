      L’idée aussi qu’il faut bien comprendre, c’est que le profit est réalisé sur la
      vente. Donc en fait tout le monde veut vendre sa marchandise, mais comme on
      gagne de l’argent en achetant moins cher que ce qu’on vend, on voit bien que le
      souci, c’est qu’on va limiter ses achats et augmenter ses ventes. Mais tout le
      monde ne peut pas faire ça en même temps : toutes les ventes sont des achats. Au
      bout d’un moment le système devrait s’équilibrer, or là il ne veut pas
      s’équilibrer parce que justement il est construit sur une logique de production
      croissante et de ventes croissantes, sans forcément qu’il y ait à côté une
      distribution d’argent qui permette à ces ventes de se faire. C’est une crise qui
      arrive, donc une crise conjoncturelle qui arrive très régulièrement dans le
      capitalisme.
