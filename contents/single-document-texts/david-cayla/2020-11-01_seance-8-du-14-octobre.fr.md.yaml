      valeur d’usage. Dans la société marchande capitaliste, la marchandise a pour
      fonction première de générer du profit, et donc là on bascule de logique, et
      surtout d’engendrer de l’accumulation. Avec l’accumulation, on a un principe de
      croissance, déjà, mais c’est une croissance privée, ce n’est pas une croissance
      générale. Cette société n’est pas encore industrialisée : on a ici juste un
      marchand qui commerce. Une autre caractéristique de l’ère de la marchandise,
      c’est qu’elle doit être standardisée. Cela veut dire qu’on se fiche que la
      marchandise soit unique, soit belle, etc. Ce qu’on veut, c’est qu’elle soit
      vendable, et pour qu’elle soit vendable, il faut qu’elle soit standardisée. La
      marchandise va devenir marchandise : on avait un bien par exemple artisanal qui
      avait ses malfaçons, ses spécificités, sa beauté, son caractère unique en
      quelque sorte, mais pour un marchand ce n’est pas du tout intéressant d’avoir un
      bien qui peut varier en qualité. Si le bien varie en qualité, on ne sait plus à
      combien le vendre, et donc il est moins efficace pour trouver de l’argent. D’où
      la standardisation, qui apparaît au Moyen Âge et qui va s’étendre de plus en
      plus lorsque le bien va se transformer en marchandise, c’est-à-dire en biens
      dont l’objectif premier est d’être vendus et non pas d’être utilisés.
