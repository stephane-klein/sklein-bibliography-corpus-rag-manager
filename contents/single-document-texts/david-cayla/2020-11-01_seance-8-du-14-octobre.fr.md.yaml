      il fallait le faire quand même, vous avez largement le temps auparavant.
  - chunk_index: 4
    heading_path: Séance 8 du 14 octobre > Rappels sur le TD 0
    content_token_count: 175
    text: |-
      On m’a aussi demandé si on peut le rendre sous forme manuscrite : la réponse est
      non. Je répète : vous devez le taper sur ordinateur. C’est important, vous
      apprenez à taper sur un ordinateur, vous êtes encore à l’université, donc il
      faut le faire. Si vous n’avez pas d’ordinateur, il existe des ordinateurs en
      libre accès à la bibliothèque universitaire. Renseignez-vous et tapez votre
      texte ; cela ne vous demandera pas longtemps si vous l’avez déjà écrit sur
      papier auparavant. Les règles sont les mêmes pour tous : il faut rendre le TD 0
      à vos chargés de TD et le mettre sur l’espace Moodle.
  - chunk_index: 5
    heading_path: Séance 8 du 14 octobre > Rappels sur le TD 0
    content_token_count: 300
    text: |-
      J’en profite pour vous rappeler qu’il y aura une détection de plagiat sur
      l’espace Moodle. Si vous avez copié le TD d’un autre camarade, y compris s’il
      n’est pas dans le même groupe que vous, cela va immédiatement ressortir comme
      étant du plagiat à 100 %, et cela pourra être une section disciplinaire.
      Évidemment, ce sera 0, mais en plus, ne vous amusez pas à plagier sur Internet.
      Si vous avez vu des choses sur Internet là-dessus, ou auprès d’un de vos
      camarades, même s’il n’est pas dans le même TD, même s’il va corriger, le
      plagiat sera évidemment détecté. Si vous faites le malin en disant « de toute
      façon j’ai mis mon nom », si vous ne mettez pas le nom de votre chargé de TD,
      votre TD ne sera pas corrigé, il sera considéré comme un retard non rendu et
      vous aurez 0. Faites le travail que vous devez faire : vous êtes ici à
      l’université pour avoir un diplôme, et le diplôme aura la valeur que vous lui
      apportez avec votre travail. Si vous ne travaillez pas, bien sûr, ce diplôme n’a
      aucun intérêt.
