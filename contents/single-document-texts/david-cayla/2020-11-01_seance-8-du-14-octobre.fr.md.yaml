      Deuxième élément : une fois qu’on arrive aux frontières du pays, une fois qu’on
      a détruit tout l’artisanat, tout le secteur d’activité traditionnel, la logique
      d’accumulation persiste. Donc l’idée qu’il faut toujours produire davantage et
      toujours trouver des débouchés ailleurs se heurte ici aux frontières nationales.
      Que fait-on ? On va étendre la production dans le reste du monde. On va
      commencer à exporter et à trouver des débouchés extérieurs. Sauf qu’en face on
      se retrouve devant des pays qui ne veulent pas nous acheter des produits. Qu’à
      cela ne tienne : on va envoyer notre flotte et on va ouvrir de force ces pays à
      nos marchandises. Ça va être la colonisation. Là aussi, c’est un phénomène qui
      apparaît dans la deuxième moitié du XIXe siècle, au moment où justement le
      capitalisme industriel se développe en Europe, notamment dans les pays les plus
      avancés d’Europe de l’Ouest : la France, le Royaume-Uni, la Belgique,
      l’Allemagne ensuite, l’Allemagne arrive avec un peu de retard. Ces pays qui
      voient leur capitalisme à maturité avoir en partie détruit une grande partie de
      la société traditionnelle, de l’économie traditionnelle, vont se mettre à
      chercher des débouchés en Afrique, en Asie. La France colonise l’Algérie dans
      les années 1830, mais très vite, dans la deuxième moitié du XIXe siècle, on va
      coloniser l’Afrique et l’Asie. Pas forcément en disant qu’on allait chercher des
      débouchés, mais finalement c’est bien de ça qu’il s’agit : on va étendre, on va
      utiliser ces pays à la fois comme ressource pour avoir des matières premières,
      mais aussi pour construire des chemins de fer, pour construire tout un ensemble
      pour implanter le capitalisme dans ces pays. On va aussi avoir la colonisation
      de la Chine. C’est un peu particulier parce que la Chine n’est pas colonisée au
      sens légal du terme, mais de fait elle est sous domination britannique,
      française et européenne, puisqu’elle ne contrôle plus son commerce. Là aussi, ce
      sont des guerres qui visent à ouvrir de force le marché chinois, au début à
      l’opium, et en fait à toutes les autres marchandises. D’où le nom de ces
      conflits : les guerres de l’opium. Les Anglais, les Français voulaient pouvoir
      vendre de l’opium en Chine, et puis très vite ils vont chercher à vendre tout ce
      qu’ils peuvent, et notamment toute leur production industrielle supplémentaire
      en Chine.
