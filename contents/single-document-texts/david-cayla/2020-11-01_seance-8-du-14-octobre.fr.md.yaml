      Pour essayer de comprendre cette logique, il faut raisonner un peu de manière
      mathématique en essayant de décomposer ce qui est au fond le taux de profit.
      Tout d’abord, le taux de profit, qu’est-ce que c’est ? Attention, ce n’est pas
      la même chose que le profit. C’est un rapport, un taux. Le profit est lié à
      l’ensemble du profit qu’on fait sur ses ventes, et le taux de profit, c’est
      l’ensemble du profit divisé par le capital investi, le montant qu’on a dépensé
      au départ. Donc on peut donner cette formule : taux de profit, que l’on note r,
      est égal au profit réalisé, que l’on note p, le profit total réalisé, divisé par
      le capital avancé, combien on a dépensé pour réaliser la production. Vous avez
      une dépense au départ, vous faites un profit, vous faites le rapport entre le
      profit et la dépense. Retenez bien cette formule parce qu’on va la voir dans
      d’autres chapitres plus tard. Cela vous pose parfois problème parce que, une
      fois que vous avez calculé le profit, vous dites « ça s’est terminé » ; non, il
      faut calculer le taux de profit, ce n’est pas la même chose. Un taux de profit,
      c’est la définition qu’on trouve partout : le profit réalisé sur le capital
      avancé. On met k pour le capital avancé, p pour les profits réalisés, et r pour
      le taux de profit.
