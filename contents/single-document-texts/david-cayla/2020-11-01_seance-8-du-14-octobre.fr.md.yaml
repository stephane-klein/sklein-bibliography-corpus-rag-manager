    text: |-
      Un deuxième élément de crise, c’est la baisse tendancielle du taux de profit.
      Cela n’a rien à voir avec la première crise, c’est une autre crise. La première
      crise, c’est le problème de l’accumulation du capital, du principe
      d’accumulation, et notamment qui implique que les ventes doivent toujours
      augmenter alors que les capacités d’achat n’augmentent pas forcément. Mais il y
      a une autre raison, une autre crise, qui cette fois est une crise structurelle
      et qui est pour Marx la crise majeure du capitalisme. Cette crise est le produit
      de la contradiction entre les deux classes sociales qu’on a vues, c’est-à-dire
      la bourgeoisie et le prolétariat. Marx va nous expliquer que cette contradiction
      va engendrer finalement la fin programmée du capitalisme. Cela veut dire que
      autant les crises conjoncturelles n’entraînent pas forcément la fin du
      capitalisme, autant cette tension sur le taux de profit va entraîner, nous dit
      Marx, la fin du capitalisme.
