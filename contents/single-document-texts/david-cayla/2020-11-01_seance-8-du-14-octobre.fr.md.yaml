      Je conclus, il me reste même pas cinq minutes. Conclusion du chapitre 2. Les
      économistes, contrairement à ce que l’on pense parfois, ont quand même eu du mal
      au départ avec la notion de croissance. Lorsqu’ils l’ont conçue de manière
      parfaitement intéressante et valable aujourd’hui, avec Adam Smith, ils ont conçu
      la logique d’accumulation du capital, et même chez Smith il n’y a pas que le
      capital qui s’accumule, il y a aussi les marchandises. Cette accumulation de
      capital était liée elle-même au taux de profit. En même temps qu’ils ont conçu
      cela, ils ont pensé les limites de la croissance. Ces limites de la croissance
      sont liées à différents éléments. Pour Malthus, ce sont les contraintes
      démographiques et naturelles qui limitent la croissance, le fait qu’on vit dans
      un monde fini. Pour Ricardo, c’est un conflit de classe qui limite la
      croissance, c’est-à-dire la baisse du profit qui est la conséquence de la hausse
      des prix du blé, qui va entraîner aussi la hausse de la rente. Donc la hausse
      des prix du blé va à la fois entraîner la hausse de la rente et la baisse du
      taux de profit. C’est aussi en raison de contraintes naturelles et
      démographiques, c’est toujours l’idée qu’il y a une contrainte naturelle. Pour
      Marx, on a vu que ce ne sont pas du tout les mêmes causes : la baisse du profit
      n’est pas liée aux limites naturelles. Chez Marx, la nature, les limites de la
      nature, les limites des ressources, des matières premières, tout ça, ce n’est
      pas ce qui l’intéresse. Ce qui l’intéresse, ce sont les limites sociales. Ce qui
      va poser problème, c’est la dynamique technologique du capitalisme, qui va avoir
      des machines de plus en plus chères, qui vont prendre une place de plus en plus
      importante, alors même que le profit est généré par le travail. Donc plus on
      baisse le travail et plus on augmente la machine, plus on aura du mal à prélever
      du travail du profit. On va donc se retrouver dans un problème qui est cette
      baisse du taux de profit. C’est cette baisse du taux de profit qui va exacerber
      les conflits de classe, et c’est ça qui va être au cœur de la fin du capitalisme
      : les conflits de classe vont finir par déboucher sur une révolution. Mais on a
      aussi un autre problème, qui est la logique d’accumulation elle-même, qui va se
      heurter à la faiblesse des débouchés.
