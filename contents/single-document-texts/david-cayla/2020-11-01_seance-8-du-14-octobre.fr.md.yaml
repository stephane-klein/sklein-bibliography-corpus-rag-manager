      Or, nous dit Marx, le capital avancé, qu’est-ce que c’est ? C’est deux choses :
      le capital constant et le capital variable. Le capital constant, c’est ce qui ne
      dépend pas des volumes de production, c’est plus ou moins le capital fixe chez
      Smith. Lui appelle ça le capital constant. Cela peut troubler parce qu’on n’a
      pas la même chose chez Smith, mais vous allez comprendre pourquoi ce capital
      variable va être différent de Smith. Le capital constant, c’est en quelque sorte
      ce qui ne varie pas avec la production, c’est-à-dire le capital fixe, les
      bâtiments, les machines, les choses comme ça. Et puis le capital variable, comme
      son nom l’indique, c’est ce qui varie avec la quantité de production,
      c’est-à-dire les matières premières, mais aussi le travail, la force de travail,
      le coût du travail, parce que si vous ne produisez rien, vous n’avez pas besoin
      d’embaucher des gens. On a bien ici deux éléments du capital variable : les
      matières premières, on va dire, et puis la force de travail qu’on a dû embaucher
      pour réaliser la production. Le capital variable, on va le noter v. Pour Marx,
      le capital constant, c’est ce qui est matériel : biens d’équipement, matières
      premières. Le capital variable, c’est la force de travail. Pour les matières
      premières, c’est discutable, mais ça ne change absolument rien au raisonnement.
      Je vérifierai d’ici demain ou la semaine prochaine si je me trompe, mais si j’ai
      écrit ça, c’est que j’ai dû vérifier avant.
