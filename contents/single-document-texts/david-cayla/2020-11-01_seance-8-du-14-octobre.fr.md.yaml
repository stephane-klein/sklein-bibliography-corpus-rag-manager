    text: |-
      On a donc ici une première crise structurelle du capitalisme, ou plutôt une
      crise conjoncturelle qui arrive régulièrement et qui ne met pas forcément à bas
      le capitalisme, mais on voit ces cycles des affaires. L’idée d’une logique
      d’accumulation infinie du capital, avec toujours davantage de facteurs de
      production, l’argent de départ avec lequel on va acheter des machines et des
      matières premières et du travail va augmenter, ce qui va engendrer une
      croissance toujours plus importante de marchandises, risque d’aboutir à des
      contradictions en raison de la faiblesse des débouchés. Pour résoudre la
      faiblesse des débouchés, d’ailleurs, qu’est-ce qu’on peut faire ? On peut
      baisser les prix. C’est ce qui se passe très souvent : en période de récession,
      les industriels bradent leur production. S’ils ne trouvent pas de débouchés, ils
      vont baisser les prix, mais en baissant les prix ils vont se retrouver devant un
      problème : le profit qu’ils ont généré n’a pas été réalisé, parce que si on
      brade le prix à la production, on va se retrouver avec une somme qui ne sera pas
      supérieure au départ, et on ne pourra plus faire de profits, et parfois on fera
      des pertes. D’ailleurs, dans les périodes de récession, en général les prix
      baissent. Vous verrez dans le cours d’histoire des faits économiques qu’on va
      étudier la crise des années 1930. Qu’est-ce que c’est que la crise des années
      1930 aux États-Unis ? C’est l’effondrement de tous les prix. Pourquoi ? À cause
      de ce problème-là, à cause du fait qu’on n’arrive pas à vendre. Donc on brade,
      et comme on brade on trouve un peu des acheteurs, mais au bout d’un moment il
      faut qu’on se rattrape, donc on va baisser les salaires, on va baisser soi-même
      ce qu’on va acheter, et donc on va rentrer dans un cycle de récession.
