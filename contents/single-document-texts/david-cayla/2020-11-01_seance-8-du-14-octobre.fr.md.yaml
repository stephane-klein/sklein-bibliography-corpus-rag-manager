    text: |-
      Donc on a le capital variable, la force de travail, et le capital constant, le
      capital physique, matériel. Le taux de profit est égal à p sur c plus v. C’est
      cette formule, en pourcentage selon le livre : on multiplie par 100. Le capital
      avancé, c’est c plus v. Là aussi, pas de souci. Maintenant on va faire une
      opération qui est de diviser le numérateur et le dénominateur par v. On se
      retrouve avec p sur v divisé par c sur v plus v sur v, ce qui nous donne p sur v
      divisé par c sur v plus 1. Là apparaissent deux ratios. Le ratio du profit
      réalisé sur le capital variable, donc ici la force de travail : je reprends ce
      qui est marqué sur la diapositive, c’est plus fiable que ma mémoire. Le capital
      variable reprend la force de travail. Donc on a le profit divisé en quelque
      sorte par la main-d’œuvre, la valeur de la main-d’œuvre. Et puis on a l’autre
      ratio, qui est le capital constant divisé par le capital variable, c’est-à-dire
      le matériel divisé par la force de travail qu’on a mise dans la production. On
      constate que ces deux ratios sont de deux côtés de la fraction. Vous savez
      comment fonctionne une fraction : plus le numérateur est important, plus la
      valeur globale de la fraction va être importante ; à l’inverse, plus le
      dénominateur sera important, plus la valeur globale de la fraction sera faible.
      Si j’augmente c sur v, je diminue le résultat ; si j’augmente p sur v, je
      l’augmente au total. Ce total ici, ce n’est pas rien, c’est le taux de profit.
      Donc on va voir que le taux de profit dépend de ces deux ratios, p sur v et c
      sur v. Il augmente quand p sur v augmente, et il baisse quand c sur v augmente.
      C’est les maths de collège, je vous fais les maths.
