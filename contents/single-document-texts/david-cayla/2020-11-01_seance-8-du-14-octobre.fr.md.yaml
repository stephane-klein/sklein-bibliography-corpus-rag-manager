      évolution, une évolution qui est soumise à des contradictions. Ces
      contradictions, c’est comment les deux individus du couple vont évoluer chacun
      de leur côté. Ce qui est intéressant, c’est que le couple lui-même a évolué par
      rapport à ses contradictions. Ces contradictions ne veulent pas dire forcément
      qu’il y a des conflits ; c’est juste qu’il y a des éléments qui forment un
      système. Dans un couple, ces éléments ont une existence propre. Certains auront
      envie d’une chose, un autre élément du couple n’aura pas envie de cela. Cela va
      faire évoluer le couple : le couple va changer progressivement, il va changer
      sous l’influence des deux éléments du groupe, les deux personnes qui font partie
      de ce couple. Ce couple va donc changer. Il peut d’ailleurs changer pour le
      mieux : chacun peut apporter quelque chose de positif et cela va faire
      progresser le couple. Et puis il peut y avoir un moment où les éléments
      eux-mêmes vont changer, et où le couple va devoir s’adapter aux changements des
      éléments du couple, jusqu’à ce que, si une contradiction apparaît, le couple
      finisse par se séparer et par disparaître en tant qu’objet.
