      société ? Assez simplement : la société en termes de classes sociales, et les
      classes sociales sont donc les éléments qui constituent la société. À la fois,
      elles ont besoin les unes des autres. Chez les classiques, il y a trois classes
      sociales : les propriétaires fonciers, les capitalistes et les travailleurs.
      Elles sont complémentaires, c’est-à-dire qu’elles ont besoin les unes des
      autres, sinon elles n’existent pas. Donc la société est faite de classes qui ont
      besoin les unes des autres, et en même temps elles ont des intérêts divergents.
      Marx dit : si on veut comprendre le système capitaliste et son évolution, sa
      dynamique interne, si on veut avoir une analyse dialectique, alors il faut
      s’intéresser à la manière dont les classes sociales qui le composent évoluent et
      aux contradictions qui peuvent apparaître entre les classes sociales. C’est cela
      la dialectique.
