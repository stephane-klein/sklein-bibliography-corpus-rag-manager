      peu l’idée que la terre produit davantage que ce qu’elle a coûté pour la
      produire. On met deux quintaux de blé, vous allez labourer, semer, et à la fin
      on en reproduit cinq ; donc à la fin on a un surplus, un produit net. Marx dit
      que la force de travail fonctionne un peu comme la terre dans cette analyse : la
      force de travail va coûter 2 et le travail, lorsqu’il va être exploité, utilisé
      par le capitaliste, va produire 5. Marx dit : ce n’est pas très compliqué si on
      veut comprendre d’où vient le profit. Le profit vient de la différence qui
      existe entre la valeur marchande de la force de travail, qui est son coût de
      reproduction, et la valeur d’usage de la force de travail, qui est la valeur
      qu’elle produit lorsqu’on l’utilise. Le profit vient de là.
