      La baisse tendancielle du taux de profit est la conséquence technique du fait
      que le capital devient de plus en plus matériel parce qu’on remplace de plus en
      plus les hommes par des machines, et donc on va avoir un taux de profit qui
      baisse. Un taux de profit qui baisse, c’est très mauvais pour les capitalistes,
      évidemment. Donc qu’est-ce qu’ils vont faire ? Ils vont essayer de compenser
      cette baisse du taux de profit en augmentant le taux d’exploitation, en tentant
      de produire toujours davantage de profits par travailleur recruté en quelque
      sorte. Donc si on veut maintenir le taux de profit au niveau où il était
      auparavant, il faut augmenter la valeur du numérateur, c’est-à-dire p sur v. Il
      faut faire en sorte d’augmenter le taux d’exploitation du travail. Comment
      va-t-on faire ? On va demander à ses salariés de travailler plus longtemps, on
      va les faire travailler plus intensément, on va allonger la durée du travail, on
      va même simplement chercher à baisser leur salaire. Là aussi, il y a des
      limites, parce qu’encore une fois on est limité au niveau du salaire par la
      force de reproduction de la force de travail. Mais on se retrouve finalement
      dans un conflit qui va se radicaliser entre les propriétaires du capital et les
      ouvriers, parce qu’au fur et à mesure que le taux de profit baisse, le
      capitalisme cherche à le réaugmenter, et pour ça il va demander au travail de
      s’intensifier davantage. Il va donc dire, par la voix du président de la
      République par exemple : il faut qu’on travaille plus, ce qui veut dire
      travailler plus sans être payé plus, avoir des semaines de travail plus longues,
      ne plus prendre de vacances. Cela veut dire éventuellement subventionner des
      entreprises pour leur permettre d’être plus compétitives et de maintenir le taux
      de profit au niveau où il était auparavant. Par exemple, on va supprimer les
      impôts de production. Évidemment, je fais référence à ce qui a été annoncé par
      Emmanuel Macron il n’y a pas très longtemps : le gouvernement veut, dans le plan
      de relance, baisser de 10 milliards par an les impôts de production. Qu’est-ce
      que cela veut dire ? Cela veut dire qu’on va augmenter le taux de profit.
      François Hollande avait fait le CICE, lui aussi une subvention aux entreprises,
      qui avait exactement le même objectif : augmenter le taux de profit. Pourquoi ?
      Parce que le taux de profit aurait tendance à baisser.
