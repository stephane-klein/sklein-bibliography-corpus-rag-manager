      un système dialectique : on a deux classes sociales qui ont besoin l’une de
      l’autre. Le capitalisme ne peut rien faire sans l’ouvrier ; l’ouvrier ne peut
      pas produire sans les capitalistes parce qu’il n’a pas accès au capital. Elles
      ont besoin l’une de l’autre, elles sont dépendantes l’une de l’autre, et en même
      temps elles ont des intérêts contradictoires. Pour Marx, c’est cela la dynamique
      profonde de l’évolution du capitalisme : cette opposition de classes sociales.
