    text: |-
      L’autre ratio, c sur v, qu’est-ce qu’il exprime ? Il exprime la composition du
      capital : est-ce que ce capital est plus matériel ou est-ce qu’il est plus
      humain ? Est-ce qu’il correspond davantage à l’achat de main-d’œuvre ou est-ce
      qu’il correspond à l’achat de machines et de matières premières ? C’est ce que
      Marx appelle la composition organique du capital : le rapport entre le matériel
      et le travail, entre capital et travail. Ce ratio c sur v est déterminé par les
      évolutions technologiques. Plus on accumule, plus on a de croissance
      technologique, plus les machines vont coûter cher. Au fur et à mesure que le
      capitalisme va se développer, il va accumuler du capital matériel, il va aussi
      investir dans des machines plus performantes. C’est la logique capitaliste. Donc
      au bout d’un moment, nous dit Marx, c va prendre une place de plus en plus
      importante. Cette dynamique : lorsque c augmente plus vite que v, lorsque la
      valeur des machines augmente plus fortement que la valeur de la force de travail
