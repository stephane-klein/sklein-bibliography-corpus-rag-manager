    text: |-
      Bonjour à tous, bonjour à ceux qui viennent en ligne. Avant de commencer et de
      reprendre le cours, je voudrais faire un point sur le TD 0, parce que j’ai reçu
      un ensemble de mails d’étudiants paniqués qui me demandent comment faire pour
      rendre le TD et quand il faut le rendre. C’est normal, vous êtes étudiants en
      première année, mais je vais donc répéter à nouveau les choses.
  - chunk_index: 1
    heading_path: Séance 8 du 14 octobre > Rappels sur le TD 0
    content_token_count: 183
    text: |-
      Le TD 0 doit être rendu lors de la première séance et vous devez aussi le rendre
      sur Google, en format informatique, PDF ou Word, mais pas en format image. Vous
      devez le rendre avant le 16 octobre à 20 h pour ne pas être en retard. Je vois
      que sur 473, il n’y en a que 136 qui ont été soumis, ce qui fait quand même peu.
      Si vous avez déjà rendu le format papier, vous devez aussi le rendre en format
      papier à votre chargé de TD : les deux à la fois, papier imprimé à votre chargé
      de TD et sous format numérique sur l’espace Google. Il n’y a rien de compliqué à
      faire, mais il faut le faire au bon moment, sinon vous allez avoir des
      pénalités.
  - chunk_index: 2
    heading_path: Séance 8 du 14 octobre > Rappels sur le TD 0
    content_token_count: 229
    text: |-
      On m’a demandé ce qu’il faut faire du TD 0 : les instructions sont écrites sur
      le TD 0. Il y a les fascicules et les TD 0 qui sont disponibles. Je ne vous ai
      pas donné spécialement de conseil à part qu’il faut faire ce qui est demandé.
      C’est aussi marqué sur le TD 0 qu’il faut le rendre en format papier à votre
      chargé de TD dès la première séance, et aussi le 16 octobre à 20 h sur Google.
      Si vous êtes absent lors de cette première séance, vous ne pouvez évidemment pas
      le rendre à votre chargé de TD, mais vous le mettez avant le 16 octobre à 20 h
      sur Google, de manière à pouvoir prouver que vous l’avez bien fait dans les
      temps. Ce qui va faire foi pour savoir si vous êtes en retard ou non, c’est le
      moment où vous l’avez mis sur la plateforme. Vous pouvez tous le mettre avant 20
      h le 16 octobre.
  - chunk_index: 3
    heading_path: Séance 8 du 14 octobre > Rappels sur le TD 0
    content_token_count: 223
    text: |-
      Si jamais vous n’avez pas fini, alertez dès aujourd’hui. Vous pouvez toujours
      négocier avec votre chargé de TD. Je voudrais pas maintenant flancs de la
