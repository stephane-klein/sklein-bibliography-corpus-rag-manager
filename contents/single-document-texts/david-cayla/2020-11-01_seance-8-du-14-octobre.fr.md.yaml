    text: |-
      Pour essayer de réfléchir sur la manière dont le capitalisme fonctionne, il
      faut, nous dit Marx, montrer quelle est la spécificité du capitalisme. Il va
      réfléchir à cela en essayant de comprendre comment l’économie fonctionne, ce qui
      structure l’économie capitaliste, et pour cela il compare à d’autres sociétés.
      La première chose, c’est que dans une société traditionnelle, nous dit Marx —
      attention, il s’agit d’une reconstruction théorique, ce n’est pas une analyse :
      il n’est pas allé voir comment les sociétés traditionnelles fonctionnaient, il
      n’est pas allé faire des séjours dans les tribus d’Amazonie pour voir comment
      elles fonctionnent, c’est une reconstruction intellectuelle — donc dans une
      société traditionnelle, si c’est une société de l’échange, c’est la marchandise
      qui est au cœur des échanges. Comment évolue-t-elle ? On a d’abord une personne
      qui va vendre la marchandise, donc transformer la marchandise en argent, et avec
      cet argent il va acheter une autre marchandise. Ici on voit bien, nous dit Marx,
      que dans ces sociétés-là, au fond, ce qui importe, c’est la marchandise. Ce
      n’est pas l’argent ; l’argent n’est qu’un intermédiaire qui permet, qui facilite
      les échanges et qui transforme une marchandise en une autre marchandise. C’est
      juste pour distinguer cette deuxième marchandise de la première. Donc dans une
      société traditionnelle, il n’y a pas ici d’idée d’accumulation. C’est très
      important. Il y a une idée d’échange : on va s’échanger, on est un peu dans le
      mythe du troc d’Adam Smith, qu’on retrouve aussi dans le TD 2, je crois, et
      aussi expliqué dans le TD 5 sur la monnaie. En gros, on a l’idée que l’argent
      est un intermédiaire de marchandises et permet de faire circuler les
      marchandises. C’est cela la logique de l’échange.
