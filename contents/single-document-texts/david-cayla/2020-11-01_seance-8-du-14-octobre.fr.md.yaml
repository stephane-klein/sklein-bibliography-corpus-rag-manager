      Pour la révision, la question est simple : il faut s’appuyer sur les questions
      de cours, les questions qui sont posées à la fin de chaque chapitre, puisque ce
      sont ces questions qui vous seront posées à l’examen terminal. Il faut
      évidemment travailler ces questions, mais vous allez vite comprendre que pour
      les travailler, il faut comprendre le cours. Cela ne change pas beaucoup par
      rapport à d’habitude ; au moins, vous ne serez pas surpris sur les questions,
      parce qu’elles seront issues de ces questions de fin de chapitre. Si vous avez
      un doute sur la réponse à une question, vous venez me voir à la pause, on peut
      discuter, mais s’il vous plaît, ne m’écrivez pas par e-mail pour me demander la
      réponse à une question : je ne pourrais pas traiter les demandes de corrections
      de 500 étudiants. Le TD 0 sera noté. Je crois l’avoir dit : il fait partie de
      vos notes d’évaluation, c’est pour cette raison qu’il faut le rendre et essayer
      de faire le mieux possible. Vous aurez trois notes en TD : cette note-là, plus
      deux autres notes qui seront des notes de contrôle sur table. Votre chargé de TD
      vous le rappellera lors de la première séance.
  - chunk_index: 9
    heading_path: Séance 8 du 14 octobre > Rappels sur le TD 0
    content_token_count: 204
    text: |-
      Vous trouverez sur le site de la faculté la vidéo de la conférence d’Emmanuel
      Todd qui est venue la semaine dernière, le 5 octobre. Je ne vous en ai pas parlé
      parce que c’était affiché sur les écrans, mais j’ai vu que je pense qu’il n’y
      avait pas beaucoup d’étudiants de première année à cette conférence. De toute
      façon, on ne pouvait pas accueillir tout le monde à cause des mesures
      sanitaires, mais sachez que c’était une conférence extrêmement intéressante.
      Vous allez sur le site de la faculté et vous pouvez voir la vidéo. Moi, je l’ai
      juste présentée au départ. Cette vidéo fait deux heures trente, c’est très long,
      mais c’était un cours qui a été dispensé pour des étudiants de master en même
      temps.
  - chunk_index: 10
    heading_path: Séance 8 du 14 octobre > Rappels sur le TD 0
    content_token_count: 326
    text: |-
      Emmanuel Todd est un intellectuel français, sans doute un des plus brillants de
      mon point de vue, historien et anthropologue. Il a dû évoquer la question des
      rapports entre sociétés et individus, sous l’idée que l’économie a tendance à
      considérer, dans la méthodologie de la pensée économique, que l’individu, les
      comportements individuels, construisent la société. En réalité, d’un point de
      vue anthropologique ou sociologique, c’est plutôt l’inverse : ce sont plutôt les
      structures sociales qui influencent les comportements individuels. J’ai voulu
      l’inviter pour qu’il discute un peu avec les étudiants de master de cette
      conception des rapports entre individus et sociétés. Je comprends que cela
      puisse être un peu abstrait pour vous, mais ce qui est passionnant, c’est qu’il
      raconte comment certains pays arrivent à mieux se sortir par exemple de la crise
      du Covid que d’autres. Pour lui, ce qui est au cœur de ces différences, quand on
      regarde par exemple comment l’Allemagne a beaucoup moins de morts et beaucoup
      moins de contaminations et gère manifestement beaucoup mieux l’épidémie que la
      France, ces différences d’approche sont liées à des valeurs anthropologiques qui
      sont différentes en France et en Allemagne.
  - chunk_index: 11
    heading_path: Séance 8 du 14 octobre > Rappels sur le TD 0
    content_token_count: 410
    text: |-
      Son grand travail d’anthropologue essaie de comprendre pourquoi les pays sont
      différents, et pourquoi par exemple le capitalisme allemand n’est pas le même
      que le capitalisme français, pourquoi la gestion de l’épidémie n’est pas la même
      en Allemagne qu’en France. C’est au cœur de sa pensée, et ce que je trouve
      intéressant, c’est que l’on a tendance en économie à penser que toute la
      production, toute l’économie, est le produit de comportements rationnels
      déterminés par des individus. Ce que Todd nous explique, c’est qu’en fait les
      individus qui paraissent libres et rationnels sont façonnés par des systèmes de
      valeurs qu’ils ont inculqués dans l’enfance, et ces systèmes de valeurs sont
      culturels. Pour Todd, c’est cela qui va déterminer davantage la dynamique des
      sociétés, quelque chose qui est souvent totalement oublié par un certain nombre
      d’économistes. Sa conférence dure une heure et demie, puis il y a une heure de
      questions. Il ne faut pas négliger les questions, parce qu’elles ont permis
      d’avoir une réflexion complémentaire, notamment sur le cas de la Chine ou
      d’autres choses. Il ne va pas voir juste la France et l’Allemagne, il a écrit
      des livres sur l’analyse des structures anthropologiques de sociétés du monde
      entier, et à partir de là il explique la dynamique politique et économique de
      ces pays. Je voulais vous signaler cette conférence, que j’ai trouvée
      passionnante et qui est accessible en ligne, publiquement, donc n’importe qui
      peut la regarder.
  - chunk_index: 12
    heading_path: Séance 8 du 14 octobre > Reprise du chapitre 2
    content_token_count: 165
    text: |-
      Je reprends le cours, chapitre 2. Ce chapitre s’intéresse à la manière dont les
      économistes ont analysé la croissance économique, et notamment comment ils ont
      essayé d’inventer ce concept. On a vu que le concept n’existait pas du temps des
      mercantilistes, qu’il apparaît avec Adam Smith véritablement sous forme
      d’accumulation de biens et d’accumulation du capital : la croissance, c’est
      l’augmentation de la richesse. On a vu aussi que ces économistes qui
      concevaient, qui inventaient la croissance, avaient ensuite conçu la fin de la
      croissance, c’est-à-dire l’état stationnaire.
  - chunk_index: 13
    heading_path: Séance 8 du 14 octobre > Reprise du chapitre 2
    content_token_count: 162
    text: |-
      On a d’abord essayé de montrer comment Malthus considérait que l’état
      stationnaire est la conséquence de l’état social, la conséquence de la
      croissance démographique et du fait que plus on allait augmenter la population,
      plus il fallait cultiver des terres et plus il fallait nourrir des gens. Le
      problème, c’est que la production de nourriture n’augmentait pas au même rythme
      que la multiplication de la population, puisqu’on avait une variation linéaire,
      c’est-à-dire une droite pour l’augmentation de la nourriture, nous dit Malthus,
      et une variation exponentielle pour la population par multiplication.
  - chunk_index: 14
    heading_path: Séance 8 du 14 octobre > Reprise du chapitre 2
    content_token_count: 259
    text: |-
      Ensuite, on a une théorie plus raffinée que celle de Ricardo, plus raffinée
      parce qu’elle englobe de très nombreuses réflexions autres que simplement la
      démographie : c’est la réflexion de Ricardo, qui considère que la croissance est
      limitée par le taux de profit et dépend en tout cas du taux de profit. Le profit
      lui-même dépend du montant de la rente, c’est-à-dire du loyer des terres que les
      agriculteurs doivent payer aux propriétaires fonciers. Selon Ricardo, ce qui va
      déterminer la baisse du taux de profit, c’est l’augmentation de la rente ; ce
      qui va déterminer l’augmentation de la rente, c’est le fait qu’on va devoir
      mettre en culture des terres de moins en moins fertiles, et donc il faudrait que
      le prix de marché des céréales augmente pour rentabiliser ces terres les moins
      fertiles. Cela va entraîner une hausse de la rente et symétriquement une baisse
      du profit.
  - chunk_index: 15
    heading_path: Séance 8 du 14 octobre > Reprise du chapitre 2
    content_token_count: 164
    text: |-
      Pourquoi ? Parce qu’il faudra augmenter les salaires pour que les ouvriers
      puissent se nourrir, et en augmentant les salaires, on va forcément
      mécaniquement baisser le profit. C’est l’analyse de Ricardo, et il arrive à la
      conclusion logique que, au fur et à mesure que la population s’accroît parce que
      la richesse permet à la population de s’accroître, on va avoir une rente qui va
      augmenter, un profit qui va baisser, et il va baisser jusqu’à ce qu’il arrive au
      niveau de 0 %. Lorsque le profit arrive à zéro, nous dit Ricardo, on arrivera à
      l’état stationnaire.
  - chunk_index: 16
    heading_path: Séance 8 du 14 octobre > Reprise du chapitre 2
    content_token_count: 242
    text: |-
      Ricardo construit cette théorie en publiant son livre en 1817, au moment où il y
      a un débat intense au sein de la société et de la politique britannique sur la
      question des Corn Laws, des lois protectionnistes qui interdisent les
      importations de céréales lorsque les prix des céréales tombent en dessous d’un
      certain seuil. Si les prix des céréales sont trop bas, nous disent les députés,
      il ne faut pas importer. En gros, ces lois visent à garantir un niveau minimal
      des prix des céréales et finalement favorisent les propriétaires fonciers, mais
      défavorisent les marchands et les industriels. Ricardo est en quelque sorte le
      porte-parole des intérêts des industriels, des marchands et des banquiers,
      puisque lui-même est banquier, et il va chercher à convaincre le gouvernement
      d’abroger ces lois sur le grain, ces lois protectionnistes, en promettant le
      libre-échange.
  - chunk_index: 17
    heading_path: Séance 8 du 14 octobre > Reprise du chapitre 2
    content_token_count: 289
    text: |-
      L’idée derrière cette théorie de la rente, c’est de dire : vous voyez, si vous
      interdisez les importations de céréales, vous allez maintenir les prix du blé à
      un niveau élevé, mais du coup vous allez entraîner des hausses salariales pour
      permettre aux ouvriers de continuer à vivre, et vous allez aussi entraîner une
      baisse du taux de profit. Cette baisse du taux de profit va limiter la
      croissance économique. On retrouve encore aujourd’hui des économistes dire :
      votre objectif, gouvernement, c’est de favoriser la croissance économique pour
      aller vers la prospérité. Attention, si vous prenez de mauvaises lois, la
      croissance sera plus faible et vous allez vous retrouver avec des difficultés.
      On voit que Ricardo invente en quelque sorte l’idée que les politiques publiques
      peuvent favoriser la croissance ou la défavoriser si elles sont mauvaises.
      Derrière l’idée de libre-échange, il y a l’idée de libéralisme : il faut laisser
      les individus libres de commercer librement, y compris avec l’étranger.
  - chunk_index: 18
    heading_path: 'Séance 8 du 14 octobre > Karl Marx : matérialisme et dialectique'
    content_token_count: 462
    text: |-
      Maintenant, on va voir un autre économiste, Karl Marx, qui n’est pas un simple
      économiste. Au départ, Marx est un philosophe allemand, et c’est aussi
      aujourd’hui un activiste, un militant, qui continuait de militer toute sa vie.
      Il cherche à comprendre le monde dans lequel il vit, et ce monde n’est plus tout
      à fait celui de Ricardo. C’est un monde où globalement on a de très nombreuses
      révolutions, des luttes sociales très fortes. On voit bien la dégradation de la
      condition ouvrière depuis la fin du XVIIIe siècle, qui apparaît un peu partout
      en Europe, et surtout un urbanisme qui s’accroît. Quand les pays, notamment le
      Royaume-Uni, mais aussi la France et tous les pays d’Europe, amorcent la
      révolution industrielle, la première conséquence est un premier exode rural, qui
      en aura d’autres après, et une augmentation de la taille des villes. Cette
      transformation socioculturelle, l’urbanisation, va évidemment favoriser à la
      fois la dégradation des conditions de travail, parce que les logements vont être
      très souvent insalubres. Les villes sont beaucoup moins saines que les campagnes
      en réalité, parce qu’il y a la pollution, parce qu’on n’a pas de systèmes
      sanitaires corrects, on n’a pas forcément de systèmes de collecte des déchets.
      Il faut bien voir que les villes du début du XIXe siècle, c’est très malsain.
      D’ailleurs, on constate, quand on regarde les chiffres démographiques, qu’on a
      un taux de mortalité supérieur dans les villes que dans les campagnes :
      globalement, les gens meurent plus, l’espérance de vie dans les villes est plus
      faible que dans les campagnes dans la première moitié du XIXe siècle. C’est dire
      à quel point les villes sont insalubres.
  - chunk_index: 19
    heading_path: 'Séance 8 du 14 octobre > Karl Marx : matérialisme et dialectique'
    content_token_count: 409
    text: |-
      Marx, quand il réfléchit, quand il pense, quand il milite, on est au milieu du
      XIXe siècle. Il voit les conséquences néfastes de la révolution industrielle,
      notamment sur les populations les plus pauvres. Les ouvriers voient leur niveau
      de vie se dégrader au début, à la fin du XVIIIe et au début du XIXe siècle, au
      moment de la révolution industrielle. Le niveau de vie des ouvriers va ensuite
      progresser, mais progresser lentement, et on va dire que cela ne sera visible
      qu’après la première moitié du XIXe siècle, à partir du milieu du XIXe siècle,
      voire plus tard encore, dans les années 1860-1870, où on va commencer à voir des
      classes ouvrières un peu moins démunies. N’oubliez pas que dans les années 1830,
      on a des enfants qui travaillent dans la plupart des pays occidentaux. N’oubliez
      pas qu’en Angleterre, le travail des enfants va être autorisé jusqu’à l’âge de
      11 ans pendant tout le XIXe siècle. Donc on pouvait faire travailler des enfants
      de 12 ans, des collégiens, des petits sixièmes, et même pendant très longtemps
      les enfants de 8 ans pouvaient aussi travailler. On avait des lois sociales qui
      étaient extrêmement réduites, et là on parle encore une fois de la fin du XIXe
      siècle, une période où globalement on voit bien que si le travail des enfants
      est autorisé, c’est parce que pour beaucoup de familles c’est indispensable pour
      se nourrir. On a une situation sociale extrêmement désastreuse.
  - chunk_index: 20
    heading_path: 'Séance 8 du 14 octobre > Karl Marx : matérialisme et dialectique'
    content_token_count: 326
    text: |-
      Je vous ai parlé de cela, j’ai montré aussi qu’on avait des lois qui
      interdisaient les syndicats en France, la loi Le Chapelier de 1791. Les
      syndicats vont être autorisés à partir de 1864, donc là on est encore sous le
      Second Empire, et le droit de grève lui-même va être accordé au moment de la
      Troisième République, donc après 1870. L’instruction obligatoire en France et
      dans beaucoup de pays d’Europe, c’est à la fin du XIXe siècle. L’instruction
      obligatoire, c’est cela qui va concrètement terminer le travail des enfants,
      parce qu’ils sont obligés d’être à l’école jusqu’à 12 ans au départ, puis
      progressivement cela va augmenter, aujourd’hui jusqu’à 16 ans. Cela veut dire
      que le travail est très difficile à faire avant cet âge-là. Sachez
      qu’aujourd’hui on peut faire travailler les adolescents de 15 ans, il faut une
      dérogation, mais c’est possible. Donc quand je vous dis que les deux sont liés,
      c’est vrai. Jusqu’à 16 ans, on a l’instruction obligatoire, mais on peut
      commencer à travailler à 15 ans, et même parfois sous forme d’apprenti dès 14
      ans, mais c’est dans le cadre d’un apprentissage.
  - chunk_index: 21
    heading_path: 'Séance 8 du 14 octobre > Karl Marx : matérialisme et dialectique'
    content_token_count: 328
    text: |-
      Karl Marx, je vous invite à voir le film *Le jeune Karl Marx* de Raoul Peck, un
      film qui raconte la jeunesse de Marx et qui est intéressant parce qu’il raconte
      aussi la manière dont la politique et la défense des ouvriers se faisaient à ce
      moment-là. On est dans les années 1840, et c’est assez amusant de voir comment,
      par les débats de l’époque, le mouvement ouvrier s’organisait. Ce qui est aussi
      amusant, c’est de voir que Marx s’oppose à un autre théoricien qui est son aîné,
      qui est la personne la plus connue dans le monde ouvrier, Joseph Proudhon.
      Proudhon lutte contre le propriétaire, contre la propriété, et on lui doit la
      formule « la propriété, c’est le vol ». Donc ils avaient vraiment une vision
      révolutionnaire, qui sera la même aussi que Marx. Mais la différence entre Marx
      et Proudhon, ce que va apporter Marx au mouvement ouvrier, c’est une réflexion
      scientifique. Marx va s’intéresser à la manière dont la bourgeoisie, qu’il
      appelle la classe bourgeoise, légitime sa politique. Pour Marx, au cœur de
      l’idéologie dominante de son époque, il y a l’économie politique, et notamment
      l’économie politique de Ricardo.
  - chunk_index: 22
    heading_path: 'Séance 8 du 14 octobre > Karl Marx : matérialisme et dialectique'
    content_token_count: 206
    text: |-
      Ce que va faire Marx, c’est qu’il va s’imprégner de l’analyse ricardienne de
      l’économie et il va chercher à retourner la théorie de Ricardo pour en faire un
      instrument au service de la classe ouvrière. C’est clairement dans le projet de
      Marx : il considère que Ricardo a mis la pensée scientifique économique au
      service de la bourgeoisie, et lui dit : je vais prendre la même pensée et je
      vais la mettre au service des travailleurs. Cela veut dire qu’il va reprendre
      grosso modo l’essentiel de la pensée de Ricardo, mais il va la réinterpréter
