      Comment se résout-elle ? De plusieurs manières. D’abord, on voit bien que cette
      croissance de la production capitaliste ne peut être résolue que si le
      capitalisme s’étend. On est ici dans un système qui fondamentalement va créer de
      la croissance et qui ne va pouvoir créer cette croissance que s’il parvient à
      s’étendre. Comment s’étendre ? Déjà géographiquement, dans le cadre des
      frontières nationales. En gros, la première phase qui va permettre au
      capitalisme de se développer, c’est qu’il va faire disparaître toute l’activité
      traditionnelle, et ça va aller très vite. Là aussi Marx a raison : c’est ce qui
      se passe très vite. Les artisans, les petits commerces traditionnels
      disparaissent. On le voit d’ailleurs : c’est cette dynamique constante dans le
      capitalisme. Voyez comment les supermarchés ou les hypermarchés ont fait
      disparaître les petits commerçants. Il n’y a quasiment plus d’épiceries, bien
      qu’il en reste quelques-unes. Si vous avez une machine à remonter le temps et
      que vous remontez dans les années 1960, vous verrez qu’à l’époque tout le monde
      faisait ses courses sur les marchés ou dans les épiceries, il n’y avait pas de
      supermarché. Ces supermarchés, c’est du capitalisme : on passe de l’artisanat au
      capitalisme. Les artisans individuels, les commerçants, passent à une entreprise
      capitaliste qui va complètement repenser le modèle avec des grands parkings, des
      immenses surfaces, des coûts bas, et qui va repenser le modèle de consommation.
      Tout ça va totalement éradiquer toute la production traditionnelle. Il se passe
      pareil en agriculture : la culture paysanne, classe traditionnelle de la fin du
      XIXe siècle, a totalement disparu avec la mécanisation et l’industrialisation de
      la production agricole. On voit ça partout. Donc le premier élément, c’est que
      ce système-là ne peut fonctionner que grâce à l’existence d’un système
      productiviste arriéré qu’il va progressivement remplacer. Il va trouver des
      débouchés dans les gens qui achetaient au secteur traditionnel et qui vont se
      tourner vers le secteur industriel. C’est une structure tendancielle du
      capitalisme : la disparition de l’artisanat, de la paysannerie, du travail
      indépendant, et globalement la généralisation du salariat. Les gens vont perdre
      leur indépendance. Ils ne vont plus produire eux-mêmes pour eux-mêmes avec leur
      propre capital ; ils vont devoir être salariés et travailler pour une entreprise
      capitaliste. On dit parfois que, avec la numérisation, on retrouve le
      travailleur indépendant contre le salarié, mais malgré tous ces emplois
      individuels permis par Internet et l’économie des plateformes, aujourd’hui on
      reste encore dans le salariat pour l’essentiel du travail, notamment du travail
      bien rémunéré. Le problème des contenus des plateformes, c’est que très souvent
      le travail n’est pas vraiment rémunéré.
