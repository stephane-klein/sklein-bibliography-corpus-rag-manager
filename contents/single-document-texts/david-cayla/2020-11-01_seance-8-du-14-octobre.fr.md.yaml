      d’intérêt les cours. Hegel considère que tout système trouve en lui des
      contradictions qui le poussent à se transformer, à évoluer. Ce qui est au cœur
      de la pensée dialectique, c’est le principe d’évolution. Si on veut réfléchir
      très simplement, la première hypothèse que pose la pensée dialectique, c’est que
      rien n’est jamais stable : tout change, tout évolue, tout se transforme.
      Jusqu’où un objet peut-il évoluer ? Jusqu’à ce qu’il disparaisse. C’est la
      première hypothèse de la pensée dialectique : tout objet qu’on analyse a une
      existence, a un début au moment où il apparaît dans l’univers, puis il ne reste
      jamais ce qu’il est, il se transforme, il se transforme jusqu’à un point où il
      disparaît en tant qu’objet, il casse, il meurt, tout ce que vous voulez dire. Ce
      qu’il faut comprendre, c’est que rien n’est dans l’état où il est ad vitam
      aeternam, tout se transforme.
