  - chunk_index: 0
    heading_path: Qui DOIT gagner la coupe du monde ? FOOTBALL & UTILITARISME
    content_token_count: 48
    text: |-
      aujourd'hui on parle de football et de morale. Faisons taire un moment d'autre
      hooliganisme et posons-nous sérieusement la question : qui doit gagner cette
      Coupe du monde ?
  - chunk_index: 1
    heading_path: Qui DOIT gagner la coupe du monde ? FOOTBALL & UTILITARISME
    content_token_count: 96
    text: |-
      « À la France, c'est les meilleurs ! » Alors d'abord, j'en sais rien, et toi non
      plus. Mais surtout, ce n'était pas le sens de ma question. Je ne demande pas qui
      doit gagner au sens de la nécessité ou du mérite sportif. Je demande qui le doit
      au sens moral, et plus spécifiquement, on va l'aborder sous l'angle
      utilitariste.
  - chunk_index: 2
    heading_path: Qui DOIT gagner la coupe du monde ? FOOTBALL & UTILITARISME > L'utilitarisme et le football
    content_token_count: 186
    text: |-
      Ah ok, c'est reparti pour l'utilitarisme. L'utilitarisme, dont je vous ai déjà
      parlé dans plein de vidéos et dont on parle aussi régulièrement, est la théorie
      selon laquelle la valeur morale d'une action dépend de sa contribution au
      bonheur général, c'est-à-dire à la plus grande somme de bonheur individuel. Même
      si les fondements de la morale sont toujours discutables et incertains, et que
      j'ai peut-être tort de ne pas me taire à ce sujet comme nous y invite
      Wittgenstein, il faut avouer que l'utilitarisme, en dehors des cas bizarres à
      base de petit train qui foncent sur des personnes, est une base plutôt très
      intuitive pour la plupart de nos jugements moraux.
  - chunk_index: 3
    heading_path: Qui DOIT gagner la coupe du monde ? FOOTBALL & UTILITARISME > L'utilitarisme et le football
    content_token_count: 102
    text: |-
      Par exemple, si deux événements A et B peuvent se produire et que vous savez
      qu'il résultera beaucoup de malheurs et très peu de bonheur de l'événement A,
      tandis qu'il résultera beaucoup de bonheur et très peu de malheur de l'événement
      B, il paraît profondément immoral de souhaiter A plutôt que B. Ça paraît plutôt
      logique, non ?
  - chunk_index: 4
    heading_path: Qui DOIT gagner la coupe du monde ? FOOTBALL & UTILITARISME > L'utilitarisme et le football
    content_token_count: 134
    text: |-
      Bah oui, il faudrait une bonne dose de perversité pour souhaiter le malheur des
      gens. Eh bien, si vous m'accordez ce point, vous devriez en conclure que la
      majorité des supporters sont au moins occasionnellement profondément immoraux,
      puisqu'en souhaitant la victoire de leur équipe au détriment de l'équipe
      adverse, bien souvent ils souhaitent un événement dont ils ont toutes les
      raisons de penser qu'il causera globalement plus de malheurs que de bonheur dans
      le monde.
  - chunk_index: 5
    heading_path: Qui DOIT gagner la coupe du monde ? FOOTBALL & UTILITARISME > L'utilitarisme et le football
    content_token_count: 232
    text: |-
      Ah oui, mais bon, faut pas regarder les choses sous cet angle... Mais pourquoi
      pas ? C'est bien pour ça que l'utilitarisme est chouette : ça permet de voir les
      choses sous un autre angle, souvent un angle plus général. L'approche
      utilitariste se prête vraiment bien à un match de foot à gros enjeux. Il y a en
      gros deux issues possibles à un match entre A et B : victoire de l'équipe A ou
      victoire de l'équipe B. Chacune de ces issues aura un effet bien distinct,
      produira une certaine quantité de bonheur et de malheur dans le monde. C'est une
      quantité que l'on peut plus ou moins estimer avant le match. Le bon résultat, au
      sens utilitariste, sera celui qui produit le plus grand bonheur pour le plus
      petit malheur. Et c'est ça qui détermine quelle équipe doit gagner, quelle
      équipe vous devez soutenir si vous êtes vraiment utilitariste.
  - chunk_index: 6
    heading_path: Qui DOIT gagner la coupe du monde ? FOOTBALL & UTILITARISME > L'utilitarisme et le football
    content_token_count: 180
    text: |-
      Ça me paraît complètement con comme raison pour soutenir une équipe. C'est pas
      plus con qu'on essaie d'être plutôt irrationnel que de soutenir une équipe sur
      la base de sa nationalité, j'imagine. Tant qu'à être hooligans, autant être
      utilitaristes dans son néo-legalisme. 1 qu'est-ce que tu dis ça allait... et
      vraiment, s'il y a bien un événement qui se prête à cette approche utilitariste,
      c'est la Coupe du monde de football. Parce que les effets des matches sont très
      importants, et la quantité de bonheur produite par telle ou telle issue paraît
      estimable de façon assez convaincante à partir de quelques critères simples.
  - chunk_index: 7
    heading_path: Qui DOIT gagner la coupe du monde ? FOOTBALL & UTILITARISME > L'utilitarisme et le football > Les critères utilitaristes
    content_token_count: 14
    text: 'Par exemple, on pourrait retenir déjà ces quatre critères :'
  - chunk_index: 8
    heading_path: Qui DOIT gagner la coupe du monde ? FOOTBALL & UTILITARISME > L'utilitarisme et le football > Les critères utilitaristes
    content_token_count: 426
    text: |-
      1.  **La taille de la population qui soutient l'équipe.** Quand, en huitièmes de finale de l'Euro 2016, l'Islande (300 000 habitants) a éliminé l'Angleterre (53 millions d'habitants), c'est peut-être un exploit, mais c'est surtout monstrueux du point de vue utilitariste. Sans rancune, c'était le temps d'aimer, la quantité de bonheur produite par leur victoire n'est juste pas à la hauteur.
      2.  **Le degré d'intérêt de la population concernée pour le foot.** Toutes choses égales par ailleurs, il est clair que la quantité de bonheur produite sera plus grande si la population y accorde plus d'importance, ce qui, j'imagine, donne un bonus utilitariste à une bonne partie de l'Amérique du Sud.
      3.  **Les conditions socio-économiques et le bonheur initial de la population concernée.** On peut estimer que la quantité de bonheur produite sera d'autant plus importante que la population qui soutient l'équipe est au départ plutôt pauvre et malheureuse.
      4.  **La rareté des victoires par le passé, et particulièrement le passé récent.** Plus une équipe gagne souvent et récemment, moins elle produit de bonheur par ses victoires. Il y a une utilité décroissante des victoires. Si l'Allemagne avait encore gagné celle-ci, ça aurait fait plaisir aux Allemands, bien sûr, mais bien moins qu'à bien d'autres pays qui n'ont jamais remporté le trophée. De ce point de vue, l'élimination de l'Allemagne par la Corée du Sud en phase de poules était plutôt une bonne chose. Bien joué à eux.
  - chunk_index: 9
    heading_path: Qui DOIT gagner la coupe du monde ? FOOTBALL & UTILITARISME > L'utilitarisme et le football > Application à la Coupe du monde
