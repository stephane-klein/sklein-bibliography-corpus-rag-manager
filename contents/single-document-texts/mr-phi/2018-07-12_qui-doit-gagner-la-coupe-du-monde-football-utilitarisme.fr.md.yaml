      Autres questions amusantes à soulever : quel match, à votre avis, a eu le
      résultat le moins utilitariste de la compétition ? Autrement dit, quel match a
      manqué le plus de maximiser le bonheur ? Par exemple, pour l'Euro 2016, je vote
      sans hésitation pour l'Islande-Angleterre, dont le résultat est juste une
      catastrophe d'un point de vue utilitariste. Y a-t-il eu un match semblable lors
      de cette Coupe du monde ? Pour ma part, le match Belgique-Brésil me paraît être
      un bon candidat.
  - chunk_index: 12
