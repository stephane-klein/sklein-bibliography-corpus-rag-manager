  - chunk_index: 25
    heading_path: 'CONSÉQUENTIALISME - Quel est le but de la morale ? | Grain de philo #16 > Conclusion : un désaccord sur les hiérarchies de valeurs'
    content_token_count: 27
    text: |-
      Sur ce, je vous laisse. Portez-vous bien, et tâchez d'être bénéfiques pour le
      monde.
