chunks:
  - chunk_index: 0
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4)'
    content_token_count: 136
    text: |-
      Aujourd'hui est un grand jour, car je vais parler de Lewis Carroll et des
      Éléments d'Euclide. Mais c'est quand même le dernier épisode de cette série — en
      fait, je me suis rendu compte que j'avais pas mal de choses à dire sur la
      géométrie euclidienne et l'axiomatique. C'est donc un running gag : on est passé
      de un à cinq épisodes en tout, et c'est mieux. Tu vois, c'est les cinq doigts de
      la main, les cinq postulats d'Euclide — ça fait sens.
  - chunk_index: 1
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > La démonstration élégante de la somme des angles'
    content_token_count: 129
    text: |-
      Je me souviens qu'un jour, à l'école, on nous avait demandé de dessiner des
      triangles, puis de découper leurs angles et de les coller côte à côte. C'est
      sûrement un truc que beaucoup d'élèves ont fait, et quel que soit le triangle
      dont je partais, à chaque fois, quand je collais le troisième angle, ça
      complétait parfaitement un demi-cercle. Ce qui ne manquait pas de m'ébahir — ça
      avait quelque chose d'un tour de magie.
  - chunk_index: 2
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > La démonstration élégante de la somme des angles'
    content_token_count: 180
    text: |-
      Est-ce qu'il y a d'encore plus génial ? C'est ça qui est beau en maths : on nous
      a expliqué ce tour de magie. La démonstration est super simple — je pense qu'une
      bonne partie d'entre vous la connaissez déjà. Si je prends un triangle ABC, je
      peux toujours tracer une droite qui passe par A et qui soit parallèle au côté
      opposé BC. Et là, tout à coup, vous voyez que cet angle sera toujours égal à cet
      angle, et que cet angle sera toujours égal à celui-là — on dit que ce sont des
      angles alternes-internes. Du coup, en effet, l'angle plat ici est toujours égal
      à la somme des trois angles du triangle. N'est-ce pas une belle démonstration ?
  - chunk_index: 3
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > La démonstration élégante de la somme des angles'
    content_token_count: 179
    text: |-
      Mais moi, ça me convient tout à fait. Sauf que je commence à connaître : tu vas
      dire un truc du genre "oui, mais ça suppose plein de trucs qui ne sont même pas
      vraiment démontrés, et pour les démontrer, il faut supposer plein d'autres
      trucs." D'abord, c'est ridicule, personne ne parle comme ça. Mais effectivement,
      ça suppose plein de choses qui n'ont pas été démontrées. D'abord, ça suppose
      qu'on a cette égalité d'angle lorsqu'une droite coupe deux droites parallèles.
      Et ça suppose aussi qu'il y a une droite parallèle à BC passant par A — et
      crois-moi, ce n'est pas une supposition anodine du tout.
  - chunk_index: 4
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > La démonstration élégante de la somme des angles'
    content_token_count: 196
    text: |-
      Je sais, ça paraît totalement évident. En effet, c'est évident, c'est intuitif,
      et c'est pour ça que c'est une démonstration tout à fait convaincante : on part
      de deux prémisses évidentes et intuitives, et on arrive à une conclusion qui est
      nettement moins évidente et intuitive. En fait, c'est même plutôt une
      proposition surprenante de prime abord. Mais puisqu'on a bien mené une
      démonstration — c'est-à-dire que le raisonnement est valide — alors il faut
      transmettre entièrement la force des prémisses à la conclusion. Il faut donc
      dorénavant tenir cette conclusion, qui nous semblait au départ plutôt
      surprenante, pour aussi assurée que les prémisses évidentes et intuitives dont
      nous étions partis.
  - chunk_index: 5
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > Les Éléments d''Euclide'
    content_token_count: 172
    text: |-
      Et ça, c'est beaucoup, je trouve, et c'est beau. Partir du plus évident et
      arriver, par démonstration, au moins évident. C'est ce qui est au cœur de la
      méthode d'un des livres de mathématiques les plus influents de l'histoire, un
      véritable chef-d'œuvre : les *Éléments d'Euclide*. Figurez-vous que c'est le
      premier livre à avoir été imprimé en Occident après la Bible — on avait le sens
      des priorités à l'époque. Il s'agit d'un traité de géométrie et d'arithmétique
      écrit vers 300 avant J.-C. par le mathématicien grec Euclide.
  - chunk_index: 6
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > Les Éléments d''Euclide'
    content_token_count: 123
    text: |-
      Pourquoi ce livre a-t-il été si important ? On pourrait croire que c'est parce
      qu'Euclide démontre dedans des choses très difficiles à démontrer que personne
      n'avait démontrées avant lui. Mais en fait, pas vraiment — la plupart des
      résultats présentés dans les *Éléments d'Euclide* étaient probablement déjà
      connus. Alors, qu'est-ce qui est si extraordinaire dans les *Éléments* ? Ce
      n'est juste un best-of de mathématiques ?
  - chunk_index: 7
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > La carte routière de la démonstration'
    content_token_count: 130
    text: |-
      Tu peux te représenter une démonstration comme une route qui relie un ensemble
      de points (les prémisses) à un autre point (la conclusion). À l'époque
      d'Euclide, on connaît déjà plein de routes qui aboutissent à des trucs
      intéressants, comme le théorème de Pythagore ou l'irrationalité de racine de 2 —
      ces choses-là sont vraiment bien connues déjà. Mais on n'a pas une idée claire
      de comment s'organise ce réseau de routes. D'où partent toutes ces routes ?
  - chunk_index: 8
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > La carte routière de la démonstration'
    content_token_count: 187
    text: |-
      Les *Éléments d'Euclide*, c'est une carte routière. Le génie d'Euclide dans ces
      *Éléments*, c'est qu'il va donner un cadre qui permet d'unifier à peu près tout
      le savoir mathématique de son temps dans une seule arborescence de
      démonstration, dont les racines — les points de départ — seront aussi peu
      nombreux et aussi simples et évidents que possible. De sorte que la vérité de
      l'ensemble de tous les résultats mathématiques prouvés dans les *Éléments
      d'Euclide* (et des autres, comme on pourra le prouver à partir de là) ne dépend
      que de la vérité de ce petit nombre de points de départ évidents, qu'on appelle
      aujourd'hui des **axiomes**.
  - chunk_index: 9
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > La carte routière de la démonstration'
    content_token_count: 103
    text: |-
      Construire un édifice de démonstration de cette façon, c'est ce qu'on a appelé
      pendant longtemps la méthode des géomètres, et c'est ce qu'on appelle
      aujourd'hui la méthode axiomatique. Et même si la méthode axiomatique
      aujourd'hui a pas mal évolué et beaucoup gagné en rigueur, les *Éléments
      d'Euclide* méritent bien qu'on se penche sur eux.
  - chunk_index: 10
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > Les trois types de points de départ'
    content_token_count: 27
    text: |-
      Quels sont ces points de départ sur lesquels tout sera construit ? Euclide
      distingue lui-même trois types.
  - chunk_index: 11
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > Les trois types de points de départ > Les définitions'
    content_token_count: 108
    text: |-
      Le groupe le plus important concerne des affirmations qui ont trait au
      vocabulaire employé : ce sont des définitions. Par exemple, Euclide définit le
      cercle de la façon suivante (c'est la définition 15) : « Un cercle est une
      figure plane comprise par une seule ligne qu'on nomme circonférence, toutes les
      droites menées à la circonférence d'un des points placés dans cette figure étant
      égales entre elles. »
  - chunk_index: 12
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > Les trois types de points de départ > Les définitions'
    content_token_count: 210
    text: |-
      On peut comprendre sa définition vraiment comme une convention arbitraire, un
      peu comme une abréviation. L'idée, c'est qu'on va souvent vouloir parler de ces
      figures planes comprises par une seule ligne, telles que toutes les droites
      menées à cette ligne depuis un certain point à l'intérieur de cette figure sont
      égales entre elles. Mais c'est super long et chiant à dire, et du coup ça
      vaudrait le coup d'abréger ça en un seul mot : « cercle ». C'est quand même
      vachement plus pratique — mais c'est un mot dont on pourrait théoriquement se
      passer, puisque à chaque fois que le mot « cercle » apparaîtra dans les
      *Éléments d'Euclide*, il serait formellement correct d'y substituer cette
      expression qui le définit. Ce serait juste un petit peu lourde, mais ce serait
      formellement correct.
  - chunk_index: 13
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > Les trois types de points de départ > Les définitions'
    content_token_count: 112
    text: |-
      Dans la définition du cercle, il y a d'autres mots qui sont aussi des
      abréviations. Effectivement, la définition du cercle — la 15e que donne Euclide
      — contient plusieurs mots pour lesquels Euclide a déjà donné une définition,
      notamment les mots « ligne droite » et « point ». En fait, la toute première
      définition d'Euclide est justement celle du point : « Le point est celui dont la
      partie est nulle. »
  - chunk_index: 14
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > Les trois types de points de départ > Les définitions'
    content_token_count: 243
    text: |-
      Du coup, comment sont définis les termes de cette première définition ? Tu as
      compris le truc : il y a quelque chose d'inévitable au sujet de cette
      définition, puisque c'est la toute première du livre. Tous les termes qui
      apparaissent sont fatalement des termes non définis. On peut les appeler des
      termes primitifs. On peut se refaire un trilemme d'Agrippa, mais avec des
      définitions — c'est exactement ça : si on ne veut pas d'une régression à
      l'infini dans les définitions, si on ne veut pas non plus de définition
      circulaire (définir A par B puis B par A), il faut admettre qu'il y aura un
      certain nombre de termes primitifs non définis. Et ce n'est pas grave : il faut
      bien des termes primitifs, il faut bien des premières briques au langage, comme
      il faut bien des premières briques aux démonstrations.
  - chunk_index: 15
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > Les trois types de points de départ > Les notions communes'
    content_token_count: 161
    text: |-
      Penchons-nous maintenant sur le deuxième type de point de départ dans les
      *Éléments d'Euclide* : les notions communes. Les notions communes sont peu
      nombreuses — il y en a cinq en tout, dont quatre qui concernent l'égalité. Par
      exemple, la première : « Deux choses égales à une même troisième sont égales
      entre elles. » On appelle d'ailleurs aujourd'hui « euclidiennes » les relations
      qui ont cette propriété. La cinquième notion commune est assez célèbre, et j'en
      reparlerai un peu plus loin : « Le tout est plus grand que la partie. » Bah oui,
      ça paraît évident.
  - chunk_index: 16
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > Les trois types de points de départ > Les postulats'
    content_token_count: 114
    text: |-
      Voyons le troisième type de point de départ : les postulats. Et comme pour les
      notions communes, il y en a seulement cinq dans les *Éléments d'Euclide*. Les
      postulats, à la différence des notions communes, concernent directement la
      géométrie, et on peut dire en quelque sorte que ce sont eux qui font la
      géométrie euclidienne. Ce sont des affirmations, là encore, très simples et
      intuitives.
  - chunk_index: 17
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > Les trois types de points de départ > Les postulats'
    content_token_count: 91
    text: |-
      Le premier : entre deux points, on peut toujours tracer une droite. Le deuxième
      : on peut toujours prolonger indéfiniment une droite tracée entre deux points.
      Le troisième : partant d'un point et d'une longueur donnés, on peut toujours
      tracer un cercle. Le quatrième : tous les angles droits sont égaux entre eux —
      ça tombe vraiment sous le sens.
  - chunk_index: 18
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > Les trois types de points de départ > Les postulats'
    content_token_count: 228
    text: |-
      Et le cinquième postulat : « Si une droite coupant deux droites fait les angles
      intérieurs du même côté plus petits que deux droits, ces droites prolongées à
      l'infini se rencontreront du côté où les angles sont plus petits que deux
      droits. » Ce cinquième postulat d'Euclide a toujours frappé comme étant
      sensiblement moins évident que tout le reste. Ceci dit, on s'est assez vite
      rendu compte qu'on pouvait, sans rien changer à la géométrie d'Euclide,
      remplacer ce postulat par un équivalent plus simple et plus intuitif, comme :
      par un point donné, on ne peut mener qu'une et une seule parallèle à une droite
      donnée. C'est cette version qui reste aujourd'hui la plus connue, si bien que le
      cinquième postulat d'Euclide est souvent présenté — et même souvent appelé —
      l'axiome des parallèles.
  - chunk_index: 19
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > La méthode axiomatique'
    content_token_count: 109
    text: |-
      Voilà les points de départ d'Euclide : des définitions qui ne sont, ensemble,
      que des conventions d'écriture, et surtout cinq notions communes et cinq
      postulats, tous très simples et intuitifs — avec juste un petit bémol pour le 5e
      postulat. Je vais appeler dorénavant tous ces points de départ des **axiomes** —
      ce sera plus simple, et ça correspond en gros à l'usage moderne du terme.
  - chunk_index: 20
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > La méthode axiomatique'
    content_token_count: 126
    text: |-
      Si on démontre une proposition en ne prenant que ses axiomes pour prémisses,
      alors la proposition ainsi démontrée sera appelée **théorème** de la géométrie
      euclidienne. Un théorème, c'est ce que l'on peut déduire d'un ensemble
      d'axiomes. Donc, quand on parle d'un théorème, pour parler vraiment strictement,
      il faudrait toujours préciser dans quelle théorie, vis-à-vis de quel ensemble
      d'axiomes c'est un théorème.
  - chunk_index: 21
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > La méthode axiomatique'
    content_token_count: 197
    text: |-
      Mais ça veut dire qu'à chaque fois, il faut repartir des axiomes pour prouver un
      théorème ? En fait, non. Parce qu'une fois que tu as démontré un théorème, tu
      peux réutiliser ce théorème comme prémisses pour prouver d'autres théorèmes dans
      la même théorie. En effet, si tu as une démonstration qui va du théorème 1 à une
      proposition 2, comme tu sais par ailleurs qu'il y a une démonstration qui va des
      axiomes au théorème 1 — sinon ce ne serait pas un théorème — tu sais que cette
      démonstration pourrait être prolongée jusqu'à la proposition 2, qui est du coup
      elle aussi bien un théorème, puisqu'on l'a démontrée à partir des axiomes
      seulement.
  - chunk_index: 22
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > La méthode axiomatique'
    content_token_count: 159
    text: |-
      En procédant de cette façon, de théorème en théorème, tout ce qui est démontré
      dans les *Éléments d'Euclide* — et de façon plus générale, tout ce qui peut être
      démontré en géométrie euclidienne — repose seulement sur l'acceptation des
      définitions et surtout des dix petits axiomes très simples et intuitifs posés au
      tout début du livre. Si ces axiomes sont vrais, alors nécessairement tout le
      reste est vrai. Et ça, c'est très fort et très beau : on accepte très très peu
      de choses au départ, et ça permet d'explorer un continent de démonstration.
  - chunk_index: 23
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > La méthode axiomatique'
    content_token_count: 111
    text: |-
      On décrit souvent cette structure comme une pyramide inversée : il y a quelques
      petites briques à la base, et sur ces petites briques, on a posé plein de
      théorèmes, et sur ces théorèmes, on en pose encore plus. En fin de compte, on a
      posé des milliers et des milliers de théorèmes sur seulement quelques axiomes.
      Et c'est là qu'on se rend compte que le choix des axiomes est particulièrement
      crucial.
  - chunk_index: 24
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > La question du cinquième postulat et les géométries non euclidiennes'
    content_token_count: 34
    text: |-
      Bon, ça va, c'est du solide, les axiomes d'Euclide ? Pas en fait — ce n'est pas
      si simple que ça.
  - chunk_index: 25
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > La question du cinquième postulat et les géométries non euclidiennes'
    content_token_count: 148
    text: |-
      D'abord, il y a ce 5e postulat, l'axiome des parallèles. Comme il est nettement
      plus complexe que les autres, il fait un peu tache. Les mathématiciens ont
      toujours voulu s'en débarrasser, en particulier se demander si on ne pourrait
      pas le démontrer à partir d'autres axiomes — en somme, ce serait un
      crypto-théorème, et donc on aurait la même théorie avec un axiome de moins. Mais
      malgré bien des tentatives, on n'arrivait pas à démontrer ce foutu postulat.
  - chunk_index: 26
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > La question du cinquième postulat et les géométries non euclidiennes'
    content_token_count: 144
    text: |-
      Au XVIIe siècle, un mathématicien italien nommé Saccheri a eu l'idée de prendre
      le problème à l'envers : il voulait montrer qu'en prenant les autres axiomes
      d'Euclide et la négation du cinquième postulat, il arriverait à une
      contradiction — c'est-à-dire qu'il arriverait à démontrer à la fois une
      proposition et sa négation. Cela constituerait du coup une démonstration par
      l'absurde du cinquième postulat d'Euclide à partir d'autres axiomes.
  - chunk_index: 27
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > La question du cinquième postulat et les géométries non euclidiennes'
    content_token_count: 127
    text: |-
      Saccheri a passé sa vie sur ce problème, sans succès. En partant de la négation
      du cinquième postulat d'Euclide plus les autres axiomes, il construisait des
      démonstrations tout à fait cohérentes, mais dont les conclusions lui semblaient
      bizarres et répugnantes, et qui ne l'intéressaient pas, parce que lui, il
      cherchait seulement une contradiction — contradiction qu'il n'a jamais trouvée,
      et qui, on le sait aujourd'hui, n'existe pas.
  - chunk_index: 28
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > La question du cinquième postulat et les géométries non euclidiennes'
    content_token_count: 111
    text: |-
      En fait, tel un Christophe Colomb des mathématiques, en voulant arriver à la
      géométrie euclidienne par un nouveau chemin, Saccheri avait par hasard découvert
      un nouveau continent mathématique : celui des géométries non euclidiennes — en
      gros, des géométries pour des espaces tordus et bizarres, mais qui sont tout
      aussi cohérentes que notre bonne vieille géométrie euclidienne.
  - chunk_index: 29
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > La question du cinquième postulat et les géométries non euclidiennes'
    content_token_count: 326
    text: |-
      Alors, du coup, l'axiome des parallèles, il est vrai ou il est faux ? Pas si
      facile : en géométrie euclidienne, l'axiome est vrai, et dans les géométries non
      euclidiennes, il est faux. Mais moi, je veux savoir si c'est vrai ou faux
      absolument parlant ! Si c'est ça ta question, elle n'a probablement pas de sens.
      Se demander si la géométrie euclidienne est bien « la vraie » géométrie — ça ne
      veut pas dire grand-chose. Les géométries non euclidiennes, tout aussi
      cohérentes, ne sont ni plus vraies ni plus fausses. Comme disait Poincaré, une
      géométrie ne peut pas être plus vraie qu'une autre ; elle peut seulement être
      plus commode — plus simple, plus intuitive, applicable pour décrire certains
      objets intéressants ou familiers. Et à ce titre, oui, la géométrie euclidienne
      est sans doute la plus commode. Ceci dit, dans cet épisode de Sciences
      Étonnantes, les passants expliquaient que la géométrie de la surface de son
      caleçon est une géométrie hyperbolique. Comme quoi, il ne faut pas chercher plus
      loin que vos fesses pour trouver une géométrie non euclidienne.
  - chunk_index: 30
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > Cohérence et vérité des axiomes'
    content_token_count: 232
    text: |-
      Si je comprends bien, une théorie axiomatique ne peut jamais être fausse ? En
      fait, il y a tout de même quelque chose d'important : les axiomes d'une théorie
      ne doivent pas être incohérents — c'est-à-dire qu'ils ne doivent pas permettre
      de démontrer à la fois une proposition et sa négation, ce qui constituerait une
      contradiction. Et c'est à peu près la pire chose qui puisse arriver à une
      théorie : si les axiomes sont incohérents, on peut dire que la théorie est
      fausse — avec quelques guillemets, tout de même. Par contre, si les axiomes
      d'une théorie ne mènent à aucune contradiction, la théorie est aussi vraie
      qu'une théorie peut l'être en mathématiques. On parle souvent de
      **vérité-cohérence** pour désigner cette notion un peu particulière de vérité en
      mathématiques.
  - chunk_index: 31
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > Cohérence et vérité des axiomes'
    content_token_count: 195
    text: |-
      Du coup, ce n'est pas bien difficile de faire une théorie vraie : il suffit
      juste de ne pas se contredire dans ses axiomes. Mais c'est loin d'être aussi
      facile que tu le crois. La contradiction peut ne pas être immédiate, et elle
      peut se cacher dans les axiomes. On ne voit pas d'un coup d'œil tout ce
      qu'implique un ensemble d'axiomes. La pyramide qu'on peut bâtir sur eux est
      énorme — qu'est-ce que tu en sais, si des briques ne vont pas finir par se
      contredire quelque part ? Qu'est-ce qui permettrait de savoir, juste en
      regardant les axiomes, que la géométrie euclidienne, par exemple, ne va pas
      produire un moment deux théorèmes en contradiction ?
  - chunk_index: 32
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > Cohérence et vérité des axiomes'
    content_token_count: 115
    text: |-
      Bon, là, les axiomes d'Euclide sont tellement simples et intuitifs qu'il y a
      clairement aucun risque. Mais ça fait longtemps que les mathématiques sont
      pleines de trucs bizarres et contre-intuitifs, au point qu'il y a de bonnes
      raisons de douter que l'évidence, l'intuition, la simplicité des axiomes soient
      un critère suffisant pour garantir la cohérence d'un ensemble d'axiomes.
  - chunk_index: 33
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > L''axiome « le tout est plus grand que la partie »'
    content_token_count: 170
    text: |-
      On a parlé tout à l'heure de l'axiome d'Euclide « le tout est plus grand que la
      partie ». Oui, bah ça me paraît toujours aussi clair et évident. On pourrait
      dire que, par rapport au tout que forment l'ensemble des nombres entiers,
      l'ensemble des nombres pairs est une partie. Bah oui. Donc cet axiome implique
      que l'ensemble des nombres entiers est plus grand que l'ensemble des nombres
      pairs. Or, on peut établir une correspondance un à un entre les membres de ces
      deux ensembles — autrement dit, ces deux ensembles ont la même taille. Bienvenue
      dans l'infini, où les parties sont bien souvent aussi grandes que le tout !
  - chunk_index: 34
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > L''axiome « le tout est plus grand que la partie »'
