    text: |-
      Et si vous ne connaissez pas tout ça, je vous renvoie à l'excellente série de
      Math s'Eteint sur l'infini, ou cette vidéo de Sciences Étonnantes, où vous
      pouvez aussi faire un tour dans l'hôtel de Hilbert avec El Jj. Tout ça mérite le
