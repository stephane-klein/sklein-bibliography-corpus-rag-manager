  - chunk_index: 35
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > L''axiome « le tout est plus grand que la partie »'
    content_token_count: 175
    text: |-
      Comme on peut restreindre l'axiome « le tout est plus grand que la partie » aux
      ensembles finis, on voit bien comment on peut interpréter l'axiome de telle
      façon à ce qu'il ne soit plus problématique. Mais c'est intéressant de voir
      qu'un axiome qui paraît à première vue tout à fait simple, évident et intuitif
      peut tout à fait entraîner des contraintes inattendues si l'on n'y prend pas
      garde. L'évidence et l'intuition sont loin — très loin — d'être des garants
      fiables de la vérité ou de la cohérence, surtout quand on touche aux fondements
      des mathématiques et de la logique.
  - chunk_index: 36
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > Conclusion sur l''axiomatique d''Euclide'
    content_token_count: 116
    text: |-
      La méthode d'Euclide est restée un modèle de rigueur indépassable pendant
      littéralement plusieurs milliers d'années. Quelques philosophes ont d'ailleurs
      voulu appliquer cette méthode des géomètres à la philosophie, notamment Thomas
      Hobbes dans les *Éléments de la loi naturelle et politique* et Spinoza dans son
      *Éthique*, mais il faut bien avouer que ça ne prenait pas aussi bien qu'en
      géométrie.
  - chunk_index: 37
    heading_path: 'L''AXIOMATIQUE - Les Éléments d''Euclide | Grain de philo #14 (Ep.4) > Conclusion sur l''axiomatique d''Euclide'
    content_token_count: 197
    text: |-
      À partir de la fin du XIXe siècle, comme on s'interrogeait beaucoup sur les
      fondements des mathématiques, on s'est mis à axiomatiser plein de trucs — on
      s'est mis à le faire d'une façon encore plus rigoureuse qu'Euclide. Et si
      l'axiomatique moderne vous intéresse, je vous recommande cette vidéo de Patrice,
      qui parle justement de l'axiomatisation de l'arithmétique et de la théorie des
      ensembles ZFC — c'est le cas de le dire — qui est particulièrement intéressante,
      parce que c'est une théorie extraordinairement puissante, où l'on peut
      construire quasiment toutes les mathématiques, et qui repose seulement sur une
      petite dizaine d'axiomes. Ça me laisse rêveur.
