  - chunk_index: 4
    heading_path: 'LA RELIGION NOUS EMPÊCHE-T-ELLE D''ÊTRE MORAUX ? - Religion et morale (2/2) - Grain de philo #3 > La religion nous empêche-t-elle d''être moraux ? > Le parallèle avec la religion'
