  - chunk_index: 5
    heading_path: 'LA RELIGION NOUS EMPÊCHE-T-ELLE D''ÊTRE MORAUX ? - Religion et morale (2/2) - Grain de philo #3 > La religion nous empêche-t-elle d''être moraux ? > L''intention derrière l''action'
    content_token_count: 165
    text: |-
      Alors, c'est curieux parce que dans le premier cas, quand il y a pas de
      milliardaire pour me menacer ou me promettre quoi que ce soit, on est d'accord
