  - chunk_index: 21
    heading_path: 'LA RELIGION NOUS EMPÊCHE-T-ELLE D''ÊTRE MORAUX ? - Religion et morale (2/2) - Grain de philo #3 > La religion nous empêche-t-elle d''être moraux ? > La charité comme placement'
