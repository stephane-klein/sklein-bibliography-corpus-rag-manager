chunks:
  - chunk_index: 0
    heading_path: 'Une action peut-elle être PIRE parce qu''elle est BÉNÉFIQUE ? #shorts > Une action peut-elle être perçue comme moralement pire parce qu''elle est bénéfique ?'
    content_token_count: 30
    text: |-
      Cela peut sembler bizarre, mais oui. C'est ce qu'on appelle l'effet d'altruisme
      corrompu.
  - chunk_index: 1
    heading_path: 'Une action peut-elle être PIRE parce qu''elle est BÉNÉFIQUE ? #shorts > Une action peut-elle être perçue comme moralement pire parce qu''elle est bénéfique ?'
    content_token_count: 70
    text: |-
      Pour le voir à l'œuvre, imaginez qu'on présente à un groupe la situation
      suivante : une grande entreprise A a consacré 1 million d'euros à une campagne
      publicitaire, ceci afin d'améliorer son image et attirer à elle de nouveaux
      consommateurs.
  - chunk_index: 2
    heading_path: 'Une action peut-elle être PIRE parce qu''elle est BÉNÉFIQUE ? #shorts > Une action peut-elle être perçue comme moralement pire parce qu''elle est bénéfique ?'
    content_token_count: 60
    text: |-
      Maintenant, on présente à un autre groupe la situation suivante : une grande
      entreprise B consacre 1 million d'euros à un hôpital pour enfants, ceci afin
      d'améliorer son image et attirer à elle de nouveaux consommateurs.
  - chunk_index: 3
    heading_path: 'Une action peut-elle être PIRE parce qu''elle est BÉNÉFIQUE ? #shorts > Une action peut-elle être perçue comme moralement pire parce qu''elle est bénéfique ?'
    content_token_count: 118
    text: |-
      Ce qui a été observé, c'est que la décision de l'entreprise B, qui fait la
      donation, est jugée en moyenne comme moralement pire que la décision de
      l'entreprise A, qui fait juste une campagne de pub. La seule différence
      pourtant, c'est que la décision de B a des effets bénéfiques. Mais, étant
      motivée par des raisons égoïstes, elle est jugée comme moralement pire que la
      décision de A.
  - chunk_index: 4
    heading_path: 'Une action peut-elle être PIRE parce qu''elle est BÉNÉFIQUE ? #shorts > Une action peut-elle être perçue comme moralement pire parce qu''elle est bénéfique ? > L''importance des alternatives'
    content_token_count: 70
    text: |-
      Mais que se passe-t-il si, dans les scénarios, on mentionne aussi l'alternative
      qui n'a pas été choisie ? Eh bien, l'effet d'altruisme corrompu disparaît. C'est
      bien l'action de A qui est jugée moralement comme la plus mauvaise.
  - chunk_index: 5
    heading_path: 'Une action peut-elle être PIRE parce qu''elle est BÉNÉFIQUE ? #shorts > Une action peut-elle être perçue comme moralement pire parce qu''elle est bénéfique ? > Conclusion'
    content_token_count: 43
    text: |-
      Pour conclure, cette histoire montre que pour juger de la valeur d'une décision,
      il est important de l'évaluer par rapport aux alternatives qui n'ont pas été
      choisies.
