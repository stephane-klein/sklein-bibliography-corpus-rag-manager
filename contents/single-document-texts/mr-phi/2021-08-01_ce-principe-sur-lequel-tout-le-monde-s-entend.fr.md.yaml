chunks:
  - chunk_index: 0
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 15
    text: '**Dictature !** **Destitutez le tyran !**'
  - chunk_index: 1
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 38
    text: |-
      Avons-nous définitivement sombré dans la dictature sanitaire ? Toutes nos
      libertés sacrifiées à l'autel du pan-médicalisme ?
  - chunk_index: 2
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 8
    text: '**Le pan médicalisme !**'
  - chunk_index: 3
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 122
    text: |-
      Plus sérieusement, ces histoires d’obligation vaccinale pour certaines
      professions et de pass sanitaire sont une bonne occasion de reparler un peu de
      liberté politique. Beaucoup de gens y voient en effet une violation inacceptable
      de nos libertés fondamentales, et ce n’est pas parce que Francis Lalanne et
      Jean-Marie Bigard font partie de ces gens que la question ne mérite pas d’être
      posée. Bon, par contre, on va pas leur demander d’y répondre, faut pas pousser.
  - chunk_index: 4
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 45
    text: |-
      Mais oui, la question se pose : est-il légitime pour un État de limiter
      étroitement la liberté des personnes qui refusent de se faire injecter une
      certaine substance ?
  - chunk_index: 5
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 30
    text: |-
      Eh bien, nous allons essayer d’y réfléchir, dans le calme et la bienveillance,
      certainement.
  - chunk_index: 6
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 9
    text: '**Mise au point préliminaire**'
  - chunk_index: 7
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 155
    text: |-
      Alors déjà, j’aimerais bien qu’on mette de côté les arguments à base de « Oui
      mais il y a déjà d’autres vaccins obligatoires, donc ça va, faites pas chier ».
      Je ne dis pas que ce n’est pas intéressant de le souligner, mais notez que ça
      n’apporte pas de justification en soi : peut-être qu’il était illégitime aussi
      de rendre ces vaccins obligatoires. Si vous donnez pas de justification
      supplémentaire, ça revient quand même juste à dire « Bah écoutez, on a toujours
      fait comme ça, donc je vois pas pourquoi on ferait autrement ». Y’a mieux comme
      argument.
  - chunk_index: 8
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 10
    text: '**Vers un outil de réflexion**'
  - chunk_index: 9
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 127
    text: |-
      Alors, je préfère prévenir d’entrée de jeu qu’en fait, dans cet épisode, je vais
      pas examiner directement la question de l’obligation vaccinale. Je vais surtout
      vous proposer un outil pour réfléchir à sa légitimité. C’est un peu comme dans
      cet épisode sorti il y a un an qui évoquait l’obligation du port du masque, mais
      qui en fait traitait la question plus générale du renoncement à des libertés au
      nom de la sécurité.
  - chunk_index: 10
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 105
    text: |-
      Et d’ailleurs, ça va être important de rappeler quelques points de cette vidéo
      parce que ça aura évidemment un rapport avec notre sujet. Dans cet épisode, on
      avait vu pourquoi parler de liberté en termes absolus, comme s’il était
      parfaitement inacceptable et contraire à tous les principes de l’état de droit
      de renoncer à la plus petite fraction de liberté, eh bien ça n’a juste pas de
      sens.
  - chunk_index: 11
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 189
    text: |-
      Pourquoi cela ? me direz-vous. Excellente question, je vous félicite de me la
      poser. Eh bien, parce que la limitation des libertés au nom de la sécurité,
      c’est littéralement au fondement de tout État, de toute vie en société réglée
      par des lois. Après tout, une loi constitue toujours une restriction de liberté,
      d’une façon ou d’une autre. Ça interdit des trucs, les lois, c’est pour ça que
      c’est là. Donc si par « liberticide » vous voulez juste dire « qui porte
      atteinte aux libertés », on peut dire qu’une loi liberticide est un pléonasme.
      Ou si vous voulez, les seules lois pas liberticides, ce seraient les lois sans
      effet, ce qui est pas spécialement intéressant comme loi.
  - chunk_index: 12
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 104
    text: |-
      Et on est très content qu’au moins certaines libertés se fassent « liberticider
      », genre la liberté de pratiquer la torture récréative non consentie. C’est une
      activité que je n’ai pas la liberté de pratiquer, et ça va, c’est pas grave. En
      fait même, tant mieux, parce que du coup c’est une liberté que les autres non
      plus n’ont pas, et quelque part je préfère ça.
  - chunk_index: 13
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 134
    text: |-
      Ainsi, une restriction de liberté n’est pas nécessairement un problème, en
      particulier quand cette restriction a pour effet d’augmenter la sécurité des
      personnes. Donc, si vous croyez défendre la Liberté avec un grand L comme un
      truc entier, absolu, inviolable, non-négociable, jamais ! Non, jamais une mesure
      liberticide ne touchera ma précieuse liberté ! — Vous vous condamnez surtout à
      ne dire que des platitudes grandiloquentes et pas bien cohérentes à y regarder
      de près.
  - chunk_index: 14
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 96
    text: |-
      Il y a plutôt DES libertés avec un petit L, et les défendre c’est chercher le
      meilleur compromis possible entre renoncer à certaines de ces libertés pour
      renforcer et cultiver les autres. La question générale qui se pose est donc :
      dans quelle mesure ça vaut le coup de renoncer à telle ou telle liberté en
      échange de tel ou tel gain social par ailleurs ?
  - chunk_index: 15
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 181
    text: |-
      Et c’est un type de question souvent très difficile à régler parce que tout
      dépend de l’importance qu’on accorde aux différentes options du compromis.
      Différentes personnes peuvent, de bonne foi, peser les choses différemment pour
      des raisons morales par exemple. Prenons le cas d’un impôt qui doit servir à
      financer X. Certaines personnes peuvent considérer que la liberté d’user comme
      on veut de cette part de nos revenus est moralement plus importante que le
      financement de X. D’autres pourraient au contraire accorder une plus grande
      importance morale à X. Et d’autres pourraient encore préférer que cet impôt
      serve à financer Y plutôt que X parce qu’ils accordent plus d’importance à Y
      qu’à X.
  - chunk_index: 16
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 65
    text: |-
      Entre tout ça, quelle est la façon légitime de trancher étant données ces
      différences de préférences ? C’est un type de question délicate et difficile, à
      laquelle il est souvent peine perdue de chercher une réponse qui satisfasse tout
      le monde.
  - chunk_index: 17
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 78
    text: |-
      Mais par ailleurs, il y a aussi des cas, comme la liberté de torturer son
      prochain à des fins récréatives, où quasi-tout le monde tombera d’accord sur la
      légitimité d’une restriction. Donc un accord quasi-universel n’est pas
      inenvisageable, au moins sur certains sujets.
  - chunk_index: 18
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 99
    text: |-
      Et du coup, à défaut d’un critère applicable toujours et sur lequel tout le
      monde puisse s’entendre, est-ce qu’on ne pourrait pas identifier au moins un
      critère minimal en quelque sorte : un critère qui ne peut pas toujours
      s’appliquer, mais qui, au moins lorsqu’il est satisfait, mettrait tout le monde
      d’accord sur le fait qu’une restriction des libertés est ici légitime ?
  - chunk_index: 19
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 18
    text: Eh bien, réfléchissons-y. On est là pour ça.
  - chunk_index: 20
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 11
    text: '**Le principe de tort de John Stuart Mill**'
  - chunk_index: 21
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 87
    text: |-
      Pour y réfléchir, ça peut être intéressant de se pencher sur un principe proposé
      par le philosophe John Stuart Mill, dans son fameux essai *De la liberté*. Ce
      principe, il l’appelle en anglais « *Harm principle* », ce qu’on pourrait
      traduire par « principe de tort » ou « principe de préjudice ».
  - chunk_index: 22
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 102
    text: |-
      L’expression « nuire » ici traduit donc « *harm* », qu’on pourrait traduire
      aussi par « causer un tort », « causer un dommage » ou « porter préjudice ». Et
      dans le contexte du livre, il faut l’entendre en un sens vraiment fort : c’est
      pas juste une petite nuisance mais bien un préjudice réel, qui touche
      directement la personne. Genre la mort, typiquement.
  - chunk_index: 23
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 53
    text: |-
      Donc, pour John Stuart Mill : « La seule fin pour laquelle le pouvoir peut être
      légitimement exercé sur un membre d’une communauté civilisée, contre sa volonté,
      est de prévenir un tort aux autres. »
  - chunk_index: 24
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 91
    text: |-
      Alors, à première vue, ça peut sembler assez intuitif. On voit bien pourquoi,
      par exemple, dans le cas de la torture récréative non consentie, il y aurait des
      torts, des dommages causés par l’exercice de cette liberté si elle nous était
      laissée, et c’est pour ça qu’il semble légitime de nous ôter cette liberté.
  - chunk_index: 25
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 109
    text: |-
      Mais quelque chose qui vous aura peut-être échappé : l’idée de Mill dans son
      essai, c’est que ce principe énonce la SEULE raison de limiter la liberté des
      individus. Autrement dit, pour lui, ce critère du tort est avant tout un critère
      NÉCESSAIRE, c’est-à-dire qu’IL FAUT qu’il y ait un tort causé aux autres pour
      qu’il soit légitime de légiférer.
  - chunk_index: 26
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 137
    text: |-
      Et c’est sur cet aspect que Mill insiste parce que derrière ça, il y a la
      critique de toute législation paternaliste qui restreindrait la liberté des
      individus au nom de l’idée qu’on se fait de leur propre bien. Pour Mill, ce type
      de restriction est inacceptable. L’État doit laisser tranquille les individus
      tant qu’ils ne causent pas de tort aux autres (et qu’ils sont adultes et
      informés). En somme, foutez la paix aux gens dans leur sphère privée tant qu’ils
      ne nuisent pas aux autres.
  - chunk_index: 27
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 72
    text: |-
      C’est un point de vue typiquement libéral, au sens où l’optique est avant tout
      de préserver un maximum de libertés individuelles. En fait, l’essai de John
      Stuart Mill sur la liberté est un des textes fondateurs de la pensée libérale en
      philosophie.
  - chunk_index: 28
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 9
    text: '**Vers un critère suffisant**'
  - chunk_index: 29
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 86
    text: |-
      Et si je propose de partir de ça pour réfléchir à l’obligation vaccinale et au
      pass sanitaire, c’est justement parce qu’en général ceux qui s’y opposent le
      font, de façon plus ou moins implicite, au nom de principes libéraux, au nom de
      la défense des libertés individuelles contre des mesures liberticides, etc.
  - chunk_index: 30
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 48
    text: |-
      Donc c’est intéressant d’examiner si en fait MÊME le principe de Mill, ce
      principe libéral par excellence, ne pourrait pas en fait justifier ces
      restrictions de liberté ?
  - chunk_index: 31
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 79
    text: |-
      Autrement dit, je vais pas m’intéresser à ce principe comme critère nécessaire à
      la façon de Mill (de fait, c’est assez problématique de le considérer comme
      nécessaire). Moi ici, je veux plutôt en tirer une sorte de critère minimal, un
      critère SUFFISANT pour justifier une loi.
  - chunk_index: 32
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 107
    text: |-
      En somme, face à n’importe quelle loi, n’importe quelle mesure qui restreint nos
      libertés, commençons toujours par nous demander : est-ce que ça satisferait pas
      un principe de tort minimal ce truc ? Si c’est le cas, eh bah ça fera au moins
      une justification pour cette loi sur laquelle quasi-tout le monde devrait
      pouvoir s’entendre, des plus libéraux aux moins libéraux.
  - chunk_index: 33
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 31
    text: |-
      Ce principe de tort minimal, si je devais l’exprimer de façon rigoureuse, je le
      formulerais comme ceci :
  - chunk_index: 34
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 161
    text: |-
      > **Si l’exercice de certaines libertés individuelles cause des torts importants
      aux autres, si restreindre ces libertés (par une obligation légale, typiquement)
      permet d’éviter (ou au moins de diminuer considérablement) ces torts et que
      cette restriction de liberté ne cause elle-même aucun tort comparable (elle ne
      cause que des torts individuels bien plus légers en comparaison), et enfin s’il
      est impossible d’éviter ou diminuer ces torts par un moyen moins coûteux (moins
      coûteux en termes de torts causés et de libertés restreintes), alors cette
      restriction de liberté est légitime.**
  - chunk_index: 35
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 78
    text: |-
      C’est un peu long formulé comme ça, mais ça permet d’écarter les objections les
      plus évidentes et de restreindre le principe à une forme qui me semble
      effectivement très prudente et modeste. Je vois pas bien comment le refuser, à
      moins de défendre une éthique radicalement égoïste.
  - chunk_index: 36
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 63
    text: |-
      Mais bon, c’est quand même une position assez extrême et rarement partagée. A
      priori, il me semble que ce principe de tort minimal que j’ai formulé est
      difficile à refuser, quelles que soient vos sensibilités morales et politiques.
  - chunk_index: 37
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 9
    text: '**Application à la question vaccinale**'
  - chunk_index: 38
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 123
    text: |-
      Et maintenant, donc, on peut se demander si l’obligation vaccinale pour les
      soignants et le pass sanitaire satisfont ce principe de tort minimal. Cela
      revient à se demander, premièrement : l’exercice de la liberté de refus vaccinal
      cause-t-il des torts importants aux autres ? Deuxièmement : ces torts
      peuvent-ils être évités par cette restriction ? Et troisièmement : la
      restriction ne cause-t-elle pas des torts comparables ?
  - chunk_index: 39
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 77
    text: |-
      Alors, c’est loin d’re si trivial de répondre à ces questions. Finalement, je me
      suis dit que c’était peut-être plus intéressant pour vous et moins éprouvant
      nerveusement pour moi de vous laisser y réfléchir vous-même, et tâcher de
      répondre vous-même à ces questions.
  - chunk_index: 40
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 42
    text: |-
      Donc n’hésitez pas à contribuer dans l’espace commentaire, ci-dessous à la
      disposition de vos doigts agiles et zélés, c’est fait pour ça.
  - chunk_index: 41
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 47
    text: |-
      Et pour tout dire, je ne m’attends pas à ce que tout le monde soit d’accord. Ça
      risque d’être une bataille de tranchée en commentaires, malheureusement…
  - chunk_index: 42
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 145
    text: |-
      Mais ce qui m’intéresse en posant les choses ainsi, c’est de mettre en lumière à
      quel point le désaccord sur cette question n’est peut-être pas tant que ça ancré
      dans un désaccord sur des principes moraux ou politiques. Puisque je parle qu’en
      effet pas grand monde ne s’opposera à mon principe de tort minimal, mais les uns
      vont considérer que ce principe justifie la légitimité des mesures sanitaires,
      tandis que d’autres vont considérer que ce même principe justifie l’absence de
      légitimité de ces mêmes mesures !
  - chunk_index: 43
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 136
    text: |-
      En effet, certains vont considérer que les torts causés par le fait de laisser
      le virus courir alors que la couverture vaccinale est insuffisante sont très
      très importants, qu’on peut en diminuer une large part en mettant en place ce
      pass sanitaire et tout ça, et que ces mesures elles-mêmes ne causent que des
      torts dérisoires en comparaison, et même en comparaison des autres moyens de
      contrôler l’épidémie : au fond, ce sont des restrictions bien moins
      contraignantes qu’un confinement ou un couvre-feu.
  - chunk_index: 44
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 126
    text: |-
      Mais pour d’autres personnes, ce sera absolument le contraire : ils estimeront
      que les torts causés par le fait de laisser le virus courir seraient finalement
      négligeables ou inévitables même avec ces mesures, tandis que les torts causés
      par le fait de quasiment forcer les gens à se faire vacciner seraient, eux, très
      importants : ça touche à l’intégrité de notre corps, on manque de recul, on veut
      nous empoisonner avec des substances douteuses…
  - chunk_index: 45
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 11
    text: '**Le désaccord épistémologique**'
  - chunk_index: 46
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 111
    text: |-
      Mais donc, vous voyez que le désaccord entre les uns et les autres ne porte pas
      sur le principe de tort, non, tout le monde peut l’accepter, ça coûte rien. Le
      désaccord porte sur ce que chacun sait ou croit savoir concernant les torts
      causés par ceci ou cela. Car en effet, il faut des informations de cet ordre
      pour pouvoir appliquer ce principe de tort à telle ou telle situation concrète.
  - chunk_index: 47
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 28
    text: |-
      Et donc, s’appuyer sur des informations différentes peut amener à tirer des
      conclusions différentes de ce même principe.
  - chunk_index: 48
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 33
    text: |-
      Mais alors, suffirait-il de donner accès aux mêmes informations à tous pour que
      tout le monde tombe joyeusement d’accord ?
  - chunk_index: 49
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 66
    text: |-
      Bah non, très probablement pas : c’est pas un simple désaccord factuel, il
      semble que ce soit souvent un désaccord plus fondamental sur ce qui peut être
      pris ou non en compte comme source d’information. Un désaccord sur la façon de
      former des connaissances.
  - chunk_index: 50
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 22
    text: Autrement dit, ce désaccord est avant tout de nature **épistémologique**.
  - chunk_index: 51
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 49
    text: |-
      Épistémologique, si vous ne connaissez pas, c’est un mot très chic pour désigner
      ce qui touche à la connaissance en général, en particulier au mode de formation
      des connaissances.
  - chunk_index: 52
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 81
    text: |-
      En somme, on pourrait dire qu’il y a une fracture épistémologique dans ce pays.
      Je trouve ça fascinant, et un peu effrayant, de se dire que des désaccords
      épistémologiques peuvent creuser un tel fossé, même entre des personnes qui,
      peut-être, partagent beaucoup de valeurs morales et politiques au départ.
  - chunk_index: 53
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 76
    text: |-
      Je dis pas que c’est systématiquement le cas, bien sûr, il peut y avoir
      évidemment d’autres formes de désaccord, mais il me semble que c’est assez
      fréquent en fait, et le cas des vaccins met en lumière ce phénomène d’une façon
      dramatique et spectaculaire.
  - chunk_index: 54
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 25
    text: |-
      Mais bref, ce serait un tout autre sujet à traiter, peut-être pour une autre
      vidéo un jour.
  - chunk_index: 55
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 3
    text: '**Conclusion**'
  - chunk_index: 56
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 50
    text: |-
      Pour l’heure, tel un chirurgien de guerre qui prend sa pause clope en pleine
      bataille, je vous laisse vous débrouiller en commentaire avec cette fracture
      épistémologique ouverte.
  - chunk_index: 57
    heading_path: Ce principe sur lequel tout le monde s'entend
    content_token_count: 96
    text: |-
      Merci d’avoir regardé tout ça. N’hésitez pas à user de votre précieuse liberté
      par exemple pour signaler d’un pouce bleu l’appréciation de ces quelques minutes
      de vidéo. Et vous pouvez aussi commenter à vos risques et périls, et oui, ça
      risque d’être un petit peu la jungle en commentaire comme à chaque fois qu’on
