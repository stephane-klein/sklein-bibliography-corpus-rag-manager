  - chunk_index: 15
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > Pourquoi nier ce droit à la vie est difficile'
    content_token_count: 53
    text: |-
