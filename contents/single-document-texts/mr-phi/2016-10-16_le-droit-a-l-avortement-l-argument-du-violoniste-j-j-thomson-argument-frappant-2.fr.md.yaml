  - chunk_index: 25
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > La distinction entre obligations morales et actions surérogatoires'
    content_token_count: 296
    text: |-
      Est-ce que c'est l'intuition que vous avez ? Est-ce que vous pensez que vous
      avez le devoir de faire ça, de rester branché pendant neuf ans à ce violoniste
      juste pour pas qu'il meure ? Mais non, personne ou presque ne dirait que vous
      êtes moralement obligé de faire une chose pareille. Si vous le faites, si vous
      sauvez le violoniste, vous faites quelque chose de bien — c'est une bonne
      action, et même une très bonne action. Mais si vous répondez au directeur de
      l'hôpital : « Écoutez, je suis désolé mais j'ai une vie et j'ai pas envie de
      l'arrêter pendant neuf mois ou neuf ans juste pour sauver ce violoniste, donc
      voilà, s'il vous plaît débranchez-moi. Je suis triste pour lui et ses amis qui
      jouent sûrement très très bien, mais voilà, j'ai une vie et j'ai quand même le
      droit d'en faire ce que je veux. » — on va pas vous donner une médaille pour ça,
      mais on va pas aller jusqu'à dire que vous avez mal agi, que vous avez fait une
      mauvaise action. Votre décision n'est pas immorale.
  - chunk_index: 26
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > La distinction entre obligations morales et actions surérogatoires'
    content_token_count: 134
    text: |-
      Pour mieux comprendre ce qui se joue ici, il faut faire la distinction entre
      deux types d'actions morales, de bonnes actions. Il y a d'abord celles qui sont
      **moralement obligatoires**, au sens où ne pas les faire revient à agir de façon
      immorale — ça revient vraiment à faire une mauvaise action. Par exemple, si
      quelqu'un se noie et j'ai juste à lui tendre la main pour le sauver, eh bien ne
      pas le faire, c'est vraiment immoral. Sauver la personne est moralement
      obligatoire.
  - chunk_index: 27
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > La distinction entre obligations morales et actions surérogatoires'
    content_token_count: 229
    text: |-
      Mais supposons que pour sauver le type, je n'ai pas d'autre choix que de
      sacrifier ma propre vie. Est-il encore moralement obligatoire de le faire ? Eh
      bien, si je le fais, si je le sauve et que du coup je meurs en le faisant,
      certainement on pourrait me donner une médaille, on pourrait dire que j'ai
      vraiment très bien agi. Ce serait une bonne action. Mais si je le fais pas, on
      n'ira pas jusqu'à me dire que j'ai mal agi, on va pas dire que je me suis
      conduite de façon immorale. Sauver le type en sacrifiant ma vie, c'est donc une
      action qui est bonne, mais il n'est pas immoral de ne pas la faire. Ce sont des
      bonnes actions qui vont au-delà de l'obligation morale, on les appelle des
      **actions surérogatoires** — c'est un mot bien joli, bien technique, comme les
      philosophes aiment ça.
  - chunk_index: 28
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > La distinction entre obligations morales et actions surérogatoires'
    content_token_count: 56
    text: |-
      Sauver le violoniste dans la situation décrite par Thomson, c'est typiquement
      une action surérogatoire : c'est bien de le faire, bravo si vous le faites, mais
      si vous le faites pas, c'est pas immoral.
  - chunk_index: 29
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > Le droit à la vie n''est pas absolu'
    content_token_count: 148
    text: |-
      Qu'est-ce que nous montre cette situation du violoniste ? Elle nous montre avant
      tout que le droit à la vie ne fonde pas un devoir absolu de sauver la vie. Même
      si nous reconnaissons le droit à la vie du violoniste, nous reconnaissons aussi
