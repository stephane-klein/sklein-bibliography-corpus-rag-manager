  - chunk_index: 0
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > Le droit à l''avortement et la Pologne actuelle'
    content_token_count: 218
    text: |-
      Aujourd'hui, on va parler d'avortement. L'endroit à la mode là où ça bouge en ce
      moment, c'est la Pologne. La Pologne est déjà l'un des pays d'Europe où le droit
      à l'avortement est le plus restreint. Il n'est permis d'avorter qu'en cas de
      viol, d'inceste, en cas de risque pour la santé de la mère, ou encore en cas de
      malformation du fœtus. Et c'est tout. Officiellement, il y a juste quelques
      centaines d'avortements par an en Pologne. En France, en comparaison, il y en a
      à peu près 200 000 par an. Et ça ne suffit pas aux Polonais : un projet de loi
      va être examiné ces jours-ci, qui vise l'interdiction totale de l'avortement,
      c'est-à-dire même dans les trois cas susmentionnés.
  - chunk_index: 1
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > Le droit à l''avortement et la Pologne actuelle'
    content_token_count: 178
    text: |-
      La Pologne est-elle un cas exceptionnel en Europe ? Eh bien, pas franchement.
      Chez nos bons amis Irlandais, l'avortement est déjà totalement interdit sauf en
      cas de danger mortel pour la mère. Quant au viol ou à une malformation du fœtus,
      on s'en fiche. À Malte, comme chacun le sait, dans l'Union européenne,
      l'avortement est juste totalement interdit. Je m'en tiens ici aux pays
      européens, mais il va sans dire qu'il y a énormément d'autres pays dans le monde
      où l'avortement est illégal. En fait, le droit à l'avortement comme on le
      connaît dans nos pays est loin, très loin d'être la norme dans le monde.
  - chunk_index: 2
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > Le rôle de la religion'
    content_token_count: 161
    text: |-
      On peut remarquer que dans la plupart des pays où l'avortement est très
      restreint, la religion occupe une place plutôt très importante. Restons sur nos
      exemples européens : la Pologne et l'Irlande, ce sont deux pays très, très
      catholiques. On sait que le Pape n'est pas très chaud sur l'avortement. Oui,
      même le dernier Pape, celui qui est censé être plus sympa que les autres, quand
      il s'agit de parler de malformations du fœtus dues au virus Zika, il est assez
      clair : avorter, même dans ce cas-là, c'est un crime, c'est un mal absolu.
  - chunk_index: 3
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > La réaction face à ces restrictions'
    content_token_count: 173
    text: |-
      Alors quand on vient d'un pays comme la France, où l'on est très attaché au
      droit à l'avortement, la réaction face à des choses comme ce qui se passe en
      Pologne actuellement se résume généralement à : « Mais pourquoi sont-ils si
      méchants ? Pourquoi sont-ils si arriérés et obscurantistes ? Pourquoi
      détestent-ils tellement les femmes ? » En gros, le droit à l'avortement nous
      paraît aller tellement de soi qu'on ne voit même plus pourquoi on pourrait être
      contre, sinon parce qu'on est un crétin arriéré, obscurantiste, facho, qui
      déteste les femmes et qui croit tout ce que lui dit le Pape.
  - chunk_index: 4
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > La réaction face à ces restrictions'
    content_token_count: 235
    text: |-
      Or, en fait, c'est quand même un peu plus compliqué que ça. À vrai dire, non, le
      droit à l'avortement n'a rien d'une position facile à soutenir face aux
      arguments adverses. Car oui, vraiment, il y en a. La principale raison pour
      laquelle beaucoup pensent que ce droit va de soi, c'est que ces arguments
      adverses, en fait, on les entend tout simplement pas. Et même si on les entend,
      on les ignore en se disant que c'est juste un truc d'arriérés, obscurantistes,
      fachos qui détestent les femmes. Or même un arriéré obscurantiste facho qui
      déteste les femmes peut à l'occasion produire un argument qui tient la route et
      qui pourrait même nous mettre dans l'embarras. Défendre le droit à l'avortement
      de façon rationnelle plutôt que dogmatique, c'est être capable de répondre à de
      tels arguments, et c'est tout le but de cette vidéo.
  - chunk_index: 5
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > L''argumentaire central contre l''avortement'
    content_token_count: 84
    text: |-
      Le cœur de l'argumentaire contre le droit à l'avortement, c'est de présenter
      l'avortement comme une action immorale. En gros, avorter, c'est mal, et c'est
      pour ça qu'il faut l'interdire. Pour montrer qu'avorter c'est mal, l'argument
      central est toujours plus ou moins le suivant :
  - chunk_index: 6
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > L''argumentaire central contre l''avortement'
    content_token_count: 142
    text: |-
      - **Première prémisse** : Si un être a le droit de vivre, alors causer directement sa mort quand on peut l'éviter, c'est immoral.
      - **Deuxième prémisse** : Un fœtus a le droit de vivre.
      - **Première conclusion** : Causer directement la mort d'un fœtus alors qu'on peut l'éviter, c'est immoral.
      - **Troisième prémisse** : Avorter, c'est causer directement la mort d'un fœtus alors qu'on peut l'éviter.
      - **Conclusion** : Avorter, c'est mal.
  - chunk_index: 7
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > L''argumentaire central contre l''avortement'
    content_token_count: 66
    text: |-
      Cette argumentation est très claire. Elle repose sur trois prémisses et chaque
      étape de l'argumentation est valide. Cette conclusion suit nécessairement des
      trois prémisses : c'est une pure affaire de logique. Et de ce point de vue,
      c'est très beau à voir.
  - chunk_index: 8
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > L''argumentaire central contre l''avortement'
    content_token_count: 103
    text: |-
      L'argument ne veut pas dire que c'est bon — je veux juste dire que c'est un bel
      argument. Comme l'argument est valide, ça veut dire que pour rejeter la
      conclusion, on n'a pas d'autre choix que de rejeter au moins l'une des trois
      prémisses. La balle est maintenant du côté des défenseurs de l'avortement : on
      doit dire quelle prémisse de l'argument on rejette.
  - chunk_index: 9
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > Analyse des prémisses'
    content_token_count: 84
    text: |-
      La troisième prémisse me paraît tout à fait impossible à rejeter : c'est juste
      la description de l'avortement. Donc ça veut dire que toute la fin de l'argument
      est vraiment impirable à partir du moment où on l'accepte. C'est perdu, on ne
      peut plus éviter la conclusion finale : avorter, c'est mal.
  - chunk_index: 10
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > Analyse des prémisses'
    content_token_count: 146
    text: |-
      Du coup, on va se concentrer sur les deux premières prémisses. Laquelle peut-on
      rejeter ? Peut-on remettre en cause le fait que causer directement la mort d'un
      être qui a le droit de vivre soit quelque chose d'immoral ? Eh bien, par six
      lettres : Hitler. Éventuellement, Néron. Précisons : c'est un être parfaitement
      innocent qui n'a jamais rien fait de mal. On va pas dire qu'Hitler, c'est
      immoral de le tuer si on a la possibilité de ne pas le faire. Ça ne paraît pas
      discutable. OK.
  - chunk_index: 11
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > Analyse des prémisses'
    content_token_count: 203
    text: |-
      Donc la seule prémisse qui reste, c'est la prémisse : « le fœtus a le droit de
      vivre ». Il semble que ce soit le seul point de l'argumentation qu'on puisse
      remettre en cause. Et en effet, la plupart du temps, le débat entre les pro et
      les anti-avortement, quand il ne se résume pas à des invectives de part et
      d'autre, va surtout se focaliser sur cette question : le fœtus a-t-il un droit à
      la vie ? Les anti-avortement soutiennent qu'il y a un tel droit à la vie, et
      c'est ça qui donne les raisons morales contre l'avortement. Et du coup, il
      semble que nous, qui défendons le droit à l'avortement, nous devions nier ce
      droit à la vie du fœtus.
  - chunk_index: 12
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > Pourquoi nier ce droit à la vie est difficile'
    content_token_count: 88
    text: |-
      Et là, vous attendez sans doute à ce que je présente un argument frappant qui
      justifie pourquoi le fœtus ne peut pas prétendre à un tel droit à la vie — un
      argument tellement frappant que ça ferme le bec aux anti-avortement. Sauf que
      non. À ma connaissance, il n'y a pas de tels arguments.
  - chunk_index: 13
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > Pourquoi nier ce droit à la vie est difficile'
    content_token_count: 98
    text: |-
