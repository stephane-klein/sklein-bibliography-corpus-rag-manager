  - chunk_index: 31
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > Le droit à la vie n''est pas absolu'
    content_token_count: 178
    text: |-
      Mais non, il y a toujours moyen de faire plus pour sauver plus de vies. Les gens
      ont tous le droit à la vie, et si le droit à la vie était ce truc absolument
      sacré et inviolable, nous n'aurions jamais d'excuse pour faire quoi que ce soit
