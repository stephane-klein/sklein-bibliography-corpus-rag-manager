      foutez-moi la paix, j'ai bien le droit de jouer à Mario Kart de temps en temps.
  - chunk_index: 32
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > Le conflit entre droits'
    content_token_count: 160
    text: |-
      Ainsi donc, le droit de vivre de chaque individu, on le reconnaît, mais nous ne
      sommes pas prêts à tout lui céder. Il rentre en conflit avec d'autres droits des
      individus qu'il faut aussi reconnaître. Dans le cas du violoniste, avec quoi ce
      droit à la vie entre-t-il en conflit ? Eh bien, ce qu'on aura envie de dire,
      c'est quelque chose comme le droit de mener sa vie comme on l'entend, ou le
      droit de disposer de son corps comme on veut — quelque chose dans ce goût-là. On
      pourra appeler ça, en gros, un **droit à l'autonomie**.
  - chunk_index: 33
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > Le conflit entre droits'
    content_token_count: 214
    text: |-
      Mais attention, il faut bien comprendre que ce droit à l'autonomie n'est pas
      plus sacré, inviolable et absolu que le droit à la vie du violoniste. Si, pour
      sauver la vie du violoniste, vous n'aviez qu'une demi-heure à rester allongé à
      côté de lui, on n'hésiterait pas à considérer comme immoral le fait de refuser
      de le faire. Pourtant, ça empiète bien là aussi sur votre droit à l'autonomie. «
      Moi, je fais ce que je veux de ma vie, si j'ai pas envie d'être branché à un
      violoniste, même une demi-heure, eh bien non. » Voilà, donc vraiment, ça
      paraîtrait incroyablement immoral et égoïste, et ça montre que ce n'est pas non
      plus un devoir absolu de respecter ce droit à l'autonomie.
  - chunk_index: 34
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > Le conflit entre droits'
    content_token_count: 234
    text: |-
      On voit par là que le conflit entre ces droits n'est pas une affaire de grands
      principes absolus à respecter coûte que coûte, mais une affaire plus subtile,
      une affaire de degré, de mesures. Quand respecter le droit à la vie d'un
      individu n'empiète que peu sur votre autonomie, on va considérer que c'est votre
      devoir de le respecter. Mais quand ça commence à vous coûter beaucoup, eh bien
      on va finir par se dire que c'est le droit à l'autonomie qui prime. Il serait
      bien difficile d'établir une frontière nette pour délimiter le moment où le
      droit à l'autonomie commence à primer sur le droit à la vie du violoniste — en
      gros, à partir de combien de temps branché au violoniste, ça cesse d'être un
      devoir de le sauver ? Une demi-heure, oui. Neuf ans, non. Donc c'est quelque
      part entre les deux.
  - chunk_index: 35
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > Application à l''avortement'
    content_token_count: 183
    text: |-
      Tout ceci étant dit, revenons à l'avortement. Je pense qu'on peut reconnaître
      que ne pas avorter, de même que ne pas se débrancher du violoniste, c'est en soi
      une bonne action. On n'a pas besoin de nier ça pour défendre le droit à
      l'avortement. Défendre ce droit, c'est simplement défendre que ne pas avorter
      n'est pas moralement obligatoire, c'est seulement surérogatoire. Et donc, il n'y
      a pas lieu d'obliger légalement qui que ce soit à faire des actions moralement
      surérogatoires. En gros, c'est bien de garder le bébé, mais c'est pas immoral de
      ne pas le faire. Donc foutez-nous la paix.
  - chunk_index: 36
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > Application à l''avortement'
    content_token_count: 205
    text: |-
      Cette façon de défendre l'avortement est plus habile et plus solide pour la
      raison suivante : on peut tout à fait reconnaître au fœtus un droit à la vie —
      même s'il y a lieu d'en discuter par ailleurs — mais on soulignera le fait que
      ce supposé droit à la vie du fœtus est loin de clore le débat. Il faut tenir
      compte aussi d'autres droits : le droit à l'autonomie des individus, et en
      particulier le droit pour les femmes de disposer de leur corps. Aucun de ces
      droits n'est absolu et inviolable : ni le droit à la vie du fœtus, ni le droit à
      l'autonomie. Ces droits sont en conflit, et il faut seulement réfléchir en
      quelles circonstances l'un va primer sur l'autre.
  - chunk_index: 37
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > Application à l''avortement'
    content_token_count: 138
    text: |-
      Au départ, tant qu'on a à faire qu'à un embryon, on peut clairement considérer
      que le très hypothétique droit à la vie de l'embryon ne doit pas passer avant le
      droit de la femme à disposer de son corps. Par contre, au bout de huit mois de
      grossesse, personne ne va considérer qu'un avortement sur simple demande serait
      quelque chose de légitime. Autrement dit, on considère qu'à ce moment-là, le
      droit à la vie du fœtus l'emporte sur le droit de la femme à disposer de son
      corps.
  - chunk_index: 38
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > Application à l''avortement'
    content_token_count: 141
    text: |-
      À quel moment de la grossesse ce droit finit-il par l'emporter sur l'autre ? Eh
      bien, c'est aussi difficile à trancher que de savoir à partir de combien de
      temps branché au violoniste il devient moralement permis de prendre la décision
      de se débrancher. Du coup, on peut faire remarquer que ce sera toujours
      arbitraire. Peut-être qu'il vaudrait mieux ne pas trancher ? Mais non, ce serait
      encore plus injuste de ne pas faire de loi du tout que d'en faire une qui fait
      totalement primer un droit sur l'autre.
  - chunk_index: 39
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > Application à l''avortement'
    content_token_count: 203
    text: |-
      Une loi qui autorise l'avortement fixe une limite — un certain nombre de
      semaines, après quoi il n'est plus autorisé de pratiquer l'avortement. Il y a
      bien quelque chose d'un peu arbitraire dans une telle limite, mais ça permet
      d'éviter une plus grande injustice qui consisterait à ne pas en fixer et à
      interdire totally l'avortement. On peut dire que la limite de 12 semaines ou
      plus pour pratiquer l'avortement est une sorte de compromis pour régler le
      conflit entre deux droits. Et comme tout compromis, ça a quelque chose de pas
      tout à fait satisfaisant et d'un peu arbitraire, mais mieux vaut un compromis
      qui s'efforce de respecter les droits des uns et des autres qu'une position
      unilatérale qui négligerait complètement l'une des parties.
  - chunk_index: 40
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > Conclusion'
    content_token_count: 133
    text: |-
      Voilà pourquoi défendre le droit à l'avortement est plus complexe et difficile
      que l'idée qu'on s'en fait généralement. En fait, il y a d'un côté un supposé
      droit à la vie du fœtus qu'il est quand même difficile de nier complètement, et
      de l'autre le droit des femmes à disposer de leur corps. Le droit à
      l'avortement, c'est le résultat d'une sorte d'arbitrage entre ces deux droits —
      un arbitrage qui se justifie parfaitement mais qui est loin d'être facile.
  - chunk_index: 41
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > Conclusion'
    content_token_count: 257
    text: |-
      L'article de Judith Jarvis Thomson, *A Defense of Abortion*, est l'un des
      articles de philosophie morale les plus cités et repris. Il a eu vraiment
      beaucoup d'idées et c'est un des rares articles de philosophie à être vraiment
      connu bien au-delà du cercle des philosophes. Cet article contient bien d'autres
      choses dont on n'a pas parlé ici, mais l'idée centrale reste celle-ci : si on
      fait porter tout le débat sur l'avortement sur la question du droit à la vie du
      fœtus, ou sur la question de savoir si le fœtus est une personne, eh bien ça
      rend très difficile la défense du droit à l'avortement. Il vaut mieux, en fait,
      remettre aussi en cause l'autre prémisse, celle selon laquelle l'existence d'un
      droit à la vie fonde un devoir absolu de préserver la vie. Son argument du
      violoniste montre avant tout à quel point ce principe est faux, et en cela, il a
      vraiment fait évoluer la façon dont on défend l'avortement.
