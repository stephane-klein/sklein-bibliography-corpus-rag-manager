      sacrifier, si ce n'est éventuellement notre propre vie. Et heureusement, parce
      que sinon, nous ne pourrions rien faire de nos vies.
  - chunk_index: 30
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > Le droit à la vie n''est pas absolu'
    content_token_count: 168
    text: |-
      Il y a sûrement dans le monde des gens qui ont droit de vivre, dont la vie est
      menacée et qui pourraient être sauvées si j'y consacrais tout mon temps et tout
