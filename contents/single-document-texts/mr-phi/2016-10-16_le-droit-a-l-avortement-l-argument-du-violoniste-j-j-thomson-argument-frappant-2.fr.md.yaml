      et d'autre part, je dois reconnaître qu'il y a d'assez bonnes raisons de penser
      en faveur de l'idée qu'il y a un droit à la vie du fœtus.
  - chunk_index: 14
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > Pourquoi nier ce droit à la vie est difficile'
    content_token_count: 215
    text: |-
      Sinon, finalement, ce serait quoi le statut du fœtus ? Est-ce que vraiment on
