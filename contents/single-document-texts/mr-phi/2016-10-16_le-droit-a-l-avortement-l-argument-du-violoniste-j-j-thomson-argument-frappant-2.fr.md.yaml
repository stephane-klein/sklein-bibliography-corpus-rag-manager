  - chunk_index: 18
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > Répondre autrement : la première prémisse'
    content_token_count: 170
    text: |-
      On doit cet argument à **Judith Jarvis Thomson**, qui l'a présenté dans son
      article célèbre *A Defense of Abortion*. Son combat, dans cet article, c'est de
      montrer qu'on peut défendre le droit à l'avortement tout en accordant aux
      adversaires qu'il y a un droit à la vie du fœtus, et même en accordant, à la
      limite, que le fœtus a les mêmes droits qu'une personne adulte. Pourquoi ? Me
      direz-vous. Et bien parce que même si une personne a le droit de vivre, il y a
      bien des situations où causer directement et intentionnellement sa mort alors
      qu'on peut l'éviter... eh bien, c'est pas immoral.
  - chunk_index: 19
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > L''argument du violoniste'
    content_token_count: 51
    text: |-
      Judith Jarvis Thomson nous en donne justement à travers une expérience de pensée
      souvent appelée « l'argument du violoniste ». C'est un très chouette argument
      que j'aime beaucoup. Vous allez voir :
  - chunk_index: 20
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > L''argument du violoniste'
    content_token_count: 143
    text: |-
      Vous vous réveillez un matin et vous vous trouvez dos à dos dans votre lit avec
      un violoniste inconscient. On a diagnostiqué sur lui une maladie rénale fatale
      et la Société des Amis de la Musique a trouvé que vous êtes le seul à posséder
      le type sanguin adéquat pour le sauver. Ils vous ont donc kidnappé et, la nuit
      dernière, le système de drainage du violoniste a été relié aux vôtres de manière
      à ce que vos reins puissent être utilisés pour extraire les poisons de son sang
      et du vôtre.
  - chunk_index: 21
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > L''argument du violoniste'
    content_token_count: 147
    text: |-
      Le directeur de l'hôpital s'adresse maintenant à vous en vous disant : «
      Écoutez, nous sommes désolés que la Société des Amis de la Musique vous ait fait
      cela. Nous n'aurions jamais autorisé cela si nous avions été au courant. Mais
      maintenant c'est fait et le violoniste est branché sur vous. Vous débrancher
      reviendrait à le tuer, mais ce n'est pas très grave, cela ne durera que neuf
      mois. Il sera alors guéri de sa maladie et vous pourrez le débrancher sans
      danger dans neuf mois. »
  - chunk_index: 22
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > L''argument du violoniste'
    content_token_count: 74
    text: |-
      Réfléchissons à cette situation. Le violoniste est une personne, et de toute
      évidence, elle a le droit de vivre. Oui. Et même plus que vous : au moins vous,
