      Mais bon, ça c'est pas le sujet.
  - chunk_index: 23
    heading_path: 'LE DROIT À L''AVORTEMENT - L''argument du violoniste (J.J. Thomson) - Argument frappant #2 > L''argument du violoniste'
    content_token_count: 131
    text: |-
      Le violoniste a le droit de vivre, et si vous vous débranchez, vous causez
      directement sa mort alors que vous pouviez l'éviter. Si la prémisse de
      l'argument moral anti-avortement était vraie, ça voudrait dire que dans la
