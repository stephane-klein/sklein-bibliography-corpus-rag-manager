  - chunk_index: 24
    heading_path: 'TU DOIS ! — l''impératif catégorique selon Kant | Grain de philo #31 > Universalisation et Contradiction'
    content_token_count: 216
    text: |-
      Notamment, donne, parce que cette notion de « règles de conduite » dont je parle
