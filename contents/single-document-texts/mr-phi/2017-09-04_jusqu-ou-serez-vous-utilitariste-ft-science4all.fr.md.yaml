chunks:
  - chunk_index: 0
    heading_path: Jusqu'où serez-vous utilitariste ? (Ft. Science4All)
    content_token_count: 107
    text: |-
      Aujourd'hui, je vais jouer au savant fou, concoctant d'effroyables expériences
      de pensée morale. Et pour les tester, je vais avoir un cobaye de choix :
      Désintox, les Saf's, et quelques épisodes que tu fais sur ta chaîne,
      Science4All. Tu parles de morale, et du coup j'ai très envie de te poser la
      question suivante : à ton avis, c'est quoi, agir moralement ?
  - chunk_index: 1
    heading_path: Jusqu'où serez-vous utilitariste ? (Ft. Science4All)
    content_token_count: 84
    text: |-
      En fait, alors c'est peut-être une des formations professionnelles dues à mes
      études en théorie des jeux, mais je dirais que ce qui importe le plus pour moi,
      c'est qu'un maximum de gens soient aussi heureux que possible. Autrement dit, je
      pense qu'être moral, c'est maximiser quelque chose comme la somme des bonheurs
      de tous.
  - chunk_index: 2
    heading_path: Jusqu'où serez-vous utilitariste ? (Ft. Science4All)
    content_token_count: 70
    text: |-
      Là, on fait... c'est la définition même de l'utilitarisme. Et je ne suis loin
      d'être le seul, en fait. Je pense que tout le monde est utilitariste au moins un
      peu, mais je pense aussi que personne n'est utilitariste jusqu'au bout. Pas même
      toi.
  - chunk_index: 3
    heading_path: Jusqu'où serez-vous utilitariste ? (Ft. Science4All)
    content_token_count: 159
    text: |-
      Tu veux me tester ? Considère d'abord la situation suivante. Tu gères les
      ressources d'un hôpital, et il y a six patients en danger de mort. Le premier
      d'entre eux, le patient zéro, est dans l'état le plus grave : il a cinq
      blessures létales. Autrement dit, chacune de ses cinq blessures suffit à
      entraîner rapidement sa mort, et il faudrait donc les soigner rapidement toutes
      les cinq pour le sauver. D'autre part, il y a les patients 1, 2, 3, 4 et 5, qui
      ont chacun une seule blessure létale.
  - chunk_index: 4
    heading_path: Jusqu'où serez-vous utilitariste ? (Ft. Science4All)
    content_token_count: 129
    text: |-
      Laisse-moi deviner : les ressources de l'hôpital sont limitées ? En effet. Tu
      disposes seulement de cinq machines qui permettent chacune de traiter une
      blessure létale. En gros, on branche la machine sur un patient et ça va soigner
      une blessure létale de ce patient. Et ça prend un certain temps, donc on ne peut
      pas réutiliser la même machine pour sauver différents patients. Note aussi que
      c'est le seul hôpital du coin, tu ne peux pas envoyer les patients ailleurs.
  - chunk_index: 5
    heading_path: Jusqu'où serez-vous utilitariste ? (Ft. Science4All)
    content_token_count: 132
    text: |-
      Dans cette situation, quelles sont les options ? Première option : ne rien
      faire. Mais si, on fait quelque chose. Deuxième option : sauver le patient zéro
      en branchant sur lui les cinq machines. Mais alors, les patients 1 à 5 n'auront
      plus de machines pour être soignés et vont donc mourir. Troisième option :
      brancher les cinq machines sur les patients de 1 à 5, ce qui les sauve, mais
      alors c'est le patient zéro qui ne pourra pas être soigné et qui va donc mourir.
  - chunk_index: 6
    heading_path: Jusqu'où serez-vous utilitariste ? (Ft. Science4All)
    content_token_count: 88
    text: |-
      Du coup, qu'est-ce qu'affirme oralement dans cette situation ? Quelle option
      choisir ? Bah, troisième option : sauver un maximum de gens. On appelle ça un
      dilemme ? Un dilemme, en effet. Je pense que tout le monde sera d'accord avec
      toi là-dessus pour dire que dans cette situation, c'est la bonne action à faire.
  - chunk_index: 7
    heading_path: Jusqu'où serez-vous utilitariste ? (Ft. Science4All)
    content_token_count: 121
    text: |-
      Et ce qui est intéressant ici, c'est que l'on voit que cette bonne action n'est
      pas si bonne que ça. Elle n'est pas absolument bonne. Le patient zéro meurt tout
      de même, ce qui en soi est une mauvaise chose. Idéalement, il faudrait plutôt
      que tous les patients soient sauvés. Idéal, mais impossible. L'action que l'on
      doit faire n'est jamais que la meilleure, ou pire, la moins pire, parmi
      l'ensemble des actions possibles.
  - chunk_index: 8
    heading_path: Jusqu'où serez-vous utilitariste ? (Ft. Science4All)
    content_token_count: 185
    text: |-
      En effet, et ça a une première conséquence intéressante sur ce qu'on devrait
      attendre d'une théorie morale. On pourrait croire qu'une théorie morale fixe un
      ensemble de critères qui déterminent si une action en elle-même est bonne ou
      mauvaise. Idéalement, dans une situation, il y aurait une action possible bonne
      et toutes les autres actions possibles mauvaises. Dans ce cas, on sait
      exactement quoi faire. Mais on est rarement face à ce type de cas. Et en
      particulier, que faire lorsque aucune des actions possibles n'est en soi bonne ?
      C'est généralement ce qui fait les dilemmes moraux. Dans de tels cas, le choix
      qu'on fait n'est pas indifférent, même si toutes les actions sont mauvaises.
  - chunk_index: 9
    heading_path: Jusqu'où serez-vous utilitariste ? (Ft. Science4All)
    content_token_count: 100
    text: |-
      Dans le cas de l'hôpital, puisque des gens vont mourir, on a envie de dire
      qu'elles ne sont pas également mauvaises. Et si l'absence de bonnes actions
      possibles donne envie de ne pas agir, comme pour ne pas se salir les mains, il
      ne faut pas oublier qu'en fait, ne pas agir est aussi une action, et bien
      souvent c'est la pire.
  - chunk_index: 10
    heading_path: Jusqu'où serez-vous utilitariste ? (Ft. Science4All)
    content_token_count: 143
    text: |-
      En somme, une théorie morale, ce n'est pas un ensemble de critères qui nous dit
      « ça c'est bien, ça c'est mal ». C'est une théorie qui est capable de nous dire
      quelle est la meilleure chose à faire, sachant que « meilleur » est synonyme de
      « moins mauvais ». Et ça, ça revient à quantifier les valeurs morales des
      différentes actions, puis à les comparer comme on compare des nombres. Alors, en
      théorie des jeux, notamment en présence d'incertitude, il y a des petites
      subtilités, mais pour aujourd'hui, on peut oublier ça.
  - chunk_index: 11
    heading_path: Jusqu'où serez-vous utilitariste ? (Ft. Science4All)
    content_token_count: 33
    text: |-
      Bref, une action sera moralement bonne dans une situation donnée si et seulement
      si toutes les autres actions auraient une valeur moindre dans cette situation.
  - chunk_index: 12
    heading_path: Jusqu'où serez-vous utilitariste ? (Ft. Science4All)
    content_token_count: 170
    text: |-
      Voilà. Il reste à comprendre maintenant comment nous évaluons et comparons les
      actions. Dans l'expérience de pensée de l'hôpital, nous avons tendance à
      comparer les actions en comparant les conséquences attendues de ces actions. Ce
      type de raisonnement relève de ce qu'on appelle en philosophie morale le
      conséquentialisme, l'aspect des conséquences, en somme. Il y a une multitude
      d'approches, mais la plus classique est l'utilitarisme, l'on considère l'effet
      de l'action sur le bonheur général. En gros, nos actions doivent optimiser le
      bonheur général. Elles doivent tendre à nous rendre collectivement aussi heureux
      que possible.
  - chunk_index: 13
    heading_path: Jusqu'où serez-vous utilitariste ? (Ft. Science4All)
    content_token_count: 226
    text: |-
      Ah oui, c'est ma philosophie morale, ça. Ou du moins, c'est celle que j'ai
      prétendu avoir. L'utilitarisme est né en Angleterre au 19e siècle avec Jeremy
      Bentham et John Stuart Mill, et il a été développé ensuite par des centaines
      d'autres jusqu'à aujourd'hui. Et parmi tous ceux qui se réclament de
      l'utilitarisme, il y a évidemment beaucoup de discussions sur la façon de
      comprendre, de quantifier et de calculer ce bonheur général. Mais en tout cas,
      face à un exemple aussi simple que celui que nous venons de voir, il n'y a guère
      lieu de discuter. Nous faisons tous le même calcul des conséquences : 5 vaut
      mieux que 1. Et le fait que nous tombions tous d'accord sur ce genre de
      scénarios montre qu'il y a bien dans notre pensée morale une part utilitariste,
      ou tout au moins conséquentialiste.
  - chunk_index: 14
    heading_path: Jusqu'où serez-vous utilitariste ? (Ft. Science4All)
    content_token_count: 117
    text: |-
      Pourquoi juste une part ? Tu me crois vraiment pas quand je dis que tout ce que
      je veux, c'est le bonheur du plus grand nombre ? En particulier, il me semble
      que si on a le choix entre sauver 5 et sauver 1, si on n'a aucune information et
      donc aucune raison d'accorder plus d'importance à la vie de l'un plutôt que de
      l'autre, il me semble que c'est un devoir moral d'en sauver 5 plutôt que 1.
  - chunk_index: 15
    heading_path: Jusqu'où serez-vous utilitariste ? (Ft. Science4All)
    content_token_count: 126
    text: |-
      Eh bien, ce n'était pas si facile que ça d'être toujours utilitariste. Vraiment.
