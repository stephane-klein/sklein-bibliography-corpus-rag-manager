      Et je pense aussi que la diffusion des sciences et du savoir doit s'adapter à la
      manière dont les convictions se propagent à travers internet. Et je ne pense pas
      que ce soit une mauvaise chose. Je pense que les mathématiques sont vivantes une
      fois qu'on leur attribue des émotions. Moi personnellement, j'ai été atterré par
      le théorème de l'impensabilité d'Arrow, je suis intrigué par les ordinateurs
      quantiques, le fait qu'ils sont capables de casser la cryptographie qu'on
      utilise aujourd'hui, et j'ai été absolument heureux quand j'ai découvert le
      scrutin de Condorcet randomisé. Et c'est pour ça que j'adore les mathématiques.
      C'est pas parce que ça rend rationnel, ça aide à réfléchir et tout ça – ça, j'ai
      envie de dire que c'est un effet secondaire, une espèce de side-effect, du fait
      d'apprendre les mathématiques, qui est souhaitable. Mais ce n'est pas la raison
      première pour laquelle je trouve les mathématiques fascinantes, et c'est pas la
      raison pour laquelle je passe autant de temps à lire, à penser et si possible
      créer des mathématiques. Et je pense que c'est quelque chose qui manque
      énormément dans la communication des sciences en général et des mathématiques en
      particulier : cet aspect émotif, et notamment la fascination que les
      mathématiques peuvent provoquer. Parce qu'à la réponse : "Comment fait-on pour
      lutter contre les mauvaises convictions ?" bah, j'ai envie de dire que la seule
      solution, c'est de développer un esprit critique. Et cet esprit critique, il
      faut vouloir le développer.
