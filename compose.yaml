services:
  postgres:
    # ParadeDB bundles PostgreSQL 18, pg_search (BM25) and pgvector.
    # Built from:
    # https://github.com/paradedb/paradedb/blob/0d55a93132b2a78e3480ec81afe1f30104e54c41/docker/Dockerfile.paradedb-18
    image: paradedb/paradedb:0.26.6-pg18
    restart: "no"
    ports:
      - 5432
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres:/var/lib/postgresql/
    healthcheck:
      test: ["CMD", "sh", "-c", "pg_isready -U $$POSTGRES_USER -h $$(hostname -i)"]
      interval: 10s
      start_period: 30s

volumes:
  postgres:
    name: ${COMPOSE_PROJECT_NAME}_postgres
