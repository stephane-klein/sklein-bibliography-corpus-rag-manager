apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "sklein-bibliography-corpus-rag-manager.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: sklein-bibliography-corpus-rag-manager
    app.kubernetes.io/instance: {{ .Release.Name }}
