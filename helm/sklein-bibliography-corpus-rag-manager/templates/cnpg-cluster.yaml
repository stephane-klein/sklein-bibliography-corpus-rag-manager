apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.cnpg.clusterName }}
  labels:
    {{- include "sklein-bibliography-corpus-rag-manager.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.cnpg.instances }}
  imageName: {{ .Values.cnpg.imageName }}

  storage:
    size: {{ .Values.cnpg.storage.size }}

  postgresql:
    shared_preload_libraries:
      - pg_search
    extensions:
      - name: vector
        image:
          reference: {{ .Values.cnpg.extensions.vector.image }}
      - name: pg_search
        image:
          reference: {{ .Values.cnpg.extensions.pgSearch.image }}
        extension_control_path:
          - share
        dynamic_library_path:
          - lib
        ld_library_path:
          - system

  bootstrap:
    initdb:
      database: {{ .Release.Name }}
      owner: {{ .Release.Name }}
      {{- with .Values.cnpg.bootstrapPassword }}
      secret:
        name: {{ $.Release.Name }}-bootstrap
      {{- end }}
      # The application runs migrations at startup and needs to create
      # pg_search, which is not a trusted extension.
      postInitApplicationSQL:
        - |
          ALTER ROLE "{{ .Release.Name }}" SUPERUSER;

  managed:
    roles:
      - name: {{ .Release.Name }}
        ensure: present
        login: true
        createdb: false
        superuser: {{ .Values.cnpg.appRoleSuperuser }}
